# Build the browser page's WebAssembly bundle and publish it to GitHub Pages.
#
# Runs only on version tags (v*) and on manual dispatch, so routine development pushes never change the
# live page. Setup, once per repository: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# A version tag always publishes. A manual run builds and checks the site from the branch or tag chosen under
# "Use workflow from", keeps it as the downloadable artifact `site-preview` (7 days), and does NOT publish,
# unless the `build_only` box is unticked. Use it to try a branch (a change to build-site.sh, a new page module,
# a new asset) before it goes into a release.
name: Deploy browser page

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and check the site, keep it as an artifact, and do not publish it (untick to publish)"
        type: boolean
        default: true

permissions:
  contents: read

# One deployment at a time; a newer one waits rather than cancelling a deploy in progress. A build-only run
# has a group of its own per branch, so it never waits for, or holds up, a real deploy.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only && format('pages-build-{0}', github.ref_name) || 'pages' }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake patch autoconf automake \
            libtool bison flex pkg-config xz-utils bzip2 unzip zlib1g-dev

      # emsdk, Rust and the Pyodide build environment are the slow part; cache them keyed on the pinned
      # setup script, so a version bump there rebuilds them and nothing else does.
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/emsdk
            ~/emsdk-3.1.58
            ~/pyhmmer-tools
            ~/.cargo
            ~/.rustup
          key: toolchains-${{ runner.os }}-${{ hashFiles('web/spike/ci/setup-toolchains.sh') }}

      - name: Install toolchains
        run: |
          echo "PYHMMER_TOOLS=$HOME/pyhmmer-tools" >> "$GITHUB_ENV"
          bash web/spike/ci/setup-toolchains.sh

      - name: Build WebAssembly bundle
        run: bash web/spike/browser/build-bundle.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/bundle"

      - name: Install the page's JavaScript dependency
        run: npm ci --prefix web/spike

      # build-site.sh regenerates web/intro/data from the committed tables under results/ (standard library only).
      - name: Assemble the site
        run: bash web/spike/page/build-site.sh "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/site"

      # Fails the run on a page module that was not copied, a file the page fetches that is missing, or a
      # database archive that does not match its manifest (web/spike/page/check_site.py).
      - name: Check the site
        run: python3 web/spike/page/check_site.py "$RUNNER_TEMP/site"

      - name: Keep the site as an artifact (build only)
        if: env.BUILD_ONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: ${{ runner.temp }}/site
          retention-days: 7

      - name: Upload the site for publishing
        if: env.BUILD_ONLY != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Summary
        if: always()
        run: |
          {
            echo "### Browser page build"
            echo "Ref \`$GITHUB_REF_NAME\` at \`${GITHUB_SHA::7}\`: $([ "$BUILD_ONLY" = true ] && echo 'build only, not published (artifact site-preview)' || echo 'built for publishing')"
            if [ -d "$RUNNER_TEMP/site" ]; then echo "Site size: $(du -sh "$RUNNER_TEMP/site" | cut -f1)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: bundle
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
