    reference_orientation: MATalpha2->MATalpha1->MATa1->sla2
    definition_note: 'Left (alpha-dominant) sub-cluster of the active MAT locus on
      chromosome IV of S. schoenii GDD12 (CM143129.1; the paper''s span 470,610-475,000,
      Kriti et al. G3 2026, PMID 41849659). HOMOTHALLIC (Dost et al. 2024, PMID 38492364);
      one of several SLA2-MAT cassettes (one per chromosome plus a palindromic one
      on chromosome IV). GENE MODELS ARE OURS (tier 3): the BRAKER2 GTF the paper
      cites is not on its GitHub or Zenodo, so the models were rebuilt from the three
      public paired RNA-seq runs (PRJNA1364152; hisat2, StringTie, TransDecoder, phmmer
      against the curated MAT proteins, Pfam-A); see results/2026-10-29_ss_records/README.md.
      The library is not stranded; strand is the ORF''s. GENE NAMES come from new
      MATa1, MATalpha2 and MATa2 profiles (results/2026-10-30_mat_hmms; supporting
      evidence, a score difference, not a gate): the ORF at 470,349-470,951 (200 aa,
      single exon, 227 aa with a 92 bp intron of 97 reads) is MATalpha2 (alpha2 profile
      73 bits, a1 12) and not an HMG-box MATa2; the homeodomain at 471,961-472,489
      is MATa1 (a1 86, alpha2 29), so the cluster holds both an alpha pair and an
      a1 beside SLA2 (the paper''s MATa1-SLA2 junction). MATalpha1 is single-exon,
      minus strand, 191 aa. The MATa1 model is partial (103 aa, two exons with a 217
      bp intron of 198 reads that joins it toward SLA2); the uninterrupted frame through
      the intron scores lower (a1 60) and runs through a low-complexity repeat. SLA2
      is a diverged copy: 256 aa (472,708-473,478, minus), 5-prime partial (no start
      codon); a second SLA2 piece (473,680-474,606, 309 aa) is not recorded. GENETIC
      CODE: NCBI table 12 (CUG = Ser).'
