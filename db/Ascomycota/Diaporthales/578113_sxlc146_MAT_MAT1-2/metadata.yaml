    notes: 'Both COX13 (gene_index 3) and MAT1-1-2 (gene_index 4) fail/warn
      independent re-translation. KX349090.1''s own feature table (re-fetched via
      NCBI efetch on 2026-09-18) shows: COX13 CDS is
      join(12954..13107,13179..13203,13479..13646,13801..13846) (4 exons);
      MAT1-1-2 CDS is
      complement(join(14568..14792,14843..14902,14953..15306,15440..15976)) (4
      exons). This schema stores only a single start/end/strand span per gene
      with no intron model, so translating the raw recorded spans cannot
      reproduce either protein exactly. The recorded coordinates already match
      each CDS''s real outer bounds exactly; this is a known schema limitation,
      not a coordinate error. SLA2, MAT1-2-1 and APN2 are also multi-exon but
      their recorded spans already pass because the matched region before each
      gene''s first intron is 100% identical (their low coverage values are
      expected for the same reason -- only a short leading exon aligns before the
      independent translation diverges at the first intron).'
