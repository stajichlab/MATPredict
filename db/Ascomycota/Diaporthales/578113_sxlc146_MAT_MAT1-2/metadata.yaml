    definition_note: 'Source literature (Yin et al. 2017) refers to this species as
      "Valsa mali" (its historical/anamorph name); NCBI taxonomy currently resolves
      the same organism as Cytospora mali (taxid 578113) -- both names refer to the
      same fungus, this record uses NCBI''s current taxonomic name. Unconventional
      locus structure: APN2 and COX13, normally canonical FLANKING genes bounding
      the MAT locus across Pezizomycotina, are here captured INSIDE the MAT1-2 idiomorph
      itself (between MAT1-2-1 and a MAT1-1-2 remnant), likely via intrachromosomal
      rearrangement per the source paper. Retained role: flanking_conserved for APN2/COX13
      (same gene identity as the canonical flanking case elsewhere in Pezizomycotina)
      despite their unusual position here -- the "role" vocabulary describes gene
      identity/function, not physical position, and order_in_locus below reflects
      the true unusual order. MAT1-1-2 present here is a co-located remnant from the
      opposite idiomorph (a recombination byproduct, per the paper), analogous to
      the truncated MAT1-1-1 seen in the paired Ophiostomatales records (230073_uamh-11059_MAT_MAT1-2)
      -- a recurring pattern across this session''s Pezizomycotina curation.

      '
