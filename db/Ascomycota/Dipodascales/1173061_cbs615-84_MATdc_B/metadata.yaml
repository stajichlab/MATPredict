    reference_orientation: MATB
    definition_note: 'EVIDENCE TIER 3 (curator-approved 2026-10-17) and DEPOSIT-ONLY:
      the only evidence is the unpublished GenBank deposit HF558449.1 (Galactomyces
      candidum MATB gene for mating type protein MatB, strain CBS 615.84, 1,020 bp,
      CCO73813.1; INRA/MICALIS submission 07-NOV-2012, journal Unpublished), annotated
      only as "mating type protein". No paper was found, and no genome assembly of
      strain CBS 615.84 was found in the local library (so no flank and no assembly
      anchor in this record; excluded from the coordinate benchmark). Corroboration,
      not evidence: G. candidum LMA-244 (GCA_013365045.1) carries a protein 96.8%
      identical beside its SLA2 (QQZM01000017.1:285536-286546 by tblastn, 97% identity),
      left deliberately uncurated so it stays a held-out test genome. The alpha1-like
      character is by position and weak homology (35-40% to Ogataea matalpha1); no
      Pfam run. The system "heterothallic" is NOT verified (see the MATdc A record).
      OPEN CURATOR QUESTION: whether A/B here are homologous to Yarrowia MATA/MATB
      is not established.'
