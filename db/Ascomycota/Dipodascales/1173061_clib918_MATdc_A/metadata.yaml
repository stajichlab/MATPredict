    definition_note: 'EVIDENCE TIER 3 (curator-approved 2026-10-17): the only evidence
      is an unpublished GenBank deposit, HF558448.1 (Galactomyces candidum MATA gene
      for mating type protein MATA, strain CLIB 918, 846 bp, CCO73812.1; INRA/MICALIS
      submission 07-NOV-2012, title "Specialization of the cheese isolates of the
      species Geotrichum", journal Unpublished), annotated only as "mating type protein";
      no paper was found. Corroboration: in the strain''s own assembly GCA_001402995.1
      (CIRM-Levures INRA annotation) the deposit CDS is CCBN010000002.1:584221-585066
      (CDO51888.1, "mating type protein MATA", 100% identical, same protein), 2.0
      kb from SLA2 (CDO51887.1, 579055-582249), order SLA2 -> MATA -> APC5. mating_type.system
      "heterothallic" is NOT verified (the schema has no "unknown"): a review snippet
      calls G. candidum self-fertile, while in a tblastn screen MATA-like and MATB-like
      proteins fell in different genomes. HMG-box content is NOT verified (the protein
      hits Y. lipolytica mata2 at 29%; no Pfam run). APN2 was not found beside SLA2
      at tblastn threshold, so apn2 is not part of this record. OPEN CURATOR QUESTION:
      whether idiomorph labels A/B here are homologous to Yarrowia MATA/MATB (family
      MATyl) is not established; MATdc is a separate family and no homology is asserted.'
