    definition_note: 'MATB idiomorph of Yarrowia lipolytica, taken from the RefSeq
      annotation of the CLIB122 reference genome (GCF_000002525.2, chromosome C, NC_006069.1;
      YALI0_C07436g apn2, YALI0_C07458g matb2, YALI0_C07480g matb1, YALI0_C07502g
      sla2). Same-strain assembly match: the Butler et al. 2004 MATB deposit AJ617307.1
      (3,353 bp, matb2 CAE84425.1, matb1 CAE84426.1; PMID 14745027) is 3353/3353 nucleotides
      identical to NC_006069.1:980802-984154 (local alignment, 2026-10-17), and CAE84425.1/CAE84426.1
      are identical to the RefSeq proteins XP_501556.1/XP_501557.1. The architecture
      is the mirror of the MATA record (4952_w29_MATyl_A): apn2 and sla2 flank the
      idiomorph, which here carries matb2 (367 aa) and matb1 (302 aa) instead of mata1/mata2.
      The MATB idiomorph was shown functional in a MATA background by cassette replacement
      (Rosas-Quijano et al. 2008, PMID 18461384) and MATA<->MATB switching with mating
      was shown by Han et al. 2020 (PMID 32105315). No protein domain is established
      for matb1/matb2 (curator ruling 2026-10-01 leaves idiomorph_class unassigned).
      The RefSeq apn2 protein (XP_501555.1, 582 aa) is longer at its N-terminus than
      the MATA-record apn2 (CAE84424.1, 412 aa; contained in it). The deposit AJ617307.1
      carries strain "W29" in its source feature (so does the MATA deposit AJ617306.1). Checked 2026-10-17: three W29 assemblies (GCA_001307795.1, GCF_001761485.1, GCA_003054345.1) all carry MATA (99.7% to AJ617306.1, no hit to AJ617307.1), while the CLIB122 and 22301-5 genomes carry AJ617307.1 at 100% over its full length. The W29 label on AJ617307.1 therefore does not identify the source strain of the MATB allele (Butler et al. 2004 full text could not be read, so the actual source strain is unverified). The allele label B rests on the sequence (identical to the CLIB122 MATB locus) and on the functional papers, not on the strain name. The
      strain 22301-5 draft (GCA_023272835.1, CP096873.1:1023801-1031608, 100% to AJ617307.1)
      is corroboration only and is not used as evidence in this record.'
