    reference_orientation: SLA2(+)->MAT1-2-1(+)->APN2(-)->COX13(+)
    definition_note: Genome-derived MAT1-2 locus of Verticillium dahliae VdLs.17 (RefSeq
      GCF_000150675.1, scaffold NW_009276925.1), curated 2026-10-11 from the RefSeq
      GFF (gene models and XP protein accessions as annotated). Canonical Pezizomycotina
      arrangement SLA2 -> MAT1-2-1 -> APN2 -> COX13. The HMG-box gene VDAG_02444 (XP_009651392.1,
      232 aa) contains the published TV103 MAT1-2-1 protein (BAH66364.1, 156 aa; Usami
      et al. 2009) at 100% identity over all 156 aa; the RefSeq model is extended
      at the N terminus by 76 aa relative to the TV103 deposit, which is a gene-model
      difference, not a sequence difference in the shared region. The RefSeq annotation
      also places an uncharacterized gene (VDAG_02443, XP_009651391.1, minus strand)
      between SLA2 and MAT1-2-1; it is not in the MAT vocabulary of order.yml and
      is not recorded. V. dahliae JR2 (GCA_000400815.2, CP009079.1:3830361-3865909)
      gave the same SLA2-MAT1-2-1-APN2-COX13 arrangement and a MAT1-2 call in a matpredict
      detect run (not recorded here). Short et al. 2014 (PMID 25383550) report that
      the sequenced V. dahliae strain contains only MAT1-2-1; the passage does not
      name the strain.
