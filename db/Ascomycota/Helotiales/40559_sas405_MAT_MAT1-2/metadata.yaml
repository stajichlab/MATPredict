    - pmid: '37824487'
      doi: 10.1371/journal.pone.0292619
  boundaries:
    tier: 2
    experimental_method: 'Coordinates and exon structures are the CDS features of
      GenBank KF944386.1 as read by the curator via NCBI efetch on 2026-10-17; protein
      accessions AHX22634.1 and AHX22635.1 are the deposit''s own. Tier 2: unpublished
      direct submission, no flank-to-flank experiment; only the MAT1-2-1/MAT1-2-10
      block is asserted. The unannotated MAT1-1-1 remnant (about 3267..3960) lies
      outside the asserted segment.

      '
    citations:
