  idiomorph_assignment:
    tier: 2
    experimental_method: 'MAT1-2 assignment rests on the HMG-box identity of MAT1-2-1
      annotated on the primary record and the submitter''s own /note="type: MAT1-2"
      and /strain="SAS405" qualifiers, with Abate et al. 2018 (MAT1-2 = MAT1-2-1 plus
      MAT1-2-10 in Sclerotiniaceae). No experimental mating-phenotype evidence is
      claimed for this strain. Tier 2.

      '
