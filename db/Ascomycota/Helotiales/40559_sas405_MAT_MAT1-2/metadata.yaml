    tier: 2
    experimental_method: 'Targeted sequencing of the MAT1-2 idiomorph of tester strain
      SAS405, deposited as GenBank KF944386.1; the accompanying manuscript is listed
      on the record as "Unpublished". Published descriptions of the B. cinerea/Sclerotiniaceae
      MAT1-2 architecture (Abate et al. 2018, abstract read; Wilson et al. 2023, abstract
      read) are comparative/homology-based. Tier 2.

      '
    citations:
