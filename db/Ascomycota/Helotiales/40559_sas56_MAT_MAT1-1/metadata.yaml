evidence:
  locus_existence:
    tier: 2
    experimental_method: 'Targeted sequencing of the MAT1-1 idiomorph of tester strain SAS56,
      deposited as GenBank KF944385.1, but the accompanying manuscript is listed on the record
      as "Unpublished" and no matching publication was found in PubMed by the curator. The
      published descriptions of this locus available today (Wilson et al. 2023; Abate et al.
      2018) are homology- and annotation-based, not functional characterisations of this locus.
      Tier 2, not tier 1: real, primary sequence data, but no published experimental validation
      of the locus itself.

      '
    citations:
    - pmid: '37824487'
      doi: 10.1371/journal.pone.0292619
    - pmid: '29767553'
      doi: 10.1094/PHYTO-03-18-0074-R
  boundaries:
    tier: 2
    experimental_method: 'Coordinates are exact CDS spans read by the curator directly from
      GenBank KF944385.1 via NCBI efetch on 2026-09-17, and both protein accessions (AHX22633.1,
      AHX22632.1) were confirmed to exist with the expected product names and lengths (376
      and 353 aa) via NCBI esummary. Tier 2 because the underlying deposit is an unpublished
      direct submission and the locus was not bounded by a published flank-to-flank sequencing
      experiment; only the MAT1-1 gene block, not an APN2-to-SLA2 span, is asserted.

      '
    citations:
    - pmid: '37824487'
      doi: 10.1371/journal.pone.0292619
  idiomorph_assignment:
    tier: 2
    experimental_method: 'MAT1-1 assignment rests on the alpha-box (alpha-domain) identity
      of MAT1-1-1 annotated on the primary record and on the submitter''s own /note="type:
      MAT1-1" and /strain="SAS56" qualifiers, corroborated by the homology-based Leotiomycete
      survey of Wilson et al. 2023. B. cinerea heterothallism is long-established by classical
      crossing genetics (Faretra et al. 1988), but the curator did not read that paper and
      does not assert here that it designates SAS56 as the MAT1-1 tester, so no experimental
      mating-phenotype evidence is claimed for this strain''s idiomorph. Tier 2.

      '
    citations:
    - pmid: '37824487'
      doi: 10.1371/journal.pone.0292619
