    reference_orientation: MAT1-1-5->MAT1-1-1
    definition_note: "The MAT1-1 idiomorph of Botrytis cinerea (teleomorph Botryotinia fuckeliana),\
      \ from the classical mating tester strain SAS56, deposited as GenBank KF944385.1 (6,433\
      \ bp). The GenBank source feature carries /note=\"type: MAT1-1\" and /strain=\"SAS56\"\
      . Gene identities, CDS coordinates, strands and protein accessions below were read directly\
      \ off that primary GenBank record by the curator via NCBI efetch. The complementary\
      \ MAT1-2 idiomorph of the same study is deposited as KF944386.1 (strain SAS405, /note=\"\
      type: MAT1-2\", 4,501 bp) and carries MAT1-2-1 (AHX22634.1, HMG-domain) and MAT1-2-4/MAT1-2-10\
      \ (AHX22635.1); a companion MAT1-2 record can be built from it if the curator wants\
      \ the pair.\nEVIDENCE CAVEAT -- read before accepting. Unlike the Sclerotinia records\
      \ curated in the same pass, KF944385.1 has no published primary paper behind it. Its\
      \ GenBank REFERENCE block lists De Miccolis Angelini, Rotolo, Pollastro and Faretra,\
      \ \"Molecular analysis of the mating type (MAT1) locus in the heterothallic ascomycete\
      \ Botryotinia fuckeliana (Botrytis cinerea)\", JOURNAL \"Unpublished\", plus a 2013\
      \ direct submission. The curator searched PubMed and found no publication matching that\
      \ title. This record is therefore tier 2 on all three evidence axes: the sequence and\
      \ its annotation are real and primary, but the supporting literature is either an unpublished\
      \ direct submission or, for the architecture, published work that is homology- and annotation-based\
      \ rather than a functional characterisation of this locus.\nPublished support cited\
      \ below is: (i) Wilson et al. 2023 (PLOS ONE 18:e0292619), the Leotiomycete-wide survey\
      \ that uses B. cinerea as one of its reference species and describes its MAT1-1 idiomorph\
      \ as carrying MAT1-1-1 and MAT1-1-5 plus a short MAT1-2-1 fragment -- an explicitly\
      \ BLAST/tBLASTn-plus-manual-annotation study with no functional validation of any MAT\
      \ locus; and (ii) Abate et al. 2018 (Phytopathology 108:1315-1325; De Miccolis Angelini\
      \ is the second author, not the first -- corrected citation attribution), whose own\
      \ experiments are on Monilinia but which states that the Monilinia MAT1 idiomorphs are\
      \ flanked by APN2 and SLA2 and \"resemble those of Botrytis cinerea and other heterothallic\
      \ fungi in the family Sclerotiniaceae\", with MAT1-1 containing MAT1-1-1 (alpha-box)\
      \ and MAT1-1-5 and MAT1-2 containing MAT1-2-1 (HMG-box) and MAT1-2-10. The B. cinerea\
      \ architecture claim in that paper is comparative, not experimental.\nHeterothallism\
      \ itself in this species is long-established by classical crossing genetics (Faretra,\
      \ Antonacci and Pollastro 1988, J Gen Microbiol 134:2543-2550), but the curator did\
      \ not obtain that 1988 paper and so does not assert here that it designates SAS56 as\
      \ the MAT1-1 tester; the MAT1-1 assignment below rests on the submitter's own /note\
      \ on the GenBank record and on the alpha-box identity of MAT1-1-1. That is why idiomorph_assignment\
      \ is tier 2 rather than tier 1.\ncompleteness is \"partial\": KF944385.1 annotates only\
      \ the two MAT1-1 genes. APN2 and SLA2 are documented to flank this locus in the Sclerotiniaceae\
      \ (and are annotated on the sister S. trifoliorum records KU726096.1/KU726097.1 curated\
      \ in the same pass) but neither is a feature on this record, so no flanking coordinates\
      \ are asserted. The segment below spans only MAT1-1-5 through MAT1-1-1. Wilson et al.\
      \ 2023 additionally report a short MAT1-2-1 fragment within the B. cinerea MAT1-1 idiomorph;\
      \ no such feature is annotated on KF944385.1, so it is not listed here.\nNomenclature:\
      \ the alpha-box gene is annotated on KF944385.1 as gene \"MAT1-1-1\", product \"mating\
      \ type protein MAT1-1\", note \"alpha-domain containing protein\" (AHX22632.1, 353 aa);\
      \ the second gene is annotated as gene \"MAT1-1-5\", product \"putative mating type\
      \ protein MAT1-1\" (AHX22633.1, 376 aa). Both names are used as deposited.\nCorrection\
      \ to a widely repeated secondary description: Butler 2007 (\"The Evolution of MAT: The\
      \ Ascomycetes\", in Heitman et al. eds., Sex in Fungi, ASM Press), citing a Broad Institute\
      \ draft genome, describes the B. cinerea MAT locus as containing \"a single alpha-box\
      \ gene ... between APN2 and SLA2\" plus \"an additional gene between APN2 and the alpha-box\
      \ protein ... with no significant similarity to proteins from other fungal species\"\
      . The primary record shows that the \"additional gene\" is MAT1-1-5, which is now a\
      \ named, recognised MAT gene found across the Leotiomycetes and is annotated as such\
      \ on this very record; it should not be treated as an uncharacterised ORF of unknown\
      \ identity. Butler's statement that no MAT1-1-2 ortholog is present at this locus is\
      \ consistent with the primary record (no MAT1-1-2 is annotated on KF944385.1); MAT1-1-2\
      \ is accordingly not listed below at all rather than asserted absent.\n\nASSEMBLY LOCUS\
      \ TAGS (added 2026-09-23). The gene-level `locus_tag` values below name\nthis species'\
      \ REFERENCE-GENOME genes, not features of this record's own source\ndeposit -- the same\
      \ convention the Neurospora crassa record uses, where NCU*\ntags name OR74A genes on\
      \ an M33876.1-derived record. Assembly: GCF_000143535.2_ASM14353v4\n(B05.10), sequence\
      \ NC_037310.1.\n\nEach tag was established by two independent methods that were required\
      \ to\nagree: (1) miniprot of this record's own curated protein against that\nassembly,\
      \ and (2) the gene NCBI annotates at that position, read from the\nassembly's feature\
      \ table via efetch rettype=ft. Per gene:\n\n  * MAT1-1-5   = BCIN_01g02140  813342..814869+\
      \  aa identity 100.00%, contained\n  * MAT1-1-1   = BCIN_01g02150  814948..816426+ \
      \ aa identity 100.00%, contained\n\nNCBI Gene has NO gene NAMED MAT1-1-1 for this species\
      \ (esearch count 0); these\ngenes are annotated only as \"hypothetical protein\"/\"\
      predicted protein\", so a\nname-based lookup finds nothing and a positional one finds\
      \ them at once.\nCoordinates were NOT copied into this record: they describe a different\n\
      assembly than this record's source deposit and live in\ntestset/coordinate_truth/supplemental_locus_tags.yaml.\n"
