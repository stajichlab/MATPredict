evidence:
  locus_existence:
    tier: 1
    experimental_method: 'Targeted amplification and Sanger sequencing of the complete
      MAT locus from a 283-isolate survey of Sclerotinia sclerotiorum, deposited as
      GenBank JQ815883.1; MAT gene expression at this locus confirmed by transcript
      analysis (MAT1-2-1 transcript variants and MAT1-1-1 alpha1-domain transcripts
      compared between the Inv- and Inv+ alleles); self-fertility of the isolates
      demonstrated directly. This is a dedicated, experimentally supported characterisation
      of this specific locus, not a genome-annotation homology screen, which is why
      tier 1 is assigned. (Chitrampalam et al. 2013)

      '
    citations:
    - pmid: '23457637'
      doi: 10.1371/journal.pone.0056895
  boundaries:
    tier: 1
    experimental_method: 'Complete locus region cloned and sequenced (Chitrampalam
      et al. 2013); every CDS coordinate, strand and protein accession recorded below
      was independently re-read by the curator from the primary GenBank record JQ815883.1
      via NCBI efetch on 2026-09-17, and the four protein accessions (AGB05586.1,
      AGB05587.1, AGB05588.1, AGB05589.1) were each confirmed to exist with the expected
      product names and lengths (376, 335, 281, 394 aa) via NCBI esummary. Note the
      GenBank gene features carry partial-location markers (<, >) on their mRNA extents;
      the CDS spans used here are exact.

      '
    citations:
    - pmid: '23457637'
      doi: 10.1371/journal.pone.0056895
  idiomorph_assignment:
    tier: 1
    experimental_method: 'Both idiomorphs'' core genes are physically present at one
      fused locus in a single haploid genome (alpha-box MAT1-1-1 plus HMG-box MAT1-2-1),
      and the isolates carrying this allele were shown to be self-fertile; the 3.6-kb
      inversion affecting three of the four MAT genes was shown to segregate ~1:1
      in progeny of both Inv- and Inv+ parents, i.e. the idiomorph content of this
      locus was tracked experimentally through meiosis rather than inferred from sequence
      alone. "homothallic" is used for the mating system; note that S. sclerotiorum
      is more precisely a self-fertile species that additionally switches MAT allele
      orientation every meiotic generation, which Wilson et al. 2023 classify as a
      form of mating-type switching (secondary homothallism). The schema''s `system`
      vocabulary has no "switching" value, so "homothallic" is the closest honest
      fit and the mechanism is documented in definition_note.

      '
    citations:
    - pmid: '23457637'
      doi: 10.1371/journal.pone.0056895
