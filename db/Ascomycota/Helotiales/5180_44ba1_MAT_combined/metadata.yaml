    reference_orientation: MAT1-1-5->MAT1-1-1->MAT1-2-10(reverse)->MAT1-2-1
    definition_note: 'Homothallic (self-fertile) Leotiomycete MAT locus in which the
      MAT1-1 and MAT1-2 idiomorphs are fused end-to-end at a single locus, so all
      four MAT genes are carried by one haploid genome. This record is the Inv- ("non-inverted")
      MAT allele of Chitrampalam et al. 2013, sequenced from isolate 44Ba1 and deposited
      as GenBank JQ815883.1 (12,145 bp). Gene identities, CDS coordinates and protein
      accessions below were read directly off that primary GenBank record by the curator
      via NCBI efetch, not taken from any review or synthesis.

      Nomenclature: the gene listed here as MAT1-2-10 is deposited on JQ815883.1 under
      its older name MAT1-2-4 (protein AGB05588.1, product "MAT1-2-4"). MAT1-2-4 was
      renamed MAT1-2-10 in the Pezizomycotina MAT nomenclature revision of Wilken
      et al. 2017 (Fungal Biol Rev 31:199-211), and the Leotiomycete-wide survey of
      Wilson et al. 2023 (PLOS ONE 18:e0292619) uses MAT1-2-10 throughout. The current
      name is used here; the deposited synonym is recorded in this note so the GenBank
      feature can still be matched.

      Inversion polymorphism: the same study deposited two further alleles of this
      locus from sibling isolates, JQ815884.1 (44Ba12) and JQ815885.1 (44Ba18), which
      carry a 3.6-kb inversion (designated Inv+). In the Inv+ alleles MAT1-2-1 and
      MAT1-2-10 are inverted and MAT1-1-1 is truncated at its 3'' end, so those records
      annotate only MAT1-1-5, MAT1-2-1 and MAT1-2-10 (no intact MAT1-1-1). The inversion
      is bounded by a 250-bp inverted repeat that is itself a partial MAT1-1-1, and
      it segregates ~1:1 in every meiotic generation regardless of parental orientation.
      This record deliberately captures the Inv- allele, which is the one with all
      four MAT genes intact; a companion Inv+ record could be built from JQ815884.1
      if the curator wants both orientations represented.

      completeness is "partial" because JQ815883.1 annotates only the four MAT genes.
      The canonical Pezizomycotina flanking anchors APN2 and SLA2 are known to bound
      this locus in the Sclerotiniaceae (they are annotated on the sister Sclerotinia
      trifoliorum records KU726096.1/KU726097.1 curated in the same pass), but neither
      is annotated as a feature on JQ815883.1, so no APN2/SLA2 coordinates are asserted
      here. The locus segment below therefore spans only the MAT gene block, from
      the start of MAT1-1-5 to the end of MAT1-2-1, not an APN2-to-SLA2 span.

      Correction to a widely repeated secondary description: Butler 2007 ("The Evolution
      of MAT: The Ascomycetes", in Heitman et al. eds., Sex in Fungi, ASM Press) describes
      the S. sclerotiorum MAT locus, citing a Broad Institute draft genome, as containing
      "an alpha-box gene and an HMG-domain gene between orthologs of APN2 and SLA2"
      plus "an additional gene ... with no significant similarity to proteins from
      other fungal species". The primary record shows four MAT genes, not two: that
      unnamed "additional gene" is MAT1-1-5, now a recognised and named MAT gene across
      the Leotiomycetes, and there is a fourth gene, MAT1-2-10, as well. Butler''s
      statement that no MAT1-1-2 ortholog is present at this locus is consistent with
      the primary record (no MAT1-1-2 is annotated on JQ815883.1); MAT1-1-2 is accordingly
      not listed below at all rather than being listed as an absent gene, since no
      primary evidence here speaks to it.

      '
