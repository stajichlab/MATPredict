evidence:
  locus_existence:
    tier: 1
    experimental_method: 'Cloning and complete sequencing of the MAT locus of homothallic
      Gibberella zeae alongside heterothallic G. fujikuroi and asexual F. oxysporum,
      with RT-PCR confirmation that all four MAT genes are expressed and spliced as
      predicted (Yun et al. 2000); targeted gene replacement deleting the entire MAT1
      locus abolished perithecium and ascospore production, and complementation with
      a copy of the whole locus restored them (Desjardins et al. 2004).

      '
    citations:
    - pmid: '11118131'
      doi: 10.1006/fgbi.2000.1226
    - pmid: '15066842'
      doi: 10.1128/AEM.70.4.2437-2444.2004
  boundaries:
    tier: 2
    experimental_method: 'No explicit locus endpoints are published on AF318048.1.
      The four gene coordinates are the authors'' own GenBank annotation, independently
      re-fetched and transcribed by the curator; the recorded core segment 3602..9614
      is a curator-defined span from the first to the last MAT CDS. Tier 2 for the
      boundary claim specifically, even though locus_existence and idiomorph_assignment
      are tier 1.

      '
    citations:
    - pmid: '11118131'
      doi: 10.1006/fgbi.2000.1226
  idiomorph_assignment:
    tier: 1
    experimental_method: 'Gene identity by sequence (alpha-box MAT1-1-1; HMG-domain
      MAT1-1-3 and MAT1-2-1) and homology to the two alternative idiomorphs of heterothallic
      G. fujikuroi (Yun et al. 2000); functionally confirmed by differential targeted
      deletion of MAT1-1 or MAT1-2 from the wild-type MAT1-1;MAT1-2 strain, which
      converted the fungus from homothallic to obligately heterothallic -- the resulting
      MAT1-1;mat1-2 and mat1-1;MAT1-2 strains were self-sterile but crossed to each
      other (Lee et al. 2003).

      '
    citations:
    - pmid: '11118131'
      doi: 10.1006/fgbi.2000.1226
    - pmid: '14507370'
      doi: 10.1046/j.1365-2958.2003.03694.x
