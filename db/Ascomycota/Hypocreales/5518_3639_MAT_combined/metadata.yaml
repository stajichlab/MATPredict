    definition_note: 'SPECIES CHOICE. Fusarium graminearum (teleomorph Gibberella
      zeae) was chosen over the heterothallic Gibberella fujikuroi complex because
      it has the strongest EXPERIMENTAL validation of the MAT locus in the genus:
      beyond the original cloning and sequencing (Yun et al. 2000), the locus has
      been dissected by targeted gene replacement. Lee et al. 2003 differentially
      deleted MAT1-1 or MAT1-2 from a wild-type MAT1-1;MAT1-2 haploid and obtained
      self-sterile strains that still outcrossed to each other, proving both idiomorphs
      are required for selfing; Desjardins et al. 2004 deleted the entire MAT1 locus
      (perithecia and ascospores abolished) and restored fertility by complementation
      with a copy of the whole locus. That is direct functional proof of both locus
      identity and idiomorph identity, not genome annotation. The Gibberella/Fusarium
      genus name pair is retained here as NCBI does: the GenBank record''s SOURCE
      line reads ''Fusarium graminearum (Gibberella zeae)'' and db_xref taxon:5518;
      the source paper and the deletion papers use ''Gibberella zeae''.


      HOMOTHALLIC ARCHITECTURE. Unlike the heterothallic Pezizomycotina pattern (three
      genes at MAT1-1 in one nucleus, one gene at MAT1-2 in the other), F. graminearum
      carries ALL FOUR genes -- MAT1-1-1, MAT1-1-2, MAT1-1-3 and MAT1-2-1 -- tightly
      linked at the same chromosomal location in a single haploid nucleus, interspersed
      with G. zeae-specific sequence (Yun et al. 2000). The curator independently
      confirmed the contrasting heterothallic case directly on NCBI: the G. fujikuroi
      (Fusarium fujikuroi, taxid 5127) MAT1-1 idiomorph is GenBank AF100925.1 (strain
      MO44 (A00149), three genes) and the MAT1-2 idiomorph is AF100926.1 (strain MO45
      (A00999), one gene) -- two separate accessions from two separate strains, both
      citing PMID 11118131. Those two idiomorphs are proposed as separate records
      in the same pass (5127_mo44_MAT_MAT1-1, 5127_mo45_MAT_MAT1-2). Gene names here
      follow The MAT1 / MAT1-1 / MAT1-2 / MAT1-x-x convention itself is defined by
      Turgeon and Yoder 2000, ''Proposed nomenclature for mating type genes of filamentous
      ascomycetes'', Fungal Genet Biol 31:1-5, PMID 11118130, doi 10.1006/fgbi.2000.1227
      -- citation independently verified by the curator via PubMed efetch this session.
      Note that it appeared in the same issue as, and immediately before, Yun et al.
      2000 (PMID 11118131). mating_type.idiomorphs therefore lists BOTH MAT1-1 and
      MAT1-2 and system is homothallic, following the same convention this database
      already uses for combined-locus records (e.g. the Pneumocystis *_PM_combined
      records).


      SOURCE AND COORDINATES. Source is GenBank AF318048.1 (13675 bp, /strain="3639",
      db_xref taxon:5518), the deposit accompanying Yun et al. 2000. All four gene
      spans, strands and protein_ids below were read directly off the AF318048.1 feature
      table via NCBI efetch by the curator. Strain 3639 is NOT the F. graminearum
      reference-genome strain (PH-1), hence differs_from_sequenced: true. As an independent
      cross-check, the same MAT gene cluster is present in the PH-1 RefSeq build as
      FGSG_08890-FGSG_08893 on chromosome 2 (NC_026475.1); FGSG_08891 spans 270358..271938
      complement, i.e. 1581 bp, exactly matching the MAT1-1-2 span 4797..6377 recorded
      here. This was confirmed via NCBI Gene efetch.


      SEGMENT BOUNDARY IS CURATOR-DERIVED. Neither Yun et al. 2000 nor the deposit
      states explicit locus endpoints on AF318048.1, and AF318048.1 annotates only
      the four MAT genes (no APN2/SLA2/COX13 flanking genes are present in the deposit,
      so they are not represented here). The core segment recorded below, 3602..9614,
      is defined mechanically as the span from the first base of the leftmost MAT
      CDS (MAT1-1-3) to the last base of the rightmost MAT CDS (MAT1-2-1), leaving
      3601 bp of unannotated sequence to the left and 4061 bp to the right of the
      recorded core. boundaries evidence is therefore tier 2, not tier 1: the deletion
      experiments delimit the locus functionally but publish no coordinates on this
      accession. The gene coordinates themselves are from the authors'' own deposit
      and are not in doubt, which is why excluded_from_coordinate_benchmark is left
      false; a reviewer who wants the benchmark to score only published endpoints
      should flip it to true.

      '
