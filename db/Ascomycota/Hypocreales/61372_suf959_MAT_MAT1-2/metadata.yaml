    reference_orientation: MAT1-2-1(+)
    definition_note: 'SOURCE. GenBank AB011378.1 (5122 bp; /isolate="SUF959"; db_xref
      taxon:61372; organism Fusarium oxysporum f. sp. radicis-lycopersici). The deposit''s
      reference is Yoshida T, Arie T, Noguchi M, Nomura Y, Yoder OC et al. 1998, Ann.
      Phytopathol. Soc. Jpn. (in press; no PMID). The peer-reviewed description is
      Arie et al. 2000, Mol Plant Microbe Interact 13:1330-1339 (PMID 11106025): the
      same group cloned the F. oxysporum MAT1-1 (~4.6 kb) and MAT1-2 (~3.8 kb) idiomorphs
      with flanking regions (alpha-box gene in MAT1-1, HMG-box gene in MAT1-2). The
      abstract does not list the accessions; the link is by authors, organism and
      gene content (curator check 2026-10-05).


      NOMENCLATURE. The deposit''s legacy /gene MAT-2 is recorded as MAT1-2-1 (Turgeon
      and Yoder 2000, PMID 11118130).


      BOUNDARIES. No idiomorph endpoints or flank genes are annotated on the deposit;
      the core segment is the curator-defined span of the MAT CDS. CDS join(4115..4283,4331..4542),
      126 aa, annotated ''putative'': shorter than typical MAT1-2-1 proteins; it may
      be a partial model of the gene.


      USE. Canonical F. oxysporum MAT reference (curator ruling 2026-10-05); the same
      two accessions are the references of the read-based Fola mating-type typing
      (/bigdata/stajichlab/nicolel/Fola/06_Align/Mating_Types).'
