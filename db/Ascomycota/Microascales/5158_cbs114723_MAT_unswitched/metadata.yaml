    definition_note: 'UNSWITCHED state of the C. fimbriata mating locus (GenBank KF033902.1,
      clone ''unswitched'', 46,416 bp). Genes annotated by the depositors: MAT1-1-1,
      MAT1-2-7, MAT1-2-1 and MAT1-1-2 in an atypical single-locus organisation (Wilken
      et al. 2014). Both idiomorph gene sets are present in one genome and the isolate
      is self-fertile (unisexual); this state can switch to the self-sterile MAT1-1
      state by deletion of a 3,581 bp region carrying MAT1-2-1 (and MAT1-2-7), see
      the record 5158_cbs114723_MAT_switched. Flanking genes COX13, APN2 and SLA2
      are named from the depositors'' product annotations (cytochrome c oxidase subunit
      VIa, DNA lyase, cytoskeleton assembly control protein); APC5 (putative anaphase-promoting
      complex protein, 12,578-15,226) lies between APN2 and SLA2 and is omitted because
      it is not in the order.yml vocabulary.'
