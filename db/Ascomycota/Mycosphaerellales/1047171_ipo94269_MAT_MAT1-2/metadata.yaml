evidence:
  locus_existence:
    tier: 1
    experimental_method: MAT1-2 cloned from isolate IPO94269 by heterologous probing;
      MAT1-1 from the opposite-mating-type isolate IPO323 by long-range PCR. "For
      each of the MAT genes specific primers were designed and tested on an F1 mapping
      population that was generated from a cross between IPO323 and IPO94269. An absolute
      correlation was found between the amplified allele-specific fragments and the
      mating type as determined by backcrosses of each F1 progeny isolate to the parental
      isolates." (Waalwijk et al. 2002, abstract)
    citations:
    - &id001
      pmid: '11929216'
      doi: 10.1006/fgbi.2001.1322
  boundaries:
    tier: 1
    experimental_method: Boundaries are the GenBank deposit's own; the record segment
      spans the curated genes on it. The published idiomorph lies inside.
    citations:
    - *id001
  idiomorph_assignment:
    tier: 1
    experimental_method: Idiomorph from MAT gene content (alpha-box MAT1-1-1 vs HMG-box
      MAT1-2-1) of isolates of known, opposite mating type, confirmed genetically
      (see locus_existence).
    citations:
    - *id001
