  core:
    completeness: partial
    reference_orientation: MAT1-2-1
    definition_note: 'MAT1-2 idiomorph region of Coccidioides posadasii strain Silveira,
      from the targeted GenBank deposit EF472258.1 of Fraser et al. 2007 (5,014 bp;
      curator confirmed the flatfile REFERENCE block cites PMID 17337636). Only the
      HMG-domain gene is annotated on this deposit, so completeness is ''partial'':
      the captured APN2/COX13 copies and the other MAT1-2 idiomorph genes that Mandel
      et al. 2007 report (~9 kb, five genes) are outside or unannotated on this accession.
      A sister deposit EF472257.1 carries the same gene for C. posadasii strain 1037.
      The corresponding full MAT1-2 gene complement can be seen in the C. immitis
      RS record (5501_rs_MAT_MAT1-2) proposed alongside this one. Gene-name convention:
      in the source GenBank deposits of Mandel et al. 2007 the captured flanking genes
      are given MAT-style names (cox13 = ''MAT1-1-2'', APN2 = ''MAT1-1-3''). Those
      names COLLIDE with the unrelated Sordariomycete core genes MAT1-1-2/MAT1-1-3
      already used in this phylum''s order.yml, so this record uses the gene-identity
      names COX13 and APN2 with role flanking_conserved, exactly as done for the Cytospora
      mali record where the same genes are found inside the idiomorph. Note the biology:
      in Coccidioides APN2 and COX13 are CAPTURED INSIDE the MAT idiomorph rather
      than merely flanking it, and the MAT1-1 and MAT1-2 copies have diverged strongly
      from each other (Fraser et al. 2007; Mandel et al. 2007). The role vocabulary
      describes gene identity, not physical position; order_in_locus reflects the
      true order. No sexual cycle has ever been observed in Coccidioides, and no functional
      characterisation of these MAT genes exists, so ALL evidence keys in this record
      are tier 2.'
