evidence:
  locus_existence:
    tier: 2
    experimental_method: Identified by genome analysis, targeted direct sequencing
      and bioinformatics (Fraser et al. 2007); Mandel et al. 2007 additionally determined
      cDNA structures showing all idiomorph genes are transcribed. No mating has ever
      been observed in Coccidioides and no functional (mating/deletion) validation
      of these genes exists, so this does not meet the tier-1 bar.
    citations:
    - pmid: '17337636'
      doi: 10.1128/EC.00018-07
    - pmid: '17513566'
      doi: 10.1128/EC.00117-07
  boundaries:
    tier: 2
    experimental_method: Per-gene coordinates are the authors' published GenBank CDS
      annotations on EF472259.1, independently re-fetched and checked by the curator
      via NCBI efetch. No functional validation of the locus boundary.
    citations:
    - pmid: '17337636'
      doi: 10.1128/EC.00018-07
  idiomorph_assignment:
    tier: 2
    experimental_method: Assigned by alpha-box domain identity and by a diagnostic
      PCR mating-type test applied to isolate panels (Fraser et al. 2007; Mandel et
      al. 2007 typed 436 isolates and found a 1:1 MAT ratio). The PCR test detects
      idiomorph sequence; it is not a functional mating assay, and mating has never
      been observed in this genus, so this is tier 2.
    citations:
    - pmid: '17337636'
      doi: 10.1128/EC.00018-07
    - pmid: '17513566'
      doi: 10.1128/EC.00117-07
