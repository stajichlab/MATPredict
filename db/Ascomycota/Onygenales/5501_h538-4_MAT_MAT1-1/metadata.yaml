  core:
    completeness: partial
    reference_orientation: COX13->APN2->MAT1-1-1
    definition_note: 'MAT1-1 idiomorph region of Coccidioides immitis strain H538.4,
      from the targeted GenBank deposit EF472259.1 of Fraser et al. 2007 (14,205 bp;
      curator confirmed the REFERENCE block of the flatfile cites PMID 17337636).
      The deposit annotates only COX13, APN2 and the alpha-box protein; the unknown-function
      idiomorph gene that Mandel et al. 2007 report for C. immitis MAT1-1 (ABS19617.1,
      on the gapped record AH015916.2 for strain RMSCC3703) is NOT annotated on EF472259.1
      and is therefore not listed here. SLA2 is outside the deposited region. completeness
      is ''partial'' for that reason. Mandel et al. give the MAT1-1 idiomorph as 8.1
      kb; EF472259.1 does not carry an explicit idiomorph boundary feature, so the
      segment is the full deposited accession and the per-gene coordinates are the
      authors'' own published CDS annotations, re-fetched by the curator via NCBI
      efetch on 2026-09-17. Gene-name convention: in the source GenBank deposits of
      Mandel et al. 2007 the captured flanking genes are given MAT-style names (cox13
      = ''MAT1-1-2'', APN2 = ''MAT1-1-3''). Those names COLLIDE with the unrelated
      Sordariomycete core genes MAT1-1-2/MAT1-1-3 already used in this phylum''s order.yml,
      so this record uses the gene-identity names COX13 and APN2 with role flanking_conserved,
      exactly as done for the Cytospora mali record where the same genes are found
      inside the idiomorph. Note the biology: in Coccidioides APN2 and COX13 are CAPTURED
      INSIDE the MAT idiomorph rather than merely flanking it, and the MAT1-1 and
      MAT1-2 copies have diverged strongly from each other (Fraser et al. 2007; Mandel
      et al. 2007). The role vocabulary describes gene identity, not physical position;
      order_in_locus reflects the true order. No sexual cycle has ever been observed
      in Coccidioides, and no functional characterisation of these MAT genes exists,
      so ALL evidence keys in this record are tier 2.'
