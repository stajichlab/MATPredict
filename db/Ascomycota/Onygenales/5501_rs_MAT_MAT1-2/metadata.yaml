    definition_note: 'MAT1-2 idiomorph region of the Coccidioides immitis RS reference
      genome (RefSeq scaffold NW_004504310.1 = supercont3.1). No targeted per-locus
      GenBank deposit exists for C. immitis MAT1-2; Fraser et al. 2007 defined this
      idiomorph from the RS genome (reported as 9,037 bp) and Mandel et al. 2007 report
      the MAT1-2 idiomorph as ~9 kb with five genes. Curator verification: the RefSeq
      protein XP_001246635.1 (CIMG_00406, ''HMG domain-containing protein'') is ~99%
      identical to the C. posadasii Silveira MAT1-2-1 protein ABO87599.1 from the
      targeted deposit EF472258.1, confirming CIMG_00406 is MAT1-2-1 and that strain
      RS is MAT1-2. CIMG_00405 is annotated ''exodeoxyribonuclease III (xth)'' but
      is the captured APN2 copy (homologous to, yet strongly diverged from, the MAT1-1
      APN2 copy ABO87600.1 -- the divergence Mandel et al. describe). CIMG_00407 is
      an idiomorph-specific unknown-function gene; it is distinct in sequence from
      the MAT1-1 unknown-function gene (ABS19617.1/ABS19621.1) and is recorded under
      its locus tag rather than a MAT-style number, because the curator could not
      verify a published MAT1-2-x number for it from a primary source. Coordinates
      are curator-derived from RefSeq, fetched via NCBI efetch on 2026-09-17. Gene-name
      convention: in the source GenBank deposits of Mandel et al. 2007 the captured
      flanking genes are given MAT-style names (cox13 = ''MAT1-1-2'', APN2 = ''MAT1-1-3'').
      Those names COLLIDE with the unrelated Sordariomycete core genes MAT1-1-2/MAT1-1-3
      already used in this phylum''s order.yml, so this record uses the gene-identity
      names COX13 and APN2 with role flanking_conserved, exactly as done for the Cytospora
      mali record where the same genes are found inside the idiomorph. Note the biology:
      in Coccidioides APN2 and COX13 are CAPTURED INSIDE the MAT idiomorph rather
      than merely flanking it, and the MAT1-1 and MAT1-2 copies have diverged strongly
      from each other (Fraser et al. 2007; Mandel et al. 2007). The role vocabulary
      describes gene identity, not physical position; order_in_locus reflects the
      true order. No sexual cycle has ever been observed in Coccidioides, and no functional
      characterisation of these MAT genes exists, so ALL evidence keys in this record
      are tier 2.'
