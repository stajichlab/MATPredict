evidence:
  locus_existence:
    tier: 2
    experimental_method: Identified by genome analysis and bioinformatics from the
      C. immitis RS genome (Fraser et al. 2007); Mandel et al. 2007 determined cDNA
      structures for the idiomorph genes. No mating observed, no functional validation.
    citations:
    - pmid: '17337636'
      doi: 10.1128/EC.00018-07
    - pmid: '17513566'
      doi: 10.1128/EC.00117-07
  boundaries:
    tier: 2
    experimental_method: Curator-derived from the C. immitis RS RefSeq annotation
      on NW_004504310.1 via NCBI efetch; the published idiomorph length (~9 kb) was
      not mapped to base-level coordinates by the curator.
    citations:
    - pmid: '17337636'
      doi: 10.1128/EC.00018-07
  idiomorph_assignment:
    tier: 2
    experimental_method: HMG-domain identity, confirmed by the curator via direct
      protein comparison of XP_001246635.1 with the targeted-deposit C. posadasii
      MAT1-2-1 protein ABO87599.1 (~99% identity). Diagnostic PCR mating-type typing
      of isolate panels supports the bipolar idiomorph system but is not a functional
      mating assay.
    citations:
    - pmid: '17337636'
      doi: 10.1128/EC.00018-07
    - pmid: '17513566'
      doi: 10.1128/EC.00117-07
