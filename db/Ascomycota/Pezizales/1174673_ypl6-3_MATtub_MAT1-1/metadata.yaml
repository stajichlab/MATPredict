      the locus deposit KY782630.1 (63,555 bp). Curated genes: MAT1-1-1 and APN2 (two
      adjacent CDS, AVI60822.1 and AVI60823.1, kept under one gene name). SLA2 is
      NOT on this deposit: it begins at MBA1 (358-1470), on the other side of MAT
      from APN2. The paper''s two extra MAT1-1 ORFs (GME3123, GME3124; ''novel mating
      genes found only in morels'') are not in the MATtub roster and are not curated.
      APN2 lies ~19 kb from MAT1-1-1.'
