evidence:
  locus_existence:
    tier: 1
    experimental_method: Genome sequencing of two ascospore isolates of opposite mating
      type; idiomorphs identified and deposited with flanking genes. "In this study,
      the genomes of two ascospore isolates of M. importuna with opposite mating-type
      were sequenced and two idiomorphs, MAT1-1 and MAT1-2, were identified. The MAT1-2
      idiomorph was 6.7 kb in length containing a single MAT1-2-1 gene, and the MAT1-1
      idiomorph was 10.5 kb containing a MAT1-1-1 gene and two other open reading
      frames (ORFs), GME3123 and GME3124. ... Single-ascospore populations of M. importuna,
      M. sextelata and Mel-20 were analysed, and the result indicated that the ratios
      of MAT1-1- and MAT1-2-harbouring idiomorphs were not significantly different
      from a 1:1 ratio. The results suggest that these three black morels are heterothallic."
      (Chai et al. 2017, abstract)
    citations:
    - pmid: null
      doi: 10.1007/s11557-017-1309-x
  boundaries:
    tier: 1
    experimental_method: Boundaries of the deposited region are the GenBank record's
      own; the record segment spans the curated genes on it. The paper's idiomorph
      (MAT1-2 6.7 kb / MAT1-1 10.5 kb) lies inside.
    citations:
    - pmid: null
      doi: 10.1007/s11557-017-1309-x
  idiomorph_assignment:
    tier: 1
    experimental_method: Idiomorph by MAT gene content (MAT1-1-1 vs MAT1-2-1) of opposite-mating-type
      ascospore isolates; 1:1 segregation in single-ascospore populations.
    citations:
    - pmid: null
      doi: 10.1007/s11557-017-1309-x
