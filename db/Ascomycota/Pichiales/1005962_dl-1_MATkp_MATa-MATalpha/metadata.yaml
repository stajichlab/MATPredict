evidence:
  locus_existence:
    tier: 1
    experimental_method: two MAT loci and inversion-based switching in H. polymorpha
      (O. polymorpha) by genetic and molecular analysis; the DL-1 cassette itself
      is a genome annotation
    citations:
    - pmid: '25412462'
      doi: 10.1371/journal.pgen.1004796
    - pmid: '25349420'
      doi: 10.1073/pnas.1416014111
  boundaries:
    tier: 2
    experimental_method: RefSeq genome annotation of DL-1 (GCF_000187245.1) for SLA2,
      MATa1, MATalpha2, DIC1; MATalpha1 derived here by alignment of the O. polymorpha
      deposit protein; gene extents are annotation-derived
    citations:
    - pmid: '25412462'
      doi: 10.1371/journal.pgen.1004796
  idiomorph_assignment:
    tier: 1
    experimental_method: 'functional assay in H. polymorpha: MAT1-encoded alpha1 specifies
      alpha cell identity, MAT1 alpha2 and MAT2 a1 are essential for meiosis (abstract
      of PMID 25412462); gene identity by homology'
    citations:
    - pmid: '25412462'
      doi: 10.1371/journal.pgen.1004796
