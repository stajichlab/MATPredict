    experimental_method: genome annotation of CBS 7435 (FR839631.1, curated by Valli
      et al. 2016; and the independent 2022 annotation of LT962479.2); gene extents
      are annotation-derived, not experimentally delimited
    citations:
    - pmid: '21575661'
      doi: 10.1016/j.jbiotec.2011.04.014
    - pmid: '27388471'
      doi: 10.1093/femsyr/fow051
