    reference_orientation: DIC1->MATa2->MATa1->SLA2
    definition_note: 'MATa cassette of K. phaffii CBS 7435, chromosome 4 (FR839631.1:1666-7892,
      Kuberl et al. 2011 genome, PMID 21575661; gene models CCA40181.1 DIC1-1, SCV12319.1
      MATa2, CCA40182.1 MATa1, CCA40183.1 SLA2-2). K. phaffii is homothallic and switches
      mating type by inversion of a ~138 kb region of chromosome 4 that carries a
      MATa cassette at one end and a MATalpha cassette at the other; the cassette
      beside the telomere is repressed (Hanson et al. 2014, PMID 25349420; Heistinger
      et al. 2018, PMID 29061733; Feng et al. 2020, PMID 31756769). In the CBS 7435
      assembly this MATa cassette is the one at the chromosome-4 end (locus 1, FR839631.1
      position 1666) and the MATalpha cassette is 135 kb away (locus 2), so the sequenced
      cell was in the configuration with MATalpha at the active locus; mating_type.system
      is pseudohomothallic (switching homothallism) for the species, not a property
      of this configuration alone. ANCHOR (curator rule B10): strain label CBS 7435
      on both assemblies (BioSample SAMEA2272267 STRAIN CBS 7435 for GCA_000223565.1,
      which holds FR839631.1; GCA_900235035.2 assembly KP_7435-4, organism K. phaffii
      CBS 7435), then blastn of the 6,228 bp segment FR839631.1:1665-7892 against
      LT962479.2: 100.000% over 6,228/6,228 bp at LT962479.2:1770-7997 (2026-10-17).
      The same segment also matches the other cassette at 99.97% over its 3.1 kb SLA2
      repeat and 100% over a 1 kb DIC1 repeat (LT962479.2:136012-139143, 140791-141829):
      the flanks are an inverted repeat shared by both cassettes, only the MATa1/MATa2
      interval is idiomorph-specific. GENE MODELS: MATa2 (178 aa) and MATa1 (225 aa)
      are single-exon in this annotation and in the independent 2022 annotation of
      LT962479.2 (CAH2450367.1, CAH2450368.1, identical proteins). No intron was found
      by me and no RNA-seq was re-examined. GENETIC CODE: standard (NCBI Taxonomy
      GeneticCode 1 for taxid 460519, 981350 and 644223); every CDS here translates
      with table 1 without an internal stop. STRAIN LABEL: CBS 7435 is stated to be
      equivalent to NRRL Y-11430 in PMID 36520709 (Offei et al. 2022, "CBS7435 (NRRL
      Y-11430)") and PMID 31654411 ("Y-11430 (CBS7435)"); the culture_collection_ids
      list NRRL Y-11430 on that basis. NOT VERIFIED: the Kuberl et al. 2011 full text
      (the J Biotechnol paper) was not readable here, so the CBS 7435 source and its
      deposit history rest on the NCBI records and the two papers above. The idiomorph
      names MATa1/MATa2/MATalpha1/MATalpha2 are the annotation names; idiomorph_class
      and gene classes for this family are unassigned pending the curator (order.yml,
      MATkp). RECORD VERSION 2, 2026-10-18: gene_class HMG_box is declared for MATa2 in order.yml
      by curator decision, accepting structural, iterative and alignment evidence as the bar;
      the evidence is weak and is stated here. Pfam HMG_box scores MATa2 13.6 bits (GA 25.4)
      and the curator MAT1-2-1 profile finds nothing; a single search finds only C. albicans
      MTLA2 (38 bits) and jackhmmer reaches HMG-box proteins (Ixr1, Abf2, Rox1) and
      Pezizomycotina MAT1-2-1 only after iterating; AlphaFold models of Komagataella, K. lactis
      and C. albicans MATa2 show one three-helix core of about 80 residues and Foldseek top
      hits are all HMG boxes at E 0.02-0.65; the alignment to Nhp6a, SRY, Ixr1 and Aspergillus
      MAT1-2-1 matches the box start and the helix-2 S/K..S..W motif. A 7-protein
      Saccharomycotina MATa2 profile recovers held-out lineages with thin margins over the
      best background HMG protein (deterministic build, held-out vs background: Komagataella
      43.9 vs 37.7 bits, K. lactis 26.7 vs 25.4, Yarrowia mata2 22.4 vs 21.3, Clavispora 39.5 vs
      41.3, i.e. below it). Details: docs/notes/2026-10-18_komagataella-mata-analysis.md. MATa1
      is a homeodomain protein (PF00046 51.7 bits) and has no class (the schema has none).'
