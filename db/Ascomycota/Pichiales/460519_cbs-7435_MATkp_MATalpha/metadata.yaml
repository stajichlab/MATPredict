    reference_orientation: SLA2->MATalpha1->MATalpha2->DIC1
    definition_note: 'MATalpha cassette of K. phaffii CBS 7435, chromosome 4 (FR839631.1:135891-141707,
      Kuberl et al. 2011 genome, PMID 21575661; gene models CCA40250.1 SLA2-1, CCA40251.1
      MATalpha1, SCV12330.1 MATalpha2, CCA40252.1 DIC1-2). This is locus 2, 135 kb
      from the MATa cassette (record 460519_cbs-7435_MATkp_MATa) in the same chromosome;
      K. phaffii switches mating type by inversion of the region between them (Hanson
      et al. 2014, PMID 25349420; Heistinger et al. 2018, PMID 29061733). Added 2026-10-18
      on the curator decision so that MATalpha1 is searchable (the GS115 MATalpha
      record carries a frameshifted MATalpha1). ANCHOR (curator rule B10): strain
      label CBS 7435 on both assemblies; blastn of FR839631.1:135890-141707 (5,818
      bp) against LT962479.2 (GCA_900235035.2): 100.000% over 5,818/5,818 bp at LT962479.2:136011-141828
      (2026-10-18; the record segment 135891-141707 maps to 136012-141828). GENE MODELS:
      MATalpha1 (190 aa) and SLA2/DIC1 are single exon; MATalpha2 (173 aa) has one
      57 bp intron after an 11 bp first exon (exons 140525-140535 and 139957-140467
      on the minus strand): read through, the ATG is blocked by a stop after four
      codons, the spliced ORF is open, keeps a homeodomain (PF00046) and hits MATalpha2
      of S. cerevisiae by phmmer; the same models are annotated in the independent
      2022 annotation of LT962479.2 (CAH2450441.1, CAH2450442.1). No RNA-seq was examined.
      GENETIC CODE: standard (NCBI Taxonomy code 1). STRAIN LABEL: CBS 7435 = NRRL
      Y-11430 per PMID 36520709 and PMID 31654411. NOT VERIFIED: the Kuberl 2011 full
      text. MATalpha1 carries the alpha box (Pfam PF04769 37.5 bits, GA 28.1); the
      idiomorph_class of this family is unassigned pending the curator.'
