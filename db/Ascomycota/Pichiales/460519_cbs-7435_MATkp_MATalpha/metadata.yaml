evidence:
  locus_existence:
    tier: 1
    experimental_method: both MAT cassettes and the inversion-based switching between
      them shown by PCR/sequence analysis of both orientations and induction of switching;
      functional dissection of the MAT genes by deletion and mating assays in a K.
      phaffii type-strain background (CBS 2612, 99% identical at both loci to CBS
      7435)
    citations:
    - pmid: '25349420'
      doi: 10.1073/pnas.1416014111
    - pmid: '29061733'
      doi: 10.1128/MCB.00398-17
  boundaries:
    tier: 2
    experimental_method: genome annotation of CBS 7435 (FR839631.1, and the independent
      2022 annotation of LT962479.2); gene extents are annotation-derived, not experimentally
      delimited
    citations:
    - pmid: '21575661'
      doi: 10.1016/j.jbiotec.2011.04.014
    - pmid: '27388471'
      doi: 10.1093/femsyr/fow051
  idiomorph_assignment:
    tier: 1
    experimental_method: 'functional assay: Matalpha1 is essential for diploid formation
      in alpha-type cells and Matalpha2 for sporulation in heterothallic strains of
      stable mating type; MATalpha identity of the genes by homology to the Saccharomycotina
      MATalpha1/MATalpha2'
    citations:
    - pmid: '29061733'
      doi: 10.1128/MCB.00398-17
