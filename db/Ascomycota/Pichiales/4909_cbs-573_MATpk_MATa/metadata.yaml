  core:
    completeness: complete
    reference_orientation: SLA2->MATa1->MATa2->TGL1
    definition_note: 'MATa allele of P. kudriavzevii CBS 573 on chromosome 2 (CP028774.1;
      RefSeq NC_042507.1, the same sequence), about 310 kb from the left end (Douglass
      et al. 2018, PMID 30024981). The species is heterothallic with no silent loci;
      CBS 573 is a heterozygote, and the other allele is the record 4909_cbs-573_MATpk_MATalpha
      (MH260578.1). GENE MODELS are the RefSeq annotation of GCF_003054445.1: SLA2
      C5L36_0B01570 (XP_029320369.1), MATa1 C5L36_0B01580 (XP_029320370.1, 810 bp,
      single exon, minus strand), MATa2 C5L36_0B01585 (XP_029320371.1, plus strand,
      two exons 311,575-311,841 and 311,904-312,245, 202 aa) and TGL1 C5L36_0B01590
      (XP_029320372.1). The RefSeq /note fields name MATa1 and MATa2 and a ''mating
      type locus Ya region'' feature at 310,398-312,401. RNA-SEQ CHECK (SRR6966973,
      the same strain, 72.1 M reverse-stranded reads, 2026-10-29): the 62 bp intron
      at 311,842-311,903 is GT..AG with 27 spliced reads; the plus-strand transcript
      starts about 311,660, so the annotated start codon (ATG 311,575) is supported
      by homology and annotation, not by this RNA; ATG 311,788 would remove the HMG-box
      core. The MATa2 protein is divergent (Saccharomycotina MATa2 profile 52.4 bits,
      supporting evidence only). Flank synteny with the alpha allele: SLA2 and TGL1
      (100% and 98% identical proteins by miniprot). SUI1 (306,404-306,947) and SEC3
      (313,903-317,976) lie one gene further out and are not recorded. GENETIC CODE:
      standard (table 1). Details: results/2026-10-29_yeast_routing/ogataea_pichia_reference_check.md
      and results/2026-10-29_pichia_family/README.md.'
