    reference_orientation: SLA2->MATalpha1->MATalpha2->TGL1
    definition_note: 'MATalpha allele of P. kudriavzevii CBS 573, the deposit MH260578.1
      (11,807 bp; SUI1, SLA2, MATalpha1, MATalpha2, TGL1, SEC3; Douglass et al. 2018,
      PMID 30024981). The deposit is the PacBio contig for the alternative allele
      of the heterozygous CBS 573; the chromosome-2 assembly carries the MATa allele
      (record 4909_cbs-573_MATpk_MATa). Same BioSample as the assembly (SAMN08558011,
      strain CBS 573). The record covers SLA2 to TGL1; SUI1 (5-prime end of the deposit,
      partial) and SEC3 (partial) are not recorded. MATalpha1 (180 aa) is single-exon
      on the minus strand; MATalpha2 has three exons on the minus strand (the last
      exon is 14 bp, as deposited). The MAT1-1-1 profile hits MATalpha1 (E 3.2e-7).
      GENETIC CODE: standard (table 1). No assembly anchor (assembly_accession null):
      the 11.8 kb contig is not part of GCA_003054445.1; the alpha allele of the independent
      isolate SJP (GCA_003033855.1, CP021089.1) is the test case in results/2026-10-29_pichia_family/README.md.'
