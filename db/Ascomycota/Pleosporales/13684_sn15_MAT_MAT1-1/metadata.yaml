    reference_orientation: MAT1-1-1(+)->APN2(-)->COX13(+)
    definition_note: Genome-derived MAT1-1 locus of Parastagonospora nodorum SN15
      (RefSeq GCF_000146915.1 = Broad assembly ASM14691v2, scaffold NW_001884549.1),
      curated 2026-10-17 from the RefSeq GFF (CDS coordinates and XP protein accessions
      as annotated). MAT1-1-1 (SNOG_00375, XP_001791062.1, 344 aa) is identical (100%
      over 344 aa) to the SN435PL98 MAT1-1-1 protein AAO31740.1 of the curated deposit
      record 13684_sn435pl98_MAT_MAT1-1 (Bennett et al. 2003); SN15 is MAT1-1 (Syme
      et al. 2013, G3, doi 10.1534/g3.112.004994; not independently verified here).
      APN2 (SNOG_00377, XP_001791064.1) and COX13 (SNOG_00378, XP_001791065.1) follow
      MAT1-1-1 on the same scaffold, identified by blastp against the A. fumigatus
      Af293 records (APN2 50.6%, COX13 48.2% identity); SNOG_00377 is annotated 5'-partial
      (end_range). Two small uncharacterised genes lie between MAT1-1-1 and APN2 and
      are not recorded. SLA2 is NOT recorded here. The SN15 SLA2 ortholog (SNOG_00689,
      XP_001791366.1, 74.2% identity to Af293 SLA2) lies on the same scaffold 690
      kb from MAT1-1-1 (1,557,598-1,563,291), so it is not a flank of the locus in
      this genome; the roster still declares SLA2 for other lineages.
