evidence:
  locus_existence:
    tier: 1
    experimental_method: MAT-1 cloned by complementing a MAT-2 strain; MAT identity
      proven by RFLP and conventional genetic mapping. "MAT-1 was cloned by complementing
      a MAT-2 strain using a cosmid library from a MAT-1 strain and screening for
      a homothallic transformant. ... MAT identity was proven by restriction fragment
      length polymorphism and conventional genetic mapping. ... MAT-2 was cloned by
      probing a cosmid library from a MAT-2 strain with a fragment of insert DNA from
      a MAT-1 cosmid. A 1.5 kb subclone of either MAT-containing cosmid was sufficient
      to confer mating function in transformants." (Turgeon et al. 1993, abstract)
    citations:
    - &id001
      pmid: '8479433'
      doi: 10.1007/BF00279556
  boundaries:
    tier: 1
    experimental_method: Boundaries are the GenBank deposit's own; the record segment
      spans the curated genes on it. The published idiomorph lies inside.
    citations:
    - *id001
  idiomorph_assignment:
    tier: 1
    experimental_method: Idiomorph from MAT gene content (alpha-box MAT1-1-1 vs HMG-box
      MAT1-2-1) of isolates of known, opposite mating type, confirmed genetically
      (see locus_existence).
    citations:
    - *id001
