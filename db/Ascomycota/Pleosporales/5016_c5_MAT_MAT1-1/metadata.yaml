    definition_note: 'Cochliobolus heterostrophus (= Bipolaris maydis, NCBI taxid
      5016) strain C5 MAT-1 locus, deposit AF029913.1 (12,572 bp). The paper calls
      the gene MAT-1; it is the alpha-box MAT1-1-1 ("similarity to the Neurospora
      crassa MATA ... and Saccharomyces cerevisiae MAT alpha 1 proteins"). Curated:
      MAT1-1-1 (AAB82945.1); GAP1 (AAB82943.1) and BGL1 (AAB82946.1) added 2026-10-22
      as Pleosporaceae-scoped roster flanks (prototype; db/Ascomycota/order.yml), CDS
      joins translated from the deposit equal the protein records. Not curated: the
      unknown ORF1 (AAB82944.1). The segment spans GAP1 to BGL1. The deposit has no
      APN2 or SLA2. Idiomorph 1,297 bp per the paper.'
