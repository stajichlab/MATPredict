  core:
    completeness: partial
    reference_orientation: matPi->matMc->matMi
    definition_note: 'Pneumocystis species are obligate primary homothalls: a single
      fused locus carries both M-class (matMc, matMi) and P-class (matPi; matPc is
      absent/lost in this genus) genes together in every genome, spanning ~10kb on
      one contig (Richard et al. 2018). Coordinates for matPi and matMc were independently
      confirmed against this assembly''s own RefSeq annotation via NCBI efetch (protein
      accessions below); both GenBank CDS spans matched the literature-reported coordinates
      within a few bp (likely a gene-vs-CDS boundary difference, not a discrepancy
      in identity). matMi could NOT be independently confirmed this way: RefSeq does
      not annotate a gene/CDS feature at the literature-reported position (211185-221394
      -> re-checked as 221185-221394), consistent with the source paper''s own note
      that matMi is only ~12-20% identical to homologs and "nearly undetectable by
      homology" -- it is included here (present: true) on the paper''s authority alone,
      with no protein_accession, rather than omitted or guessed. completeness is "partial"
      for this reason, and because matPc (present in most other Ascomycota MAT systems)
      is absent/lost in this genus per the same paper, not because the locus itself
      is incompletely characterized.

      '
