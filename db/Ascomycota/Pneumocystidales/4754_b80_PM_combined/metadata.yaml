    reference_orientation: matPi->matMc->matMi
    definition_note: 'Same fused homothallic PM locus architecture as 42068_ru7_PM_combined
      (Pneumocystis jirovecii), same source paper (Richard et al. 2018). matPi and
      matMc coordinates independently confirmed against RefSeq assembly GCF_001477545.1
      via NCBI efetch; both matched the literature-reported coordinates closely (small
      boundary differences consistent with gene-vs-CDS span). matMi is not annotated
      as a discrete RefSeq gene/CDS at the literature-reported position and could
      not be independently confirmed the same way as the other two genes -- included
      here (present: true) on the source paper''s authority alone, no protein_accession.
      completeness is "partial" for the same reasons as the paired jirovecii record
      (matMi unconfirmable via RefSeq; matPc absent/lost in this genus per the source
      literature).

      '
