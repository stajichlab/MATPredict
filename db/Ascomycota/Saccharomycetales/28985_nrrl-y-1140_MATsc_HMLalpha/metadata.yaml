evidence:
  locus_existence:
    tier: 1
    experimental_method: Sequenced K. lactis cryptic alpha cassette (Astrom et al.
      2000, deposit AF195066.1); K. lactis MAT/HML organisation (Butler et al. 2004);
      alpha3 in this cassette and its role in switching (Barsoum et al. 2010). The
      X/Y/Z cassette structure used to delimit this locus is the one defined by complete
      sequencing of the S. cerevisiae MAT, HML and HMR loci (Astell et al. 1981, PMID
      7034964); it is cited as the structural basis, not as evidence about this species.
