    reference_orientation: MATALPHA1->MATALPHA2
    definition_note: 'The alpha idiomorph of Kluyveromyces lactis, taken from the SILENT HML donor cassette,
      because the reference strain is MATa at MAT and therefore carries no alpha allele there. Same precedent
      as 4932_s288c_MATsc_HMRa in reverse: HML sequence is what gene conversion copies into MAT when a
      cell switches to alpha, so the HML-encoded alpha1/alpha2 proteins ARE the MATalpha proteins. Confirmed
      as HML by blastn of the deposited cryptic cassette AF195066.1 (HMLalpha) against the genome: 99.928%
      over 9,671 bp at NC_006039.1:20,393-30,060, subtelomeric on the left arm and abutting CHA1 (KLLA0_C00440g)
      -- the same CHA1-HML adjacency S. cerevisiae shows. NOT curated here: alpha3 (XP_452212.1, 26,146-28,839),
      a domesticated transposase inside this cassette required for K. lactis switching (Barsoum et al.
      2010 Genes Dev 24:33-44, PMID 20008928). It is a real gene with a real accession and would be genuinely
      idiomorph-informative in this genus, but it has no roster slot in MATsc and needs a curator ruling
      first. Citations: Astrom et al. 2000 (PMID 10978277); Butler et al. 2004 (PMID 14745027).'
