  core:
    completeness: complete
    reference_orientation: sla2->MATA1->MATA2
    definition_note: 'The ACTIVE MAT locus of Kluyveromyces lactis NRRL Y-1140 (=
      CBS 2359), on chromosome C. Idiomorph established by SEQUENCE, not by annotation
      naming: RefSeq leaves these two CDSs unnamed, so the deposited cryptic-cassette
      sequence AF195067.1 (HMRa) was blastn''d against the genome -- it matches chromosome
      B at 99.855% (HMR) and the MAT position on chromosome C at 100.000% over 3,004
      bp, so the MAT position carries Ya. sla2 is genuinely adjacent here, unlike
      in Saccharomyces where SLA2 is not even on the MAT chromosome; that is why sla2
      is a bonus flank (`optional`) in this family rather than excluded. Curated 2026-09-21
      to close the measured allele-calling gap: Kluyveromyces resolved only 47-64%
      of confident loci with S. cerevisiae/Zygosaccharomyces references, and on held-out
      K. marxianus the only MATA2 hit landed on the SILENT alpha cassette. Citations:
      Butler et al. 2004 PNAS 101:1632-1637 (PMID 14745027); Astrom et al. 2000 Genetics
      156:81-91 (PMID 10978277).'
