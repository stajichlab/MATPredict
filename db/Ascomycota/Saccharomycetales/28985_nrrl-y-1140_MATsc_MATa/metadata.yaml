evidence:
  locus_existence:
    tier: 1
    experimental_method: Sequenced K. lactis mating-type cassettes (Astrom et al.
      2000, deposits AF195066.1 HMLalpha and AF195067.1 HMRa) and comparative analysis
      of the K. lactis MAT locus (Butler et al. 2004). The X/Y/Z cassette structure
      used to delimit this locus is the one defined by complete sequencing of the
      S. cerevisiae MAT, HML and HMR loci (Astell et al. 1981, PMID 7034964); it is
      cited as the structural basis, not as evidence about this species.
    citations:
    - &id001
      pmid: '10978277'
      doi: 10.1093/genetics/156.1.81
    - &id002
      pmid: '14745027'
      doi: 10.1073/pnas.0304170101
    - &id003
      pmid: '7034964'
      doi: 10.1016/0092-8674(81)90356-1
  boundaries:
    tier: 1
    experimental_method: 'Placed on the K. lactis NRRL Y-1140 reference assembly by
      the curator: blastn of the deposited HMRa cassette AF195067.1 matches the MAT
      position on chromosome C at 100.000% over 3,004 bp (see definition_note). The
      X/Y/Z cassette structure used to delimit this locus is the one defined by complete
      sequencing of the S. cerevisiae MAT, HML and HMR loci (Astell et al. 1981, PMID
      7034964); it is cited as the structural basis, not as evidence about this species.'
    citations:
    - *id001
    - *id002
    - *id003
  idiomorph_assignment:
    tier: 1
    experimental_method: 'MATa by sequence: the MAT position carries the Ya region
      of the deposited HMRa cassette (Astrom et al. 2000); MAT locus organisation
      in K. lactis per Butler et al. 2004. The X/Y/Z cassette structure used to delimit
      this locus is the one defined by complete sequencing of the S. cerevisiae MAT,
      HML and HMR loci (Astell et al. 1981, PMID 7034964); it is cited as the structural
      basis, not as evidence about this species.'
    citations:
    - *id001
    - *id002
    - *id003
