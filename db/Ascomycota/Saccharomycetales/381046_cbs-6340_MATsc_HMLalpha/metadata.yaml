    reference_orientation: MATALPHA1->MATALPHA2
    definition_note: 'The alpha idiomorph of Lachancea thermotolerans CBS 6340, from
      the SILENT HML cassette on chromosome F -- the reference strain is MATa at MAT.
      Cassette architecture established by blastn self-comparison of chromosome F:
      the MAT-position X box matches HML''s at 99.660%, the Ya region matches the
      silent a cassette at 99.931%, and the Z box at 100%. CHA1 (KLTH0F00440g) abuts
      this cassette, the same CHA1-HML adjacency seen in S. cerevisiae and K. lactis.
      CAVEAT, recorded deliberately: MATALPHA2 is only 108 aa across two exons (intron
      32,052-32,347, GT..AG confirmed directly in the genomic sequence), against 210
      aa in S. cerevisiae and 223 aa in K. lactis. The longest alternative continuous
      plus-strand ORF in the Yalpha region is 63 aa, so there is no simple unspliced
      alternative, but the model may still be N-terminally truncated -- treat it as
      the weak gene of this record. Measured on held-out Lachancea fermentati it did
      NOT improve on the existing references (32.0 bits at E=0.016, worse than S.
      cerevisiae MATALPHA2''s 42.7), whereas MATALPHA1 improved from 73.9 to 100 bits.
      The Lachancea a-allele is deliberately NOT curated: no MATa1 with both a protein
      accession and an intact homeodomain exists in NCBI (the MAT-position ORF at
      NC_013082.1:282,329-282,664 is unannotated; the accessioned XP_002554220.1 from
      the silent cassette lacks the homeodomain because a1''s 3'' end runs out of
      the Y box into a non-homologous X box). Curator''s ruling, 2026-09-21: defer
      it. Citation: Souciet et al. 2009 Genome Res 19:1696-1709 (PMID 19525356).'
