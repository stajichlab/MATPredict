    reference_orientation: MATA2->MATA1
    definition_note: 'The MATa (Ya) allele of Saccharomyces cerevisiae, taken from the SILENT HMR donor
      cassette of the S288C reference genome (NC_001135.5:293179-294321), because S288C is MATalpha and
      therefore carries no a-allele at the MAT position itself -- SGD''s own MATA locus entry (S000124955)
      states ''note that the systematic sequence in SGD contains MATalpha sequences''. The sibling record
      4932_s288c_MATsc_MATalpha deferred a MATa record on exactly this ground, for want of ''an independently-reconfirmed
      modern coordinate source''; HMR supplies one, with RefSeq protein accessions and exact coordinates
      on the current assembly. This is biologically sound rather than a workaround: HML/MAT/HMR are the
      cassette system, and the HMR sequence is what gene conversion copies INTO the MAT position when
      a cell switches to a, so the HMR-encoded a1/a2 proteins are the MATa proteins (Astell et al. 1981;
      Haber 2012). Curated under the canonical roster names MATA1/MATA2; the deposit''s own gene names
      are HMRA1 (YCR097W, NP_010021.1) and HMRA2 (YCR096C, NP_010020.1). Same convention as pra1/Uhpra1
      in db/Basidiomycota/order.yml. CONSEQUENCE FOR DETECTION, and the reason this record exists: without
      an a-allele reference, every cassette in every Saccharomyces genome matched only alpha references,
      so a run on S288C reported all three cassettes -- HML, MAT and HMR -- as ''MATalpha'', including
      HMR, which is actually a. Curator''s ruling 2026-09-21: in Saccharomyces do not attempt to pick
      the active locus by flanking genes; report every cassette and its allele.'
