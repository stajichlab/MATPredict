    notes: 'Both cha1 (gene_index 0) and sla2 (gene_index 3) fail independent
      re-translation. AB781017.1''s own feature table (re-fetched via NCBI efetch
      on 2026-09-18) shows: cha1 CDS is <1..71, /codon_start=3; sla2 CDS is
      complement(2794..>3161), /codon_start=3. Both are single-exon, but each is
      a partial CDS whose real reading frame starts 2 nucleotides into the
      recorded range (codon_start=3). This schema stores only start/end/strand
      per gene with no codon_start/frame-phase field, so translating the raw span
      from position 1 of the recorded range is off by 2 nt for the entire gene --
      for sla2 this shifts the frame enough to hit a premature stop essentially
      immediately (0% coverage). The recorded coordinates (1..71 and 2794..3161)
      already match each CDS''s real, GenBank-annotated bounds exactly; this is a
      known schema limitation, not a coordinate error. alpha1 and alpha2 have
      codon_start=1 and are unaffected.'
