    reference_orientation: cha1->alpha2->alpha1->sla2
    definition_note: 'Z. rouxii carries the classical 3-locus (MAT/HML/HMR) Saccharomycetaceae
      cassette architecture, gene-content-compatible with the existing "MATsc" locus_name
      (same alpha1/alpha2 core-identity genes, sla2 flanking gene) -- reused rather
      than creating a redundant new locus_name. Watanabe et al. 2013 (PLoS ONE) is
      a real, targeted experimental study (genetic reconstruction of translocation
      events, not mere genome annotation), supporting tier 1 for the underlying scientific
      claims. HOWEVER, a genuine, unresolved ambiguity: this specific accession (DDBJ
      AB781017.1) is from strain "DA2", which the source paper describes as the EXPERIMENTAL
      RECONSTRUCTION BACKGROUND strain used to reproduce translocation events under
      laboratory conditions -- NOT necessarily a natural, undisturbed wild-type genotype
      (the paper identifies NBRC1130 as the strain retaining the true ancestral, un-rearranged
      karyotype, but no independently fetchable NBRC1130-specific MAT-locus GenBank/DDBJ
      accession was located in this curation pass). Consequently it is NOT CONFIRMED
      whether the gene arrangement in this record (cha1-alpha2-alpha1-sla2) represents
      Z. rouxii''s natural MAT locus, a natural HML/HMR silent cassette, or a laboratory-reconstructed
      translocation product. excluded_from_coordinate_benchmark is set to true and
      differs_from_sequenced is set to true specifically because of this DA2-reconstruction-background
      uncertainty -- a human reviewer should decide whether to accept this as-is,
      seek the NBRC1130 sequence specifically, or reject pending clarification. idiomorph_assignment
      ("MATalpha") reflects the alpha1/alpha2 gene content present in this specific
      accession, not a confirmed, independently-verified genotype call for the DA2
      strain as a whole.

      '
