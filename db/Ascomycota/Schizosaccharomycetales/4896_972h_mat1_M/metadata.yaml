    reference_orientation: mat1-Mi->mat1-Mc
    definition_note: 'S. pombe determines mating type by which allele (P or M) occupies
      the single EXPRESSED mat1 locus; this is switched during mitotic growth by gene
      conversion from one of two nearby SILENT donor cassettes (mat2-P, mat3-M), each
      ~15kb away on the same chromosome (Kelly et al. 1988). This record captures
      ONLY the active mat1 locus and its two genes for the standard laboratory reference
      strain 972h- (RefSeq assembly, chromosome NC_003423.3), which has mat2-P physically
      deleted -- a fixed, non-switching derivative used as the community reference
      genome, carrying the mat1-M allele. mat2-P/mat3-M (the silent donor cassettes)
      are NOT represented in this record; they are a distinct genomic concept (unexpressed
      template sequences, not an active MAT locus) and are deferred to a follow-up
      record/schema decision per user direction (2026-09-16: "we should at least capture
      mat1" as the immediate priority). system is set to "pseudohomothallic" rather
      than "heterothallic" because this genome, while fixed at mat1-M, represents
      a species whose wild-type (h90) strains switch mating type via this donor-cassette
      mechanism -- not a permanently fixed heterothallic species, and not simultaneous/primary
      homothallism (both genes always present) like the Pneumocystis/Taphrina "PM"
      locus records. Coordinates independently confirmed against RefSeq''s own GenBank
      annotation via NCBI efetch.

      '
