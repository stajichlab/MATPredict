    reference_orientation: H3->H2->matPc->matPi
    definition_note: 'This is the SILENT P-type donor cassette (mat2-P), NOT the expressed
      mat1 locus -- captured per user direction (2026-09-16) specifically because
      the Pc/Pi protein sequences here are needed for future HMM-building work on
      P-type mating proteins, even though this genomic copy is transcriptionally silenced
      and never directly expressed. Located ~15kb from mat1 in the switching- competent
      h90 (wild-type) strain (contig FP565355), whereas the community reference genome
      (972h-, used in 4896_972h_mat1_M) has this entire region deleted for lab stability.
      Original characterization: Kelly et al. 1988 (same paper as mat1). H1/H2/H3
      are shared/cassette-boundary homology-box sequences (not genes) bounding this
      cassette, flagged here for completeness but not included in genes[] since they
      encode no protein. excluded_from_coordinate_benchmark is set to true because
      this locus is never an active MAT locus by definition -- it should never be
      scored in any downstream MAT-locus boundary-detection benchmark, only used as
      a reference protein sequence source.

      '
