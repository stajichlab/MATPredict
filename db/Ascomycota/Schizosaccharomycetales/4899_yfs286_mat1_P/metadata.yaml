    reference_orientation: mat1-Pc->mat1-Pi
    definition_note: 'Provides a genuinely active (not silent/donor) bipolar P-allele
      record, paired conceptually with the S. pombe mat1-M record (4896_972h_mat1_M):
      S. octosporus shares the same mat1/mat2/mat3 three-component switching architecture
      as S. pombe (Rhind et al. 2011, comparative fission-yeast genomics), but this
      particular reference strain''s genome sequence has the P allele active at mat1.
      Gene identity and coordinates independently confirmed directly against this
      contig''s own RefSeq annotation (NW_013185619.1) via NCBI efetch. system is
      "pseudohomothallic" for the same reasoning as the S. pombe mat1 records: this
      is a switching-capable species snapshot, not simultaneous/primary homothallism.

      '
