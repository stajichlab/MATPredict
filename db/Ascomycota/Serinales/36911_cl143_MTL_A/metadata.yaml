    definition_note: 'Clavispora (Candida) lusitaniae CL143 MTLa idiomorph (Reedy
      et al. 2009). Curated: MTLa2 (ACS29266.1) and MTLa1 (ACS29267.1), each 2 exons.
      The idiomorph-specific PAP/OBP/PIK alleles on the deposit are not MTL roster
      genes and are not curated. Clavispora lacks MTLalpha2 altogether; its alpha
      idiomorph has alpha1 only. Metschnikowiaceae reference: the pilot called 0/30
      Metschnikowiaceae genomes without one.'
