evidence:
  locus_existence:
    tier: 1
    experimental_method: Cloning and sequencing of the MTLa idiomorph, deposited as
      FJ524850.1. "Candida species are microbial pathogens originally thought to be
      asexual, but several are now recognized as sexual or parasexual. Candida albicans,
      the most common fungus infecting humans, is an obligate diploid with a parasexual
      cycle involving mating, recombination, and genome reduction but no recognized
      meiosis. Others (C. lusitaniae, C. guilliermondii) are haploid, and their mating
      produces spores, suggestive of complete meiotic sexual cycles. However, comparative
      genomic analysis reveals that these species lack key meiotic components, including
      the recombinase Dmc1 and cofactors (Mei5/Sae3), synaptonemal-complex proteins
      (Zip1-Zip4/Hop1), and the crossover interference pathway (Msh4/5). Here we elucidate
      the structure and functions of the mating-type (MAT) locus and establish that
      C. lusitaniae undergoes meiosis during its sexual cycle. The MAT-encoded a2
      (high-mobility group) and a..." (Reedy et al. 2009, Curr Biol 19:891, abstract)
    citations: &id001
    - pmid: '19446455'
      doi: 10.1016/j.cub.2009.04.058
  boundaries:
    tier: 1
    experimental_method: The record segment spans the curated MTL genes on the deposit
      FJ524850.1; the idiomorph's own boundaries (it also carries the idiomorph-specific
      PAP/OBP/PIK alleles) are the paper's.
    citations: *id001
  idiomorph_assignment:
    tier: 1
    experimental_method: Idiomorph by gene content of the deposited idiomorph (FJ524850.1),
      as reported in Reedy et al. 2009, Curr Biol 19:891.
    citations: *id001
