evidence:
  locus_existence:
    tier: 1
    experimental_method: Cloning and sequencing of the MTLalpha idiomorph, deposited
      as AY622606.1. "Because Candida dubliniensis is closely related to Candida albicans,
      we tested whether it underwent white-opaque switching and mating and whether
      white-opaque switching depended on MTL homozygosity and mating depended on switching,
      as they do in C. albicans. We also tested whether C. dubliniensis could mate
      with C. albicans. Sequencing revealed that the MTLalpha locus of C. dubliniensis
      was highly similar to that of C. albicans. Hybridization with the MTLa1, MTLa2,
      MTLalpha1, and MTLalpha2 open reading frames of C. albicans further revealed
      that, as in C. albicans, natural strains of C. dubliniensis exist as a/alpha,
      a/a, and alpha/alpha, but the proportion of MTL homozygotes is 33%, 10 times
      the frequency of natural C. albicans strains. C. dubliniensis underwent white-opaque
      switching, and, as in C. albicans, the switching was dependent on MTL homozygosis.
      C. dubliniensis a/a and alpha/..." (Pujol et al. 2004, Eukaryot Cell 3:1015,
      abstract)
    citations: &id001
    - pmid: '15302834'
      doi: 10.1128/EC.3.4.1015-1027.2004
  boundaries:
    tier: 1
    experimental_method: The record segment spans the curated MTL genes on the deposit
      AY622606.1; the idiomorph's own boundaries (it also carries the idiomorph-specific
      PAP/OBP/PIK alleles) are the paper's.
    citations: *id001
  idiomorph_assignment:
