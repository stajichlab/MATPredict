    definition_note: 'Candida dubliniensis d1558 MTLalpha idiomorph, ''highly similar
      to that of C. albicans'' (Pujol et al. 2004). Curated: MTLalpha1 (AAU13777.1).
      MTLalpha2 is on this deposit but is NOT curated: it has no slot in the MTL roster
      (it is absent from Clavispora and C. auris; adding it as an optional gene is
      a curator ruling). The alpha2 CDS is AAU13776.1. The PAPalpha CDS is 3''-partial
      on this deposit. The idiomorph-specific PAP/OBP/PIK alleles on the deposit are
      not MTL roster genes and are not curated. '
