    definition_note: 'Candidozyma auris B11205 (clade I) MTLa1, complete-genome assembly
      GCA_016772135.1, where it is annotated only as ''hypothetical protein CJI82_03095''
      (WZC25182.1, 166 aa, 3 exons). Adjacent to PIK1 (WZC25183.1) - OBP1 (WZC25184.1)
      - PAP1 (WZC25185.1). The full-length a1, curated alongside the truncated B11243
      model. completeness is partial because MTLa2 is not annotated in this assembly
      (the ~780 bp between a1 and PIK1 is where it would sit; not modelled here).


      record_version bump, 2026-09-25 (curator ruling): PIK1 (WZC25183.1), OBP1 (WZC25184.1),
      PAP1 (WZC25185.1) added from the same CP060341.1 -- the PAP1-OBP1-PIK1 block
      (optional `flanking_variable` roster genes). Added so a one-core-gene alpha
      idiomorph can reach the two-modelled-gene bar; see the MTL roster comment in
      order.yml.'
