    definition_note: 'Candidozyma auris B11221 (clade III) MTLalpha, GenBank assembly
      GCA_002775015.1, annotated ''mating type MTLalpha1'' (TQB77621.1, 172 aa; RefSeq
      copy XP_047603489.1). Order PAP1 - MTLalpha1 - PIK1 - OBP1. MTLalpha2 is biologically
      absent in this clade (Munoz et al. 2018: ''as in C. lusitaniae, the MTL alpha
      locus is missing the alpha2 gene'').


      record_version bump, 2026-09-25 (curator ruling): PAP1 (PIS55911.1), PIK1 (PIS55912.1),
      OBP1 (PIS55913.1) added from the same PGLS01000002.1 -- the PAP1-OBP1-PIK1 block
      (optional `flanking_variable` roster genes). Added so a one-core-gene alpha
      idiomorph can reach the two-modelled-gene bar; see the MTL roster comment in
      order.yml.'
