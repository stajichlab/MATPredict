    definition_note: 'Candidozyma auris B11243 (clade IV) MTLa, GenBank assembly GCA_003014415.1,
      annotated by the depositors as ''mating_type_MTLa2'' (PSK75931.1, 152 aa) and
      ''mating_type_MTLa1'' (PSK75932.1, 99 aa). Gene order PAP1 (PSK75928.1) - OBP1
      (PSK75929.1) - PIK1 (PSK75930.1) - MTLa2 - MTLa1, the C. lusitaniae arrangement.
      completeness is PARTIAL: the MTLa1 model is a single 99-aa exon with its homeodomain
      at residues 46-92, against 166 aa and residues 99-154 in the three-exon models
      of clade I strains (e.g. B11205 WZC25182.1) -- its 5'' exons are missing from
      this annotation. It still carries the homeodomain, which is what the search
      needs.'
