      ''mating_type_MTLa1'' (PSK75932.1, 99 aa). Gene order PAP1 (PSK75928.1) - OBP1
      (PSK75929.1) - PIK1 (PSK75930.1) - MTLa2 - MTLa1, the C. lusitaniae arrangement.
      MTLa1 is recorded as the full-length three-exon model (15538-15669, 15718-16020,
      16094-16159; 166 aa, the structure of the clade I models, e.g. B11205 WZC25182.1),
      curator ruling 2026-10-22: the depositors'' MTLa1 (PSK75932.1) is a single 99-aa
      exon that starts at a CTG inside exon 2 and reads into intron 2, so it lacks the
      5'' exons; see curation.notes. completeness is complete (curator ruling 2026-10-22):
      MTLa2 and the full-length MTLa1 are both modelled, with the PAP1-OBP1-PIK1 flanks.


