evidence:
  locus_existence:
    tier: 2
    experimental_method: 'TIER 2 (genome-derived, admitted under the curator''s 2026-09-24
      ruling). The protein is the depositors'' own gene model in the Munoz et al.
      2018 C. auris genome annotation, not a locus-specific study. Validated 2026-09-25
      (results/2026-09-25_cauris_mtl/): MTLa1 carries a homeodomain (Pfam PF00046,
      i-E=1.3e-14); MTLa2 has no Pfam HMG_box hit, as neither do the curated C. albicans
      and C. lusitaniae a2 proteins; reciprocal best hit to the curated C. lusitaniae
      MTLa2 (E=3e-13; next hit 2.1) and C. albicans MTLa1 (E=3e-8); and gene order:
      it sits in the PAP1-OBP1-PIK1 block, each flank a blastp-verified ortholog of
      the C. lusitaniae FJ524850.1 gene. Munoz et al. 2018: ''the genes flanking the
      MTL locus ... PIK1, OBP1 and PAP1 were adjacent in all sequenced genomes of
      the emerging MDR clade''.'
    citations: &id001
    - pmid: '30559369'
      doi: 10.1038/s41467-018-07779-6
