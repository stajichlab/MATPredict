evidence:
  locus_existence:
    tier: 1
    experimental_method: Cloning and sequencing of the MTLa idiomorph, deposited as
      AF167162.1. "Candida albicans, the most prevalent fungal pathogen in humans,
      is thought to lack a sexual cycle. A set of C. albicans genes has been identified
      that corresponds to the master sexual cycle regulators a1, alpha1, and alpha2
      of the Saccharomyces cerevisiae mating-type (MAT) locus. The C. albicans genes
      are arranged in a way that suggests that these genes are part of a mating type-like
      locus that is similar to the mating-type loci of other fungi. In addition to
      the transcriptional regulators a1, alpha1, and alpha2, the C. albicans mating
      type-like locus contains several genes not seen in other fungal MAT loci, including
      those encoding proteins similar to poly(A) polymerases, oxysterol binding proteins,
      and phosphatidylinositol kinases...." (Hull & Johnson 1999, Science 285:1271,
      abstract)
    citations: &id001
    - pmid: '10455055'
      doi: 10.1126/science.285.5431.1271
  boundaries:
    tier: 1
    experimental_method: The record segment spans the curated MTL genes on the deposit
      AF167162.1; the idiomorph's own boundaries (it also carries the idiomorph-specific
      PAP/OBP/PIK alleles) are the paper's.
    citations: *id001
  idiomorph_assignment:
    tier: 1
    experimental_method: Idiomorph by gene content of the deposited idiomorph (AF167162.1),
      as reported in Hull & Johnson 1999, Science 285:1271.
    citations: *id001
