    definition_note: 'Candida albicans SC5314 MTLa idiomorph, the first fungal mating-type-like
      locus described in an ''asexual'' yeast (Hull & Johnson 1999). Curated: MTLa2
      (AAT08437.1, 2 exons) and MTLa1 (AAD51404.1, 3 exons). The idiomorph-specific
      PAP/OBP/PIK alleles on the deposit are not MTL roster genes and are not curated.
      SC5314 is an a/alpha diploid; this is its a haplotype.'
