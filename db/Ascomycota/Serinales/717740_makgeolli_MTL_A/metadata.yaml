evidence:
  locus_existence:
    tier: 3
    experimental_method: 'TIER 3 (genome-derived, no paper). Gene models are unpublished genome-annotation
      predictions (BFD funannotate, assembly GCA_003856795.1). MTLA1 was found by diamond blastp of curated
      Serinales MTLA1 proteins and the NCBI Lodderomyces MTLA1 deposits (CCG24159.1, ADY62670.1) against
      the proteome and verified by gene order: neighbours within 4 genes hit the curated C. lusitaniae
      / C. auris proteins (PAP1 71%; OBP1 70%; PIK1 63%; MTLA2 47%); results/2026-10-24_ctg_mtla1_verify/.
      Identity of the MTLA1 candidate to the best curated MTLA1 is 33-39%, so the assignment rests on
      position, not sequence alone.'
