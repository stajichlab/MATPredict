evidence:
  locus_existence:
    tier: 1
    experimental_method: 'Cloning of the A and a mating-type regions and demonstration
      by transformation that the cloned DNA confers both sexual (mating) and vegetative
      heterokaryon-incompatibility function (Glass et al. 1988); complete DNA sequencing
      of the A region and localization of function to a single ORF, with frameshift
      mutations in that ORF recovered from sterile, heterokaryon-compatible mutants
      (Glass et al. 1990); transcriptional characterization and mutant analysis identifying
      matA-2 and matA-3 as additional genes in the same idiomorph (Ferreira et al.
      1996, 1998).

      '
    citations:
    - pmid: '2840740'
      doi: 10.1126/science.2840740
    - pmid: '2142303'
      doi: 10.1073/pnas.87.13.4912
    - pmid: '8628238'
      doi: 10.1007/BF02172989
    - pmid: '9539425'
      doi: 10.1093/genetics/148.3.1069
  boundaries:
    tier: 1
    experimental_method: 'Complete sequencing of the A mating-type region; the idiomorph
      is reported explicitly as 5301 bp of non-homologous DNA bounded by flanks that
      are essentially identical between A and a strains (Glass et al. 1990; Glass
      et al. 1988). The curator independently mapped that flank junction onto M33876.1
      by blastn of M33876.1 vs M54787.1 (single HSP, M33876.1 5307..5736), giving
      an idiomorph-unique span of 1..5306 -- within ~5 bp of the published length.

      '
    citations:
    - pmid: '2142303'
      doi: 10.1073/pnas.87.13.4912
    - pmid: '2840740'
      doi: 10.1126/science.2840740
  idiomorph_assignment:
    tier: 1
    experimental_method: 'Genetic and molecular demonstration that A and a are non-homologous
      alternative sequences (idiomorphs) at one locus, with one copy per haploid genome
      and no switching (Glass et al. 1988); matA-1 encodes a 288-aa protein with alpha-box
      (MAT alpha 1-like) similarity and matA-3 an HMG domain, and mutations in matA-1
      abolish mat A identity (Glass et al. 1990; Ferreira et al. 1996, 1998).

      '
    citations:
    - pmid: '2840740'
      doi: 10.1126/science.2840740
    - pmid: '2142303'
      doi: 10.1073/pnas.87.13.4912
    - pmid: '9539425'
      doi: 10.1093/genetics/148.3.1069
