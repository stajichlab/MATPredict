evidence:
  locus_existence:
    tier: 1
    experimental_method: 'Cloning of the a mating-type region and demonstration by
      transformation that the cloned DNA confers sexual and vegetative heterokaryon-incompatibility
      function (Glass et al. 1988); complete DNA sequencing of the a region, identification
      of the spliced mt a-1 transcript, and mutant analysis assigning vegetative incompatibility,
      mating identity and perithecium induction to the mt a-1 polypeptide (Staben
      and Yanofsky 1990).

      '
    citations:
    - pmid: '2840740'
      doi: 10.1126/science.2840740
    - pmid: '2142304'
      doi: 10.1073/pnas.87.13.4917
  boundaries:
    tier: 2
    experimental_method: 'The published idiomorph LENGTH (3235 bp) is explicit in
      Staben and Yanofsky 1990, but its offsets within M54787.1 are not published.
      The left endpoint recorded here was derived by the curator from a blastn alignment
      of M33876.1 vs M54787.1 (common flank ends at M54787.1 1466); the right endpoint
      is arithmetic from the published length and could not be independently confirmed.
      Tier 2, not tier 1, for exactly this reason; excluded_from_coordinate_benchmark
      is set true.

      '
    citations:
    - pmid: '2142304'
      doi: 10.1073/pnas.87.13.4917
  idiomorph_assignment:
    tier: 1
    experimental_method: 'Genetic and molecular demonstration that A and a are non-homologous
      alternative sequences (idiomorphs) at a single locus, one copy per haploid genome,
      with no switching (Glass et al. 1988); the mt a-1 amino-terminal half is homologous
      to the S. pombe mat-Mc HMG-domain polypeptide and mt a-1 mutants lose mat a
      identity (Staben and Yanofsky 1990).

      '
    citations:
    - pmid: '2840740'
      doi: 10.1126/science.2840740
    - pmid: '2142304'
