    reference_orientation: single gene (mt a-1) on the plus strand of M54787.1
    definition_note: 'NOMENCLATURE. The gene name used here, ''mt a-1'', is the literal
      /gene qualifier on the primary GenBank deposit M54787.1, confirmed by the curator
      via NCBI efetch. It appears in the literature as ''mat a-1'' or ''mt a-1'' (Staben
      and Yanofsky 1990; Glass et al. 1988). Its standard-nomenclature equivalent
      in the Pezizomycotina MAT family vocabulary is MAT1-2-1 (HMG-domain protein).
      The MAT1 / MAT1-1 / MAT1-2 / MAT1-x-x convention itself is defined by Turgeon
      and Yoder 2000, ''Proposed nomenclature for mating type genes of filamentous
      ascomycetes'', Fungal Genet Biol 31:1-5, PMID 11118130, doi 10.1006/fgbi.2000.1227
      -- citation independently verified by the curator via PubMed efetch this session.
      Note that it appeared in the same issue as, and immediately before, Yun et al.
      2000 (PMID 11118131). As with the paired mat A record (5141_74-ors-a_MAT_MAT1-1),
      this record keeps N. crassa''s own documented symbol rather than forcing the
      MAT1-x-x form; the reviewer should decide at accept time whether to add the
      synonym to db/Ascomycota/order.yml or rename. NCBI Gene has no entry for this
      gene because the N. crassa reference genome strain OR74A is mat A, so the mat
      a idiomorph is absent from the reference build -- the classic locus deposit
      is the only source. The IDIOMORPH value is forced: N. crassa''s own documented
      idiomorph name is simply ''a'' (mat a), but order.yml''s ''MAT'' locus enum
      only permits MAT1-1/MAT1-2.


      SOURCE AND COORDINATES. Source is GenBank M54787.1 (6548 bp, /mating_type="a",
      db_xref taxon:5141), the deposit accompanying Staben and Yanofsky 1990. The
      deposit carries NO /strain qualifier, and the full text of the paper (PMC54232)
      does not state a strain designation either, so organism.strain.known is false.
      The mt a-1 gene span 3227..4485 (CDS join(3227..3396,3450..3718,3776..4485),
      protein_id AAA33598.2) was read directly off the M54787.1 feature table via
      NCBI efetch.


      SEGMENT BOUNDARY IS DERIVED AND ONLY PARTLY VERIFIABLE -- SEE excluded_from_coordinate_benchmark.
      Staben and Yanofsky 1990 report the a idiomorph as a 3235 bp segment non-homologous
      to mat A and bordered by near-identical flanking DNA, but do not publish its
      offsets within M54787.1. The curator located ONE boundary independently: blastn
      of M33876.1 (the mat A deposit) against M54787.1 returns a single HSP, M33876.1
      5307..5736 vs M54787.1 1466..1032 (95.4% identity, 436 bp, inverted orientation).
      The common flank therefore ends at M54787.1 position 1466, so the a-idiomorph-unique
      region begins at 1467 and runs rightward. The right-hand endpoint, 4701, is
      simply 1467 + 3235 - 1, i.e. it assumes the published 3235 bp length starts
      exactly at the flank junction. That right endpoint could NOT be independently
      confirmed, because M33876.1 contains no counterpart of that second flank (the
      mat A deposit begins at the idiomorph edge with no left flank). excluded_from_coordinate_benchmark
      is therefore true and the boundaries evidence is tier 2, even though the mt
      a-1 gene coordinates themselves are solid. The recorded mt a-1 span (3227..4485)
      lies well inside the derived window, which is consistent but is not proof of
      the endpoint.


      FLANKING GENES. APN2/SLA2/COX13 are not annotated on M54787.1 and are not represented
      here.

      '
