    definition_note: "Ciss\xE9 et al. 2013 first described putative MAT cassette candidates\
      \ in T. deformans; Almeida et al. 2015 (PMID 25587012, mBio 6(1):e02250-14,\
      \ \"Comparative genomics suggests primary homothallism of Pneumocystis species\"\
      ) reports that T. deformans carries a fused M+P locus with matMc (HMG, M-class)\
      \ and matPi (homeobox, P-class) genes on two contigs of the T. deformans genome\
      \ assembly (ENA/GenBank accession CAHR00000000, strain PYCC 5710, submitted\
      \ 2012-2013 by the Faculdade de Ci\xEAncias e Tecnologia, Universidade Nova\
      \ de Lisboa group -- the group that also produced Ci\xEAss\xE9 et al. 2013),\
      \ but does NOT report specific scaffold/contig identifiers or exact coordinates\
      \ for these genes in its main text (verified by reading the full text at PMC4313921).\
      \ PREVIOUS VERSION OF THIS RECORD BUG: this record previously cited coordinates\
      \ on assembly GCA_005281805.1 (INSDC prefix RHGF, submitted 13-MAY-2019 by\
      \ Wang & Liu, Northwest A&F University, an unrelated, unpublished, later genome\
      \ project) as if Almeida et al. 2015 had reported them -- a chronological impossibility,\
      \ since that assembly did not exist for 4 years after the paper was published.\
      \ That was a provenance error, not a verified fact. The GCA_005281805.1/RHGF01000006.1\
      \ accession IS a real, independently-generated T. deformans genome (confirmed\
      \ via NCBI efetch: strain A2, BioProject PRJNA299790, BioSample SAMN04217078)\
      \ -- organism.strain is set from this accession's real /strain=\"A2\" qualifier\
      \ -- but the specific gene coordinates on it (51694-52236, 92621-93112) have\
      \ NO verified source: they cannot be attributed to Almeida et al. 2015 (wrong\
      \ assembly/chronology), and this curator found no gene/CDS annotation at these\
      \ positions in RHGF01000006.1's own GenBank feature table when re-checked, so\
      \ they cannot be independently confirmed against the assembly's own annotation\
      \ either. coordinate_provenance is therefore set to \"not_available\" and validation.status\
      \ to \"needs_review\" pending a real re-derivation of these coordinates (e.g.\
      \ a tblastn/exonerate search of the matMc/matPi reference proteins against RHGF01000006.1,\
      \ or tracking down the actual CAHR00000000 contig positions) in a follow-up\
      \ curation pass -- no coordinates have been fabricated to fill this gap. locus_existence/idiomorph_assignment\
      \ remain tier 1 since the underlying published claim (T. deformans has a fused\
      \ M+P locus with these two gene identities) is itself solid; only the specific\
      \ numeric coordinates are unverified. excluded_from_coordinate_benchmark remains\
      \ true for the same reason: these coordinates must not be scored in any downstream\
      \ boundary-accuracy benchmark until independently re-derived.\n

2026-09-18 follow-up (this curation pass): the recommended tblastn/exonerate re-derivation was actually attempted, using the 4 real Pneumocystis PM-family reference proteins from this same source paper (Almeida et al. 2015): matPi ncbi_protein:XP_018229374.1 (231 aa, from curated record 42068_ru7_PM_combined) and ncbi_protein:XP_018224792.1 (230 aa, from 4754_b80_PM_combined); matMc ncbi_protein:XP_018229377.1 (251 aa, from 42068_ru7_PM_combined) and ncbi_protein:XP_018224795.1 (232 aa, from 4754_b80_PM_combined). The full RHGF01000006.1 scaffold (real NCBI-reported length 550495 bp, confirmed via esummary.fcgi) was fetched and searched with tblastn -query pm_refs.faa -db rhgf6_db -seg no -outfmt '6 qseqid sseqid pident length sstart send evalue bitscore' (BLAST+, this project's own search.py parameters, no other pre-filter). matMc: both references hit the SAME region with a clear best-scoring peak far above background (matMc_ru7 vs 92621-93112, 45.5% identity, e=3.16e-40, bitscore 142; matMc_b80 vs 92630-93121, 44.5% identity, e=2.94e-42, bitscore 147; next-best hits elsewhere on the scaffold were e>=0.09). This hit was independently re-verified by translation (reusing this project's own _independent_translation logic, not just trusting the alignment): the plus-strand span 92606-93298 translates cleanly to a 231 aa protein starting with Met, with no internal stop codon and a natural in-frame stop immediately following (comparable in length to the 232 aa and 251 aa references; global pairwise identity ~33-34% against both, consistent with cross-genus MAT-gene divergence). matMc alone would therefore be a credible, translation-verified re-derivation. matPi: both references also hit the same region (matPi_ru7 vs 51688-52236, 31.0% identity, e=2.36e-21, bitscore 87; matPi_b80 vs 51949-52236, 42.6% identity, e=8.19e-20, bitscore 82.4), a real, statistically clear best hit -- but exonerate protein2genome spliced alignment (run against +/-1kb and +/-2.5kb windows, both references, down to --percent 15) confirmed this hit covers ONLY the C-terminal homeodomain (query residues ~151-220 of the 230-231 aa references) and no additional exon matching the N-terminal ~150 residues could be found anywhere in a 5kb window. Translating the literal tblastn subject span (51688-52236) does not start at Met (first residue is Ser); the nearest in-frame Met downstream (51754) yields only a 166 aa ORF to the next in-frame stop -- well short of the ~230 aa references, and not near either scaffold edge, so it cannot be attributed to assembly truncation either. Per this project's discipline (do not treat a credible-looking alignment as sufficient without independently verifying the translated product), matPi's true gene boundaries could NOT be independently re-derived with confidence from this search -- only a real, homology-confirmed homeodomain-encoding region (~52041-52230) was localized, not a full, Met-initiated CDS. Because matMc and matPi are resolved as a pair for this record rather than forcing through a partial result, NEITHER gene's coordinates, coordinate_provenance, excluded_from_coordinate_benchmark, evidence.boundaries, or validation.status were changed in this pass -- these remain not_available/needs_review exactly as before. This is reported to the human reviewer as a real, honest outcome: matMc's coordinates ARE independently re-derivable and translation-verified whenever a reviewer chooses to apply them; matPi's are not, absent further evidence (e.g. RNA-seq, a different homolog set, or manual synteny/gene-model work).
"
