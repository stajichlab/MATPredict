    definition_note: "Ciss\xE9 et al. 2013 first described putative MAT cassette candidates\
      \ in T. deformans; Almeida et al. 2015 resolved the locus to exactly two genes\
      \ -- matMc (HMG, M-class) and matPi (homeobox, P-class) -- interpreted as a\
      \ fusion of an M locus with an incomplete P locus (matPc lost), ~40kb apart\
      \ on one contig of assembly GCA_005281805.1. UNLIKE the paired Pneumocystis\
      \ records (42068_ru7_PM_combined, 4754_b80_PM_combined), these coordinates could\
      \ NOT be independently confirmed against this assembly's own GenBank annotation:\
      \ NCBI efetch on RHGF01000006.1 in the literature-reported coordinate windows\
      \ returns a \"source\" feature only, no gene/CDS annotation at all -- these\
      \ genes were identified in the source paper by tblastn homology search, not\
      \ by this assembly's own gene-calling pipeline, and this curator has no independent\
      \ way to verify the exact coordinates beyond trusting the paper's reported tblastn\
      \ hit positions as transcribed into the literature-synthesis table this record\
      \ was drafted from. Both genes are recorded with protein_accession: null for\
      \ this reason. boundaries evidence is tier 2 (not tier 1) specifically because\
      \ of this unconfirmable-coordinate gap -- contrast with locus_existence/idiomorph_assignment,\
      \ which remain tier 1 since the underlying published, reanalyzed scientific\
      \ claim (this species has a fused M+P locus with these two genes) is itself\
      \ solid. excluded_from_coordinate_benchmark is set to true for the same reason:\
      \ these coordinates should not be scored in any downstream boundary-accuracy\
      \ benchmark until independently confirmed.\n"
