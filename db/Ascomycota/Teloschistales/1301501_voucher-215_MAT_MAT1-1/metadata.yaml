    reference_orientation: SLA2->MAT1-1-1(-)->APN2(-)
    definition_note: 'MAT1-1 idiomorph of the heterothallic lichen-forming fungus
      Polycauliona polycarpa (published under the name Xanthoria polycarpa; NCBI taxid
      1301501 lists "Xanthoria polycarpa" as a synonym). Sequence is EMBL/GenBank
      AJ884599.1, deposited by Scherrer, Zippler and Honegger for their 2005 study,
      which cloned the X. parietina MAT locus from a genomic lambda phage library
      and then used the two flanking genes (SLA2 and a DNA lyase = APN2 homologue)
      as PCR anchors to amplify both idiomorphs of X. polycarpa. Segment span here
      is the whole deposited fragment (1..5809) and is therefore curator_derived,
      not a published locus boundary; the deposit itself does explicitly annotate
      the idiomorph-specific interval as misc_feature 1785..5054 ("MAT1-1 idiomorph"),
      which is the published boundary statement. All gene coordinates, strands and
      protein accessions below were re-read by the curator directly from the GenBank
      flatfile via NCBI efetch on 2026-09-17, not copied from any paper.

      The GenBank gene name for the APN2 anchor is "DNA lyase"; it is recorded here
      as APN2 (the order.yml flanking_conserved gene name) because APN2 is the DNA
      lyase that anchors the Pezizomycotina MAT locus, and because Pizarro et al.
      2019 explicitly treat this same Scherrer et al. protein (CAI59775.1, the X.
      parietina orthologue) as their APN2 query. SLA2 and APN2 are both partial CDS
      features at the fragment ends (<1..523 and 5566..>5809); completeness is "complete"
      in the sense used by Pizarro et al. 2019 -- both anchoring genes are present
      and flank the idiomorph -- not in the sense that each anchor CDS is full length.

      '
