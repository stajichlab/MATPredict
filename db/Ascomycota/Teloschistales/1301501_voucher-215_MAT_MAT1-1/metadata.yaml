evidence:
  locus_existence:
    tier: 1
    experimental_method: genomic lambda phage library screening and cloning of the
      MAT locus in the congener X. parietina, followed by PCR amplification, cloning
      and sequencing of both X. polycarpa idiomorphs using the SLA2 and DNA lyase
      (APN2) flanking genes as anchors (Scherrer et al. 2005)
    citations:
    - pmid: '16266815'
      doi: 10.1016/j.fgb.2005.09.002
  boundaries:
    tier: 1
    experimental_method: complete sequencing of the cloned locus fragment; the deposit
      annotates the MAT1-1 idiomorph interval explicitly (misc_feature 1785..5054).
      The segment recorded here is the full deposited fragment and was re-read from
      GenBank AJ884599.1 by the curator.
    citations:
    - pmid: '16266815'
      doi: 10.1016/j.fgb.2005.09.002
  idiomorph_assignment:
    tier: 1
    experimental_method: 'alpha-domain (MAT_Alpha1, pfam04769) identity of MAT1-1-1
      plus an experimental single-ascus segregation assay: eight single-spore isolates
      derived from one ascus of X. polycarpa each carried either an alpha-box or an
      HMG fragment, never both, demonstrating heterothallism and mutually exclusive
      idiomorphs'
    citations:
    - pmid: '16266815'
      doi: 10.1016/j.fgb.2005.09.002
