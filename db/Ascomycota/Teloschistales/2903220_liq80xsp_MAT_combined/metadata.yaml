      TASK 2B UPDATE (2026-09-18): the flat-span coordinates for APN2, MAT1-1-1 and
      SLA2 were genuinely multi-exon and naive single-span translation of all three
      was severely truncated/wrong. MAT1-1-1''s real exon/intron structure was independently
      re-derived via polish_with_exonerate and re-verified by independent translation
      (_independent_translation): the spliced product is 352 aa, starts with Met,
      and has no internal stop -- this gene is now genuinely resolved and its `genes[].exons`
      reflect real, exonerate-derived, verified coordinates. APN2 and SLA2 were also
      run through the same exonerate pipeline but FAILED independent-translation verification
      (APN2: internal stop codon; SLA2: translated product does not start with Met,
      missing ~15-24 N-terminal residues) -- per this project''s no-fabrication discipline
      their coordinates are unchanged (still the original flat span) and `proteins.faa`
      will still carry a naive, known-wrong translation for these two genes until
      better evidence resolves their true boundaries.'
