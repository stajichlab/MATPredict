phylum: Ascomycota
loci:
  - locus_name: "MAT"
    vocabulary_type: "enum"
    idiomorph_values: ["MAT1-1", "MAT1-2"]
    # CURATOR RULING, J. Stajich, 2026-10-01 (B9): report-only cross-lineage class
    # (MAT1-1 = alpha-box idiomorph, MAT1-2 = HMG idiomorph); labels unchanged.
    idiomorph_class: {MAT1-1: MAT1-1, MAT1-2: MAT1-2}
    taxonomic_scope: [716546]  # leotiomyceta -- live-confirmed via NCBI esummary
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 147538  # Pezizomycotina
    # Flank-carried window (curator's ruling 2026-09-26; results/
    # 2026-09-26_flank_rule_ascomycota/NOTE.md): the flanks sit OUTSIDE the
    # idiomorph, and real loci were found up to 9.9 kb from the flank span.
    flank_carried_window_bp: 20000
    # 2026-09-18; recommended by `matpredict detect audit-scope` as the deepest
    # common ancestor of the 17/26 curated records this family's own prior
    # scope ([222544, 5180, 28548, 40559]) did not cover. Confirmed via NCBI
    # Taxonomy esummary: taxid 716546 = "leotiomyceta", rank clade, ascomycete
    # fungi -- the well-known Pezizomycotina subclade that covers every order
    # this family's own curated records span (Helotiales, Onygenales,
    # Eurotiales, Hypocreales, Sordariales, Teloschistales, Lecanorales) while
    # EXCLUDING Pezizomycetes/Pezizales, so unlike a broader Pezizomycotina-
    # level scope this does not overlap Ascomycota:MATtub's own dedicated
    # Pezizomycetes/Tuber scope below -- no multi-family fallback introduced.
    # See docs/superpowers/plans/2026-09-18-genome-scale-detection-rollout-findings.md
    # for the audit that found the prior value stale.
    genes:
      # gene_class alpha_box/HMG_box mark the two conserved MAT-identity domain classes
      # shared across Pezizomycotina (Debuchy & Turgeon 2006; Turgeon & Yoder 2000):
      # MAT1-1-1 is the alpha-box (alpha-domain) protein, MAT1-2-1 the HMG-box protein.
      # MAT1-1-5 and MAT1-2-10 are idiomorph-specific accessory genes with no single
      # conserved cross-family domain class documented in this DB's own records --
      # left unclassified rather than guessed.
      #
      # MAT1-1-2 -> matA-2 and MAT1-1-3 -> matA-3 were assigned by the project's
      # curator, J. Stajich, on 2026-09-19, with citations the curator supplied and
      # this project verified against PubMed:
      #   * Klix et al. 2010, Eukaryot Cell 9(6):894-905, doi:10.1128/EC.00019-10
      #     (PMID 20435701). Sordaria macrospora SmtA-1/-2/-3 = MAT1-1-1/-2/-3. Its
      #     abstract calls SmtA-2 "the PPF domain protein-encoding gene", which is the
      #     documented functional identity behind the matA-2 class. It also calls
      #     SmtA-1 and SmtA-3 "the alpha domain protein-encoding genes"; the curator
      #     did not adopt alpha_box for MAT1-1-3, judging the call not settled.
      #   * Doughan & Rollins 2016, Fungal Biol 120(9):1105-17,
      #     doi:10.1016/j.funbio.2016.06.007 (PMID 27567717), which names MAT1-1-5 and
      #     MAT1-2-4 as lineage-specific to S. sclerotiorum and close relatives.
      # The classes are named after the Aspergillus-style matA-N gene names rather than
      # a domain: the curator judged "PPF_domain" unclear, and SmtA-N too Sordaria-
      # specific ("Sm") to name a cross-family class. Hyphens are deliberate and match
      # the literal gene spelling.
      # matA-2/matA-3 (Eurotiomycetes) carry the SAME classes because this DB's own
      # records document the equivalence in their definition_notes -- "matA-2 =
      # MAT1-1-2, matA-3 = MAT1-1-3" -- exactly as matA-1 already shares alpha_box with
      # MAT1-1-1. Classifying one member of a documented equivalence and not the other
      # would split the group in every figure that colours by gene_class.
      # Names remain provisional under the NAMES PROVISIONAL note in order.schema.yaml.
      # THE REQUIRED CORE IS TWO GENES: the alpha box (MAT1-1-1) and the HMG
      # box (MAT1-2-1). Everything else below is `optional`.
      #
      # Measured 2026-09-22 on 30 Pezizomycotina genomes (Aspergillus,
      # Penicillium, Neurospora, Sclerotinia, Botrytis, Fusarium): ZERO of 212
      # calls reached `high`, every one capped at medium. Cause:
      # `assign_tier` requires EVERY expected core gene of the called
      # idiomorph, and the MAT1-1 roster listed five -- MAT1-1-1 through
      # MAT1-1-5 -- that NO curated record carries together. Aspergillus
      # MAT1-1 has one of them, Botrytis two, Fusarium three. `core_found`
      # was unsatisfiable for the largest clade in the database (13,136
      # genomes), so the high tier was unreachable by construction.
      #
      # Same ruling shape the curator applied to btbA (Mucoromycota), to
      # STE20/RPO41/SXI1/SXI2 (Cryptococcus) and to the Saccharomyces
      # cassettes: keep the accessory genes searched and reported, out of
      # fraction_found and out of the core requirement.
      #
      # ALIASES: matA-1/matA-2/matA-3/mt a-1 are the NEUROSPORA names for
      # genes already on this roster -- the gene_class values assigned by the
      # curator already pair them (alpha_box, matA-2, matA-3, HMG_box). Listing
      # both spellings as separate roster entries inflated the expected roster
      # and let one locus gene count twice, exactly as MFa1/2/3 did in
      # Tremellales. Confirmed by blastp best-hit, each Neurospora protein
      # against every other MAT protein in db/:
      #   matA-1 -> MAT1-1-1  31.9%  E 2.8e-18   (top 3 hits all MAT1-1-1)
      #   mt a-1 -> MAT1-2-1  47.1%  E 7.7e-24   (top 2 hits all MAT1-2-1)
      #   matA-2 -> MAT1-1-2  33.3%  E 4.1e-06
      #   matA-3 -> MAT1-1-3  38.2%  E 5.8e-10   MARGINAL: MAT1-2-1 is second
      #                                          at E 1.7e-09, under one order
      #                                          of magnitude away, because
      #                                          MAT1-1-3 and MAT1-2-1 are both
      #                                          HMG-box proteins and
      #                                          cross-match (E 2.5e-17).
      #                                          They are idiomorph-specific
      #                                          paralogs -- the sexM/sexP
      #                                          shape -- and must NOT be
      #                                          merged with each other.
      # CIMG_00407 is NOT aliased: its best hit to any other MAT protein is
      # E 5.7, i.e. nothing. It stays a distinct Coccidioides gene.
      - {name: MAT1-1-1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["MAT1-1"], aliases: [matA-1]}
      - {name: MAT1-1-2, role: core_MAT, gene_class: matA-2, present_in_idiomorphs: ["MAT1-1"], aliases: [matA-2], optional: true}
      - {name: MAT1-1-3, role: core_MAT, gene_class: matA-3, present_in_idiomorphs: ["MAT1-1"], aliases: [matA-3], optional: true}
      # MAT1-1-5 and MAT1-2-10 are the two Leotiomycete-characteristic MAT genes. Both are
      # real, named genes on primary GenBank records for this class (e.g. MAT1-1-5 on
      # JQ815883/KU726096/KU726097/KF944385; MAT1-2-10 is deposited under its older name
      # MAT1-2-4 on those same records, renamed per Wilken et al. 2017 Fungal Biol Rev).
      # Declared here so detect.search._attribute does not silently drop hits to them.
      # MAT1-1-5 and MAT1-2-4 are lineage-specific, not universal (curator, 2026-09-19;
      # Doughan & Rollins 2016, doi:10.1016/j.funbio.2016.06.007).
      - {name: MAT1-1-5, role: core_MAT, present_in_idiomorphs: ["MAT1-1"], optional: true}
      - {name: MAT1-2-1, role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["MAT1-2"], aliases: ["mt a-1"]}
      - {name: MAT1-2-10, role: core_MAT, present_in_idiomorphs: ["MAT1-2"], optional: true}
      # APN2/SLA2 gene_class assigned 2026-09-19 by the project's curator, J. Stajich,
      # who was asked what gene_class values APN2 and SLA2 should take. He described APN2
      # as "class II DNA repair apurinic/apyrimidinic endonuclease" or "DNA endonuclease 2",
      # and SLA2 as "cytoskeleton assembly control protein". Those functional descriptions
      # are the curator's own words. The curator was then offered three naming options --
      # function-named (AP_endonuclease/cytoskeleton_assembly), literal-descriptor
      # (DNA_endonuclease_2/cytoskeleton_assembly_control), and gene-named
      # (apn2_homolog/sla2_homolog) -- and SELECTED THE GENE-NAMED PAIR, deliberately
      # trading the schema's "functional identity" framing for extensibility to the other
      # flanking genes still to be classified (COX13, tptA, rnhA and the rest). NOT
      # VERIFIED: no external publication was consulted for either value; the functional
      # descriptions above were not checked against any source.
      - {name: APN2, role: flanking_conserved, gene_class: apn2_homolog}
      - {name: SLA2, role: flanking_conserved, gene_class: sla2_homolog}
      - {name: COX13, role: flanking_conserved}
      # MAT1-2-4 (A. fumigatus Af293, XP_754990.2) is a genuinely distinct gene from
      # Leotiomycetes' MAT1-2-4, which was renamed MAT1-2-10 above precisely to avoid
      # this collision (Wilken et al. 2017). This entry is Eurotiomycetes-only; do not
      # conflate the two literal names sharing this spelling.
      # MAT1-2-4 is Sclerotinia/Leotiomycete-specific (curator, 2026-09-19;
      # doi:10.1016/j.funbio.2016.06.007, PMID 27567717).
      - {name: MAT1-2-4, role: core_MAT, present_in_idiomorphs: ["MAT1-2"], optional: true}
      # MAT1-2-3 added to the vocabulary by the curator, J. Stajich, 2026-10-12. Source: the
      # Fusarium sacchari MAT1-2 deposit JF776855.1 carries a partial MAT1-2-3 CDS
      # (2870..3644; Martin et al. 2011, Fungal Genet Biol 48:731-740, PMID 21453780).
      # Optional: not every Pezizomycotina MAT1-2 locus has it. No accepted record
      # declares it yet.
      - {name: MAT1-2-3, role: core_MAT, present_in_idiomorphs: ["MAT1-2"], optional: true}
      # MAT1-1-4 (Coccidioides posadasii RMSCC1040, ABS19621.1) is a Coccidioides-
      # specific captured MAT1-1-idiomorph gene (Fraser et al. 2007; Mandel et al. 2007).
      - {name: MAT1-1-4, role: core_MAT, present_in_idiomorphs: ["MAT1-1"], optional: true}
      # CIMG_00407 (C. immitis RS genome, XP_001246636.2) is named by its locus tag
      # because no published MAT1-2-x number could be verified for it; a captured
      # Coccidioides MAT1-2-idiomorph gene (Fraser et al. 2007; Mandel et al. 2007).
      - {name: CIMG_00407, role: core_MAT, present_in_idiomorphs: ["MAT1-2"], optional: true}
      # matA-1/matA-2/matA-3/"mt a-1" are Neurospora crassa's own official NCBI Gene
      # symbols for its MAT1-1-1/MAT1-1-2/MAT1-1-3/MAT1-2-1 equivalents (classic
      # literature "mat A-1"/"mat A-2"/"mat A-3"/"mat a-1"; Glass et al. 1990;
      # Ferreira et al. 1996, 1998; Staben and Yanofsky 1990). Declared here as
      # additional gene names for the same core_MAT roles/idiomorphs so records that
      # keep Neurospora's native symbols (db/candidates/Ascomycota/5141_74-ors-a_MAT_MAT1-1,
      # db/candidates/Ascomycota/5141_unknown-1_MAT_MAT1-2) validate against
      # validate_gene_vocabulary and are not silently dropped by
      # detect.search._attribute. Mapping documented in each record's own
      # definition_note: matA-1 = MAT1-1-1, matA-2 = MAT1-1-2, matA-3 = MAT1-1-3,
      # "mt a-1" = MAT1-2-1.
  - locus_name: "PM"
    vocabulary_type: "enum"
    idiomorph_values: ["M", "P"]
    # CURATOR RULING, J. Stajich, 2026-10-01 (B9): report-only cross-lineage class
    # (MAT1-1 = alpha-box idiomorph, MAT1-2 = HMG idiomorph); labels unchanged.
    # M -> MAT1-2 (Mc carries an HMG box). P unassigned: Pc vs alpha-box homology not settled.
    idiomorph_class: {M: MAT1-2, P: unassigned}
    taxonomic_scope: [451866]
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 451866  # Taphrinomycotina
    genes:
      - {name: matMc, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: matMi, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: matPc, role: core_MAT, present_in_idiomorphs: ["P"]}
      - {name: matPi, role: core_MAT, present_in_idiomorphs: ["P"]}
  - locus_name: "mat1"
    vocabulary_type: "enum"
    idiomorph_values: ["M", "P"]
    # CURATOR RULING, J. Stajich, 2026-10-01 (B9): report-only cross-lineage class
    # (MAT1-1 = alpha-box idiomorph, MAT1-2 = HMG idiomorph); labels unchanged.
    # M -> MAT1-2 (Mc carries an HMG box). P unassigned: Pc vs alpha-box homology not settled.
    idiomorph_class: {M: MAT1-2, P: unassigned}
    taxonomic_scope: [4895]
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 451866  # Taphrinomycotina
    genes:
      - {name: mat1-Mc, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: mat1-Mi, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: mat1-Pc, role: core_MAT, present_in_idiomorphs: ["P"]}
      - {name: mat1-Pi, role: core_MAT, present_in_idiomorphs: ["P"]}
  - locus_name: "mat2"
    vocabulary_type: "enum"
    idiomorph_values: ["P"]
    # CURATOR RULING, J. Stajich, 2026-10-01 (B9): report-only cross-lineage class
    # (MAT1-1 = alpha-box idiomorph, MAT1-2 = HMG idiomorph); labels unchanged.
    # P unassigned: Pc vs alpha-box homology not settled.
    idiomorph_class: {P: unassigned}
    taxonomic_scope: [4896]
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 451866  # Taphrinomycotina
    genes:
      - {name: matPc, role: core_MAT, present_in_idiomorphs: ["P"]}
      - {name: matPi, role: core_MAT, present_in_idiomorphs: ["P"]}
  - locus_name: "mat3"
    vocabulary_type: "enum"
    idiomorph_values: ["M"]
    # CURATOR RULING, J. Stajich, 2026-10-01 (B9): report-only cross-lineage class
    # (MAT1-1 = alpha-box idiomorph, MAT1-2 = HMG idiomorph); labels unchanged.
    # M -> MAT1-2 (Mc carries an HMG box).
    idiomorph_class: {M: MAT1-2}
    taxonomic_scope: [4896]
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 451866  # Taphrinomycotina
    genes:
      - {name: matMc, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: matMi, role: core_MAT, present_in_idiomorphs: ["M"]}
  - locus_name: "MATsc"
    vocabulary_type: "enum"
    idiomorph_values: ["MATalpha", "MATa"]
    # CURATOR RULING, J. Stajich, 2026-10-01 (B9): report-only cross-lineage class
    # (MAT1-1 = alpha-box idiomorph, MAT1-2 = HMG idiomorph); labels unchanged.
    # MATalpha1 carries the alpha box; MATa by convention (S. cerevisiae lost its HMG gene).
    idiomorph_class: {MATalpha: MAT1-1, MATa: MAT1-2}
    taxonomic_scope: [4893]
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 147537  # Saccharomycotina
    # Flank-carried window (curator's ruling 2026-09-26): sla2/cha1 sit OUTSIDE
    # the idiomorph, like SLA2/APN2/COX13. Set by analogy with the audited
    # SLA2/APN2 families (results/2026-09-26_flank_rule_ascomycota/NOTE.md);
    # the audit's changed calls contained no MATsc call.
    flank_carried_window_bp: 20000
    genes:
      # Curator's ruling, 2026-09-21: in Saccharomyces "only find the key 2
      # genes (and recognize there are silent and active copies, I would just
      # like a report of all these loci and allele)".
      #
      # WHY NOT FLANKING GENES HERE. S. cerevisiae carries THREE cassettes on
      # chromosome III with the same gene content -- HML (12,386-13,809), MAT
      # (199,546-200,969) and HMR (293,179-294,321) -- and WHICH ONE sits at
      # the MAT position is the mating type. Gene content cannot answer that,
      # and a real run on S288C reports all three. The discriminator here is
      # the flanking DNA (the X/Y/Z homology boxes used by HO-triggered gene
      # conversion), not flanking GENES. So this family does not try to pick
      # the active cassette: it reports each one with its allele.
      #
      # alpha1/alpha2 came from the Zygosaccharomyces rouxii record and are the
      # SAME TWO GENES under another species' naming. Measured on S288C:
      # MATALPHA1 (100%) and alpha1 (65.2%) hit ONE ORF; MATALPHA2 (100%) and
      # alpha2 (52.3%) hit the other. Four names on two genes inflated
      # fraction_found exactly as MFa1/2/3 did in Tremellales. Aliased, so one
      # ORF counts once and both reference sequences are still searched.
      - {name: MATALPHA1, role: core_MAT, present_in_idiomorphs: ["MATalpha"], aliases: [alpha1]}
      # MATALPHA2/MATA2 mark the cassette but do NOT vote on which allele it
      # carries. a2 and alpha2 are homologous over the X region shared by all
      # three chromosome-III cassettes, so MATA2 hits at 100% identity and
      # 100% coverage at every one of them, and MATALPHA2 -- the longer
      # protein -- outscores it at every one, INCLUDING HMR, which is a.
      # Measured bitscores on S288C (HML / MAT / HMR):
      #   MATA2      246 / 246 / 246      MATALPHA2  422 / 422 / 374
      # Letting that pair vote calls HMR alpha. Silenced, MATA1 (236) beats
      # MATALPHA1 (82, a 38 aa 22%-coverage fragment) at HMR and the call is
      # right at all three. Curator's ruling 2026-09-21: "just knowing where
      # the cassettes are is sufficient".
      - {name: MATALPHA2, role: core_MAT, present_in_idiomorphs: ["MATalpha"], aliases: [alpha2], idiomorph_informative: false}
      - {name: MATA1, role: core_MAT, present_in_idiomorphs: ["MATa"]}
      - {name: MATA2, role: core_MAT, present_in_idiomorphs: ["MATa"], idiomorph_informative: false}
      # sla2 here is the same gene as Ascomycota:MAT's SLA2 under this family's own
      # lowercase name, and takes the same class by the same 2026-09-19 curator ruling
      # recorded on that entry above (curator described SLA2 as "cytoskeleton assembly
      # control protein", then chose the gene-named option sla2_homolog from three
      # offered namings). NOT VERIFIED: no external publication was consulted, and the
      # curator did not separately rule on this lowercase spelling.
      # sla2 is a BONUS FLANK: searched everywhere, corroborating where the
      # architecture has it, costing nothing where it does not. Curator's
      # ruling 2026-09-21, after the two measurements that show one flag
      # cannot describe this family:
      #   * Saccharomyces -- SLA2 is not on chromosome III AT ALL (checked on
      #     the S288C reference, 150 annotated chrIII genes), so it is not a
      #     MAT flank there;
      #   * Kluyveromyces lactis (NC_006039.1) and Lachancea thermotolerans
      #     (NC_013082.1) -- sla2 IS immediately adjacent, sla2 -> MATA1 ->
      #     MATA2, so it is a real anchor there.
      # `MATsc` spans all of Saccharomycetaceae, so both are true at once.
      # `optional` gives exactly the asymmetry wanted: finding it still
      # promotes the call to High, its absence no longer demotes anything, and
      # it stays out of fraction_found. Previously `exclude_from_search`, which
      # silenced it for the whole family and discarded the genera where it
      # works.
      - {name: sla2, role: flanking_conserved, gene_class: sla2_homolog, optional: true}
      # cha1 stays OFF the search list -- it is not merely absent in
      # Saccharomyces, it is actively misleading: CHA1 (15,798-16,880) abuts
      # HML, not MAT, so anchoring on it selects the silent donor cassette.
      # Kept declared so the Z. rouxii record's own gene name stays
      # attributable.
      - {name: cha1, role: flanking_variable, exclude_from_search: true}
  - locus_name: "MATyl"
    vocabulary_type: "enum"
    idiomorph_values: ["A", "B"]
    # CURATOR RULING, J. Stajich, 2026-10-01 (B9): report-only cross-lineage class
    # (MAT1-1 = alpha-box idiomorph, MAT1-2 = HMG idiomorph); labels unchanged.
    # Unmapped by ruling: MATA (MATA1, MATA2) / MATB (MATB1, MATB2) per Han et al. 2020,
    # FEMS Yeast Res 20:foaa011, which gives no protein domains. A and B are both curated
    # (B added 2026-10-17: 4952_clib122_MATyl_B).
    idiomorph_class: {A: unassigned, B: unassigned}
    # CURATOR DECISION, J. Stajich, 2026-10-17: scope extended from Yarrowia lipolytica
    # (4952) to the genus Yarrowia (4951; verified live via NCBI Taxonomy esummary,
    # rank genus), because Y. yakushimensis CBS 10253 carries the MATB idiomorph at the
    # SLA2 site (82% matb2). Strict superset: the 4952 records stay covered.
    # The sibling Geotrichum family `MATdc` (scope 43987) is disjoint from this one.
    taxonomic_scope: [4951]
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 147537  # Saccharomycotina
    # CURATOR DECISION, J. Stajich, 2026-10-17: scope-only family (never searched on a
    # phylum fallback).
    fallback_searchable: false
    # A/B HMM RESULT (2026-10-17; scores in docs/notes/2026-10-17_dipodascales-curation.md):
    # no Yarrowia protein hits Pfam HMG_box (PF00505), HMG_box_2 (PF09011) or the curator
    # HMG-box profile MAT1-2-1 at E<=10, so the HMG box of mata2 reported in the literature is
    # NOT confirmed by these profiles (too diverged). matb1 has a weak MATalpha_HMGbox
    # (PF04769) hit (14.4 bits, E 5.8e-6, below the GA of 28.1). By phmmer mata2 is
    # similar to Geotrichum MATA (HMG-like; 42 bits) and matb1 to Geotrichum MATB
    # (alpha-box-like; 26 bits). Labels A/B therefore line up across the two genera.
    # GENE CLASS EVIDENCE (2026-10-18; thin margins stated, nothing here is a strong score):
    #  Yarrowia mata2: no hit to Pfam HMG_box PF00505, HMG_box_2 PF09011 or the curator
    #   MAT1-2-1 profile at E<=10. phmmer to Geotrichum MATA 42 bits (E 2e-14), the
    #   strongest link; Geotrichum MATA scores 39.4 bits on the curator HMG profile
    #   (E 1.8e-13). Komagataella analysis: Pfam HMG_box scores Komagataella MATa2 only
    #   13.6 bits (GA 25.4); a 7-protein Saccharomycotina MATa2 profile recovers every
    #   held-out lineage at 22-52 bits but with THIN margins over the best background HMG
    #   protein (Komagataella 46.9 vs 39.9, K. lactis 27.6 vs 25.4, Yarrowia mata2 22.4
    #   vs 21.3 = the thinnest); AlphaFold/Foldseek give HMG-box structures as the top
    #   hits only at E 0.02-0.65.
    #  Yarrowia mata1: homeodomain-like (34.0 bits, per the Komagataella analysis) -> no class.
    #  Yarrowia matb1: Pfam MATalpha_HMGbox 14.4 bits (GA 28.1) and phmmer to Geotrichum MATB
    #   26 bits (E 2e-9); matb2: nothing. Below the bar -> no class (an open question).
    # `idiomorph_class` stays unassigned for MATyl and MATdc by curator decision 2026-10-18.
    # Flank-carried window (curator's ruling 2026-09-26; results/
    # 2026-09-26_flank_rule_ascomycota/NOTE.md): the flanks sit OUTSIDE the
    # idiomorph, and real loci were found up to 9.9 kb from the flank span.
    flank_carried_window_bp: 20000
    genes:
      # gene_class (curator decision 2026-10-18, after the Komagataella MATa analysis,
      # origin/komagataella-curation docs/notes/2026-10-18_komagataella-mata-analysis.md):
      # the structural + iterative-search + alignment evidence is accepted as the bar for
      # `HMG_box` on the divergent yeast MATa2-type genes, so mata2 is HMG_box. Evidence
      # and its thin margins are written out in the `GENE CLASS EVIDENCE` block below.
      # mata1 is left UNSET on purpose: that analysis found it homeodomain-like (Pfam
      # PF00046 34.0 bits, GA 22.9) and the schema has no homeodomain class.
      # matb1/matb2 are left UNSET: the only domain evidence here is below Pfam GA (see
      # block below) and does not meet the bar that was accepted for mata2.
      - {name: mata1, role: core_MAT, present_in_idiomorphs: ["A"]}
      - {name: mata2, role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["A"]}
      # MATB idiomorph genes, Butler et al. 2004 (PMID 14745027; GenBank AJ617307.1
      # matb2 CAE84425.1, matb1 CAE84426.1) and the CLIB122 RefSeq annotation
      # (YALI0_C07458g / YALI0_C07480g). Added 2026-10-17 by curator decision. Roles
      # mirror mata1/mata2: both core_MAT, restricted to idiomorph B. Same lowercase
      # naming as the A genes. No gene_class: no protein domain is established (see
      # idiomorph_class above).
      - {name: matb2, role: core_MAT, present_in_idiomorphs: ["B"]}
      - {name: matb1, role: core_MAT, present_in_idiomorphs: ["B"]}
      # sla2/apn2 here are the same genes as Ascomycota:MAT's SLA2/APN2 under this
      # family's own lowercase names, and take the same classes by the same 2026-09-19
      # curator ruling recorded on those entries above (curator described APN2 as "class
      # II DNA repair apurinic/apyrimidinic endonuclease" or "DNA endonuclease 2", SLA2 as
      # "cytoskeleton assembly control protein", then chose the gene-named option
      # apn2_homolog/sla2_homolog from three offered namings). NOT VERIFIED: no external
      # publication was consulted, and the curator did not separately rule on these
      # lowercase spellings.
      - {name: sla2, role: flanking_conserved, gene_class: sla2_homolog}
      - {name: apn2, role: flanking_conserved, gene_class: apn2_homolog}
  - locus_name: "MATdc"
    vocabulary_type: "enum"
    # A = the HMG-box-like protein (Geotrichum MATA, HF558448.1) and B = the alpha1-like
    # protein (Geotrichum MATB, HF558449.1), by position at SLA2 and by weak homology
    # (A hits Y. lipolytica mata2 at 29%; B hits Ogataea matalpha1 at 35-40%). Domain
    # content: see the HMM result below. The labels A/B are the depositors' MATA/MATB.
    #
    # A/B HOMOLOGY WITH `MATyl` (measured 2026-10-17, pyhmmer 0.12.3, HMMER 3.4 profiles;
    # scores in docs/notes/2026-10-17_dipodascales-curation.md):
    #   Geotrichum MATA: curator HMG-box profile MAT1-2-1 107-196 (bits 39.4, E 1.8e-13);
    #     Pfam HMG_box PF00505 and HMG_box_2 PF09011: no hit at E<=10.
    #   Geotrichum MATB: Pfam MATalpha_HMGbox PF04769 (alpha-box; bits 34.9, GA 28.1) and the
    #     curator alpha-box profile MAT1-1-1 (bits 22.6, E 2.7e-8).
    #   phmmer across genera: Geotrichum MATA <-> Yarrowia mata2 (42 bits, E 2e-14);
    #     Geotrichum MATB <-> Yarrowia matb1 (26 bits, E 2e-9); MATA/mata2 and MATB/matb1 do
    #     NOT hit each other across the A/B divide; matb2 and mata1 hit nothing.
    # So A = HMG-box-like and B = alpha-box-like here, and the labels line up with Yarrowia
    # A (mata2) and B (matb1) by sequence similarity. `idiomorph_class` is left `unassigned`
    # pending the curator's decision (A -> MAT1-2, B -> MAT1-1 would be the mapping).
    idiomorph_values: ["A", "B"]
    idiomorph_class: {A: unassigned, B: unassigned}
    # CURATOR DECISION, J. Stajich, 2026-10-17: scope-only family (never searched on a
    # phylum fallback, so it cannot fire on genera outside Geotrichum).
    fallback_searchable: false
    # CURATOR DECISION, J. Stajich, 2026-10-17: Geotrichum gets its own family, scoped
    # to the genus Geotrichum (43987; verified live via NCBI Taxonomy, rank genus,
    # lineage ...Dipodascales; Dipodascaceae). Deliberately NOT the order Dipodascales
    # (3243772): route() returns every family whose scope intersects the lineage, so an
    # order-wide scope would make Yarrowia genomes match both MATyl and MATdc and be
    # reported twice (the Serinales problem described under `MTL`).
    taxonomic_scope: [43987]
    # CURATOR DECISION (2026-10-18 relay): genome-level two-idiomorph statement ON for MATdc.
    two_idiomorphs_report: true
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 147537  # Saccharomycotina
    flank_carried_window_bp: 20000
    genes:
      # MATA/MATB: names exactly as the depositor annotated them (HF558448.1 gene MATA,
      # HF558449.1 gene MATB). Unpublished deposits (INRA/Casaregola lab, Nov 2012).
      # gene_class (curator request 2026-10-17, homothallic_candidate rule; evidence bar
      # confirmed 2026-10-18): MATA = HMG_box, MATB = alpha_box. Geotrichum MATA: curator
      # HMG profile 39.4 bits (E 1.8e-13) but Pfam HMG_box does NOT hit (the Komagataella
      # analysis reports 39.9 bits for the same pair; the 0.5-bit difference is unexplained); phmmer to Yarrowia
      # mata2 42 bits (E 2e-14). Geotrichum MATB: Pfam MATalpha_HMGbox 34.9 bits (GA 28.1)
      # and curator alpha profile 22.6 bits (E 2.7e-8). MATA's class rests on the accepted
      # structural/iterative bar for divergent yeast MATa2-type HMG boxes; margins are thin
      # for the Saccharomycotina MATa2 profile (see the MATyl GENE CLASS EVIDENCE block).
      # MATA is HMG-box like and MATB alpha-box like by profile (see the A/B HOMOLOGY note above), so a
      # locus holding both as full-length, non-overlapping models within 25 kb is labelled
      # `homothallic_candidate` by the existing different-domains path in
      # detect.idiomorph.classify_locus (pattern: G. ghanense GCA_022023575.1,
      # JAKKCX010000006.1, MATB ~1.653 Mb and MATA ~1.669 Mb, 16 kb apart). Unvalidated
      # as a biological claim: no sexual state is documented for this species.
      - {name: MATA, role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["A"]}
      - {name: MATB, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["B"]}
      # sla2 is the anchor: in G. candidum CLIB 918 the order is SLA2 -> MATA -> APC5
      # (CCBN010000002.1), MATA 2.0 kb from SLA2. apn2 is NOT adjacent there (a diverged
      # copy is on another contig), so it is declared optional.
      - {name: sla2, role: flanking_conserved, gene_class: sla2_homolog}
      - {name: apn2, role: flanking_conserved, gene_class: apn2_homolog, optional: true}
  - locus_name: "MTL"
    vocabulary_type: "enum"
    idiomorph_values: ["A", "alpha"]
    # CURATOR RULING, J. Stajich, 2026-10-01 (B9): report-only cross-lineage class
    # (MAT1-1 = alpha-box idiomorph, MAT1-2 = HMG idiomorph); labels unchanged.
    # MTLalpha1 carries the alpha box; MTLa2 the HMG box.
    idiomorph_class: {alpha: MAT1-1, A: MAT1-2}
    # Widened 2026-09-21 from 4959 -- which is Debaryomyces hansenii, a single
    # SPECIES -- to Serinales, the CUG-Ser1 / CTG clade. Verified live: 2916678
    # is rank ORDER, and the lineages of BOTH Candida albicans (5476) and
    # D. hansenii (4959) contain it, so this is a strict superset and the
    # existing 4959_cbs767_MTL_A record stays covered.
    #
    # Before this, 136 C. albicans genomes in the local library reached `MTL`
    # by no route at all: not Saccharomycetaceae (4893), not D. hansenii, so
    # they fell to phylum_fallback and were searched against all nine
    # Ascomycota families. Serinales routes 2,368 genomes here.
    #
    # Curator's ruling on clade coverage: add RECORDS inside this one family
    # rather than splitting it. `route()` returns EVERY family whose scope
    # intersects the lineage, so a second Metschnikowiaceae family would make
    # those 1,312 genomes match both and be reported twice; two families would
    # need disjoint scopes and a duplicate roster. Metschnikowiaceae (987
    # Candidozyma, 173 Metschnikowia, 102 Clavispora) gets its own research
    # pass before any split is considered -- note NCBI has no MTLa1-named
    # C. auris protein and Clavispora uses `MAT alpha 1` naming, so no
    # ready-made reference exists there.
    #
    # Disjoint from 4893 (Saccharomycetaceae) and 4952 (Yarrowia), so this
    # introduces no new multi-family ambiguity.
    taxonomic_scope: [2916678]  # Serinales (order) -- the CUG-Ser1 / CTG clade
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 147537  # Saccharomycotina
    # Flank-carried window (curator's ruling 2026-09-26): PAP1/OBP1/PIK1 sit
    # INSIDE the idiomorph, so a core hit must lie within 3 kb of them.
    flank_carried_window_bp: 3000
    genes:
      # gene_class added 2026-09-25 so the homothallic rule can tell unrelated
      # genes apart: MTLalpha1 is the alpha-box gene (the MAT1-1-1 counterpart;
      # Pfam PF04769 hits every curated MTLalpha1) and MTLa2 the HMG-domain
      # regulator (the MAT1-2-1 counterpart), the same two classes the
      # Pezizomycotina `MAT` family uses. CAVEAT, measured: Pfam HMG_box
      # (PF00505) does NOT hit the curated C. albicans or C. lusitaniae MTLa2,
      # so MTLa2's class rests on the literature, not on a Pfam hit. MTLa1 is
      # a homeodomain protein (PF00046); no curated class exists for it yet,
      # so it has none.
      - {name: MTLA1, role: core_MAT, present_in_idiomorphs: ["A"]}
      - {name: MTLA2, role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["A"]}
      - {name: MTLalpha1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["alpha"]}
      # CURATOR RULING, J. Stajich, 2026-09-25: MTLalpha2 as OPTIONAL. It is
      # present in C. albicans, C. dubliniensis and C. tropicalis but
      # biologically absent in Metschnikowiaceae (C. auris, Clavispora; Munoz
      # et al. 2018), so as a required gene it would sit in every
      # Metschnikowiaceae genome's denominator unfindable. Optional keeps it out
      # of fraction_found while a found, modelled alpha2 still counts toward the
      # modelled-gene bar. PROVISIONAL: to be tested on a broad genome scan.
      - {name: MTLalpha2, role: core_MAT, present_in_idiomorphs: ["alpha"], optional: true, aliases: [alpha2]}
      # CURATOR RULING, J. Stajich, 2026-09-25: the PAP1-OBP1-PIK1 block as
      # OPTIONAL flanks. In the CTG clade these three genes sit inside or beside
      # the MTL idiomorph in C. albicans, C. lusitaniae and all C. auris clades
      # (Hull & Johnson 1999; Munoz et al. 2018), as idiomorph-specific alleles
      # (PAPa/PAPalpha, ...), so they are `flanking_variable` with no idiomorph
      # restriction -- each idiomorph carries its own copy. Added because
      # C. auris's alpha idiomorph has ONE core gene (MTLalpha1) and the roster
      # had no flank, so an alpha genome could never reach two modelled genes.
      # NOT near MTL in D. hansenii (~700 kb away), hence optional. RISK to
      # measure: OBP1 and PIK1 have genome paralogs (C. auris OBP paralog 28%,
      # PIK paralog 42% identity), which could pair with a background MTL
      # fragment. PROVISIONAL, pending the Serinales-wide scan.
      # `polish: miniprot` (curator ruling 2026-09-26): exonerate on these long
      # proteins was ~90% of runtime; miniprot alone gave identical genotypes
      # on 60/60 ablation genomes (results/2026-09-26_flank_ablation/).
      - {name: PAP1, role: flanking_variable, optional: true, polish: miniprot, aliases: [PAPa, PAPalpha, PAP]}
      - {name: OBP1, role: flanking_variable, optional: true, polish: miniprot, aliases: [OBPa, OBPalpha, OBP, OPB]}
      - {name: PIK1, role: flanking_variable, optional: true, polish: miniprot, aliases: [PIKa, PIKalpha, PIK]}
  - locus_name: "MATtub"
    vocabulary_type: "enum"
    idiomorph_values: ["MAT1-1", "MAT1-2"]
    # CURATOR RULING, J. Stajich, 2026-10-01 (B9): report-only cross-lineage class
    # (MAT1-1 = alpha-box idiomorph, MAT1-2 = HMG idiomorph); labels unchanged.
    idiomorph_class: {MAT1-1: MAT1-1, MAT1-2: MAT1-2}
    # Pezizomycetes (class; NCBI taxid 147549, verified via NCBI Taxonomy esearch/efetch
    # 2026-09-17) plus the four Tuber species taxids actually curated so far, matching
    # this file's existing style of mixing one broad rank id with specific species ids
    # (see the "MAT" locus's 222544 + 5180/28548/40559). A separate locus_name from the
    # existing Pezizomycotina "MAT" family is required (not an extension of its scope):
    # Tuber's flanking genes on HM370280.1 (Rsm22-like, unnamed_flanking_ORF) are not
    # the canonical APN2/SLA2/COX13 set used by "MAT", per
    # db/candidates/Ascomycota/39416_mel206_MAT_MAT1-1/metadata.yaml's definition_note.
    taxonomic_scope: [147549, 39416, 57749, 752769, 55307]
    # Subphylum guard (curator ruling 2026-10-17; src/MATPredict/detect/family_registry.py route()):
    fallback_subphylum: 147538  # Pezizomycotina
    # Flank-carried window (curator's ruling 2026-09-26; results/
    # 2026-09-26_flank_rule_ascomycota/NOTE.md): the flanks sit OUTSIDE the
    # idiomorph, and real loci were found up to 9.9 kb from the flank span.
    flank_carried_window_bp: 20000
    genes:
      # Same alpha_box/HMG_box identity-domain classes as the Pezizomycotina "MAT"
      # locus above -- Tuber uses the identical MAT1-1-1/MAT1-2-1 gene names for the
      # same conserved domain proteins (Rubini et al. 2011).
      - {name: MAT1-1-1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["MAT1-1"]}
      - {name: MAT1-2-1, role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["MAT1-2"]}
      # Rsm22-like and unnamed_flanking_ORF are the two flanking CDS the depositors
      # themselves used as PCR-primer anchors around the Tuber MAT1-1-1 idiomorph on
      # HM370280.1 (Rubini et al. 2011, PMID 20961294) -- Tuber-specific anchors, not
      # the canonical Pezizomycotina APN2/SLA2/COX13 set. Declared with no
      # present_in_idiomorphs restriction since only the MAT1-1 record (Mel206) has
      # curated them so far; the MAT1-2 side (Mel28 reference genome) is an
      # acknowledged gap (see that record's definition_note).
      - {name: Rsm22-like, role: flanking_conserved}
      - {name: unnamed_flanking_ORF, role: flanking_conserved}
      # CURATOR RULING, J. Stajich, 2026-09-25: add SLA2 and APN2. Their only
      # MATtub references are the Morchella importuna records (KY782629.1 /
      # KY782630.1, Chai et al. 2017). `optional`: a missing flank stays out of
      # fraction_found, so a Tuber cluster -- whose depositors used other
      # anchors, and where APN2 was not found in any of 7 annotated proteomes --
      # is never penalised, while a found and modelled SLA2 counts toward the
      # modelled-gene bar. Measured before adding them
      # (results/2026-09-24_flank_homology): SLA2 is single-copy and a
      # reciprocal best hit to A. fumigatus in 53/53 annotated Pezizales
      # proteomes, within 20 kb of MAT in 33/34 where they share a contig
      # (median 6.1 kb); APN2 in 46/53, within 20 kb in 26/34 (median 16.6 kb).
      # The synteny test (docs/notes/2026-09-24_bar-synteny-test.md) found an
      # adjacent withheld core locus in 69 of 81 no-call Pezizales genomes.
      - {name: SLA2, role: flanking_conserved, gene_class: sla2_homolog, optional: true}
      - {name: APN2, role: flanking_conserved, gene_class: apn2_homolog, optional: true}
