phylum: Ascomycota
loci:
  - locus_name: "MAT"
    vocabulary_type: "enum"
    idiomorph_values: ["MAT1-1", "MAT1-2"]
    taxonomic_scope: [716546]  # leotiomyceta -- live-confirmed via NCBI esummary
    # 2026-09-18; recommended by `matpredict detect audit-scope` as the deepest
    # common ancestor of the 17/26 curated records this family's own prior
    # scope ([222544, 5180, 28548, 40559]) did not cover. Confirmed via NCBI
    # Taxonomy esummary: taxid 716546 = "leotiomyceta", rank clade, ascomycete
    # fungi -- the well-known Pezizomycotina subclade that covers every order
    # this family's own curated records span (Helotiales, Onygenales,
    # Eurotiales, Hypocreales, Sordariales, Teloschistales, Lecanorales) while
    # EXCLUDING Pezizomycetes/Pezizales, so unlike a broader Pezizomycotina-
    # level scope this does not overlap Ascomycota:MATtub's own dedicated
    # Pezizomycetes/Tuber scope below -- no multi-family fallback introduced.
    # See docs/superpowers/plans/2026-09-18-genome-scale-detection-rollout-findings.md
    # for the audit that found the prior value stale.
    genes:
      # gene_class alpha_box/HMG_box mark the two conserved MAT-identity domain classes
      # shared across Pezizomycotina (Debuchy & Turgeon 2006; Turgeon & Yoder 2000):
      # MAT1-1-1 is the alpha-box (alpha-domain) protein, MAT1-2-1 the HMG-box protein.
      # MAT1-1-5 and MAT1-2-10 are idiomorph-specific accessory genes with no single
      # conserved cross-family domain class documented in this DB's own records --
      # left unclassified rather than guessed.
      #
      # MAT1-1-2 -> matA-2 and MAT1-1-3 -> matA-3 were assigned by the project's
      # curator, J. Stajich, on 2026-09-19, with citations the curator supplied and
      # this project verified against PubMed:
      #   * Klix et al. 2010, Eukaryot Cell 9(6):894-905, doi:10.1128/EC.00019-10
      #     (PMID 20435701). Sordaria macrospora SmtA-1/-2/-3 = MAT1-1-1/-2/-3. Its
      #     abstract calls SmtA-2 "the PPF domain protein-encoding gene", which is the
      #     documented functional identity behind the matA-2 class. It also calls
      #     SmtA-1 and SmtA-3 "the alpha domain protein-encoding genes"; the curator
      #     did not adopt alpha_box for MAT1-1-3, judging the call not settled.
      #   * Doughan & Rollins 2016, Fungal Biol 120(9):1105-17,
      #     doi:10.1016/j.funbio.2016.06.007 (PMID 27567717), which names MAT1-1-5 and
      #     MAT1-2-4 as lineage-specific to S. sclerotiorum and close relatives.
      # The classes are named after the Aspergillus-style matA-N gene names rather than
      # a domain: the curator judged "PPF_domain" unclear, and SmtA-N too Sordaria-
      # specific ("Sm") to name a cross-family class. Hyphens are deliberate and match
      # the literal gene spelling.
      # matA-2/matA-3 (Eurotiomycetes) carry the SAME classes because this DB's own
      # records document the equivalence in their definition_notes -- "matA-2 =
      # MAT1-1-2, matA-3 = MAT1-1-3" -- exactly as matA-1 already shares alpha_box with
      # MAT1-1-1. Classifying one member of a documented equivalence and not the other
      # would split the group in every figure that colours by gene_class.
      # Names remain provisional under the NAMES PROVISIONAL note in order.schema.yaml.
      - {name: MAT1-1-1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["MAT1-1"]}
      - {name: MAT1-1-2, role: core_MAT, gene_class: matA-2, present_in_idiomorphs: ["MAT1-1"]}
      - {name: MAT1-1-3, role: core_MAT, gene_class: matA-3, present_in_idiomorphs: ["MAT1-1"]}
      # MAT1-1-5 and MAT1-2-10 are the two Leotiomycete-characteristic MAT genes. Both are
      # real, named genes on primary GenBank records for this class (e.g. MAT1-1-5 on
      # JQ815883/KU726096/KU726097/KF944385; MAT1-2-10 is deposited under its older name
      # MAT1-2-4 on those same records, renamed per Wilken et al. 2017 Fungal Biol Rev).
      # Declared here so detect.search._attribute does not silently drop hits to them.
      # MAT1-1-5 and MAT1-2-4 are lineage-specific, not universal (curator, 2026-09-19;
      # Doughan & Rollins 2016, doi:10.1016/j.funbio.2016.06.007).
      - {name: MAT1-1-5, role: core_MAT, present_in_idiomorphs: ["MAT1-1"]}
      - {name: MAT1-2-1, role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["MAT1-2"]}
      - {name: MAT1-2-10, role: core_MAT, present_in_idiomorphs: ["MAT1-2"]}
      # APN2/SLA2 gene_class assigned 2026-09-19 by the project's curator, J. Stajich,
      # who was asked what gene_class values APN2 and SLA2 should take. He described APN2
      # as "class II DNA repair apurinic/apyrimidinic endonuclease" or "DNA endonuclease 2",
      # and SLA2 as "cytoskeleton assembly control protein". Those functional descriptions
      # are the curator's own words. The curator was then offered three naming options --
      # function-named (AP_endonuclease/cytoskeleton_assembly), literal-descriptor
      # (DNA_endonuclease_2/cytoskeleton_assembly_control), and gene-named
      # (apn2_homolog/sla2_homolog) -- and SELECTED THE GENE-NAMED PAIR, deliberately
      # trading the schema's "functional identity" framing for extensibility to the other
      # flanking genes still to be classified (COX13, tptA, rnhA and the rest). NOT
      # VERIFIED: no external publication was consulted for either value; the functional
      # descriptions above were not checked against any source.
      - {name: APN2, role: flanking_conserved, gene_class: apn2_homolog}
      - {name: SLA2, role: flanking_conserved, gene_class: sla2_homolog}
      - {name: COX13, role: flanking_conserved}
      # MAT1-2-4 (A. fumigatus Af293, XP_754990.2) is a genuinely distinct gene from
      # Leotiomycetes' MAT1-2-4, which was renamed MAT1-2-10 above precisely to avoid
      # this collision (Wilken et al. 2017). This entry is Eurotiomycetes-only; do not
      # conflate the two literal names sharing this spelling.
      # MAT1-2-4 is Sclerotinia/Leotiomycete-specific (curator, 2026-09-19;
      # doi:10.1016/j.funbio.2016.06.007, PMID 27567717).
      - {name: MAT1-2-4, role: core_MAT, present_in_idiomorphs: ["MAT1-2"]}
      # MAT1-1-4 (Coccidioides posadasii RMSCC1040, ABS19621.1) is a Coccidioides-
      # specific captured MAT1-1-idiomorph gene (Fraser et al. 2007; Mandel et al. 2007).
      - {name: MAT1-1-4, role: core_MAT, present_in_idiomorphs: ["MAT1-1"]}
      # CIMG_00407 (C. immitis RS genome, XP_001246636.2) is named by its locus tag
      # because no published MAT1-2-x number could be verified for it; a captured
      # Coccidioides MAT1-2-idiomorph gene (Fraser et al. 2007; Mandel et al. 2007).
      - {name: CIMG_00407, role: core_MAT, present_in_idiomorphs: ["MAT1-2"]}
      # matA-1/matA-2/matA-3/"mt a-1" are Neurospora crassa's own official NCBI Gene
      # symbols for its MAT1-1-1/MAT1-1-2/MAT1-1-3/MAT1-2-1 equivalents (classic
      # literature "mat A-1"/"mat A-2"/"mat A-3"/"mat a-1"; Glass et al. 1990;
      # Ferreira et al. 1996, 1998; Staben and Yanofsky 1990). Declared here as
      # additional gene names for the same core_MAT roles/idiomorphs so records that
      # keep Neurospora's native symbols (db/candidates/Ascomycota/5141_74-ors-a_MAT_MAT1-1,
      # db/candidates/Ascomycota/5141_unknown-1_MAT_MAT1-2) validate against
      # validate_gene_vocabulary and are not silently dropped by
      # detect.search._attribute. Mapping documented in each record's own
      # definition_note: matA-1 = MAT1-1-1, matA-2 = MAT1-1-2, matA-3 = MAT1-1-3,
      # "mt a-1" = MAT1-2-1.
      - {name: matA-1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["MAT1-1"]}
      - {name: matA-2, role: core_MAT, gene_class: matA-2, present_in_idiomorphs: ["MAT1-1"]}
      - {name: matA-3, role: core_MAT, gene_class: matA-3, present_in_idiomorphs: ["MAT1-1"]}
      - {name: "mt a-1", role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["MAT1-2"]}
  - locus_name: "PM"
    vocabulary_type: "enum"
    idiomorph_values: ["M", "P"]
    taxonomic_scope: [451866]
    genes:
      - {name: matMc, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: matMi, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: matPc, role: core_MAT, present_in_idiomorphs: ["P"]}
      - {name: matPi, role: core_MAT, present_in_idiomorphs: ["P"]}
  - locus_name: "mat1"
    vocabulary_type: "enum"
    idiomorph_values: ["M", "P"]
    taxonomic_scope: [4895]
    genes:
      - {name: mat1-Mc, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: mat1-Mi, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: mat1-Pc, role: core_MAT, present_in_idiomorphs: ["P"]}
      - {name: mat1-Pi, role: core_MAT, present_in_idiomorphs: ["P"]}
  - locus_name: "mat2"
    vocabulary_type: "enum"
    idiomorph_values: ["P"]
    taxonomic_scope: [4896]
    genes:
      - {name: matPc, role: core_MAT, present_in_idiomorphs: ["P"]}
      - {name: matPi, role: core_MAT, present_in_idiomorphs: ["P"]}
  - locus_name: "mat3"
    vocabulary_type: "enum"
    idiomorph_values: ["M"]
    taxonomic_scope: [4896]
    genes:
      - {name: matMc, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: matMi, role: core_MAT, present_in_idiomorphs: ["M"]}
  - locus_name: "MATsc"
    vocabulary_type: "enum"
    idiomorph_values: ["MATalpha", "MATa"]
    taxonomic_scope: [4893]
    genes:
      # Curator's ruling, 2026-09-21: in Saccharomyces "only find the key 2
      # genes (and recognize there are silent and active copies, I would just
      # like a report of all these loci and allele)".
      #
      # WHY NOT FLANKING GENES HERE. S. cerevisiae carries THREE cassettes on
      # chromosome III with the same gene content -- HML (12,386-13,809), MAT
      # (199,546-200,969) and HMR (293,179-294,321) -- and WHICH ONE sits at
      # the MAT position is the mating type. Gene content cannot answer that,
      # and a real run on S288C reports all three. The discriminator here is
      # the flanking DNA (the X/Y/Z homology boxes used by HO-triggered gene
      # conversion), not flanking GENES. So this family does not try to pick
      # the active cassette: it reports each one with its allele.
      #
      # alpha1/alpha2 came from the Zygosaccharomyces rouxii record and are the
      # SAME TWO GENES under another species' naming. Measured on S288C:
      # MATALPHA1 (100%) and alpha1 (65.2%) hit ONE ORF; MATALPHA2 (100%) and
      # alpha2 (52.3%) hit the other. Four names on two genes inflated
      # fraction_found exactly as MFa1/2/3 did in Tremellales. Aliased, so one
      # ORF counts once and both reference sequences are still searched.
      - {name: MATALPHA1, role: core_MAT, present_in_idiomorphs: ["MATalpha"], aliases: [alpha1]}
      # MATALPHA2/MATA2 mark the cassette but do NOT vote on which allele it
      # carries. a2 and alpha2 are homologous over the X region shared by all
      # three chromosome-III cassettes, so MATA2 hits at 100% identity and
      # 100% coverage at every one of them, and MATALPHA2 -- the longer
      # protein -- outscores it at every one, INCLUDING HMR, which is a.
      # Measured bitscores on S288C (HML / MAT / HMR):
      #   MATA2      246 / 246 / 246      MATALPHA2  422 / 422 / 374
      # Letting that pair vote calls HMR alpha. Silenced, MATA1 (236) beats
      # MATALPHA1 (82, a 38 aa 22%-coverage fragment) at HMR and the call is
      # right at all three. Curator's ruling 2026-09-21: "just knowing where
      # the cassettes are is sufficient".
      - {name: MATALPHA2, role: core_MAT, present_in_idiomorphs: ["MATalpha"], aliases: [alpha2], idiomorph_informative: false}
      - {name: MATA1, role: core_MAT, present_in_idiomorphs: ["MATa"]}
      - {name: MATA2, role: core_MAT, present_in_idiomorphs: ["MATa"], idiomorph_informative: false}
      # sla2 here is the same gene as Ascomycota:MAT's SLA2 under this family's own
      # lowercase name, and takes the same class by the same 2026-09-19 curator ruling
      # recorded on that entry above (curator described SLA2 as "cytoskeleton assembly
      # control protein", then chose the gene-named option sla2_homolog from three
      # offered namings). NOT VERIFIED: no external publication was consulted, and the
      # curator did not separately rule on this lowercase spelling.
      # Both flanks are WRONG for Saccharomyces and are off the search list.
      # Measured on the S288C reference (chromosome III NC_001135.5, 150
      # annotated genes): SLA2 is not on chromosome III AT ALL, and CHA1
      # (15,798-16,880) abuts HML, not MAT -- anchoring on it would select the
      # silent donor cassette. Both came from the Z. rouxii record, where the
      # architecture may differ; they stay declared so that record's own gene
      # names remain attributable, and a later pass can re-scope them.
      - {name: sla2, role: flanking_conserved, gene_class: sla2_homolog, exclude_from_search: true}
      - {name: cha1, role: flanking_variable, exclude_from_search: true}
  - locus_name: "MATyl"
    vocabulary_type: "enum"
    idiomorph_values: ["A", "B"]
    taxonomic_scope: [4952]
    genes:
      - {name: mata1, role: core_MAT, present_in_idiomorphs: ["A"]}
      - {name: mata2, role: core_MAT, present_in_idiomorphs: ["A"]}
      # sla2/apn2 here are the same genes as Ascomycota:MAT's SLA2/APN2 under this
      # family's own lowercase names, and take the same classes by the same 2026-09-19
      # curator ruling recorded on those entries above (curator described APN2 as "class
      # II DNA repair apurinic/apyrimidinic endonuclease" or "DNA endonuclease 2", SLA2 as
      # "cytoskeleton assembly control protein", then chose the gene-named option
      # apn2_homolog/sla2_homolog from three offered namings). NOT VERIFIED: no external
      # publication was consulted, and the curator did not separately rule on these
      # lowercase spellings.
      - {name: sla2, role: flanking_conserved, gene_class: sla2_homolog}
      - {name: apn2, role: flanking_conserved, gene_class: apn2_homolog}
  - locus_name: "MTL"
    vocabulary_type: "enum"
    idiomorph_values: ["A", "alpha"]
    taxonomic_scope: [4959]
    genes:
      - {name: MTLA1, role: core_MAT, present_in_idiomorphs: ["A"]}
      - {name: MTLA2, role: core_MAT, present_in_idiomorphs: ["A"]}
      - {name: MTLalpha1, role: core_MAT, present_in_idiomorphs: ["alpha"]}
  - locus_name: "MATtub"
    vocabulary_type: "enum"
    idiomorph_values: ["MAT1-1", "MAT1-2"]
    # Pezizomycetes (class; NCBI taxid 147549, verified via NCBI Taxonomy esearch/efetch
    # 2026-09-17) plus the four Tuber species taxids actually curated so far, matching
    # this file's existing style of mixing one broad rank id with specific species ids
    # (see the "MAT" locus's 222544 + 5180/28548/40559). A separate locus_name from the
    # existing Pezizomycotina "MAT" family is required (not an extension of its scope):
    # Tuber's flanking genes on HM370280.1 (Rsm22-like, unnamed_flanking_ORF) are not
    # the canonical APN2/SLA2/COX13 set used by "MAT", per
    # db/candidates/Ascomycota/39416_mel206_MAT_MAT1-1/metadata.yaml's definition_note.
    taxonomic_scope: [147549, 39416, 57749, 752769, 55307]
    genes:
      # Same alpha_box/HMG_box identity-domain classes as the Pezizomycotina "MAT"
      # locus above -- Tuber uses the identical MAT1-1-1/MAT1-2-1 gene names for the
      # same conserved domain proteins (Rubini et al. 2011).
      - {name: MAT1-1-1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["MAT1-1"]}
      - {name: MAT1-2-1, role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["MAT1-2"]}
      # Rsm22-like and unnamed_flanking_ORF are the two flanking CDS the depositors
      # themselves used as PCR-primer anchors around the Tuber MAT1-1-1 idiomorph on
      # HM370280.1 (Rubini et al. 2011, PMID 20961294) -- Tuber-specific anchors, not
      # the canonical Pezizomycotina APN2/SLA2/COX13 set. Declared with no
      # present_in_idiomorphs restriction since only the MAT1-1 record (Mel206) has
      # curated them so far; the MAT1-2 side (Mel28 reference genome) is an
      # acknowledged gap (see that record's definition_note).
      - {name: Rsm22-like, role: flanking_conserved}
      - {name: unnamed_flanking_ORF, role: flanking_conserved}
