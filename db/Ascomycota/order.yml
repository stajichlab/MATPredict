phylum: Ascomycota
loci:
  - locus_name: "MAT"
    vocabulary_type: "enum"
    idiomorph_values: ["MAT1-1", "MAT1-2"]
    taxonomic_scope: [716546]  # leotiomyceta -- live-confirmed via NCBI esummary
    # 2026-09-18; recommended by `matpredict detect audit-scope` as the deepest
    # common ancestor of the 17/26 curated records this family's own prior
    # scope ([222544, 5180, 28548, 40559]) did not cover. Confirmed via NCBI
    # Taxonomy esummary: taxid 716546 = "leotiomyceta", rank clade, ascomycete
    # fungi -- the well-known Pezizomycotina subclade that covers every order
    # this family's own curated records span (Helotiales, Onygenales,
    # Eurotiales, Hypocreales, Sordariales, Teloschistales, Lecanorales) while
    # EXCLUDING Pezizomycetes/Pezizales, so unlike a broader Pezizomycotina-
    # level scope this does not overlap Ascomycota:MATtub's own dedicated
    # Pezizomycetes/Tuber scope below -- no multi-family fallback introduced.
    # See docs/superpowers/plans/2026-09-18-genome-scale-detection-rollout-findings.md
    # for the audit that found the prior value stale.
    genes:
      # gene_class alpha_box/HMG_box mark the two conserved MAT-identity domain classes
      # shared across Pezizomycotina (Debuchy & Turgeon 2006; Turgeon & Yoder 2000):
      # MAT1-1-1 is the alpha-box (alpha-domain) protein, MAT1-2-1 the HMG-box protein.
      # MAT1-1-2/-3, MAT1-1-5 and MAT1-2-10 are idiomorph-specific accessory genes with
      # no single conserved cross-family domain class documented in this DB's own
      # records -- left unclassified rather than guessed.
      - {name: MAT1-1-1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["MAT1-1"]}
      - {name: MAT1-1-2, role: core_MAT, present_in_idiomorphs: ["MAT1-1"]}
      - {name: MAT1-1-3, role: core_MAT, present_in_idiomorphs: ["MAT1-1"]}
      # MAT1-1-5 and MAT1-2-10 are the two Leotiomycete-characteristic MAT genes. Both are
      # real, named genes on primary GenBank records for this class (e.g. MAT1-1-5 on
      # JQ815883/KU726096/KU726097/KF944385; MAT1-2-10 is deposited under its older name
      # MAT1-2-4 on those same records, renamed per Wilken et al. 2017 Fungal Biol Rev).
      # Declared here so detect.search._attribute does not silently drop hits to them.
      - {name: MAT1-1-5, role: core_MAT, present_in_idiomorphs: ["MAT1-1"]}
      - {name: MAT1-2-1, role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["MAT1-2"]}
      - {name: MAT1-2-10, role: core_MAT, present_in_idiomorphs: ["MAT1-2"]}
      - {name: APN2, role: flanking_conserved, gene_class: apn2_homolog}
      - {name: SLA2, role: flanking_conserved, gene_class: sla2_homolog}
      - {name: COX13, role: flanking_conserved}
      # MAT1-2-4 (A. fumigatus Af293, XP_754990.2) is a genuinely distinct gene from
      # Leotiomycetes' MAT1-2-4, which was renamed MAT1-2-10 above precisely to avoid
      # this collision (Wilken et al. 2017). This entry is Eurotiomycetes-only; do not
      # conflate the two literal names sharing this spelling.
      - {name: MAT1-2-4, role: core_MAT, present_in_idiomorphs: ["MAT1-2"]}
      # MAT1-1-4 (Coccidioides posadasii RMSCC1040, ABS19621.1) is a Coccidioides-
      # specific captured MAT1-1-idiomorph gene (Fraser et al. 2007; Mandel et al. 2007).
      - {name: MAT1-1-4, role: core_MAT, present_in_idiomorphs: ["MAT1-1"]}
      # CIMG_00407 (C. immitis RS genome, XP_001246636.2) is named by its locus tag
      # because no published MAT1-2-x number could be verified for it; a captured
      # Coccidioides MAT1-2-idiomorph gene (Fraser et al. 2007; Mandel et al. 2007).
      - {name: CIMG_00407, role: core_MAT, present_in_idiomorphs: ["MAT1-2"]}
      # matA-1/matA-2/matA-3/"mt a-1" are Neurospora crassa's own official NCBI Gene
      # symbols for its MAT1-1-1/MAT1-1-2/MAT1-1-3/MAT1-2-1 equivalents (classic
      # literature "mat A-1"/"mat A-2"/"mat A-3"/"mat a-1"; Glass et al. 1990;
      # Ferreira et al. 1996, 1998; Staben and Yanofsky 1990). Declared here as
      # additional gene names for the same core_MAT roles/idiomorphs so records that
      # keep Neurospora's native symbols (db/candidates/Ascomycota/5141_74-ors-a_MAT_MAT1-1,
      # db/candidates/Ascomycota/5141_unknown-1_MAT_MAT1-2) validate against
      # validate_gene_vocabulary and are not silently dropped by
      # detect.search._attribute. Mapping documented in each record's own
      # definition_note: matA-1 = MAT1-1-1, matA-2 = MAT1-1-2, matA-3 = MAT1-1-3,
      # "mt a-1" = MAT1-2-1.
      - {name: matA-1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["MAT1-1"]}
      - {name: matA-2, role: core_MAT, present_in_idiomorphs: ["MAT1-1"]}
      - {name: matA-3, role: core_MAT, present_in_idiomorphs: ["MAT1-1"]}
      - {name: "mt a-1", role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["MAT1-2"]}
  - locus_name: "PM"
    vocabulary_type: "enum"
    idiomorph_values: ["M", "P"]
    taxonomic_scope: [451866]
    genes:
      - {name: matMc, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: matMi, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: matPc, role: core_MAT, present_in_idiomorphs: ["P"]}
      - {name: matPi, role: core_MAT, present_in_idiomorphs: ["P"]}
  - locus_name: "mat1"
    vocabulary_type: "enum"
    idiomorph_values: ["M", "P"]
    taxonomic_scope: [4895]
    genes:
      - {name: mat1-Mc, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: mat1-Mi, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: mat1-Pc, role: core_MAT, present_in_idiomorphs: ["P"]}
      - {name: mat1-Pi, role: core_MAT, present_in_idiomorphs: ["P"]}
  - locus_name: "mat2"
    vocabulary_type: "enum"
    idiomorph_values: ["P"]
    taxonomic_scope: [4896]
    genes:
      - {name: matPc, role: core_MAT, present_in_idiomorphs: ["P"]}
      - {name: matPi, role: core_MAT, present_in_idiomorphs: ["P"]}
  - locus_name: "mat3"
    vocabulary_type: "enum"
    idiomorph_values: ["M"]
    taxonomic_scope: [4896]
    genes:
      - {name: matMc, role: core_MAT, present_in_idiomorphs: ["M"]}
      - {name: matMi, role: core_MAT, present_in_idiomorphs: ["M"]}
  - locus_name: "MATsc"
    vocabulary_type: "enum"
    idiomorph_values: ["MATalpha", "MATa"]
    taxonomic_scope: [4893]
    genes:
      - {name: MATALPHA1, role: core_MAT, present_in_idiomorphs: ["MATalpha"]}
      - {name: MATALPHA2, role: core_MAT, present_in_idiomorphs: ["MATalpha"]}
      - {name: MATA1, role: core_MAT, present_in_idiomorphs: ["MATa"]}
      - {name: MATA2, role: core_MAT, present_in_idiomorphs: ["MATa"]}
      - {name: alpha1, role: core_MAT, present_in_idiomorphs: ["MATalpha"]}
      - {name: alpha2, role: core_MAT, present_in_idiomorphs: ["MATalpha"]}
      - {name: sla2, role: flanking_conserved, gene_class: sla2_homolog}
      - {name: cha1, role: flanking_variable}
  - locus_name: "MATyl"
    vocabulary_type: "enum"
    idiomorph_values: ["A", "B"]
    taxonomic_scope: [4952]
    genes:
      - {name: mata1, role: core_MAT, present_in_idiomorphs: ["A"]}
      - {name: mata2, role: core_MAT, present_in_idiomorphs: ["A"]}
      - {name: sla2, role: flanking_conserved, gene_class: sla2_homolog}
      - {name: apn2, role: flanking_conserved, gene_class: apn2_homolog}
  - locus_name: "MTL"
    vocabulary_type: "enum"
    idiomorph_values: ["A", "alpha"]
    taxonomic_scope: [4959]
    genes:
      - {name: MTLA1, role: core_MAT, present_in_idiomorphs: ["A"]}
      - {name: MTLA2, role: core_MAT, present_in_idiomorphs: ["A"]}
      - {name: MTLalpha1, role: core_MAT, present_in_idiomorphs: ["alpha"]}
  - locus_name: "MATtub"
    vocabulary_type: "enum"
    idiomorph_values: ["MAT1-1", "MAT1-2"]
    # Pezizomycetes (class; NCBI taxid 147549, verified via NCBI Taxonomy esearch/efetch
    # 2026-09-17) plus the four Tuber species taxids actually curated so far, matching
    # this file's existing style of mixing one broad rank id with specific species ids
    # (see the "MAT" locus's 222544 + 5180/28548/40559). A separate locus_name from the
    # existing Pezizomycotina "MAT" family is required (not an extension of its scope):
    # Tuber's flanking genes on HM370280.1 (Rsm22-like, unnamed_flanking_ORF) are not
    # the canonical APN2/SLA2/COX13 set used by "MAT", per
    # db/candidates/Ascomycota/39416_mel206_MAT_MAT1-1/metadata.yaml's definition_note.
    taxonomic_scope: [147549, 39416, 57749, 752769, 55307]
    genes:
      # Same alpha_box/HMG_box identity-domain classes as the Pezizomycotina "MAT"
      # locus above -- Tuber uses the identical MAT1-1-1/MAT1-2-1 gene names for the
      # same conserved domain proteins (Rubini et al. 2011).
      - {name: MAT1-1-1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["MAT1-1"]}
      - {name: MAT1-2-1, role: core_MAT, gene_class: HMG_box, present_in_idiomorphs: ["MAT1-2"]}
      # Rsm22-like and unnamed_flanking_ORF are the two flanking CDS the depositors
      # themselves used as PCR-primer anchors around the Tuber MAT1-1-1 idiomorph on
      # HM370280.1 (Rubini et al. 2011, PMID 20961294) -- Tuber-specific anchors, not
      # the canonical Pezizomycotina APN2/SLA2/COX13 set. Declared with no
      # present_in_idiomorphs restriction since only the MAT1-1 record (Mel206) has
      # curated them so far; the MAT1-2 side (Mel28 reference genome) is an
      # acknowledged gap (see that record's definition_note).
      - {name: Rsm22-like, role: flanking_conserved}
      - {name: unnamed_flanking_ORF, role: flanking_conserved}
