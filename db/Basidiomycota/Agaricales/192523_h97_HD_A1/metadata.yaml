  core:
    completeness: partial
    reference_orientation: beta_fg->HD2<-|->HD1(a1-1)->MIP1
    definition_note: 'A. bisporus is bipolar with a single HD locus; the PR (pheromone/
      receptor) locus has lost its mating-type role in this species (Foulongne-Oriol
      et al. 2021) -- no paired PR-locus record exists or is expected for this species.
      The reference genome (var. bisporus strain H97) carries an extra HD2 gene copy
      per the primary literature; only the single HD1/HD2 pair captured at this specific
      genomic position (matching the gene identities directly confirmed via NCBI efetch)
      is represented here -- completeness is "partial" because the reported extra
      HD2 copy elsewhere in the genome is not included in this record. HD1 is officially
      annotated "a1-1" in GenBank; idiomorph "A1" here reflects the locus_name "HD"
      pattern convention (^A[0-9]+$) already established for Coprinopsis cinerea in
      this database, applied to the "a1-1" allele designation.


      record_version 2 (2026-09-26): the two published HD-locus flanks were added,
      located on the same RefSeq scaffold NW_006267344.1 (Foulongne-Oriol et al. 2021
      report mip and beta-fg flanking the HD genes). beta_fg = XP_006454074.1 (AGABI2DRAFT_132803,
      annotated ''beta-fg''), 8.3 kb upstream of HD2. MIP1 = XP_006454076.1 (AGABI2DRAFT_213738,
      annotated ''hypothetical protein''), 397 bp past HD1; identified as MIP by homology:
      38.9% identity over 717 of 757 aa to S. cerevisiae OCT1 (P35999, mitochondrial
      intermediate peptidase, E=1e-160) and 64% to the Suillus pictus MIP fragment
      AAO61535.1 (blastp, 2026-09-26). A ''beta-fg-like protein'' (XP_006454075.1)
      and an unannotated gene (XP_006454970.1) lie between beta_fg and HD2 and are
      not curated. The segment now spans 888,865-904,939.

      '
