    definition_note: 'Schizophyllum commune has a four-sublocus tetrapolar system:
      Aalpha, Abeta, Balpha, Bbeta (Kothe 1996, 1997). This record covers only the
      Aalpha locus (Y/Z HD-domain gene pair) for the H4-8 reference genome (specificity
      "4"). A literature-derived gene list (from a separate research agent''s synthesis,
      citing Marion et al. 1996 for the Aalpha gene X/Y/Z structure) was cross-checked
      directly against the actual GenBank annotation of assembly GCF_000143185.2,
      contig NW_026089539.1, via NCBI efetch -- coordinates and protein accessions
      here are independently verified, not carried over from the synthesis unchecked.
      A flanking "mitochondrial intermediate peptidase" gene sits immediately adjacent
      (not included as a MAT gene here) -- the same flanking gene identity was independently
      observed adjacent to the HD locus in Coprinopsis cinerea (5346_a43-b43-okayama-7_HD_A43),
      suggesting real conserved synteny across Agaricomycetes worth noting for sub-project
      2''s synteny work. The Abeta sublocus (also part of this species'' A-locus complex)
      is not represented in this record or dataset; Balpha and Bbeta are separate
      records (5334_h4-8_Balpha_3, 5334_h4-8_Bbeta_2).

      '
