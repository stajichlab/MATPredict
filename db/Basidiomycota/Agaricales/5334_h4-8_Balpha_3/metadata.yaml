    reference_orientation: bap3-3->bap3-1->bar3
    definition_note: 'Balpha1 locus (specificity 3, "bar3"/"bap3-x" gene naming) per
      Wendland et al. 1995 (original Balpha1 discovery paper). Genes here (2 pheromone
      precursors + 1 receptor) form a ~7kb cluster on contig NW_026089548.1 of assembly
      GCF_000143185.2, spatially adjacent to (but distinguishable from) the Bbeta
      cluster (5334_h4-8_Bbeta_2 -- same contig, ~211-233kb, vs this locus''s ~241-248kb)
      on the same contig. Two additional receptor-like genes on this same contig (brl1
      at ~189850-192799 and brl3 at ~271890-273658, flanking the whole Balpha+Bbeta
      region on both sides) were deliberately excluded from both this record and the
      Bbeta record: their "receptor-like" naming and generic (non-alpha, non-beta)
      labeling did not let a specific sublocus assignment be made confidently. The
      report describes Balpha1 as containing 3 pheromone genes; only 2 (bap3-1, bap3-3)
      were found in the source data -- completeness is "partial" for this reason.

      '
