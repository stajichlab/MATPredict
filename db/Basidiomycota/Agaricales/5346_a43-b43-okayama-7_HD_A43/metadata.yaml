    reference_orientation: HD1(a1-1)->HD2(beta)
    definition_note: 'Coprinopsis cinerea has a tetrapolar system with a multiallelic
      HD (A) locus and a multiallelic PR (B) locus (Kamada 2002, Pardo et al. 1996).
      This record covers only the HD locus for the reference strain (allele A43, per
      the Okayama-7 AmutBmut background). Coordinates and protein accessions were
      located by matching a literature-derived gene list (from a separate research
      agent''s synthesis) against the actual GenBank annotation of assembly GCA_016772295.1,
      contig JAAGWA010000001.1 -- verified directly via NCBI efetch, not carried over
      from the synthesis unchecked. The two genes (HD1-type "a1-1" and the HD2-type
      "mating-type protein beta") are immediately adjacent (681-6547 within the fetched
      window), consistent with the expected paired HD1/HD2 architecture. HD2 has two
      annotated transcript variants (KAG2022960.1, KAG2022961.1); this record uses
      the first as the representative entry.

      '
