    notes: 'Genes 0-5 and 7 (NCBI genome annotation proteins KAG2006176/179/182/185/186/187/189):
      unchanged from the 2026-09 check, 100% identity. Genes 6, 8, 9, 10, 11 (added
      or replaced 2026-10-06, no NCBI genome protein): the protein is the translation
      of the recorded coordinates on JAAGWA010000010.1 (GCA_016772295.1), compared
      with the published GenBank deposit of the B43 gene (Riquelme et al. 2005): gene
      6 phb3.1 vs AAQ96357.1 (AY393917), gene 8 phb1.1 vs AAO17257.1 (AY172109, allele
      from strain B3), gene 9 phb2.3 vs AAQ96356.1 (AY393916), gene 10 phb2.1 vs AAQ96354.1
      (AY393914), gene 11 phb3.3 vs AAQ96359.1 (AY393919). Differences from the deposits:
      phb3.1 1 aa (V63G), phb1.1 2 aa (D6V, V21M).'
