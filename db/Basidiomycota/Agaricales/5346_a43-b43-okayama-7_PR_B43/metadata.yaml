  boundaries:
    tier: 1
    experimental_method: 'Boundaries derived by selecting one contig cluster from
      a genome-wide pheromone/receptor annotation search, on the basis of one gene''s
      explicit "B43" label. Upgraded from an initial tier-2 assessment to tier 1 per
      domain-expert review (J. Stajich, 2026-09-16): PR-locus gene duplication and
      multi-copy clustering is an established, expected feature of basidiomycete B
      loci. See locus.core.definition_note. 2026-10-06: gene roster checked against
      the published B43 sequences (Riquelme et al. 2005, GenBank AY172107, AY393905,
      AY393906, AY393914-AY393919): all 3 receptors (rcb1, rcb2, rcb3) and all 7 pheromones
      (1 + 3 + 3) of the B43 haplotype are present; the span now runs from rcb1 to
      phb3.3.

      '
    citations:
    - pmid: '9539426'
      doi: 10.1093/genetics/148.3.1081
    - pmid: '15879506'
      doi: 10.1534/genetics.105.040774
    - pmid: '9529887'
      doi: 10.1128/MMBR.62.1.55-70.1998
