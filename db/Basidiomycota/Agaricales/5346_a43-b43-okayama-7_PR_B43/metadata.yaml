    reference_orientation: not established from coordinate data alone
    definition_note: 'The B (PR) locus in C. cinerea is a multi-group pheromone/receptor
      complex (O''Shea et al. 1998; Halsall et al. 2000; Riquelme et al. 2005; Casselton
      and Olesnicky 1998): three groups per locus, each with one receptor gene (rcb1,
      rcb2, rcb3 for groups 1, 2, 3) and one to three pheromone genes. The B6 and
      B42 haplotypes carry two pheromones per group (about 17 kb); B43 carries one,
      three and three (phb1.1; phb2.1, phb2.2, phb2.3; phb3.1, phb3.2, phb3.3), so
      the record spans 21.5 kb. The counts of 14 receptors and 29 pheromones in Riquelme
      et al. 2005 are alleles across 13 B haplotypes, not genes in one genome. The
      record holds the 3 receptors and 7 pheromones of B43 plus two genes of unestablished
      role: ste3_extra_unassigned (gene 4, an STE3-type receptor between rcb2 and
      rcb3 that the literature does not describe; function unknown) and phb2_B44-like
      (gene 1, a pheromone-like gene between phb1.1 and phb2.3; see below). Source
      genome: GCA_016772295.1, strain AmutBmut pab1-1 (A43mut B43mut, #326), not the
      Okayama 7 #130 reference (GCF_000182895.1); the two B regions are identical
      over about 29 kb except one 3 bp (ACG) deletion in the rcb2 coding region of
      AmutBmut (see curation.notes). A literature-derived gene list (from a separate
      research agent''s synthesis) reported pheromone/receptor annotations for this
      species scattered across FOUR different contigs of the fragmented assembly GCA_016772295.1
      (JAAGWA010000001/4/8/10/13). Given C. cinerea has many paralogous pheromone/receptor
      gene clusters genome-wide, only ONE contig cluster (JAAGWA010000010.1) was used
      for this record: it is the only one containing a gene explicitly annotated "Pheromone
      Phb2.2 B43", directly matching this strain''s known B43 allele. Genes on the
      other contigs were deliberately excluded as likely unrelated paralogous loci
      elsewhere in the genome, not confirmed as part of this specific B43 specificity
      module (contigs 4, 8, 9 and 12 each carry a single STE3 locus 30-50% identical
      to the B receptors). Gene 1 is annotated by NCBI as "pheromone Phb2.2 B44" (KAG2006179.1).
      Per user review (J. Stajich, 2026-09-16, domain expert judgment, pending a book-chapter
      reference to be added later): PR/B loci in basidiomycetes routinely carry duplicated
      pheromone/receptor gene copies, and finding one-to-many gene copies clustered
      in adjacent/nearby contig space is sufficient to define a B locus for this database''s
      purposes. That judgment upgraded boundaries evidence below from tier 2 to tier
      1 and stands. Correction 2026-10-06: the original note read the co-occurrence
      of a B43 and a B44 pheromone gene as itself consistent with B-locus complexity;
      that sentence is withdrawn. B43 already carries its own Phb2.1, Phb2.2 and Phb2.3
      B43 genes, and gene 1 is a B43-locus gene 70% identical (42 of 61 aa) to the
      published Phb2.2 B44 (AY393913), so it is not evidence of a B44 haplotype and
      carries a neutral name. completeness remains "partial" only because the gene
      roster is not claimed to be the full B-locus gene complement (the role of genes
      1 and 4 is unestablished), not because the cluster''s validity as a B locus
      is in doubt.

      '
