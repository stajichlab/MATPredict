curation:
  proposed_by: claude-literature-search
  proposal_dedupe_key: 9539426|5346|PR|B43
  reviewed_by: null
  reviewed_date: null
  notes: 'Curated 2026-10-06 (branch curate-cinerea-b43) from the proposals of analysis/2026-10-06_cinerea-b-locus-check.md
    (branch cinerea-b-locus-check); the curator approved applying changes 1-7 in one
    branch; changes 8-9 are follow-ups, not applied. Record sign-off (reviewed_by)
    is still pending. Every coordinate and protein below was re-derived against JAAGWA010000010.1
    (GCA_016772295.1) and the published GenBank deposits (Riquelme et al. 2005, PMID
    15879506), not taken from the note. The full change list with evidence is in analysis/2026-10-06_cinerea-b43-curation-changelog.md;
    the previous definition_note and the replaced gene 6 are preserved there.

    (1) Source strain: the sequence is AmutBmut pab1-1 (A43mut B43mut #326, CUHK 2021),
    not the Okayama 7 #130 reference (GCF_000182895.1); strain.differs_from_sequenced
    is now true (the strain.name is the literature strain A43 B43 / Okayama-7 that
    the B43 evidence describes). In a MAFFT alignment of the B region (NW_003307535.1:1,713,000-1,742,500
    vs JAAGWA010000010.1:1,801,000-1,830,500; about 29.0 kb alignable, the two windows
    are offset by 464 and 467 bp at their ends) the two genomes have no mismatch and
    differ at one site: a 3 bp ACG deletion in AmutBmut at JAAGWA010000010.1:1,818,588,
    inside the rcb2 coding region (a one-codon deletion). Okayama 7 #130 and the published
    B43 rcb2 (AY393905, strain AT8) carry the ACG. Observation only; no inference
    is drawn about the mutant phenotype.

    (2) Gene 6 replaced: the NCBI model KAG2006188.1 / CC2G_002524 (1,824,970-1,825,393
    +, 123 aa, MDASVSTPIYPRPL...) is the wrong reading frame (frame 1) of the true
    Phb3.1 B43. Gene 6 is now phb3.1, 1,824,918-1,825,136 (+), 72 aa, MSDLFASLDLFLSSTEDNG...SWFCTIA;
    71 of 72 aa identical to the deposit AAQ96357.1 (AY393917; V63G in this genome).

    (3) Gene 1 renamed pheromone_B44 -> phb2_B44-like (KAG2006179.1, CC2G_002517,
    coordinates unchanged): a B43-locus gene 42 of 61 aa (69%) identical to published
    Phb2.2 B44 (AY393913); not evidence of a B44 haplotype. The definition_note sentence
    on B43/B44 co-occurrence is withdrawn.

    (4) Four missing published B43 pheromone genes added, each by exact or near-exact
    match to the GenBank deposit: phb1.1 1,809,160-1,809,315 (+, 51 aa, 49 of 51 aa
    identical to AY172109 from strain B3, the rcb1 allele-3 group-1 allele); phb2.3
    1,813,942-1,814,103 (+, 53 aa, exact match to AY393916); phb2.1 1,816,393-1,816,578
    (-, 61 aa, exact to AY393914); phb3.3 1,827,276-1,827,702 (+, 85 aa, three exons
    1,827,276-1,827,338, 1,827,419-1,827,469, 1,827,559-1,827,702; exact to AY393919).
    The note''s coordinates differed from these by one base at an end (phb2.3, phb2.1,
    phb3.3) or, for phb1.1, started 17 bp inside the ORF and ended 1 bp past the stop;
    the ORF-derived values are used. The segment now ends at 1,827,702 (the note proposed
    1,827,703), 21,549 bp.

    (5) Receptors named by group: gene 0 rcb1 (KAG2006176.1; 527 of 552 aa, 95.5%
    to the deposited partial Rcb1 allele 3, AAO17255.1), gene 3 rcb2 (KAG2006185.1;
    466 of 480 aa, 97.1% to Rcb2 B43, AAQ96345.1), gene 5 rcb3 (KAG2006187.1; 414
    of 415 aa, 99.8% to Rcb3 B43, AAQ96346.1).

    (6) Gene 4 (KAG2006186.1, CC2G_002522, 397 aa) kept and renamed ste3_extra_unassigned:
    an STE3-type receptor on the same strand as rcb2, 206 bp from the NCBI rcb2 model
    and 336 bp from the published rcb2 gene, that is not described in the literature
    read; function unknown; 31-40% identical to rcb1/rcb2/rcb3; not group-assigned;
    not a split copy of rcb2.

    (7) Group structure corrected to one receptor and one to three pheromones per
    group (B43: 1 + 3 + 3); the 14 receptors and 29 pheromones of Riquelme et al.
    2005 are alleles across 13 haplotypes; Casselton and Olesnicky 1998 (PMID 9529887)
    added to the sources.

    Literature names of the existing pheromone genes: gene 2 (pheromone_B43, KAG2006182.1)
    = Phb2.2 B43 (exact to AY393915); gene 7 (fungal_mating_type_pheromone, KAG2006189.1)
    = Phb3.2 B43 (exact to AY393918; the NCBI model 1,826,186-1,826,859 is longer
    than the 1,826,254-1,826,463 gene and is kept as curated). Gene names are aliases
    of the family roster genes in db/Basidiomycota/order.yml, so the detection roster
    is unchanged. Genes 6 and 8-11 carry no protein_accession (no NCBI genome protein);
    proteins.faa holds the translation of the recorded coordinates.

    Follow-ups not applied: (8) a separate provisional record for the T48-F genome
    (GCA_982397435.1; a different B haplotype, partial models); (9) report the array
    span separately from the B-locus span in the array study. Also open: the sibling
    HD record 5346_a43-b43-okayama-7_HD_A43 states the same strain and differs_from_sequenced:
    false and should be checked against its own source genome.

    Exons added 2026-10-22 for rcb1, phb2_B44-like, rcb2, ste3_extra_unassigned, rcb3 and fungal_mating_type_pheromone: their start/end are the deposit gene span on JAAGWA010000010.1 (the gene and mRNA features, so they include UTRs) and the exons are the coding sequence only (the CDS of KAG2006176.1, KAG2006179.1, KAG2006185.1, KAG2006186.1, KAG2006187.1 and KAG2006189.1, ATG to stop codon), so they lie inside start/end. Coordinates and translation re-derived from the NCBI nucleotide and protein records (E-utilities efetch) on 2026-10-22.

    Notes added 2026-10-22 (curator ruling, J. Stajich; notes only: no coordinate,
    exon or protein change and no record_version bump). phb1.1, phb2.1, phb2.3 and
    phb3.1 (genes 8, 10, 9, 6) are curator-derived ORFs, not the depositor''s models:
    for each, and for phb3.3, proteins.faa holds the translation of the recorded span (or
    exons) from its first base, with the stop omitted. The depositor''s annotation of GCA_016772295.1
    overlaps each of the four with a different model: phb1.1, deposit KAG2006177.1
    (CC2G_002515), join(1809160..1809311,1809367..1809370), a 2-exon model whose 55-bp
    GT..AG intron splits the last sense codon (Ser 51) and whose 51 aa equal the record''s single-exon
    1809160-1809315 protein; phb2.3, deposit KAG2006181.1 (CC2G_002518), join(1813964..1814113,1814165..1814341),
    108 aa, read in a different frame from the record''s 53 aa; phb3.1, deposit KAG2006188.1 (CC2G_002524),
    join(1824970..1825186,1825239..1825393), 123 aa, a different frame (the misread
    replaced in change (2)); phb2.1, two alternative deposit CDS of CC2G_002520, KAG2006184.1 (101
    aa) complement(join(1816094..1816325,1816387..1816460)) and KAG2006183.1 (76 aa)
    complement(join(1816111..1816200,1816259..1816325,1816387..1816460)), both in
    a different frame from the record''s 61 aa. The record''s models are kept: they
    match the published pheromone deposits (change (4) above; phb1.1 49 of 51 aa).

    Verified 2026-10-22 by Claude Code (claude-opus-5-5, branch curation-corrections):
    NCBI efetch of JAAGWA010000010.1 (1,800,001-1,830,000 and its feature table) and
    of the five deposit proteins; Biopython translation of the recorded spans compared
    with proteins.faa and of the deposit CDS compared with the deposit proteins.

    '
