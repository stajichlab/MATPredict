    definition_note: 'Phanerochaete chrysosporium strain SB25 HD mating-type locus,
      from the locus deposit HQ188438.1 (10,066 bp; James TY, Lee M, van Diepen LTA
      2011, Eukaryot Cell 10:249-261). P. chrysosporium is bipolar with the HD genes
      as the single MAT locus; the pheromone receptor genes are unlinked and not mating-type
      determinants in this species. Gene order: MIP (5'' partial, codon_start 3, ADN97170.1)
      - "A2 mating-type protein" HD2 (ADN97171.1, minus) - "A1 mating-type protein"
      HD1 (ADN97172.1, plus) - hypothetical protein HP2 (partial, ADN97173.1, not
      curated: not a roster gene). The gene names A1/A2 in the deposit denote the
      HD1/HD2 genes, NOT alleles. The idiomorph label "A1" is a PLACEHOLDER (the allele
      of SB25 is not numbered); curator decision pending on a label convention. NCBI
      taxid 2822231 is the current name for this species (lineage resolved 2026-09-26).
      No Phanerochaete genome is in the BFD library, so this record cannot be scored
      against its own assembly.'
