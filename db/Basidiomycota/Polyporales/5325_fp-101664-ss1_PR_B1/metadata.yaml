  core:
    completeness: partial
    reference_orientation: not established from coordinate data alone
    definition_note: 'Trametes versicolor FP-101664 SS1 (Polyporales) B (pheromone/receptor) mating-type
      locus, GCA_000271585.1 JH711790.1:1556459-1581006: 3 pheromone receptors and 9 pheromone precursors
      in one cluster, from the JGI Trametes versicolor v1.0 annotation (Floudas et al. 2012), which names
      the receptors ''STE3-domain-containing protein'' / ''fungal pheromone STE3G-protein-coupled receptor''
      and the precursors ''pheromone'' / ''B mating type pheromone''. Pheromone precursors: ncbi_protein:EIW57106.1
      43 aa, strict CAAX CIIA; ncbi_protein:EIW57105.1 40 aa, C-terminus TIAW (no CAAX); ncbi_protein:EIW57108.1
      43 aa, strict CAAX CIIA; ncbi_protein:EIW57109.1 43 aa, strict CAAX CIIA; ncbi_protein:EIW57102.1
      63 aa, relaxed CAAX CTIA; ncbi_protein:EIW57113.1 46 aa, strict CAAX CVIA; ncbi_protein:EIW57112.1
      68 aa, strict CAAX CVIA; ncbi_protein:EIW57111.1 53 aa, strict CAAX CVIA; ncbi_protein:EIW57110.1
      70 aa, strict CAAX CVIA. 7/9 precursors end in the strict CAAX motif. PR/B loci routinely carry
      several receptor and pheromone copies (curator domain ruling 2026-09-16); receptors and precursors
      are recorded under the family''s generic names. Which receptor(s) define the B mating specificity
      is not established. Idiomorph ''B1'' is a placeholder label (curator convention 2026-09-26: count
      alleles when the source does not number them). TIER 2: genome-derived; no locus-specific GenBank
      deposit exists for this order''s B locus.'
