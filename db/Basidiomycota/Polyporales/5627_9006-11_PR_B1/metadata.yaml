    definition_note: 'Grifola frondosa 9006-11 (Polyporales) B (pheromone/receptor) mating-type locus,
      GCA_001683735.1 LUGG01000005.1:512153-547096: 5 pheromone receptors and 3 pheromone precursors in
      one cluster, from the GenBank annotation of GCA_001683735.1 for the five receptors (''Pheromone
      B alpha/beta receptor''); the three precursors are not annotated in the assembly. Pheromone precursors:
      unannotated 525554-525709(-) 51 aa, strict CAAX CVIA; unannotated 533656-533820(-) 54 aa, strict
      CAAX CIIG; unannotated 546974-547096(-) 40 aa, strict CAAX CIIA. 3/3 precursors end in the strict
      CAAX motif. Unannotated precursors (3) are recorded by coordinates only: 525554-525709(-) unannotated
      ORF, strict-CAAX scan; 533656-533820(-) unannotated ORF, strict-CAAX scan; 546974-547096(-) unannotated
      ORF, strict-CAAX scan; tblastn of G. frondosa WM1-25 ph1 (LC706365.1, BDI00750.1) 55% identity over
      40 aa, E=2e-11. PR/B loci routinely carry several receptor and pheromone copies (curator domain
      ruling 2026-09-16); receptors and precursors are recorded under the family''s generic names. Which
      receptor(s) define the B mating specificity is not established. Idiomorph ''B1'' is a placeholder
      label (curator convention 2026-09-26: count alleles when the source does not number them). TIER
      2: genome-derived; no locus-specific GenBank deposit exists for this order''s B locus.'
