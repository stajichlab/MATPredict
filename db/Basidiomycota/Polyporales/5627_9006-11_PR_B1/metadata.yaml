evidence:
  locus_existence:
    tier: 1
    experimental_method: 'genetic crosses (test crosses and three-round mating experiments) establishing
      a tetrapolar system, and genome localization of the B locus (six pheromone receptors and five precursors)
      on chromosome 11 of strain y59 (Zhang et al. 2023). This record''s genes come from a different strain''s
      assembly (9006-11). Positional evidence (results/2026-09-27_pheromone_positional, MATPredict receptor
      queue step 2): a pheromone-receptor gene with a pheromone-precursor ORF ending in the strict Basidiomycota
      CAAX motif C[VI][IV][AVMG] within 10 kb flagged every curated Agaricomycete mating receptor (Coprinopsis
      3/3, Schizophyllum 2/2) and 0/25 non-mating STE3 copies; random genomic windows 2.5%.'
    citations: &id001
    - pmid: '37888215'
      doi: 10.3390/jof9100959
  boundaries:
    tier: 2
    experimental_method: record segment spans the first to last curated gene on LUGG01000005.1; genome-derived
    citations: *id001
  idiomorph_assignment:
    tier: 2
    experimental_method: '''B1'' is a placeholder; the strain''s B allele is not reported'
    citations: *id001
