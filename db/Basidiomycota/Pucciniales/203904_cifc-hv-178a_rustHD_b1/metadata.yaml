evidence:
  locus_existence:
    tier: 2
    experimental_method: TIER 2 (genome-derived). No locus-specific deposit and no
      depositor annotation exist for this locus. The genes are ab initio Augustus
      models on the public assembly, identified as the b HD1/HD2 pair by their divergent
      arrangement, rust-like exon structure, Pfam homeodomain signatures and alignment
      to the four rust b records; identity to those records is low (25-32% over the
      aligned region) and the assignment is inferred.
    citations: &id001
    - doi: 10.1534/g3.116.032797
      pmid: '27913634'
  boundaries:
    tier: 2
    experimental_method: record segment spans the two Augustus models on CM142961.1
      (start codon of bW to stop codon of bE, stop codons included); intron positions
      are not supported by transcript evidence
    citations: *id001
  idiomorph_assignment:
    tier: 2
    experimental_method: allele label b1 is a pattern placeholder, not the allele
      name of any published rust b allele (the H. vastatrix b alleles are not catalogued);
      alleles are not callable by homology (pattern vocabulary)
    citations: *id001
