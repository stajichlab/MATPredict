    reference_orientation: bW<-|->bE
    definition_note: 'Hemileia vastatrix CIFC Hv 178a (coffee leaf rust), b mating-type
      HD pair on chromosome 3 (CM142961.1), divergently transcribed, 551 bp between
      the two start codons: bW (HD1-type, minus strand, 494 aa, one intron of 94 bp)
      and bE (HD2-type, plus strand, 511 aa, two introns of 67 and 68 bp). TIER 2:
      genome-derived. The public assembly GCA_054948715.1 (Tobias, Edwards and Batista,
      University of Sydney, PRJNA851215, unpublished pseudophased assembly) has no
      gene annotation at this locus and no locus-specific deposit exists. The two
      models were built here with Augustus (species model cryptococcus_neoformans_neoformans_JEC21,
      no extrinsic hints) on the region and are complete ORFs: ATG start, stop codon,
      GT..AG introns, no internal stop. bE/bW identity is INFERRED, not shown: the
      Puccinia and Melampsora references align only 16-17% of bE by tblastn (homeodomain
      only). It rests on (i) a divergent HD pair 551 bp apart (rust records: 538-640
      bp), (ii) the architecture of the rust records (bW two exons, bE three exons),
      (iii) the Pfam signature (bW Homeobox_KN, bE Homeodomain) and (iv) the local
      alignment score of each model to the four rust records (bW 157-171 against bW
      references and at most 102 against bE references; bE 151-241 against bE references
      and at most 110 against bW references), identity 25-32% over the aligned region.
      The H. vastatrix isolate Hv_R1 Cat CENPAT (GCA_030280995.1) carries the same
      pair with 99.2% (bW) and 100% (bE) identical proteins and the same 551 bp spacing,
      but with the two genes in the mirrored order (bE minus, bW plus); that isolate
      is not an independent allele and is not recorded.'
