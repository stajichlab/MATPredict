    definition_note: 'Puccinia graminis f. sp. tritici CRL 75-36-700-3, b mating-type
      HD gene pair on supercontig DS178274.1, divergently transcribed, 545 bp apart:
      bE1-HD2 = PGTG_05143 (EFP79918.2, 373 aa, minus strand) and bW1-HD1 = PGTG_05144
      (EFP79919.2, 579 aa, plus strand), per Cuomo et al. 2017 Table S11. The paper
      gives bW1 as 618 aa from an RNA-seq-corrected model; the GenBank model is 579
      aa (logged in ANNOTATION_ERRORS_FIXED_REPORT.md). The second Pgt allele (bE2/bW2)
      was assembled only from RNA-seq and has no genome model, so it is not curated.
      IDIOMORPH LABEL: ''b1'' is the paper''s allele number and a pattern placeholder;
      allele identity is not called. TIER 2: genome-derived, no locus-specific deposit
      exists.'
