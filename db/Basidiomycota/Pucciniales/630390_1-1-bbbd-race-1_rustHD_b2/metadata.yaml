    definition_note: 'Puccinia triticina 1-1 BBBD Race 1, b mating-type HD pair on
      ADAS02000068.1 (Pt v2 supercontig 2.68), divergently transcribed, 620 bp apart:
      bW2-HD1 = PTTG_27730 (OAV92158.1, 621 aa, one intron) and bE2-HD2 = PTTG_03697
      (OAV92159.1, 374 aa, two introns), per Cuomo et al. 2017 Table S11 and Figure
      S9. The PtbW2/PtbE2 alleles were cloned from cDNA and tested in the Ustilago
      hordei b-deletion mating assay (File S1). The Pt b1 allele pair has only partial
      genome models (PTTG_10928 53 aa, PTTG_09683 137 aa) and is not curated. TIER
      2: genome-derived.'
