    definition_note: 'Melampsora larici-populina 98AG31, HD gene pair on GL883124.1,
      divergently transcribed, 538 bp apart: MELLADRAFT_90168 (EGG03504.1, 453 aa,
      TALE/KN homeobox) and MELLADRAFT_124184 (EGG03439.1, 392 aa, typical homeodomain,
      product "putative b mating type locus"). NAMING BY ORTHOLOGY, NOT BY THE REFSEQ
      LABEL: RefSeq names the EGG03504.1 transcript "MlpbE1", but blastp places EGG03504.1
      with Pgt bW1 PGTG_05144 (30% over 248 aa, E=2e-31) and EGG03439.1 with Pgt bE1
      PGTG_05143 (36% over 218 aa, E=9e-26). Curated as bW and bE respectively, the
      Cuomo et al. 2017 naming (logged in ANNOTATION_ERRORS_FIXED_REPORT.md). Cuomo
      et al. 2017 Figure 5 includes a single HD homolog pair from the poplar rust.
      TIER 2: genome-derived.'
