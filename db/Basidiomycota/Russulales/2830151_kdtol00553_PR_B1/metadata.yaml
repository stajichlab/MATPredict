evidence:
  locus_existence:
    tier: 2
    experimental_method: 'Source assembly GCA_984573805.1 (gfRusNobi1.hap1.1; BioProject PRJEB113492;
      BioSample SAMEA110757389; specimen KDTOL00553; Royal Botanic Gardens Kew / Earlham Institute); no
      publication describes this genome or locus. genome-derived receptor cluster (three tandem STE3 receptors,
      B-locus-type by homology to the curated Heterobasidion B-locus receptors) with a strict-CAAX precursor
      ORF. Positional evidence (results/2026-09-27_pheromone_positional, MATPredict receptor queue step
      2): a pheromone-receptor gene with a pheromone-precursor ORF ending in the strict Basidiomycota
      CAAX motif C[VI][IV][AVMG] within 10 kb flagged every curated Agaricomycete mating receptor (Coprinopsis
      3/3, Schizophyllum 2/2) and 0/25 non-mating STE3 copies; random genomic windows 2.5%.'
