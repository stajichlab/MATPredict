    definition_note: 'Russula nobilis gfRusNobi1 (specimen KDTOL00553; Russulales, Russulaceae) B (pheromone/receptor)
      mating-type locus candidate, GCA_984573805.1 OZ475200.1:1514818-1529433: three tandem pheromone
      receptors (STE3, Pfam PF02076 at gathering threshold; 490, 414 and 455 aa) and one pheromone-precursor
      ORF. The receptors'' best blastp matches among curated receptors are the Heterobasidion irregulare
      TC 32-1 B-locus receptors (38.5-53.5% identity, E <= 1.7e-100). The public assembly carries no gene
      annotation: receptor exons are the BFD funannotate models FD20D505_007127/007128/007129, recorded
      by coordinates. Precursor: unannotated ORF 1529356-1529433(-), 25 aa (MVGKPTSRKRKRYEIRNLGMCCVVG),
      strict CAAX CVVG, 7.1 kb from the third receptor; no homology to curated Basidiomycota pheromones
      (tblastn E >= 0.1 genome-wide), so it rests on the motif and position only and is SHORT for a basidiomycete
      precursor. PR/B loci routinely carry several receptor and pheromone copies (curator domain ruling
      2026-09-16). Which receptor(s) define B specificity is not established. Idiomorph ''B1'' is a placeholder
      (curator convention 2026-09-26). TIER 2: genome-derived; no Russulaceae mating-type deposit exists.'
