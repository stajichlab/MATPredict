    reference_orientation: not established from coordinate data alone
    definition_note: 'Heterobasidion irregulare TC 32-1 (Russulales) B (pheromone/receptor) mating-type
      locus, GCA_000320585.2 KI925460.1:825882-849398: 5 pheromone receptors and 3 pheromone precursors
      in one cluster, from the JGI Heterobasidion irregulare v2.0 annotation (Olson et al. 2012), which
      names the receptors ''putative pheromone receptor'' / ''putative B mating type protein'' and the
      precursors ''B mating type pheromone''. Pheromone precursors: ncbi_protein:ETW79705.1 30 aa, CAAX-like
      CILF; ncbi_protein:ETW79710.1 49 aa, relaxed CAAX CTIA; ncbi_protein:ETW79712.1 43 aa, strict CAAX
      CVVA. 1/3 precursors end in the strict CAAX motif. PR/B loci routinely carry several receptor and
      pheromone copies (curator domain ruling 2026-09-16); receptors and precursors are recorded under
      the family''s generic names. Which receptor(s) define the B mating specificity is not established.
      Idiomorph ''B1'' is a placeholder label (curator convention 2026-09-26: count alleles when the source
      does not number them). TIER 2: genome-derived; no locus-specific GenBank deposit exists for this
      order''s B locus.'
