evidence:
  locus_existence:
    tier: 2
    experimental_method: 'genome annotation of a named B-locus cluster. Positional evidence (results/2026-09-27_pheromone_positional,
      MATPredict receptor queue step 2): a pheromone-receptor gene with a pheromone-precursor ORF ending
      in the strict Basidiomycota CAAX motif C[VI][IV][AVMG] within 10 kb flagged every curated Agaricomycete
      mating receptor (Coprinopsis 3/3, Schizophyllum 2/2) and 0/25 non-mating STE3 copies; random genomic
      windows 2.5%.'
    citations: &id001
    - pmid: '22463738'
      doi: 10.1111/j.1469-8137.2012.04128.x
  boundaries:
