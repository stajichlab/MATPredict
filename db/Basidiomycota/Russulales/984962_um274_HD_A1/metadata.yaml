    definition_note: 'Heterobasidion irregulare UM274 HD (A) mating-type locus, from
      the locus deposit KF280353.1 (11,009 bp; van Diepen et al. 2013, Mol Biol Evol
      30:2286). Gene order on the deposit: MIP (5'' partial, AGS09183.1) - a1 HD1
      (AGS09184.1) - a2 HD2 (AGS09185.1) - b1 HD1 (AGS09186.1) - b2 HD2 (AGS09187.1)
      - beta-flanking protein (partial, AGS09188.1). Two divergently transcribed HD1/HD2
      pairs (a and b subloci), as in Coprinopsis. The beta-fg fragment is 28 aa and
      is NOT curated: too short to be a useful search query. MIP is curated as a flanking
      gene: AGS09183.1 matches the full-length A. bisporus MIP ortholog XP_006454076.1
      at 71.5% over its 221 aa (blastp, 2026-09-26). IDIOMORPH LABEL: the source does
      not number this allele. "A1" follows the convention already used for Agaricus
      bisporus in this database (derived from the "a1" HD1 gene name) and is a PLACEHOLDER,
      not a published allele designation. Curator decision pending on a label convention
      for unnamed multiallelic HD alleles.'
