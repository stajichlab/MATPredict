    definition_note: 'R. toruloides NBRC 0880 (manuscript clade B), P/R MAT locus allele A2: STE3a2 (349
      aa) is the group''s funannotate/miniprot model (NBRC0880_MP00002); STE20 (770 aa) is the group''s
      funannotate/miniprot model (NBRC0880_MP00005). Assignment A2 = the manuscript''s P/R allele for
      this strain, and its STE3 groups with the curated Sporidiobolales STE3a2 receptors (Coelho et al.
      2011). Pheromone precursor (RHA) genes in the locus are not curated: they are too short for the
      current search (queued with the receptor work).'
