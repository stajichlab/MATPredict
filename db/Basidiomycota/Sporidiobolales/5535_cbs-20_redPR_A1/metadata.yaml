    reference_orientation: STE3a1->STE20
    definition_note: 'R. glutinis CBS 20 (manuscript clade C), P/R MAT locus allele A1: STE3a1 (383 aa)
      is the group''s funannotate/miniprot model (RGLUT_MP00001); STE20 (785 aa, no start Met: 5-prime
      partial) is a miniprot 0.18 model built here (Rhodotorula STE20 panel (ctsai085 MAT_ref/PR/ste20.faa))
      because the group''s model did not translate cleanly on the public contig. Assignment A1 = the manuscript''s
      P/R allele for this strain, and its STE3 groups with the curated Sporidiobolales STE3a1 receptors
      (Coelho et al. 2011). Pheromone precursor (RHA) genes in the locus are not curated: they are too
      short for the current search (queued with the receptor work).'
