    definition_note: 'R. aff. mucilaginosa JY1105 (manuscript clade A), HD MAT locus, divergently transcribed
      HD1/HD2 pair; allele B8 is the manuscript''s HD allele name for this strain. HD1 (440 aa) is the
      group''s funannotate/miniprot model (RMUCI_003567); HD2 (408 aa, no start Met: 5-prime partial)
      is a miniprot 0.18 model built here (R. mucilaginosa HD2 KAG0665576) because the group''s model
      did not translate cleanly on the public contig. The HD locus sits on a different contig from the
      P/R locus, as the manuscript reports for the genus.'
