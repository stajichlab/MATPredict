    definition_note: 'R. aff. mucilaginosa JY1105 (manuscript clade A), P/R MAT locus allele A1: STE20
      (789 aa) is the group''s funannotate/miniprot model (RMUCI_MP00004); STE3a1 (384 aa) is the group''s
      funannotate/miniprot model (RMUCI_MP00007). Assignment A1 = the manuscript''s P/R allele for this
      strain, and its STE3 groups with the curated Sporidiobolales STE3a1 receptors (Coelho et al. 2011).
      Pheromone precursor (RHA) genes in the locus are not curated: they are too short for the current
      search (queued with the receptor work).'
