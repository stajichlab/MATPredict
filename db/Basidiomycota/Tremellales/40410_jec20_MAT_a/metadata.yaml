    definition_note: 'Bipolar, fused-MAT-type locus described by Lengeler et al. 2002
      (PMID 12455690, DOI 10.1128/EC.1.5.704-718.2002) and deposited as GenBank AF542530.2
      (148,067 bp, complete MATa locus, strain JEC20). As with the paired MATalpha
      record (40410_jec21_MAT_alpha), only the core identity-determining genes (SXI2,
      the three MFa pheromone precursors, and STE3) are represented with verified
      coordinates; the additional MAT-linked genes reported in the wider literature
      (MAPK cascade, MYO2a, RPL22a) are not included here. The GenBank feature table''s
      /gene qualifiers for this record use "SXI2a"-style naming inconsistently (the
      CDS itself is tagged "SXI2a" while the matching pheromone/receptor genes are
      tagged "MFa1/2/3"/"STE3" without an "a" suffix) -- names below follow the GenBank
      record''s own qualifiers exactly, not a normalized convention.

      '
