  core:
    completeness: complete
    reference_orientation: bW->bE
    definition_note: 'Published MAT b locus, 3,921 bp, complete bW/bE homeodomain
      gene pair. Adds Ustilago hordei -- a DIFFERENT genus than Mycosarcoma maydis,
      the only prior bLocus reference, though same family Ustilaginaceae -- and the
      classic Bakkeren & Kronstad bipolar-smut system. bE/bW gene names match this
      family''s existing roster exactly.


      IDIOMORPH LABEL: ''b1'' is a schema-conforming PLACEHOLDER (this locus''s vocabulary_type
      is pattern/^b[0-9]+$, and idiomorph.assign_idiomorph always returns undetermined
      for pattern families regardless of this label -- it is never used to score or
      call a detection). The deposit itself (OP433771) states NO explicit allele/mating-type
      designation.


      Steins L, Guerreiro MA, Duhamel M, Liu F, Wang QM, Boekhout T, Begerow D (2023)
      Comparative genomics of smut fungi suggest the ability of meiosis and mating
      in asexual species of the genus Pseudozyma (Ustilaginales). BMC Genomics 24(1):321.'
