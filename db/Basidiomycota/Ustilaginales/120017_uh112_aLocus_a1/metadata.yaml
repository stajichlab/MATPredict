  core:
    completeness: complete
    reference_orientation: pra1
    definition_note: 'Published MAT a locus, 1,581 bp, complete pheromone receptor
      (359 aa). The classic bipolar-vs-tetrapolar smut linkage paper.


      NAMING: the deposit''s own /gene qualifier is Uhpra1, NOT pra1. Curated under
      pra1, this family''s canonical name for the role, rather than as a separate
      roster entry (the pattern used for bar3/bbr2 in Balpha/Bbeta) -- REJECTED for
      aLocus 2026-09-20: this family''s pattern vocabulary_type never narrows its
      core roster, so a second always-required core_MAT gene name for the same functional
      slot would make the already-curated Mycosarcoma maydis record (mfa1+pra1 only)
      permanently fail assign_tier''s core_found check. Confirmed pra1/Uhpra1 are
      the same gene by sequence: AAA99766.1 (pra1) vs AAA19965.1 (Uhpra1) are 357/359
      aa, 66.0% identity over 97.2% coverage of the shorter -- the same standard used
      to establish algA==algL in db/Mucoromycota/order.yml.


      IDIOMORPH LABEL: ''a1'' is a schema-conforming PLACEHOLDER (vocabulary_type
      pattern/^a[0-9]+$; assign_idiomorph always returns undetermined for pattern
      families regardless of this label). The deposit''s OWN source feature states
      /mating_type="MAT-1" -- that real designation does not match this locus''s ^a[0-9]+$
      pattern and could not be used directly; recorded here so it is not lost.


      Bakkeren G, Kronstad JW (1994) Linkage of mating-type loci distinguishes bipolar
      from tetrapolar mating in basidiomycetous smut fungi. Proc Natl Acad Sci USA
      91(15):7085-7089.'
