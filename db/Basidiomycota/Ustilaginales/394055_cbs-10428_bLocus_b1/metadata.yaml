    definition_note: 'Published MAT b locus, 3,662 bp, 2 complete gene(s). Steins
      et al. 2023 (BMC Genomics 24:321) systematically deposited b-locus (bW/bE) and,
      for a subset, a-locus (STE3 receptor + numbered mating-factor precursor genes)
      sequences across many Ustilaginaceae genera -- "further out in the subphylum"
      than the genus Ustilago this session already curated from the same paper.


      Steins L, Guerreiro MA, Duhamel M, Liu F, Wang QM, Boekhout T, Begerow D (2023)
      Comparative genomics of smut fungi suggest the ability of meiosis and mating
      in asexual species of the genus Pseudozyma (Ustilaginales). BMC Genomics 24(1):321.'
