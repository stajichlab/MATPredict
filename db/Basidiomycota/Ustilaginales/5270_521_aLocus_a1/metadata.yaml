    reference_orientation: mfa1->pra1->rba1
    definition_note: 'REVISED (2026-09-16): this record originally used the modern
      whole-genome RefSeq assembly (NC_026482.1), which only annotates two genes at
      this position ("Pra1"/"Rba1") and is missing mfa1 entirely -- confirmed by direct
      NCBI Gene search (zero mfa1 records for this species) and by inspecting the
      assembly''s own feature table in this exact region. mfa1''s real product is
      only 41 amino acids; short pheromone-precursor ORFs like this are a known blind
      spot for automated whole-genome gene-calling pipelines. The correct, complete
      source is the original targeted locus deposit, GenBank U37795 (6343 bp, submitted
      by M. Urban, Institut fur Genetik und Mikrobiologie der Universitat Munchen,
      1995), which properly annotates all three a1-locus genes: mfa1 (lipopeptide
      mating factor precursor), pra1 (7-transmembrane pheromone receptor), and rba1
      (a1-mating-type regulatory protein). All three genes and their coordinates below
      are read directly from U37795''s own feature table via NCBI efetch.

      A user independently spotted this gap by pointing directly at U37795 and asking
      whether rba1 was present in the locus this curator had used -- it was not (the
      modern-assembly-based draft had silently relabeled the "Rba1" gene as "mfa"
      without verifying the identity, which was incorrect: Rba1 is a real, distinct
      third gene, not the pheromone precursor). This correction replaces that mislabeled
      draft entirely.

      rba1''s exact functional role is less certain than mfa1/pra1''s: Urban, Kahmann
      & Bolker 1996 describe "two additional genes" in the a2 allele context and speculate
      they may affect mitochondrial inheritance, rather than being direct mating-identity
      determinants -- rba1 is included here with role flanking_variable (not core_MAT)
      for this reason, distinct from mfa1/pra1, which the primary 1992 paper directly
      demonstrates are "necessary and sufficient" for a-locus mating identity via
      mutant complementation. The modern genome''s "a2-pheromone receptor Pra1" product
      description (despite this being an a1 strain) is very likely a legacy/copy-paste
      annotation artifact in RefSeq''s pipeline, not evidence of actual a2 content
      at this position -- U37795''s own gene naming (mfa1/pra1/rba1, all "1"-suffixed,
      consistent with the a1 allele) and this strain''s documented a1 genotype both
      support that reading, but this note records the discrepancy rather than silently
      resolving it.

      COORDINATE CORRECTION (2026-09-18): the mfa1 CDS coordinates were originally
      recorded as 1319..1856, which is actually the GENE/mRNA span (including the
      intron and untranslated flanks: mRNA is complement(join(1319..1542,1632..1856))).
      The real CDS on U37795.1, independently re-fetched via NCBI efetch, is the
      single-exon complement(1657..1779) (123 bp, 41 aa, protein AAA99765.1,
      translation "MLSIFAQTTQTSASEPQQSPTAPQGRDNGSPIGYSSCVVA" -- matching the 41-aa
      product size already stated above). Coordinates below are corrected to
      1657..1779, which independently re-derives the deposited protein exactly.

      A second instance of the same class of error was found and corrected in the
      same pass: rba1 was recorded as 5505..6272 (also the gene/mRNA span; real mRNA
      is complement(join(5505..5671,5862..5901,5995..6272))), whereas the actual CDS
      on U37795.1 is complement(join(5627..5671,5862..5901,5995..6269)) (protein
      AAA99767.1). Corrected to the CDS outer bounds, 5627..6269. rba1 is multi-exon
      (3 exons/2 introns), which this schema does not model as a span, so an
      independent re-translation of the corrected span does not exactly reproduce
      AAA99767.1 residue-for-residue; it nonetheless already re-derives a 100%-identity
      partial match (see sequence_match.notes) because the intron introduces a
      frameshift/stop before the point of first mismatch, not a mismatch itself.
      pra1''s previously recorded span (3604..4914) was independently re-checked
      against the CDS outer bounds of complement(join(3604..3721,3807..4242,
      4316..4633,4713..4914)) and found to already match exactly; no change was
      needed there.

      '
