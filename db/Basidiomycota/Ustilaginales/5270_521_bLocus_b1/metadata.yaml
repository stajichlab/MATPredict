    reference_orientation: bE1->bW1
    definition_note: 'The b locus (multiallelic, divergently transcribed bE/bW homeodomain
      pair) is genetically unlinked to the a locus in this species (separate record
      5270_521_a_locus_a1). Reference strain 521 genotype is documented as a1 b1 (Bolker
      et al. 1992; Gillissen et al. 1992, which established the bE/bW two-gene model).
      RefSeq''s own annotation confirms "b mating type locus, bE1 allele" and "b mating
      type locus, bW1 allele" directly by product description at this position, matching
      the b1 allele expected for this strain -- no naming ambiguity here (contrast
      with the a_locus record''s Pra1/Rba1 naming note). Both CDS features are annotated
      with partial/incomplete boundaries in GenBank (join() locations with ">"-prefixed
      end coordinates, i.e. extending beyond the fetched window on one side) -- completeness
      is "partial" for this reason; the coordinates given here reflect only the portion
      captured in the fetched region, not necessarily the gene''s full extent.

      '
