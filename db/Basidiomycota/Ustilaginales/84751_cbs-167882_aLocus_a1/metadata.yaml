    reference_orientation: pra1
    definition_note: 'Published MAT a locus, 1,281 bp, 1 complete gene(s). Steins
      et al. 2023 (BMC Genomics 24:321) systematically deposited b-locus (bW/bE) and,
      for a subset, a-locus (STE3 receptor + numbered mating-factor precursor genes)
      sequences across many Ustilaginaceae genera -- "further out in the subphylum"
      than the genus Ustilago this session already curated from the same paper.



      NAMING: this deposit''s own /gene qualifier(s) (STE3->pra1) do not match aLocus''s
      canonical roster names. Folded to the canonical name -- see this file''s module
      docstring for the sequence verification (STE3/pra1) or the depositing authors''
      own "mating factor" classification (numbered a-alleles) this rests on. aLocus
      is pattern-typed and never narrows its core roster, so adding these as separate
      always-required entries would break the already-curated Mycosarcoma maydis record.


      Steins L, Guerreiro MA, Duhamel M, Liu F, Wang QM, Boekhout T, Begerow D (2023)
      Comparative genomics of smut fungi suggest the ability of meiosis and mating
      in asexual species of the genus Pseudozyma (Ustilaginales). BMC Genomics 24(1):321.'
