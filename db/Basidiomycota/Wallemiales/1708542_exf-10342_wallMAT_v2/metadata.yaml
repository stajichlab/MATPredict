    experimental_method: PUTATIVE MAT LOCUS, TIER 2 (genome-derived). No MAT gene
      of Wallemia has a locus-specific GenBank deposit, and no mating or meiosis has
      been observed in the genus. The two locus versions are described as putative
      by Sun et al. 2019 and Gostincar et al. 2019 from population genomes; this record
      is the version without SXI1.
  boundaries:
    tier: 2
    citations: *id001
    experimental_method: PUTATIVE MAT LOCUS, TIER 2 (genome-derived). No MAT gene
      of Wallemia has a locus-specific GenBank deposit, and no mating or meiosis has
      been observed in the genus. Record segment spans STE3v2 to BAP31 on JBHFOR010000004.1;
      three genes from the assembly's own CDS features.
  idiomorph_assignment:
    tier: 2
    citations: *id001
    experimental_method: 'PUTATIVE MAT LOCUS, TIER 2 (genome-derived). No MAT gene
      of Wallemia has a locus-specific GenBank deposit, and no mating or meiosis has
      been observed in the genus. ''v2'' is a placeholder for the second locus version;
      which version is which mating type is not known. mating_type.system ''heterothallic''
      is itself putative: it rests on two locus versions each carried by part of the
      sequenced strains.'
