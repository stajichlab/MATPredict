    definition_note: 'PUTATIVE. Wallemia canadensis EXF-10342 (GCA_056320075.1, SPAdes,
      159 contigs, contig N50 186 kb) putative mating-type locus, the second of the
      two versions described by Sun et al. 2019 (W. mellicola) and Gostincar et al.
      2019 (W. ichthyophaga), on JBHFOR010000004.1. Chosen as the best-assembled genome
      of this version among the 18 BFD Wallemiales genomes that carry it, and the
      only one whose assembly annotates the locus receptor. STE3v2 = KAN3001147.1
      (ACAZ38_004777, ''Pheromone B beta 1 receptor''), CAF1 = KAN3001148.1 (ACAZ38_004780,
      ''CCR4-NOT transcription complex subunit 7''; 99.6% to the v1 CAF1), BAP31 =
      KAN3001158.1 (ACAZ38_004824, ''hypothetical protein''; 98.4% to the v1 BAP31).
      STE3v2 is 34.8% to the v1 receptor EIM23479.1 over 155 aa, and 80% (tblastn,
      136 aa) to the receptor of this version in W. mellicola, 65% in W. ichthyophaga.
      The annotated STE3v2 (192 aa) is probably 3''-truncated: tblastn and exonerate
      of the v1 STE3 (366 aa) continue about 260 bp past its annotated stop (logged
      B5.5); the record keeps the annotated protein. HMG: recorded present: false.
      Only a 43-aa HMG-box fragment is found (exonerate of the v1 HMG, 60.5% identity,
      331,565-331,693, unannotated), consistent with Gostincar et al. 2019 who report
      a truncated HMG gene in the inverted version; no intact ORF is asserted. SXI1:
      recorded present: false; Gostincar et al. 2019 report it absent from the inverted
      version and no homeodomain hit lies in the locus. The pheromone-processing gene
      STE14 (KAN3001145.1) and an NDUFA6-like gene (KAN3001146.1) lie next to STE3v2,
      as in v1, and are not curated. BAP31 sits on the far side of CAF1 here (about
      20 kb), the reverse of v1, consistent with the published inversion. Idiomorph
      ''v2'' is a placeholder for this version; which version is which mating type
      is not known. TIER 2: genome-derived.'
