    reference_orientation: BAP31->|STE3<-|CAF1<-|HMG<-|SXI1->
    definition_note: 'PUTATIVE. Wallemia mellicola CBS 633.66 (published as W. sebi)
      putative mating-type locus on WALSEscaffold_2 (JH668224.1), 17,113-42,263. Padamsee
      et al. 2012 found mating-type gene homologs in this genome; Sun et al. 2019
      (W. mellicola, 25 strains) and Gostincar et al. 2019 (W. ichthyophaga, 21 strains)
      describe a putative MAT locus in two versions (one inverted), each in about
      half the strains, with BAP31, a homeodomain gene SXI1, an HMG-box gene, the
      pheromone receptor STE3 and CAF1. In CBS 633.66: BAP31 = EIM23475.1 (WALSEDRAFT_59214),
      STE3 = EIM23479.1 (WALSEDRAFT_59221, ''STE3-domain-containing protein'', Pfam
      STE3 E=1.4e-87), CAF1 = EIM23480.1 (WALSEDRAFT_14687), HMG = EIM23483.1 (WALSEDRAFT_62153,
      ''hypothetical protein'', Pfam HMG_box E=1.9e-6). Gene assignment in this genome
      is by this project: blastp orthology to the W. ichthyophaga EXF-994 locus genes
      on NW_008806275.1 (BAP31 87.5%, CAF1 96.4%, HMG 51.2%). SXI1 is NOT annotated
      in the CBS 633.66 assembly: its exons are a miniprot model of W. ichthyophaga
      XP_009266116.1 (the homeodomain gene on the same contig as that locus) on JH668224.1
      (48.7% identity over all 263 aa, GT-AG intron), extended in frame to the first
      stop codon (278 aa). Idiomorph ''v1'' is a placeholder for the version carried
      by this reference strain. The pheromone-processing gene STE14 (EIM23477.1) and
      NDUFA6 (EIM23478.1) lie between BAP31 and STE3 and are not curated. TIER 2:
      genome-derived.'
