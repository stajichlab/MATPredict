evidence:
  locus_existence:
    tier: 2
    citations: &id001
    - doi: 10.1016/j.fgb.2012.01.007
      pmid: '22326418'
    - doi: 10.3390/genes10060427
      pmid: '31167502'
    - doi: 10.3389/fmicb.2019.02019
      pmid: '31551960'
    experimental_method: PUTATIVE MAT LOCUS, TIER 2 (genome-derived). No MAT gene
      of Wallemia has a locus-specific GenBank deposit, and no mating or meiosis has
      been observed in the genus. Locus described as putative by Padamsee et al. 2012
      (CBS 633.66 genome) and, from population genomes, by Sun et al. 2019 and Gostincar
      et al. 2019; STE3 was found by manual search in the latter.
  boundaries:
    tier: 2
    citations: *id001
    experimental_method: PUTATIVE MAT LOCUS, TIER 2 (genome-derived). No MAT gene
      of Wallemia has a locus-specific GenBank deposit, and no mating or meiosis has
      been observed in the genus. Record segment spans BAP31 to SXI1 on JH668224.1.
      Four genes from the assembly's own CDS features; SXI1 from this project's miniprot
      model (no annotated protein).
  idiomorph_assignment:
    tier: 2
    citations: *id001
    experimental_method: 'PUTATIVE MAT LOCUS, TIER 2 (genome-derived). No MAT gene
      of Wallemia has a locus-specific GenBank deposit, and no mating or meiosis has
      been observed in the genus. ''v1'' is a placeholder for the locus version of
      the reference strain; which version is which mating type is not known. mating_type.system
      ''heterothallic'' is itself putative: it rests on two locus versions each carried
      by about half the sequenced strains.'
