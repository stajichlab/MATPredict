phylum: Basidiomycota
# Curator's ruling 2026-09-26: no `homothallic_candidate` label in this phylum.
# "The basidiomycetes agaricomycotina aren't really homothallic in the same
# way so it doesn't really apply to try give that label." The anchor pilot
# (docs/notes/2026-09-26_basidiomycota-anchors.md, branch basidio-anchors)
# measured the rule firing on HD1+HD2 and bE+bW partner pairs in 8 of 30
# genomes. A locus entry may set `homothallic_screen: true` to override.
homothallic_screen: false
loci:
  - locus_name: "HD"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^A[0-9]+$"
    # Widened 2026-09-20 from the two curated species (Agaricus bisporus var.
    # bisporus 192523; Coprinopsis cinerea 5346) to their FAMILIES, one rank
    # broader, per the curator's ruling -- Basidiomycota order testing found
    # 65/65 detection entries falling to the exhaustive phylum_fallback
    # rule because no curated family's scope covered a close relative
    # (--taxid vs --phylum on C. cinerea itself: 14 entries/47s vs
    # 65 entries/11m13s). HD's own roster spans two DIFFERENT families within
    # Agaricales (Psathyrellaceae via Coprinopsis, Agaricaceae via Agaricus),
    # so both are listed.
    # Scope widened to ORDER rank 2026-09-21, curator's ruling ("order is
    # reasonable for most"), replacing the family-rank values set 2026-09-20.
    # Rank verified against NCBI Taxonomy, not assumed.
    taxonomic_scope: [5338]  # Agaricales (order)
    # Curator's ruling 2026-09-21: 25 kb is a reasonable upper bound for
    # Agaricales. Measured largest intra-locus gene gap in the two curated HD
    # records: 352 bp (n=2), so 25 kb is generous and costs nothing here.
    max_cluster_gap_bp: 25000
    genes:
      - {name: HD1, role: core_MAT, gene_class: HD1}
      - {name: HD2, role: core_MAT, gene_class: HD2}
  - locus_name: "PR"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^B[0-9]+$"
    # Widened 2026-09-20 from the single curated species (Coprinopsis cinerea
    # 5346) to its family, one rank broader -- see HD's scope comment above
    # for the measured phylum_fallback cost this addresses.
    # Scope widened to ORDER rank 2026-09-21, curator's ruling ("order is
    # reasonable for most"), replacing the family-rank values set 2026-09-20.
    # Rank verified against NCBI Taxonomy, not assumed.
    taxonomic_scope: [5338]  # Agaricales (order)
    # 25 kb per the curator's Agaricales upper bound. Measured largest
    # intra-locus gene gap in the one curated PR record: 3,186 bp (n=1).
    max_cluster_gap_bp: 25000
    # Gene names must match the names used by this family's curated records
    # exactly -- detect/search.py:_attribute drops any hit whose curated gene
    # name is not declared here. The specific names below are the real names in
    # db/Basidiomycota/Agaricales/5346_a43-b43-okayama-7_PR_B43. A bare
    # `pheromone` entry was removed: no curated protein anywhere in db/ carries
    # that name, so it was permanently unsatisfiable and permanently blocked
    # core_found (and therefore the high tier) for this family.
    # gene_class: pheromone_receptor/pheromone_precursor per this locus's own record
    # (db/Basidiomycota/Agaricales/5346_a43-b43-okayama-7_PR_B43/metadata.yaml), whose
    # definition_note documents pheromone_B43/pheromone_B44/fungal_mating_type_pheromone
    # as the pheromone (precursor) genes and pheromone_receptor as the 7TM receptor.
    genes:
      - {name: pheromone_receptor, role: core_MAT, gene_class: pheromone_receptor}
      - {name: pheromone_B43, role: core_MAT, gene_class: pheromone_precursor}
      - {name: pheromone_B44, role: core_MAT, gene_class: pheromone_precursor}
      - {name: fungal_mating_type_pheromone, role: core_MAT, gene_class: pheromone_precursor}
  - locus_name: "MAT"
    vocabulary_type: "enum"
    idiomorph_values: ["alpha", "a"]
    # Widened 2026-09-20 from the single curated species (Cryptococcus
    # deneoformans 40410) to its family, one rank broader -- see HD's scope
    # comment (db/Basidiomycota/order.yml, HD locus) for the measured
    # phylum_fallback cost this addresses. Cryptococcaceae has 4 genera
    # (Cryptococcus plus 3 others, verified via NCBI esearch 2026-09-20), not
    # 1 -- this is a real widening, not a same-genus relabel.
    # Scope widened to ORDER rank 2026-09-21, curator's ruling ("order is
    # reasonable for most"), replacing the family-rank values set 2026-09-20.
    # Rank verified against NCBI Taxonomy, not assumed.
    taxonomic_scope: [5234]  # Tremellales (order)
    # 120 kb, curator's ruling 2026-09-21. This locus is the outlier in the
    # whole database and the value is NOT padding: measured directly from the
    # two curated Cryptococcus deneoformans records, the locus spans 103,914 bp
    # (AF542531.2, alpha) and 96,538 bp (AF542530.2, a), with internal gene
    # gaps of 58,469 bp and 74,899 bp respectively -- SXI1 sits at 10.7 kb and
    # STE3 at 70.5 kb on AF542531.2. Under the previous 25 kb default this
    # locus could not be clustered at all, which is the most likely cause of
    # the Tremellales failure recorded in
    # docs/notes/2026-09-20_basidiomycota-order-testing.md (genes recovered at
    # 100% identity, locus call low-confidence and idiomorph undetermined).
    # NOT YET RE-RUN with this value -- that measurement is still owed.
    max_cluster_gap_bp: 120000
    # SXI1/SXI2 gene_class assigned 2026-09-19 by the project's curator, J. Stajich, who
    # stated that SXI1 and SXI2 are homeodomain proteins, citing doi:10.1128/mbio.00059-26
    # -- a citation supplied by the curator and NOT retrieved or verified here (the
    # publisher returned HTTP 403). The curator did not specify the HD1-vs-HD2 split; the
    # specific mapping SXI1 = HD1, SXI2 = HD2 was proposed from general literature
    # knowledge and accepted by the curator. It is NOT stated in this DB's own curated
    # record (db/Basidiomycota/Tremellales/40410_jec21_MAT_alpha/metadata.yaml), and
    # Lengeler et al. 2002 was NOT consulted when the call was made -- it remains the
    # right place to confirm the split. MFalpha1-3/MFa1-3 (pheromone precursors) and
    # STE3 (the receptor) are classified per that same record's definition_note.
    genes:
      # Recurated 2026-09-21 from the full Lengeler et al. 2002 deposits
      # (AF542531.2, 133,474 bp; AF542530.2, 148,067 bp), which annotate their
      # own boundaries: "MAT 5'" = 1-10,000, and the MATa locus proper =
      # 10,001-133,183. The previous curation took 5 genes per record and was
      # marked `completeness: partial`.
      #
      # ROLE ASSIGNMENT, measured. Genes outside the annotated boundary are
      # 99.1-100% identical between the two idiomorphs (UAP1 99.8, FAO1 99.1,
      # NOG2 100.0, PAN6 100.0); genes inside it are divergent (STE12 30.6,
      # STE3 34.0, STE11 43.0, MYO2 61.0, STE20 72.0). That is the
      # recombination-suppressed block, and it is the same conserved-flank /
      # variable-core architecture as SLA2->[MAT]<-APN2 in Mucoromycota.
      #
      # CAUTION on using divergence to place a gene: it measures selective
      # constraint as well as recombination suppression. RPL39 sits INSIDE the
      # block (108,406, well within 10,001-115,657) yet is 100% identical
      # between idiomorphs, because it is a ribosomal protein under purifying
      # selection. The deposit's own boundary annotation is authoritative;
      # divergence is a lower bound on the block, not its definition.
      #
      # OPTIONAL, per the curator's ruling of 2026-09-21: the trapped genes
      # and the homeodomain genes "can be trapped genes we likely expect but
      # it isn't clear how universal once we move outside of Cryptococcus".
      # The required core is the pheromone precursors and the receptor -- "the
      # main findings were the MFa/MFalpha and neighbors". An optional gene is
      # still searched and still reported, it is simply out of fraction_found
      # and out of the core requirement.
      #
      # slot SXI, curator-approved 2026-09-26: SXI1/SXI2 stay optional (their
      # absence costs nothing), but a FOUND one now counts once in
      # fraction_found. Four MATalpha C. neoformans assemblies split the locus
      # over 5-6 contigs; the true piece (SXI1 + FAO1) scored 1/3 and was
      # dropped. See results/2026-09-26_cryptococcus_zero/NOTE.md.
      - {name: SXI1, role: core_MAT, gene_class: HD1, present_in_idiomorphs: ["alpha"], optional: true, slot: SXI}
      - {name: SXI2, role: core_MAT, gene_class: HD2, present_in_idiomorphs: ["a"], optional: true, slot: SXI}
      # Recombination-trapped, present in both idiomorphs as divergent alleles.
      # One roster entry each, not an a/alpha pair: presence does not
      # discriminate the idiomorph (both have them), sequence does, and the
      # existing search-path/identity rule already handles that. Splitting them
      # per idiomorph would manufacture the sexM/sexP cross-match problem.
      # STE20 produced 187 of 272 genome-wide tblastn HSPs on JEC21, across
      # ALL 14 contigs at 31.7% median identity, and every one fed the polish
      # stage: one run went 8 s -> 535 s. It is a p21-activated kinase, a large
      # ubiquitous family. Off the search list; the records keep the protein.
      - {name: STE20, role: core_MAT, optional: true, exclude_from_search: true}
      # RPO41 is well behaved as a query (14 HSPs, one contig, 98.7% median
      # identity) -- excluded for the OTHER reason: it is not established as
      # universal outside Cryptococcus. Curator's ruling, 2026-09-21.
      - {name: RPO41, role: core_MAT, optional: true, exclude_from_search: true}
      - {name: RPL39, role: core_MAT, optional: true}
      # Boundary genes, outside the block, conserved between idiomorphs.
      # These are what make `classify_locus` able to return `mat_locus` for
      # this family at all -- before this the roster was entirely core_MAT, so
      # the flanking requirement was unsatisfiable and a complete Cryptococcus
      # MAT locus was filed as `idiomorph_gene_only`.
      - {name: FAO1, role: flanking_conserved}
      # One flank per side is kept (FAO1 left, PAN6 right), per the curator's
      # ruling. UAP1 is a clean query (8 HSPs, one contig) and is kept curated
      # so it can be restored by deleting one flag.
      - {name: UAP1, role: flanking_conserved, exclude_from_search: true}
      # NOG2 is the noisier of the two right-hand flanks (22 HSPs, 2 contigs,
      # 54.6% median) -- PAN6 is kept instead.
      - {name: NOG2, role: flanking_conserved, exclude_from_search: true}
      - {name: PAN6, role: flanking_conserved}
      # MFalpha1 and MFalpha2 are BYTE-IDENTICAL 38 aa proteins in
      # 40410_jec21_MAT_alpha, so no ranking rule can ever choose between them
      # -- identity, coverage, e-value and bitscore are all exactly tied.
      # Collapsed to one canonical name per the curator's ruling of 2026-09-21;
      # `aliases` records what was folded in, and the curated records keep
      # their own deposited gene names untouched.
      #
      # Measured consequence of NOT doing this: on 334 Tremellales genomes, one
      # ~95 bp pheromone ORF was reported as 3 distinct genes, giving 3/5 = 0.60
      # against the 0.50 ambiguity floor and admitting 927 spurious loci.
      #
      # MFalpha3 is folded in too, per the curator's ruling of 2026-09-21,
      # even though it is NOT byte-identical -- it differs from MFalpha1 by one
      # residue (97.4% identity over 100% coverage). The group, not the
      # individual paralog, is the unit of biological interest here, and the
      # curator intends a consensus or per-group HMM as the eventual search
      # strategy for these precursors.
      #
      # This does NOT reduce sensitivity. Collapsing is a change of NAME, not
      # of query set: `build_reference_fasta` deduplicates on
      # (record_id, canonical name, SEQUENCE), so MFalpha3's distinct sequence
      # is still emitted and still searched -- it simply reports as MFalpha.
      # Two reference sequences under one gene name is the ordinary case
      # (the same gene curated from two strains) and is what keeps one genomic
      # ORF from being counted three times.
      - {name: MFalpha, role: core_MAT, gene_class: pheromone_precursor, present_in_idiomorphs: ["alpha"], aliases: [MFalpha1, MFalpha2, MFalpha3]}
      # MFa1, MFa2 and MFa3 are three byte-identical 42 aa proteins in
      # 40410_jec20_MAT_a. Same reasoning as MFalpha above.
      - {name: MFa, role: core_MAT, gene_class: pheromone_precursor, present_in_idiomorphs: ["a"], aliases: [MFa1, MFa2, MFa3]}
      - {name: STE3, role: core_MAT, gene_class: pheromone_receptor}
  - locus_name: "Aalpha"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^[0-9]+$"
    # Widened 2026-09-20 from the single curated species (Schizophyllum
    # commune 5334) to its family, one rank broader -- see HD's scope comment
    # (db/Basidiomycota/order.yml, HD locus) for the measured phylum_fallback
    # cost this addresses.
    # Scope widened to ORDER rank 2026-09-21, curator's ruling ("order is
    # reasonable for most"), replacing the family-rank values set 2026-09-20.
    # Rank verified against NCBI Taxonomy, not assumed.
    taxonomic_scope: [5338]  # Agaricales (order)
    # 25 kb per the curator's Agaricales upper bound. Measured largest
    # intra-locus gene gap in the one curated Aalpha record: 272 bp (n=1).
    max_cluster_gap_bp: 25000
    # gene_class Z=HD1/Y=HD2 per this locus's own curated record
    # (db/Basidiomycota/Agaricales/5334_h4-8_Aalpha_4/metadata.yaml), whose
    # reference_orientation explicitly states "Z4(HD1)->Y4(HD2)".
    genes:
      - {name: Y, role: core_MAT, gene_class: HD2}
      - {name: Z, role: core_MAT, gene_class: HD1}
  - locus_name: "Abeta"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^[0-9]+$"
    # Widened 2026-09-20, same rationale as Aalpha above.
    # Scope widened to ORDER rank 2026-09-21, curator's ruling ("order is
    # reasonable for most"), replacing the family-rank values set 2026-09-20.
    # Rank verified against NCBI Taxonomy, not assumed.
    taxonomic_scope: [5338]  # Agaricales (order)
    # 25 kb, same as Aalpha. No Abeta record is curated yet, so this is
    # inherited from its sibling locus, not measured.
    max_cluster_gap_bp: 25000
    # No Abeta record is curated yet, but it shares the same species (S. commune,
    # 5334) and the same Y/Z gene-naming convention as Aalpha above, whose curated
    # record documents Z=HD1/Y=HD2 -- applying the same gene_class here for
    # consistency, not as an independent finding.
    genes:
      - {name: Y, role: core_MAT, gene_class: HD2}
      - {name: Z, role: core_MAT, gene_class: HD1}
  - locus_name: "Balpha"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^[0-9]+$"
    # Widened 2026-09-20, same rationale as Aalpha above.
    # Scope widened to ORDER rank 2026-09-21, curator's ruling ("order is
    # reasonable for most"), replacing the family-rank values set 2026-09-20.
    # Rank verified against NCBI Taxonomy, not assumed.
    taxonomic_scope: [5338]  # Agaricales (order)
    # 5 kb, NOT the 25 kb Agaricales upper bound -- curator's ruling
    # 2026-09-21 after the measurement below. Balpha and Bbeta sit 7,716 bp
    # apart in S. commune H4-8, so at 25 kb they chain into a single cluster;
    # the order-testing note measured that merged cluster at 83.5 kb, of which
    # the two subloci are only ~31.9 kb -- the rest is spurious hits absorbed
    # within 25 kb of each end. 5 kb clears the largest observed intra-Balpha
    # gene gap (3,722 bp) and stays under the 7,716 bp spacing.
    #
    # CAVEAT, and it is load-bearing: this value is INERT today. Clustering
    # uses ONE gap per run -- the maximum over the routed families
    # (`family_registry.derive_max_cluster_gap`) -- and any Agaricales genome
    # routes Balpha alongside HD/PR/Aalpha/Abeta at 25 kb, so 25 kb is what
    # actually gets used. Recorded here as curation intent; it takes effect
    # only once clustering becomes per-family. Derived from n=1 species.
    max_cluster_gap_bp: 5000
    # Real names from db/Basidiomycota/Agaricales/5334_h4-8_Balpha_3
    # (Schizophyllum commune Balpha-3 uses the bar3/bap3-x naming of Wendland
    # et al. 1995). `pheromone_receptor` is kept as a generic alias -- it is a
    # real curated name elsewhere in db/ (the PR family) and a future Balpha
    # record whose receptor has no allele-specific published name could use it.
    # The bare `pheromone` entry was removed: no curated protein anywhere in
    # db/ carries that name.
    # gene_class per this locus's own record
    # (db/Basidiomycota/Agaricales/5334_h4-8_Balpha_3/metadata.yaml), whose
    # definition_note documents bar3 as the receptor and bap3-1/bap3-3 as the two
    # pheromone precursors ("2 pheromone precursors + 1 receptor").
    genes:
      - {name: pheromone_receptor, role: core_MAT, gene_class: pheromone_receptor}
      - {name: bar3, role: core_MAT, gene_class: pheromone_receptor}
      - {name: bap3-1, role: core_MAT, gene_class: pheromone_precursor}
      - {name: bap3-3, role: core_MAT, gene_class: pheromone_precursor}
  - locus_name: "Bbeta"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^[0-9]+$"
    # Widened 2026-09-20, same rationale as Aalpha above.
    # Scope widened to ORDER rank 2026-09-21, curator's ruling ("order is
    # reasonable for most"), replacing the family-rank values set 2026-09-20.
    # Rank verified against NCBI Taxonomy, not assumed.
    taxonomic_scope: [5338]  # Agaricales (order)
    # 5 kb, same ruling and the same inertness caveat as Balpha above.
    # Measured largest intra-Bbeta gene gap: 2,838 bp (n=1).
    max_cluster_gap_bp: 5000
    # Real names from db/Basidiomycota/Agaricales/5334_h4-8_Bbeta_2
    # (S. commune Bbeta-2, bbr2/bbp2-x naming of Vaillancourt et al. 1997;
    # bbp2_a/bbp2_b are that record's disambiguation of two distinct proteins
    # both labelled "bbp2" in the source table). Same alias/removal reasoning
    # as Balpha above.
    # gene_class per this locus's own record
    # (db/Basidiomycota/Agaricales/5334_h4-8_Bbeta_2/metadata.yaml), whose
    # definition_note documents bbr2 as the receptor and the bbp2-* / bbp2_a / bbp2_b
    # genes as pheromone precursors ("6 pheromone precursors + 1 receptor").
    genes:
      - {name: pheromone_receptor, role: core_MAT, gene_class: pheromone_receptor}
      - {name: bbr2, role: core_MAT, gene_class: pheromone_receptor}
      - {name: bbp2-1, role: core_MAT, gene_class: pheromone_precursor}
      - {name: bbp2-2, role: core_MAT, gene_class: pheromone_precursor}
      - {name: bbp2-5, role: core_MAT, gene_class: pheromone_precursor}
      - {name: bbp2-6, role: core_MAT, gene_class: pheromone_precursor}
      - {name: bbp2-8, role: core_MAT, gene_class: pheromone_precursor}
      - {name: bbp2_a, role: core_MAT, gene_class: pheromone_precursor}
      - {name: bbp2_b, role: core_MAT, gene_class: pheromone_precursor}
  - locus_name: "aLocus"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^a[0-9]+$"
    # Scope note revised 2026-09-20. The original comment here said
    # "Ustilaginales has NO family rank in NCBI's taxonomy" -- that was an
    # overstatement, corrected after curating real Ustilago records into this
    # family: Ustilaginaceae (5268) IS a real, populated family under
    # Ustilaginales, and Ustilago itself belongs to it. What is actually true
    # is narrower -- Mycosarcoma maydis's OWN placement in NCBI's tree is
    # "Ustilaginales incertae sedis" (unranked, unplaced), sitting OUTSIDE
    # Ustilaginaceae, not that the order lacks a family concept (verified via
    # efetch 2026-09-20). Widened to Ustilaginaceae now that a second real
    # genus (Ustilago hordei, U. tritici) is curated here, which is what
    # justifies the family-level radius the curator's ruling asked for
    # elsewhere in this file -- Mycosarcoma's own taxid stays listed
    # separately since lineage matching cannot reach it through
    # Ustilaginaceae (it sits outside that family).
    # Further widened 2026-09-20 after curating real records "further out in
    # the subphylum" (Steins et al. 2023, 17 species across the family, plus
    # Malassezia sympodialis, Gioti et al. 2013). 15 of the 17 Steins species
    # already fall in Ustilaginaceae (5268); two do not and get their OWN
    # species taxid added directly (not their family/order -- that would be
    # widening beyond what the curated evidence supports): Kalmanozyma
    # brasiliensis (1392244) sits in "Ustilaginales incertae sedis", the same
    # unplaced node as Mycosarcoma; Testicularia cyperi (1882483) is in
    # Anthracoideaceae, a genuinely different family.
    #
    # Malassezia sympodialis (76777) is the biggest jump in this list --
    # Malasseziaceae, order Malasseziales, a DIFFERENT ORDER within the same
    # subphylum Ustilaginomycotina, not merely a different genus/family.
    # Added as its own species taxid only (direct membership), not its
    # family: routing an uncurated Malasseziales relative to this same
    # aLocus/bLocus family on the strength of one species is a bigger
    # inference than the Ustilaginaceae case and deliberately left for a
    # separate decision.
    # Scope widened to ORDER rank 2026-09-21, curator's ruling ("order is
    # reasonable for most"), replacing the family-rank values set 2026-09-20.
    # Rank verified against NCBI Taxonomy, not assumed.
    taxonomic_scope: [5267, 162474]  # Ustilaginales (order); Malasseziales (order)
    # 5 kb, curator's ruling 2026-09-21 ("smaller for Malasseziales and
    # Ustilaginales"). Measured largest intra-locus gene gap across the
    # curated aLocus records: 3,480 bp (n=8, Ustilaginales) and 472 bp (n=1,
    # Malasseziales); largest span 5,349 bp.
    max_cluster_gap_bp: 5000
    # gene_class per this locus's own record
    # (db/Basidiomycota/Ustilaginales/5270_521_aLocus_a1/metadata.yaml), whose
    # definition_note documents mfa1 as the lipopeptide mating-factor precursor and
    # pra1 as the 7TM pheromone receptor. rba1's functional role is explicitly noted
    # in that same record as less certain -- left unclassified rather than guessed.
    # Ustilago hordei's U07939.1 (Bakkeren & Kronstad 1994) deposits its own
    # pheromone receptor under the gene name Uhpra1, NOT pra1. Considered
    # adding it as its own roster entry (the pattern already used for
    # bar3/bbr2 in Balpha/Bbeta) and REJECTED, 2026-09-20: unlike bar3/bbr2,
    # this family's `pattern` vocabulary_type never narrows its core roster
    # (expected_genes_for_idiomorph only narrows enum families), so a second,
    # always-required core_MAT gene name for the SAME functional slot makes
    # the real, already-curated Mycosarcoma maydis record (mfa1+pra1 only)
    # permanently unable to satisfy assign_tier's core_found check -- caught
    # by the integration test suite, not by inspection. Verified these are
    # the same gene by sequence, not by title text alone: AAA99766.1 (pra1,
    # M. maydis) and AAA19965.1 (Uhpra1, U. hordei) are 357/359 aa, 66.0%
    # identity over 97.2% coverage of the shorter -- a clear ortholog pair
    # for a fast-evolving pheromone-receptor GPCR, the same standard already
    # used to establish algA==algL in db/Mucoromycota/order.yml. Curated
    # under the canonical name pra1 instead; U07939.1's real deposited name
    # is documented in that record's own definition_note.
    genes:
      - {name: mfa1, role: core_MAT, gene_class: pheromone_precursor}
      - {name: pra1, role: core_MAT, gene_class: pheromone_receptor}
      - {name: rba1, role: flanking_variable}
  - locus_name: "bLocus"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^b[0-9]+$"
    # Widened 2026-09-20 -- see aLocus's scope comment above for the full
    # correction and reasoning (Ustilaginaceae is real and populated; only
    # Mycosarcoma's own placement is incertae sedis, outside it).
    # Further widened 2026-09-20 after curating real records "further out in
    # the subphylum" (Steins et al. 2023, 17 species across the family, plus
    # Malassezia sympodialis, Gioti et al. 2013). 15 of the 17 Steins species
    # already fall in Ustilaginaceae (5268); two do not and get their OWN
    # species taxid added directly (not their family/order -- that would be
    # widening beyond what the curated evidence supports): Kalmanozyma
    # brasiliensis (1392244) sits in "Ustilaginales incertae sedis", the same
    # unplaced node as Mycosarcoma; Testicularia cyperi (1882483) is in
    # Anthracoideaceae, a genuinely different family.
    #
    # Malassezia sympodialis (76777) is the biggest jump in this list --
    # Malasseziaceae, order Malasseziales, a DIFFERENT ORDER within the same
    # subphylum Ustilaginomycotina, not merely a different genus/family.
    # Added as its own species taxid only (direct membership), not its
    # family: routing an uncurated Malasseziales relative to this same
    # aLocus/bLocus family on the strength of one species is a bigger
    # inference than the Ustilaginaceae case and deliberately left for a
    # separate decision.
    # Scope widened to ORDER rank 2026-09-21, curator's ruling ("order is
    # reasonable for most"), replacing the family-rank values set 2026-09-20.
    # Rank verified against NCBI Taxonomy, not assumed.
    taxonomic_scope: [5267, 162474]  # Ustilaginales (order); Malasseziales (order)
    # 5 kb, same ruling as aLocus. Measured largest intra-locus gene gap
    # across the curated bLocus records: 635 bp (n=19, Ustilaginales) and
    # 504 bp (n=3, Malasseziales); largest span 5,330 bp.
    max_cluster_gap_bp: 5000
    # bE/bW are a divergently-transcribed homeodomain gene pair (the b locus's own
    # curated record, db/Basidiomycota/Ustilaginales/5270_521_bLocus_b1/metadata.yaml,
    # confirms this via RefSeq's own "bE1 allele"/"bW1 allele" product annotation).
    # gene_class assigned 2026-09-19 by the project's curator, J. Stajich, who stated that
    # bE/bW are HD-class. The curator did not specify the HD1-vs-HD2 split; the specific
    # mapping bW = HD1, bE = HD2 was proposed from general literature knowledge and
    # accepted by the curator. It is NOT stated in this DB's own curated record, and the
    # papers cited here (Gillissen et al. 1992; Kamper et al. 1995) were NOT consulted
    # when the call was made -- they remain the right place to confirm the split.
    genes:
      - {name: bE, role: core_MAT, gene_class: HD2}
      - {name: bW, role: core_MAT, gene_class: HD1}
