phylum: Basidiomycota
loci:
  - locus_name: "HD"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^A[0-9]+$"
    genes:
      - {name: HD1, role: core_MAT}
      - {name: HD2, role: core_MAT}
  - locus_name: "PR"
    vocabulary_type: "pattern"
    idiomorph_pattern: "^B[0-9]+$"
    genes:
      - {name: pheromone, role: core_MAT}
      - {name: pheromone_receptor, role: core_MAT}
  - locus_name: "MAT"
    vocabulary_type: "enum"
    idiomorph_values: ["alpha", "a"]
    genes:
      - {name: SXI1, role: core_MAT, present_in_idiomorphs: ["alpha"]}
      - {name: SXI2, role: core_MAT, present_in_idiomorphs: ["a"]}
      - {name: MFalpha1, role: core_MAT, present_in_idiomorphs: ["alpha"]}
      - {name: MFalpha2, role: core_MAT, present_in_idiomorphs: ["alpha"]}
      - {name: MFalpha3, role: core_MAT, present_in_idiomorphs: ["alpha"]}
      - {name: MFa1, role: core_MAT, present_in_idiomorphs: ["a"]}
      - {name: MFa2, role: core_MAT, present_in_idiomorphs: ["a"]}
      - {name: MFa3, role: core_MAT, present_in_idiomorphs: ["a"]}
      - {name: STE3, role: core_MAT}
