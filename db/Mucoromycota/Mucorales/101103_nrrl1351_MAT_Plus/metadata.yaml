    definition_note: 'Circinella umbellata NRRL 1351 (GCA_025093555.1, JGI Cirumb1; BioProject PRJNA331974,
      BioSample SAMN05444945; contig N50 688.3 kb) MAT Plus locus on JAIWNF010000086.1. Gene order: VMA1
      (KAI7847719.1, -) -- pntA (KAI7847720.1, -) -- sexP (KAI7847721.1, +, 310 aa, single exon) -- gpmI
      (KAI7847722.1, -) -- rnhA (KAI7847723.1, +). KAI7847721.1 is annotated only as ''hypothetical protein''
      (ANNOTATION_ERRORS_FIXED_REPORT.md). sexP carries a PF00505 HMG box (aa 117-177, E 1.5e-15); best
      curated match 4837_ubc21 sexP (blastp 30.1% over 166 aa); HMM classifier (a8863f3 build) sexP 115.8
      vs sexM 32.0 bits (margin +83.8). sexP ends 98 bp from gpmI and 2.1 kb from rnhA. rnhA is 55.8%
      identical to 29922_cbs109-16 rnhA. tptA (KAI7852361.1) and algA (KAI7852358.1) sit together on JAIWNF010000034.1
      and glrA (KAI7860806.1) on JAIWNF010000001.1, so they are recorded present: false. VMA1, pntA and
      gpmI are recorded in locus.extended_flank, not as roster genes, so detection never searches them.
      The same neighbourhood (VMA1, pntA, HMG gene, gpmI, rnhA) is in the Minus record 64656_rsa-1403
      (blastp VMA1 92.2%, pntA 77.3%, gpmI 87.5%, rnhA 77.6%). The Plus assignment of this sexP clade
      rests on the classifier and on the two Fennellomyces strains labelled Plus (results/2026-10-01_circinella_label_tree/);
      the HMG-box-only tree does not support the clade (IQ-TREE 0/19; full-length 83/93). Every protein
      matches the translation of its annotated exons from JAIWNF010000086.1 at 100% (table 1, codon_start
      1). TIER 2 (genome-derived). Not a published idiomorph.'
