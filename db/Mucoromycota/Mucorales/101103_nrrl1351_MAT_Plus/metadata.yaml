evidence:
  locus_existence:
    tier: 2
    citations: []
    experimental_method: TIER 2 (genome-derived). No Circinella, Thamnostylum, Fennellomyces or Zychaea
      MAT locus has a locus-specific deposit or a publication (NCBI nuccore/protein and PubMed searched
      2026-10-01). Locus identified by the HMG-box gene typed by the MATPredict HMM idiomorph classifier
      (db/Mucoromycota/classifiers/MAT) and by the Circinella-group neighbourhood VMA1-pntA-[sex]-gpmI-rnhA,
      conserved between Zychaea and Circinella.
  boundaries:
    tier: 2
    citations: []
    experimental_method: TIER 2 (genome-derived). No Circinella, Thamnostylum, Fennellomyces or Zychaea
      MAT locus has a locus-specific deposit or a publication (NCBI nuccore/protein and PubMed searched
      2026-10-01). Record segment spans the sex gene to rnhA on JAIWNF010000086.1 (GCA_025093555.1); the
      idiomorph boundaries themselves are not mapped. VMA1, pntA and gpmI are in extended_flank (recorded,
      not searched).
  idiomorph_assignment:
    tier: 2
    citations: []
    experimental_method: 'TIER 2 (genome-derived). No Circinella, Thamnostylum, Fennellomyces or Zychaea
      MAT locus has a locus-specific deposit or a publication (NCBI nuccore/protein and PubMed searched
      2026-10-01). Idiomorph from the HMG-box gene (sexP): classifier and PF00505 scores in definition_note;
      Plus = sexP, Minus = sexM, as the curated Mucorales records.'
