    reference_orientation: sexM->rnhA
    definition_note: 'Published MAT region of a HOMOTHALLIC Mucorale, 20,845 bp. Carries
      the sexM HMG gene with an intact rnhA flank; the glrA here is annotated as a
      PSEUDOGENE with no translation and is therefore not curated. Its Plus counterpart
      in the same strain is record 101119_atcc11807_MAT_Plus (JN112240.1), where the
      situation is mirrored: intact glrA, pseudogenised rnhA.


      This is the first homothallic reference in this database. It exists to make
      the homothallic architecture -- both idiomorphs present in one genome -- detectable
      at all, which it previously was not for lack of any reference. mrsB, arbA and
      mcmV are present in the deposit but are not in db/Mucoromycota/order.yml''s
      controlled vocabulary, so they are not curated.


      Idnurm A (2011) Sex determination in the first-described sexual fungus. Eukaryotic
      Cell 10(11):1485-1491.'
