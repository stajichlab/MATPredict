    reference_orientation: sexP->glrA
    definition_note: 'Published MAT region of a HOMOTHALLIC Mucorale, 25,552 bp. Carries
      the sexP HMG gene with an intact glrA flank -- the THIRD glrA reference protein
      in this database, which is its thinnest gene. The rnhA here is annotated as
      a PSEUDOGENE with no translation and is not curated. Its Minus counterpart in
      the same strain is record 101119_atcc11807_MAT_Minus (JN112239.1).


      sspA, alyA and romA are present in the deposit but are not in the controlled
      vocabulary. NOTE for anyone extending that vocabulary: alyA here is annotated
      an ALPHA-ARRESTIN, NOT an alginate lyase -- it is not algA/algL, and a prefix
      match on aly* would be a false positive.


      Idnurm A (2011) Sex determination in the first-described sexual fungus. Eukaryotic
      Cell 10(11):1485-1491.'
