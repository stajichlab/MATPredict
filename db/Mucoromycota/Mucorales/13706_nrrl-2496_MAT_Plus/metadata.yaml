    reference_orientation: sexP->|rnhA->
    definition_note: 'Syncephalastrum racemosum NRRL 2496 (GCA_002105135.1, JGI Synrac1;
      BioProject PRJNA330704) MAT Plus locus on MCGN01000004.1. Gene order: sexP (+)
      -- 69 bp -- rnhA (ORY97819.1, +, 1262 aa, 11 exons), the canonical Mucorales
      sexP->rnhA adjacency and orientation (cf. tptA->btbA->sexP->rnhA in R. arrhizus
      CBS 346-36). tptA, algA, glrA and btbA are NOT at this locus: the genome''s
      best tptA (ORZ02716.1) and glrA (ORZ02423.1) lie on MCGN01000001.1, algA hits
      are weak (ORY97962.1, 32.9%); recorded present: false. So the Mucorales order
      is PARTIAL here (sexP-rnhA only). sexP is not annotated in the JGI assembly
      (annotation gap); recorded as the single-exon ORF 1,755,515-1,756,447 (+), 310
      aa, from the first Met after an upstream in-frame stop to the stop codon (stop-to-stop
      334 aa). PF00505 HMG box aa 112-175 (E 1.2e-16); best tblastn to curated sexP:
      4837_ubc21 sexP (35.2% over 165 aa, 92 bits). HMM classifier (db/Mucoromycota/classifiers/MAT)
      on the ORF: sexP 179.1 vs sexM 38.9 bits (margin +140). The same HMG protein
      is 100% identical (228 aa) in S. racemosum B6101 (GCA_000696955.1, JNDN01000979.1:849,656),
      where MATPredict called Plus beside rnhA. Final ML tree (results/2026-09-27_sexMP_final_ml):
      the called S. racemosum loci sit outside the sexP clade (other HMG; the 69-column
      HMG box gives UFBoot 62 even for the sexP references). TIER 2 (genome-derived).
      No Syncephalastraceae MAT locus has a locus-specific deposit or a publication
      (NCBI and PubMed searched 2026-09-26/27). '
