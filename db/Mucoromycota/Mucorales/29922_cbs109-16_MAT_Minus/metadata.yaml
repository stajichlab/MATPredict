    reference_orientation: algA->sexM->rnhA
    definition_note: 'Published MAT locus, 10,568 bp. Curated for the Minus idiomorph
      and for algA: this deposit''s unnamed ''putative alginate lyase'' (AFA26122.1)
      is the gene the algL/algA literature is about -- 384 aa, 62.8% identity to WZC35661.1
      (AlgA of OR965930.1), which is what establishes that algA and algL are one gene
      rather than two. The deposit carries no /gene qualifier for it, so the name
      here is assigned by product plus that orthology, not read off the record. A
      partial serine-rich adhesion protein CDS is not curated (no vocabulary name,
      and incomplete). No tptA is annotated in this record.


      Wetzel J, Burmester A, Kolbe M, Wostemeyer J (2012) The mating-related loci
      sexM and sexP of the zygomycetous fungus Mucor mucedo and their transcriptional
      regulation by trisporoid pheromones. Microbiology 158(Pt 4):1016-1023.'
