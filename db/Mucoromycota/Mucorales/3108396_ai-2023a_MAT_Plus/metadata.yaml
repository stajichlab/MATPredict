    definition_note: 'Published MAT locus deposited as a single 16,643 bp fragment
      (GenBank OR965930.1) by Hull, Urquhart & Idnurm (2024), describing Mooraboolomyces
      wintlei; the deposit''s organism name is the provisional ''Mucoraceae sp. AI-2023a''.
      Gene names algA/tptA/sexP/rnhA/glrA are the deposit''s own /gene qualifiers
      and match db/Mucoromycota/order.yml''s controlled vocabulary exactly.


      This is the ONLY source of reference proteins for algA and glrA, which were
      named in order.yml''s roster with no curated protein behind them, so no genome
      could match them. NAMING: the Idnurm review (doi:10.1128/microbiolspec.funk-0041-2017)
      calls algA ''algL''. They are the same gene, confirmed by domain annotation
      rather than by name -- WZC35661 (AlgA, 384 aa) carries Alginate_lyase pfam05426,
      matching the review''s ''predicted alginate lyase''; WZC35665 (GlrA, 465 aa)
      carries Pyr_redox_2, the family glutathione reductase belongs to. The deposit''s
      spelling is used here because it is the one attached to sequence.


      Hull CP, Urquhart AS, Idnurm A (2024) Mooraboolomyces wintlei gen. & sp. nov.
      from Victoria, Australia. Phytotaxa 644(1):35-41.'
