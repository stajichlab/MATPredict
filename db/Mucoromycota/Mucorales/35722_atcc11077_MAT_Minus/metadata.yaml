    reference_orientation: sexM->rnhA
    definition_note: 'Published MAT locus, 8,605 bp, curated for sexM and rnhA (both
      complete CDS). Adds a Parasitellaceae Minus reference; the genus was otherwise
      unrepresented.


      NOTED DIVERGENCE. Schulz et al. 2016 report that the predicted HMG domains of
      SexM in the two P. parasitica isolates NRRL 2501 and ATCC 11077 ''range phylogenetically
      in a wider distance to other species'', and that these two strains are ''genetically
      different to a surprising degree'' despite likely sharing a collection site.
      That divergence is the REASON to curate this record rather than a caution against
      it: the Minus reference set is the thin side of this database, and a divergent
      sexM extends the range of sequences a query genome can match. It does mean this
      protein should not be treated as typical of the genus.


      CITATION HAS NO PERSISTENT IDENTIFIER. Schulz et al. 2016 is absent from Crossref,
      PubMed and PMC, and the PDF carries no DOI, ISSN or URN. doi and pmid are therefore
      null rather than invented. The paper was read directly (curator-supplied PDF,
      2026-09-20); its Table 1 is what attributes this accession to these genes.


      Schulz E, Wetzel J, Burmester A, Ellenberger S, Siegmund L, Wostemeyer J (2016)
      Sex loci of homothallic and heterothallic Mucorales. Endocytobiosis and Cell
      Research 27(4):39-57. Journal archive: zs.thulb.uni-jena.de/content/main/journals/ecb/info.xml'
