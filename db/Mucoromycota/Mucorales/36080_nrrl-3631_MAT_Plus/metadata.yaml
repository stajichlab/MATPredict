    reference_orientation: tptA->sexP->rnhA
    definition_note: 'Locus deposited as a single sequenced fragment (GenBank FJ009107.1,
      8264 bp) by Lee et al. 2008 (Current Biology), the paper that established microsporidia-zygomycete
      sex-locus synteny by characterizing this locus (among others) directly -- not
      merely a secondary citation of an earlier description. GenBank''s own feature
      table names the genes tptA/sexP/rnhA directly (unlike the Phycomyces founding
      records, which only had product descriptions), matching the controlled vocabulary
      in db/Mucoromycota/order.yml exactly. The rnhA CDS (ACH92696.1, joined/multi-exon)
      ends at position 7593, short of the 8264 bp fragment end, so unlike the Phycomyces
      records this locus''s completeness is "complete" rather than "partial" -- the
      3'' extent of the flanking gene is captured within the deposited fragment with
      room to spare.

      '
