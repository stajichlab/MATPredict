    reference_orientation: tptA->sexP->rnhA
    definition_note: 'Locus deposited as a single sequenced fragment (GenBank EU009462.1)
      by Idnurm et al. 2008. Gene names tptA/sexP/rnhA follow the controlled vocabulary
      already established in db/Mucoromycota/order.yml; GenBank''s own feature table
      labels the flanking genes only by product description, not by these short names.
      sexP has two annotated CDS isoforms (ABX27912.1, full-length, CDS
      complement(join(2189..2358,2437..3160)); ABX27914.1, a shorter alternatively-spliced
      form, CDS complement(join(2189..2358,2437..2989))); this record uses the
      full-length isoform (ABX27912.1) as the representative sexP entry. The RNA
      helicase CDS (ABX27913.1) begins at 7376 and the record notes the sequence continues
      beyond position 9971, the end of the deposited fragment -- completeness is set
      to partial because this gene''s full extent is not contained within this record.

      COORDINATE CORRECTION (2026-09-18): sexP was originally recorded as 2004..3186,
      which is the gene/mRNA span (complement(join(2004..2358,2437..3186)), including
      5''/3'' UTR), not the CDS. The real CDS for the full-length isoform ABX27912.1,
      independently re-fetched via NCBI efetch, is complement(join(2189..2358,2437..3160)).
      Coordinates below are corrected to the CDS outer bounds, 2189..3160; the gene
      remains multi-exon (one intron, 2359..2436) which this schema does not model,
      so an independent re-translation of the corrected span will still not exactly
      reproduce ABX27912.1 -- see sequence_match.notes.

      '
