    notes: '2026-09-18 re-validation after correcting sexP''s coordinates from the
      gene/mRNA span to the real CDS outer bounds (see definition_note): identity
      rose from 88.89% to 96.5%. The residual warn (not pass) is expected: sexP is
      multi-exon (one intron, 2359..2436) and this schema stores only a single
      start/end span with no intron model, so translating straight through the
      intron still introduces some wrong residues before the reading frame
      resynchronizes; this is a known schema limitation, not a remaining coordinate
      error. rnhA''s low coverage (3.08%) is expected because this record''s segment
      captures only the first exon of that gene before the deposited fragment ends
      (see completeness: partial note above), not a data problem.'
