    definition_note: 'Published MAT locus fragment, 1,383 bp. ONLY sexM (208 aa, complete)
      is curated: the deposit''s tptA (38 aa) and rnhA (82 aa) CDS features are edge
      fragments of the sequenced region, and a 38 aa reference protein is worse than
      none -- it would either be excluded by the short-ORF floor or generate spurious
      short matches. Adds a Choanephoraceae Minus reference, a family otherwise unrepresented.


