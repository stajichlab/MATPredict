    definition_note: 'Paired Minus-idiomorph record to 64495_cbs346-36_MAT_Plus, same
      species (Rhizopus arrhizus, formerly R. oryzae) and source paper (Gryganskyi
      et al. 2010). No btbA (BTB/POZ) gene is present at this idiomorph -- the insertion
      reported in the literature is specific to the Plus allele. Locus deposited as
      GenBank HQ450316.1 (6899 bp). GenBank''s own feature table marks the rnhA CDS''s
      final exon with a ">6899" partial-boundary indicator (6783->6899), explicitly
      signaling the gene is truncated at the fragment''s end -- completeness is "partial"
      for this directly GenBank-flagged reason (not an inference).

      '
