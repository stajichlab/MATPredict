    reference_orientation: tptA->btbA->sexP->rnhA
    definition_note: 'GenBank taxonomy now lists this organism as Rhizopus arrhizus
      (formerly Rhizopus oryzae); "R. oryzae" is the name used throughout the source
      publication and the earlier Mucoromycota records in this database. Locus deposited
      as GenBank HQ450315.1 (13,259 bp) by Gryganskyi et al. 2010, the paper surveying
      the R. oryzae/R. delemar species complex mating locus across 54 isolates. This
      is the only Mucoromycota (+) record in this database carrying an extra inserted
      gene (btbA, a BTB/POZ-domain protein) between tptA and sexP -- a lineage-specific
      structural elaboration reported only for Rhizopus in the literature reviewed
      for this database, added to db/Mucoromycota/order.yml as a new flanking_variable
      gene restricted to the Plus idiomorph. tptA begins at position 1 (the very start
      of the deposited fragment) and rnhA''s CDS ends exactly at position 13259 (the
      fragment''s last base) -- completeness is "partial" because both flanking genes
      appear truncated at the fragment boundaries, not fully contained within the
      deposited sequence.

      '
