    notes: 'tptA (gene_index 0) fails independent re-translation. HQ450315.1''s
      own feature table (re-fetched via NCBI efetch on 2026-09-18) shows the real
      tptA CDS is join(<1..516,770..1333) -- a 2-exon, 1-intron gene, structurally
      identical to the tptA gene in the paired Minus-idiomorph record
      64495_cbs110-17_MAT_Minus. This schema stores only a single start/end/strand
      span per gene with no intron model, so translating the raw 1..1333 span
      cannot reproduce ADU04730.1 exactly. The recorded coordinates already match
      the CDS''s real outer bounds exactly; this is a known schema limitation, not
      a coordinate error. btbA and rnhA are also multi-exon but their recorded
      spans already pass (99.09% and 100% identity respectively) because the
      matched region before each gene''s first intron is highly or fully
      identical; sexP is single-exon and passes exactly.'
