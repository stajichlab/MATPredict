    definition_note: 'Homothallic (Schulz et al. 2016, Endocytobiosis Cell Res 27(4):39-57,
      p. 46: sexP and sexM on the same scaffold, about 150 kb apart; no DOI or PMID).
      Mycotypha africana NRRL 2978, JGI assembly Mycafr1 (GCF_025528875.1), scaffold
      NW_026515730.1. Segment 0: sexP (XP_052935775.1, +, 247 aa) -> rnhA (XP_052935776.1,
      +) -> glrA (XP_052935777.1, -), 1,357,729-1,365,893; MATPredict v0.6.0 calls
      this Plus (sexP, rnhA, glrA). Segment 1: sexM, 1,203,454-1,205,049 (-), 153
      kb from sexP; no flank gene within 60 kb. sexM model: single-exon ORF, Met to
      stop, 531 aa, curator-derived from the assembly (RefSeq has only an 83-aa partial
      fragment, XP_052935737.1, 1,204,699-1,204,947; the BFD re-annotation F5387F0C_005515
      spans the same ORF). PF00505 HMG box at aa 33-98 (i-E 6.8e-16); two weak HMG-like
      repeats at aa 221-249 and 367-395 (i-E 5.4e-4). Classifier (db/Mucoromycota/classifiers/MAT,
      built 2026-10-01) on the full ORF: sexM 171.6, sexP 70.4 (margin +101), P1 34.6
      bits; on aa 26-218: sexM 116.3, sexP 64.9. The full ORF is unusually long for
      a sexM (about 180-220 aa in other records); the classifier trains on aa 26-218
      only (curator ruling 2026-10-04). In the 2026-10-03 full-length gene tree this
      protein groups with sexM. It was in the classifier paralog-negative set (GCF_025528875.1_Mycafr1|h1|t0)
      until this record. TIER 2 (genome-derived, with literature support for the arrangement).'
