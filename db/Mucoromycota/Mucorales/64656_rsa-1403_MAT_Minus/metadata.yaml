    definition_note: 'Zychaea mexicana RSA 1403 (RefSeq GCF_025766255.1 = GenBank GCA_025766255.1, JGI
      Zycmex1; BioProject PRJNA331829, BioSample SAMN05444742; contig N50 307.7 kb) MAT Minus locus on
      NW_026516701.1 (identical to GenBank JAIXMT010000038.1; the RefSeq copy is used because it is the
      sequence the BFD genome library carries). Gene order: VMA1 (XP_052979470.1, -) -- pntA (XP_052979471.1,
      -) -- [XP_052979472.1, uncharacterized, -, not recorded] -- sexM (XP_052979473.1, +, 191 aa, single
      exon) -- gpmI (XP_052979474.1, -) -- rnhA (XP_052979475.1, +). GenBank copies of the proteins: KAI9493205.1-KAI9493210.1
      (byte-identical). sexM carries a PF00505 HMG box (aa 46-113, E 5.0e-26); best curated match 4837_nrrl1555
      sexM (blastp 43.4% over 203 aa); HMM classifier (a8863f3 build) sexM 132.9 vs sexP 70.7 bits (margin
      +62.2). sexM ends 112 bp from gpmI and 2.1 kb from rnhA. rnhA is 54.9% identical to 29922_cbs109-16
      rnhA. tptA (XP_052979568.1, NW_026516700.1), algA (XP_052976134.1, NW_026516743.1) and glrA (XP_052972719.1,
      NW_026516849.1) are on other contigs, so they are recorded present: false. VMA1, pntA and gpmI are
      recorded in locus.extended_flank, not as roster genes, so detection never searches them. Every protein
      matches the translation of its annotated exons from NW_026516701.1 at 100% (table 1, codon_start
      1). TIER 2 (genome-derived). Not a published idiomorph.'
