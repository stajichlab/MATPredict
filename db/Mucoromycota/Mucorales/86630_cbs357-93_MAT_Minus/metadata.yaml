    definition_note: 'Published MAT locus, 21,268 bp. The SECOND source of a glrA
      reference protein anywhere in this database -- glrA had exactly one (OR965930.1)
      before this, which is the thinnest part of the Mucoromycota roster. The deposit
      carries NO /gene qualifiers at all; sexM, rnhA and glrA are named here from
      their /product values (''SexM'', ''RnhA'', ''GlrA''). Hypothetical proteins
      and a phosphatidylinositol-phosphate gene are not curated.


      Gryganskyi AP, Golan J, Dolatabadi S, Mondo S, Robb S, Idnurm A et al. (2018)
      Phylogenetic and Phylogenomic Definition of Rhizopus Species. G3 (Bethesda)
