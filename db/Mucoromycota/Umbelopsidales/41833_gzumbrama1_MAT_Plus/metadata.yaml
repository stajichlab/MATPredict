    reference_orientation: glrA<-|sexP<-|tptA->|algA->
    definition_note: 'Umbelopsis ramanniana gzUmbRama1 (GCA_977110945.1, canu v2.2
      on PromethION, 23 contigs, contig N50 1.65 Mb; BioProject PRJEB96040, BioSample
      SAMEA118965535; the assembly name is used as the strain label because the BioSample
      gives no strain) MAT Plus locus on CDSBDH010000020.1. Gene order: glrA (CAO3688830.1,
      -) ... sexP (CAO3688886.1, -, 320 aa, single exon) -- tptA (CAO3688890.1, +)
      -- algA (CAO3688894.1, +). sexP carries a PF00505 HMG box (aa 108-172, E 6.8e-14);
      best curated match 36080_nrrl-3631 sexP (blastp 25.5% over 153 aa); HMM classifier
      sexP 145.2 vs sexM 34.2 bits (margin +111). The detection scan modelled only
      an 88-aa sexP fragment here (29.6%); this record supplies the full-length protein.
      rnhA is recorded present: false: it does not sit at this locus in Umbelopsis
      (its ortholog is elsewhere, see definition_note), unlike the Mucorales algA-tptA-[sex]-rnhA-glrA
      arrangement. rnhA ortholog (CAO3689817.1, 48.2% to 3108396 rnhA) lies at CDSBDH010000020.1:683,887-690,792,
      ~513 kb away. glrA has several annotated isoforms (CAO3688830/34/38/42/46.1);
      the longest (CAO3688830.1, 465 aa) is recorded. TIER 2 (genome-derived). No
      Umbelopsidales MAT locus has a locus-specific deposit or a publication (NCBI
      and PubMed searched 2026-09-27). '
