    reference_orientation: glrA<-|sexM<-|tptA->|algA->
    definition_note: 'Umbelopsis vinacea WA0000051536 (GCA_016758895.1, SPAdes 3.10.5 on Illumina and
      PacBio RSII, 150 scaffolds, N50 1.33 Mb; BioProject PRJNA668042) MAT Minus locus on JAEPRA010000016.1.
      Gene order: glrA (KAG2174489.1, -) ... sexM (-) -- tptA (KAG2174464.1, +) -- algA (KAG2174465.1,
      +). sexM is not annotated; recorded here as the single-exon ORF 154,336-154,788 (minus strand, 150
      aa, from the first Met after an upstream in-frame stop to the TAA stop). Its 3'' end is uncertain:
      curated Mucorales sexM proteins are 185-249 aa, and no intron could be supported, so completeness
      is taken as the ORF. The HMG-box exon was found by tblastn of the curated sexM set (HSP 44.3 bits);
      PF00505 HMG box at aa 33-94. The ORF has no match in the Plus genome gzUmbRama1 proteome (idiomorph-specific).
      HMM classifier on the ORF: sexM 39.8 vs sexP 26.6 bits. The adjacent annotated KAG2174494.1 (131
      aa, ''partial'') is NOT part of sexM: it is a conserved neighbouring gene (89% identical to CAO3688882.1
      beside sexP in the Plus genome); a first draft of this record wrongly fused it to the HMG exon.
      The better-assembled U. vinacea gzUmbVina2 (GCA_977110975.1) was not used: its sexM region maps
      only with frameshifts and is not annotated. rnhA is recorded present: false: it does not sit at
      this locus in Umbelopsis (its ortholog is elsewhere, see definition_note), unlike the Mucorales
      algA-tptA-[sex]-rnhA-glrA arrangement. rnhA ortholog (KAG2186781.1) is on JAEPRA010000004.1. TIER
      2 (genome-derived). No Umbelopsidales MAT locus has a locus-specific deposit or a publication (NCBI
      and PubMed searched 2026-09-27). '
