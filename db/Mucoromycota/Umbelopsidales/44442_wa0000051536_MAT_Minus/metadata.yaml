    reference_orientation: glrA<-|sexM<-|tptA->|algA->
    definition_note: 'Umbelopsis vinacea WA0000051536 (GCA_016758895.1, SPAdes 3.10.5
      on Illumina and PacBio RSII, 150 scaffolds, N50 1.33 Mb; BioProject PRJNA668042)
      MAT Minus locus on JAEPRA010000016.1. Gene order: glrA (KAG2174489.1, -) ...
      sexM (-) -- tptA (KAG2174464.1, +) -- algA (KAG2174465.1, +). sexM is a 3-exon,
      225-aa model built here (CDS 154,507-154,788 / 153,704-154,036 / 153,559-153,621,
      minus strand; canonical GT..AG introns of 470 and 82 bp; start Met is the first
      in frame after an upstream stop; stop TAA at 153,559-153,561). Evidence: the
      HMG-box exon was found by tblastn of the curated sexM set (HSP 44.3 bits); exons
      2-3 are the assembly''s own annotated KAG2174494.1, which is a 3''-part-only
      partial (131 aa, ''partial'') missing the HMG-box exon (logged in ANNOTATION_ERRORS_FIXED_REPORT.md);
      miniprot of the joined protein reproduces the exons exactly. PF00505 HMG box
      at aa 33-94 (E 1.1e-6). HMM classifier on the full model: sexM 35.0 vs sexP
      25.0 bits (margin 10, below the 25-bit floor); on the HMG-box fragment alone
      sexM by 15.3 bits. The better-assembled U. vinacea gzUmbVina2 (GCA_977110975.1)
      was not used: its sexM maps only with frameshifts (miniprot identity 68%, Frameshift=true)
      and is not annotated. rnhA is recorded present: false: it does not sit at this
      locus in Umbelopsis (its ortholog is elsewhere, see definition_note), unlike
      the Mucorales algA-tptA-[sex]-rnhA-glrA arrangement. rnhA ortholog (KAG2186781.1)
      is on JAEPRA010000004.1. TIER 2 (genome-derived). No Umbelopsidales MAT locus
      has a locus-specific deposit or a publication (NCBI and PubMed searched 2026-09-27). '
