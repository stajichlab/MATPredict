evidence:
  locus_existence:
    tier: 2
    citations: []
    experimental_method: TIER 2 (genome-derived). No Umbelopsidales MAT locus has a locus-specific deposit
      or a publication (NCBI and PubMed searched 2026-09-27). Locus identified by synteny with the Mucorales
      MAT locus (tptA, algA, glrA at the locus; an HMG-box gene 1.5 kb from tptA) and by the MATPredict
      HMM idiomorph classifier (db/Mucoromycota/classifiers/MAT) on the HMG-box protein.
