phylum: Mucoromycota
loci:
  - locus_name: "MAT"
    vocabulary_type: "enum"
    idiomorph_values: ["Plus", "Minus"]
    # Scope widened 2026-09-27 to Umbelopsidales (1913639, verified against NCBI
    # Taxonomy) with the first tier-2 Umbelopsis records
    # (db/Mucoromycota/Umbelopsidales/); curator ruling; records signed off 2026-09-29.
    taxonomic_scope: [4827, 1913639]  # Mucorales, Umbelopsidales
    # Flank-carried window (curator's ruling 2026-09-26; results/
    # 2026-09-26_flank_rule_ascomycota/NOTE.md): the flanks sit OUTSIDE the
    # idiomorph, and real loci were found up to 9.9 kb from the flank span.
    flank_carried_window_bp: 20000
    # CURATOR RULING, J. Stajich, 2026-09-26: sexM and sexP "are hard to tell
    # apart", so model BOTH and decide on the two models' alignment scores.
    # 13 Minus calls whose HMG box sits in the supported sexP clade of the
    # 2026-09-26 HMG-box tree rested on first-pass margins of 0.1-2 identity
    # points, with sexP never modelled (results/2026-09-26_sexMP_phylogeny).
    model_idiomorph_alternatives: true
    # CURATOR RULING, J. Stajich, 2026-09-26: decide the idiomorph on the
    # MODELLED proteins with a profile-HMM classifier ("a cleaner way to make
    # these assignments"). Files in classifiers/MAT/ are built ONLY by
    # scripts/build_idiomorph_hmms.py (manifest.yaml records training IDs,
    # versions and checksums). Training = curator option (a): curated
    # sexM/sexP records + UFBoot-99 sexP-clade members of the 2026-09-26
    # HMG-box tree; the Zygo 23 loci are held out. Build: 85/85 correct
    # leave-one-genus-out, worst correct margin 22.5 bits; held-out Zygo
    # 23/23, smallest margin 47.5 bits (results/2026-09-26_hmm_classifier).
    # Below min_margin the call is `undetermined` with both scores reported.
    # CURATOR RULING, J. Stajich, 2026-09-27: min_margin = 25 bits (the
    # build's recommendation, half the worst leave-one-genus-out margin, was
    # 11.2). Reason: the FastTree HMG-box tree of the classifier scan
    # (results/2026-09-27_sexMP_fasttree) split the label changes at this
    # value. The three changes with margin >= 30 bits (Mucor irregularis x2,
    # 30.1; Umbelopsis ramanniana, 51.0) sit in the matching clade; the four
    # at <= 24.2 bits (M. ardhlaengiktus 24.2, Syncephalastrum racemosum
    # NRRL 2496 12.0, S. monosporum x2 10.3) sit outside both clades. Every
    # held-out Zygo protein cleared 34 bits, so no measured correct call is
    # lost.
    #
    # CURATOR RULING, J. Stajich, 2026-10-01 (Circinella-group curation;
    # results/2026-10-01_circinella_curation/NOTE.md): a taxon-scoped flank
    # rule for the MAT-gene gate. In Circinella (101102), Thamnostylum (64650),
    # Fennellomyces (101135) and Zychaea (64651) the sex gene sits 2-9 kb from
    # rnhA, with gpmI between them, and tptA/algA/glrA sit elsewhere
    # (results/2026-10-01_lichtheimiaceae/: core locus within 50 kb of rnhA in
    # 43/46 genomes; algA-tptA together on another contig in 21/30
    # Circinella). A real locus there can never show the default two roster
    # flanks, so for a genome whose taxid lineage holds one of these genera,
    # rnhA alone (modelled at >= 40%) is flank support. Kept as a scoped group
    # in this family, not a sub-family: the group shares the Mucorales sexM/sexP
    # classifier and roster, and only the gate's flank count differs. A run
    # without a taxid never uses the group. Lichtheimia (688353) and the other
    # Lichtheimiaceae are deliberately NOT listed (discovery-only).
    idiomorph_classifier:
      type: hmm
      dir: classifiers/MAT
      min_margin: 25
      flank_support_groups:
        - name: circinella_group
          taxids: [101102, 64650, 101135, 64651]  # Circinella, Thamnostylum, Fennellomyces, Zychaea
          flanks: [rnhA]
    # CURATOR RULING, J. Stajich, 2026-09-29: test first. A genome with a
    # Plus and a Minus call is NOT a confirmed homothallic (hybrid/fusion,
    # duplication, mixed culture, assembly artefact are all possible). The
    # report lists the arrangement, evidence and every possible cause
    # (detect.two_idiomorphs; results/2026-09-29_two_idiomorphs/).
    two_idiomorphs_report: true
    # CURATOR RULING, J. Stajich, 2026-09-20: the detector's 25000 bp default
    # clustering gap is "right for Ascomycota" but too tight for Mucoromycota,
    # which should "start at 50 kb". PROVISIONAL: 50000 is a starting value, not
    # a measured one -- the curator asked that it be revised empirically as more
    # Mucoromycota examples accumulate in this database. Nothing here has been
    # measured from the curated Mucoromycota records yet.
    #
    # CROSS-PHYLUM CONSEQUENCE -- read before changing this number. One run uses
    # ONE clustering gap: the MAXIMUM over all loci that run routed to. So this
    # value is not confined to Mucoromycota. Whenever a run routes to this locus
    # alongside others -- notably the exhaustive fallback used when a query's
    # phylum cannot be determined -- raising this number also widens the
    # clustering gap applied to Ascomycota, Basidiomycota and every other
    # phylum's loci in that same run. Treat a change here as a change to every
    # multi-phylum run's clustering, not a Mucoromycota-only edit.
    max_cluster_gap_bp: 50000
    # CURATOR RULING, J. Stajich, 2026-09-20. sexM and sexP share an HMG box,
    # so one real locus gene is hit by both references -- in all 23
    # ground-truth genomes, at 92-100% coordinate overlap. The overlapping
    # pair is resolved to its higher-identity member, which is 23/23 correct,
    # but the margins split hard by idiomorph: Plus calls separate by
    # 44.6-64.2 points, Minus calls by only 2.3-13.0. Below this margin the
    # call is still made and the tier is capped.
    #
    # PROVISIONAL, like max_cluster_gap_bp above. Revise from the resolution
    # events accumulating in the evidence diagnostics, not by intuition.
    min_idiomorph_margin: 5.0
    genes:
      - {name: tptA, role: flanking_conserved}
      - {name: sexP, role: core_MAT, present_in_idiomorphs: ["Plus"]}
      - {name: sexM, role: core_MAT, present_in_idiomorphs: ["Minus"]}
      - {name: rnhA, role: flanking_conserved}
      # algA and glrA have NO reference protein in any curated record, so no
      # genome can currently match them. They are kept because they are real
      # locus architecture, not because the tool can act on them; scoring
      # excludes an unsearchable gene from the denominator and reports it as
      # `genes_not_searchable` rather than as missing.
      #
      # NAMING, resolved 2026-09-20: `algA` here matches GenBank OR965930.1,
      # which is where both genes' only reference proteins exist. The Idnurm
      # review (doi:10.1128/microbiolspec.funk-0041-2017) calls the same gene
      # `algL`. They are the same gene, confirmed by domain annotation rather
      # than by name: WZC35661 (AlgA, 384 aa) carries Alginate_lyase pfam05426,
      # matching the review's "predicted alginate lyase"; WZC35665 (GlrA,
      # 465 aa) carries Pyr_redox_2, the family glutathione reductase belongs
      # to, consistent with N. crassa NCU03339 (gtr-1) and A. nidulans AN0932.
      # Use `algA`: it is the name attached to deposited sequence.
      #
      # Ingesting OR965930.1 (Mucoraceae sp. AI-2023a = Mooraboolomyces
      # wintlei; Hull, Urquhart & Idnurm 2024, Phytotaxa 644:35-41) would give
      # both genes references and close this gap.
      - {name: algA, role: flanking_variable}
      - {name: glrA, role: flanking_variable}
      # CURATOR RULING, J. Stajich, 2026-09-20: "btbA shouldn't count in the
      # denominator but we should know when it is present." So it stays
      # Plus-restricted and stays searched, but `optional: true` takes it out
      # of `fraction_found` on both sides of the division.
      #
      # Measured on the 283-genome BFD Mucoromycota sweep: btbA is present in
      # 0 of 207 Minus loci and 57 of 220 Plus loci (26%; 39 of 134 = 29%
      # among strict mat_locus calls). Perfectly specific to Plus, weakly
      # sensitive -- presence argues Plus, absence argues nothing.
      #
      # Before this, Plus was scored against 6 expected genes and Minus
      # against 5, so a COMPLETE Plus locus lacking btbA scored 5/6 = 0.833
      # and could not reach 1.0 while its Minus equivalent could. That is the
      # Plus fraction_found reported in the detect-scoring-idiomorph handoff.
      #
      # Position, from 64495_cbs346-36_MAT_Plus (Phycomyces blakesleeanus
      # CBS 346-36), the ONLY curated record carrying btbA:
      #     tptA(+) -> btbA(+) -> sexP(+) -> rnhA(+)
      # i.e. algA - tptA - [btbA] - sexP/sexM - rnhA - glrA. One reference
      # protein is also why 26% is a floor on its detectability rather than a
      # property of the gene; revisit if more btbA-bearing records are added.
      #
      # CURATOR RULING, J. Stajich, 2026-09-26: btbA is `idiomorph_informative:
      # false`. It still marks the locus (and stays optional), but it no longer
      # votes on Plus vs Minus. Why: the "0 of 207 Minus loci" count above was
      # circular -- btbA's own vote made those loci Plus. In the 294-genome
      # early-diverging scan, 33 Rhizopus calls carried sexM (~96% identity,
      # 99% coverage) and no sexP, yet were labelled Plus; btbA was present in
      # all 33, and as a long protein its bitscore (e.g. 871 in GCA_000696915.1)
      # outvoted sexM (378). See
      # docs/notes/2026-09-26_early-diverging-scan-and-chytrid-control.md.
      #
      # CURATOR RULING, J. Stajich, 2026-09-27: btbA carries NO idiomorph
      # restriction -- it belongs to both. The Plus-only label came from the
      # one curated record above and is now contradicted by the data: btbA
      # sits at 66-99% identity in 29 Rhizopus Minus loci
      # (results/2026-09-27_tier_rule_replay) and in all 33 relabelled
      # Rhizopus Minus calls. This resolves the "revisit if more btbA-bearing
      # records are added" note above. It stays optional and non-voting. The
      # Plus-only label had also made a sexM + btbA locus name both
      # idiomorphs, so its expected core fell back to the full roster and
      # sexP counted as missing.
      - {name: btbA, role: flanking_variable, optional: true, idiomorph_informative: false}
