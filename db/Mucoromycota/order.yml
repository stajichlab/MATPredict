phylum: Mucoromycota
loci:
  - locus_name: "MAT"
    vocabulary_type: "enum"
    idiomorph_values: ["Plus", "Minus"]
    taxonomic_scope: [4827]
    # Flank-carried window (curator's ruling 2026-09-26; results/
    # 2026-09-26_flank_rule_ascomycota/NOTE.md): the flanks sit OUTSIDE the
    # idiomorph, and real loci were found up to 9.9 kb from the flank span.
    flank_carried_window_bp: 20000
    # CURATOR RULING, J. Stajich, 2026-09-20: the detector's 25000 bp default
    # clustering gap is "right for Ascomycota" but too tight for Mucoromycota,
    # which should "start at 50 kb". PROVISIONAL: 50000 is a starting value, not
    # a measured one -- the curator asked that it be revised empirically as more
    # Mucoromycota examples accumulate in this database. Nothing here has been
    # measured from the curated Mucoromycota records yet.
    #
    # CROSS-PHYLUM CONSEQUENCE -- read before changing this number. One run uses
    # ONE clustering gap: the MAXIMUM over all loci that run routed to. So this
    # value is not confined to Mucoromycota. Whenever a run routes to this locus
    # alongside others -- notably the exhaustive fallback used when a query's
    # phylum cannot be determined -- raising this number also widens the
    # clustering gap applied to Ascomycota, Basidiomycota and every other
    # phylum's loci in that same run. Treat a change here as a change to every
    # multi-phylum run's clustering, not a Mucoromycota-only edit.
    max_cluster_gap_bp: 50000
    # CURATOR RULING, J. Stajich, 2026-09-20. sexM and sexP share an HMG box,
    # so one real locus gene is hit by both references -- in all 23
    # ground-truth genomes, at 92-100% coordinate overlap. The overlapping
    # pair is resolved to its higher-identity member, which is 23/23 correct,
    # but the margins split hard by idiomorph: Plus calls separate by
    # 44.6-64.2 points, Minus calls by only 2.3-13.0. Below this margin the
    # call is still made and the tier is capped.
    #
    # PROVISIONAL, like max_cluster_gap_bp above. Revise from the resolution
    # events accumulating in the evidence diagnostics, not by intuition.
    min_idiomorph_margin: 5.0
    genes:
      - {name: tptA, role: flanking_conserved}
      - {name: sexP, role: core_MAT, present_in_idiomorphs: ["Plus"]}
      - {name: sexM, role: core_MAT, present_in_idiomorphs: ["Minus"]}
      - {name: rnhA, role: flanking_conserved}
      # algA and glrA have NO reference protein in any curated record, so no
      # genome can currently match them. They are kept because they are real
      # locus architecture, not because the tool can act on them; scoring
      # excludes an unsearchable gene from the denominator and reports it as
      # `genes_not_searchable` rather than as missing.
      #
      # NAMING, resolved 2026-09-20: `algA` here matches GenBank OR965930.1,
      # which is where both genes' only reference proteins exist. The Idnurm
      # review (doi:10.1128/microbiolspec.funk-0041-2017) calls the same gene
      # `algL`. They are the same gene, confirmed by domain annotation rather
      # than by name: WZC35661 (AlgA, 384 aa) carries Alginate_lyase pfam05426,
      # matching the review's "predicted alginate lyase"; WZC35665 (GlrA,
      # 465 aa) carries Pyr_redox_2, the family glutathione reductase belongs
      # to, consistent with N. crassa NCU03339 (gtr-1) and A. nidulans AN0932.
      # Use `algA`: it is the name attached to deposited sequence.
      #
      # Ingesting OR965930.1 (Mucoraceae sp. AI-2023a = Mooraboolomyces
      # wintlei; Hull, Urquhart & Idnurm 2024, Phytotaxa 644:35-41) would give
      # both genes references and close this gap.
      - {name: algA, role: flanking_variable}
      - {name: glrA, role: flanking_variable}
      # CURATOR RULING, J. Stajich, 2026-09-20: "btbA shouldn't count in the
      # denominator but we should know when it is present." So it stays
      # Plus-restricted and stays searched, but `optional: true` takes it out
      # of `fraction_found` on both sides of the division.
      #
      # Measured on the 283-genome BFD Mucoromycota sweep: btbA is present in
      # 0 of 207 Minus loci and 57 of 220 Plus loci (26%; 39 of 134 = 29%
      # among strict mat_locus calls). Perfectly specific to Plus, weakly
      # sensitive -- presence argues Plus, absence argues nothing.
      #
      # Before this, Plus was scored against 6 expected genes and Minus
      # against 5, so a COMPLETE Plus locus lacking btbA scored 5/6 = 0.833
      # and could not reach 1.0 while its Minus equivalent could. That is the
      # Plus fraction_found reported in the detect-scoring-idiomorph handoff.
      #
      # Position, from 64495_cbs346-36_MAT_Plus (Phycomyces blakesleeanus
      # CBS 346-36), the ONLY curated record carrying btbA:
      #     tptA(+) -> btbA(+) -> sexP(+) -> rnhA(+)
      # i.e. algA - tptA - [btbA] - sexP/sexM - rnhA - glrA. One reference
      # protein is also why 26% is a floor on its detectability rather than a
      # property of the gene; revisit if more btbA-bearing records are added.
      - {name: btbA, role: flanking_variable, present_in_idiomorphs: ["Plus"], optional: true}
