"$schema": "http://json-schema.org/draft-07/schema#"
title: MATPredict per-phylum locus/idiomorph controlled vocabulary
type: object
required: [phylum, loci]
properties:
  phylum: {type: string}
  # OPTIONAL. May this phylum's calls be labelled `homothallic_candidate`?
  # ABSENT MEANS true. A locus entry may override it with the same key.
  # Curator's ruling 2026-09-26: false for Basidiomycota.
  homothallic_screen: {type: boolean}
  loci:
    type: array
    minItems: 1
    items:
      type: object
      required: [locus_name, vocabulary_type, genes, taxonomic_scope]
      properties:
        locus_name: {type: string}
        vocabulary_type: {enum: [enum, pattern]}
        idiomorph_values: {type: array, items: {type: string}}
        # OPTIONAL (curator ruling 2026-10-01, B9): idiomorph label -> cross-
        # lineage class on the MAT1-1 (alpha box) / MAT1-2 (HMG) axis. Report only.
        idiomorph_class:
          type: object
          additionalProperties: {enum: [MAT1-1, MAT1-2, unassigned]}
        idiomorph_pattern: {type: string}
        # OPTIONAL. How far apart (bp) two tblastn hits of this locus may be and
        # still be clustered as one candidate locus. ABSENT MEANS 25000: that was
        # the single global constant the detector used for every phylum, and the
        # curator ruled on 2026-09-20 that it is right for Ascomycota, so a locus
        # only declares this field when it is known to need something else. The
        # run's gap is the MAXIMUM over the routed loci, because under-splitting
        # is recoverable (the evidence floor and polishing still discriminate
        # within an over-large cluster) while over-splitting silently destroys a
        # real locus by cutting it in two. Because it is the MAXIMUM over the
        # routed loci, one phylum's value can widen another phylum's clustering:
        # in any run that routes to several phyla's loci at once (e.g. the
        # exhaustive fallback), the largest declared gap wins for all of them.
        max_cluster_gap_bp:
          type: integer
          minimum: 1
        # OPTIONAL. How far (bp) from its flank span a flank-carried call's
        # strongest core hit may lie and still be kept (detect.flank_carried).
        # ABSENT MEANS 3000, the curator's first ruling. Curator's ruling
        # 2026-09-26: 3000 where the flanks sit inside the idiomorph (Serinales
        # MTL), 20000 where they sit outside it (SLA2/APN2/COX13, tptA/rnhA).
        flank_carried_window_bp:
          type: integer
          minimum: 0
        # OPTIONAL. Bitscore the strongest core hit of a flank-carried call
        # must reach (detect.flank_carried). ABSENT MEANS 39, the curator's
        # ruling of 2026-09-27 (replacing E <= 1e-5).
        flank_carried_min_bitscore:
          type: number
          minimum: 0
        # OPTIONAL. Split-locus rule (detect.split_locus; curator's ruling
        # 2026-09-27): `false` turns it off; a mapping overrides any of
        # min_core_identity (95), max_edge_bp (500), min_flank_genes (2),
        # flank_identity_gap (10). ABSENT MEANS the defaults (rule on).
        split_locus:
          oneOf:
            - {type: boolean}
            - type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean}
                min_core_identity: {type: number, minimum: 0, maximum: 100}
                max_edge_bp: {type: integer, minimum: 0}
                min_flank_genes: {type: integer, minimum: 1}
                flank_identity_gap: {type: number, minimum: 0}
        # OPTIONAL. Families of one physical locus type share a merge_group;
        # their overlapping calls are reported once (detect.locus_merge;
        # curator's ruling 2026-09-27). merge_generic marks the broad
        # catch-all family of the group. ABSENT MEANS never merged.
        merge_group: {type: string}
        merge_generic: {type: boolean}
        # OPTIONAL. Two merge_separately families of one group never merge with
        # each other (e.g. Aalpha/Abeta; curator 2026-09-28, provisional).
        merge_separately: {type: boolean}
        # OPTIONAL. Write a genome-level two_idiomorphs statement when the
        # family calls both idiomorphs (detect.two_idiomorphs; curator's
        # ruling 2026-09-29, test first). Report-level only.
        two_idiomorphs_report: {type: boolean}
        # OPTIONAL. Locus-level override of the phylum's homothallic_screen.
        homothallic_screen: {type: boolean}
        # OPTIONAL (curator ruling 2026-10-01). false = scope-only family: never
        # searched in phylum fallback or an explicit-phylum run. Absent = true.
        fallback_searchable: {type: boolean}
        # OPTIONAL. Polish both genes of an overlapping mutually exclusive
        # pair and decide it on the two models (curator's ruling 2026-09-26,
        # Mucoromycota sexM/sexP). Absent means false.
        model_idiomorph_alternatives: {type: boolean}
        # OPTIONAL. Profile-HMM idiomorph classifier over the modelled core
        # proteins (curator's ruling 2026-09-26). `dir` is relative to the
        # phylum directory; files are built by scripts/build_idiomorph_hmms.py.
        # OPTIONAL. Strict-CAAX pheromone-precursor scan beside receptor hits
        # (detect/caax.py; curator's ruling 2026-09-27, Basidiomycota:PR).
        # `gene` must be a gene of this locus (declare it optional);
        # `receptor_genes` are the genes whose hits are scanned around.
        pheromone_precursor_scan:
          type: object
          required: [gene, receptor_genes]
          additionalProperties: false
          properties:
            gene: {type: string}
            receptor_genes: {type: array, items: {type: string}, minItems: 1}
            motif: {type: string}
            window_bp: {type: integer, minimum: 1}
            min_codons: {type: integer, minimum: 1}
            max_codons: {type: integer, minimum: 1}
        idiomorph_classifier:
          type: object
          required: [type, dir, min_margin]
          additionalProperties: false
          properties:
            type: {enum: [hmm]}
            dir: {type: string}
            min_margin: {type: number, minimum: 0}
            # MAT-gene gate (detect/mat_gene_gate.py; curator 2026-09-28).
            mat_gene_min_score: {type: number, minimum: 0}
            flank_support_min_identity: {type: number, minimum: 0, maximum: 100}
            flank_support_min_genes: {type: integer, minimum: 0}
        taxonomic_scope:
          type: array
          minItems: 1
          items: {type: integer}
        genes:
          type: array
          items:
            type: object
            required: [name, role]
            properties:
              name: {type: string}
              role: {enum: [core_MAT, flanking_conserved, flanking_variable]}
              # gene_class is OPTIONAL and orthogonal to role: role says where a gene
              # sits structurally in the locus (core vs flanking); gene_class says what
              # functional class it belongs to, to let a gene keep its literal,
              # literature/deposit-faithful `name` (e.g. bar3, STE3, pheromone_B43) while
              # still being grouped with functionally-equivalent genes named differently
              # in other families (e.g. STE3/bar3/bbr2/pra1 are all pheromone receptors).
              # EVIDENCE BAR. Populate gene_class only from one of the sources below:
              #   1. The DB's own curated records document the functional identity -- a
              #      definition_note, a product name, or an explicit citation on the
              #      record itself. This is the original bar and is still PREFERRED.
              #   2. An explicit ruling by the project's curator (J. Stajich). Record the
              #      provenance in a comment beside the entry, stating WHO decided it,
              #      WHEN, WHAT THEY ACTUALLY SAID, and WHAT WAS AND WAS NOT VERIFIED
              #      (e.g. a citation they supplied that this project could not
              #      retrieve, or a sub-distinction they did not themselves specify).
              #      The Basidiomycota MAT SXI1/SXI2 and bLocus bE/bW comments are the
              #      model for what this requires.
              #   2b. An IMPLEMENTER PROPOSAL THAT THE CURATOR EXPLICITLY ACCEPTED,
              #      recorded as such. The comment must name BOTH what was proposed and
              #      what the curator actually said, and must state what was and was not
              #      verified, exactly as source 2 requires. This is NOT "own initiative":
              #      the distinguishing feature is that the curator saw the proposal and
              #      ratified it, and the record says so. Both flagship cases are of this
              #      kind. The HD1-vs-HD2 split (SXI1/SXI2, bE/bW, Y/Z) was proposed from
              #      general literature knowledge and then accepted by the curator; the
              #      gene-named apn2_homolog/sla2_homolog pair was one of three namings an
              #      implementer offered, and the curator chose it. An unratified proposal
              #      does not qualify, and neither does one whose ratification is not
              #      written down.
              # Everything else is still prohibited: an IMPLEMENTER MUST NOT infer a
              # gene_class from outside literature on its own initiative. Leave the
              # field absent instead, and raise the question with the curator.
              # A proposal that the curator has not yet seen and accepted is exactly this
              # prohibited case, not source 2b.
              # Sources 2 and 2b were added on 2026-09-19, when the curator ruled on
              # apn2_homolog/sla2_homolog and the four HD1/HD2 assignments; the original
              # rule was not dead, it was incomplete -- it was written to stop an
              # implementer inferring a class, which a curator ruling, or the curator
              # ratifying an implementer's proposal, is not.
              # NAMES PROVISIONAL: on 2026-09-19 the curator stated "I will review these
              # to confirm names". The gene_class VALUE NAMES assigned that day --
              # apn2_homolog, sla2_homolog, and the HD1/HD2 assignments -- are therefore
              # pending the curator's own confirmation of naming, and the enum may be
              # renamed on that review. This is about the chosen names only; that these
              # genes are classified at all is settled.
              #
              # The two `*_homolog` values are named after a CANONICAL GENE rather than
              # a molecular function, unlike every other value here. This is a deliberate
              # user decision: the conserved genes flanking a MAT locus are grouped by
              # "this is the APN2 orthologue" / "this is the SLA2 orthologue", which is
              # how the literature and the curated records themselves refer to them, and
              # their actual functions (DNA-repair endonuclease, cytoskeletal adaptor) are
              # not what makes them worth colouring together in a locus figure. Naming by
              # canonical gene also extends cleanly to the other flanking genes that will
              # be classified later (COX13, etc.) without inventing a function label for
              # each one.
              gene_class:
                enum: [alpha_box, HMG_box, pheromone_receptor, pheromone_precursor, HD1, HD2,
                       apn2_homolog, sla2_homolog, matA-2, matA-3]
              present_in_idiomorphs: {type: array, items: {type: string}}
              # polish: which tools model this gene. Absent = both exonerate and
              # miniprot. `miniprot` skips exonerate -- for long, conserved genes
              # where exonerate dominates runtime (curator ruling 2026-09-26,
              # PAP1/OBP1/PIK1 in MTL).
              polish: {enum: [miniprot]}
              # slot: groups OPTIONAL idiomorph-alternative genes into one bonus
              # scoring unit (detect.scoring.score_cluster). Found -> +1 to the
              # numerator and denominator of fraction_found; absent -> no effect.
              # Curator-approved 2026-09-26 for Cryptococcus SXI1/SXI2.
              slot: {type: string}
