    reference_orientation: SLA2->MAT1-2-1->APN2(-)
    definition_note: 'MAT locus of Xanthoria parietina, cloned by Scherrer et al.
      2005 from a genomic lambda phage library of an aposymbiotic multispore culture
      (GenBank AJ884600.1, source /cell_line="aposymbiotic multispore culture", Switzerland:
      Zurich). No strain or culture-collection identifier is given in the deposit,
      hence strain.known = false. This is the accession that supplies CAI59775.1,
      the APN2 ("putative DNA lyase") query protein used by Pizarro et al. 2019 for
      their Lecanoromycetes-wide tBLASTn screen. All coordinates, strands and protein
      accessions were re-read from the GenBank flatfile via NCBI efetch on 2026-09-17.
      Segment span is the full deposited fragment (1..6588) and is curator_derived;
      unlike the two X. polycarpa deposits, this record carries no misc_feature annotating
      an idiomorph interval.

      Two points require care. (1) MAT1-2-1 here is TRUNCATED: the deposit annotates
      the CDS as join(3368..3519,3571..3733) with /note="truncated protein, interrupted
      by stop codon at beginning of HMG box", while the gene/mRNA feature extends
      to 4723. The coordinates recorded below (3368..3733) are the annotated CDS span
      that actually produces CAI59774.2, not the mRNA span. The gene is recorded as
      present because the locus carries a MAT1-2-1 ORF, but downstream users should
      know the encoded protein is stop-truncated in this deposit. (2) mating_type.system:
      Scherrer et al. 2005 found an HMG fragment but no alpha-box fragment in all
      eight single-spore isolates of one ascus, i.e. the species is self-fertile while
      carrying only the MAT1-2 idiomorph. Scherrer et al. call this obligate (behavioural)
      homothallism; Pizarro et al. 2019 re-describe the same result as unisexuality
      -- "although being genetically heterothallic, all descendants of meiosis contained
      only MAT1-2" -- i.e. secondary homothallism. The schema enum has no "unisexual"
      value; "homothallic" is used here for the observed self-fertility, and the locus
      architecture (a single MAT1-2 idiomorph, no alpha gene) is what the gene list
      records. This is a real interpretive disagreement in the literature, not a curation
      artifact.

      The GenBank gene name for the APN2 anchor is "DNA lyase" and is recorded here
      as APN2, the order.yml flanking_conserved name. SLA2 and APN2 are partial CDS
      features at the fragment ends; "complete" means both anchoring genes are present
      and flank the idiomorph.

      '
