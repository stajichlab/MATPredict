  idiomorph_assignment:
    tier: 1
    experimental_method: PCR assay on eight single-spore isolates derived from one
      ascus -- all carried an HMG fragment and none carried an alpha-box fragment,
      assigning this locus to MAT1-2 and demonstrating that only MAT1-2 segregates
      in this species
    citations:
