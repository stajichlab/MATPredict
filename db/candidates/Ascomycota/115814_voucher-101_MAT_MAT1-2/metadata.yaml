    definition_note: 'MAT1-2-1 gene of Dufourea flammea (deposited under the name
      Xanthoria flammea; NCBI taxid 115814 lists "Xanthoria flammea" as a synonym),
      specimen voucher 101, GenBank AJ888227.1, from Scherrer et al. 2005. This is
      the accession that supplies CAI59780.2, the HMG-domain query protein used by
      Pizarro et al. 2019 for their Lecanoromycetes-wide tBLASTn screen. Coordinates,
      strand and protein accession were re-read from the GenBank flatfile via NCBI
      efetch on 2026-09-17.

      IMPORTANT LIMITATION: this deposit is only 1752 bp and contains the MAT1-2-1
      gene alone. Neither anchoring gene (SLA2, APN2) is present, so the MAT locus
      boundaries are NOT established for this species. completeness is "partial" and
      excluded_from_coordinate_benchmark is true for exactly that reason: the recorded
      segment is simply the extent of the deposited fragment (1..1752), chosen by
      the curator, and must not be scored as a locus-boundary prediction target. Only
      the gene-level coordinates (291..1448) are meaningful here.

      The species is recorded as heterothallic because the opposite idiomorph exists
      in this species as a separate Scherrer et al. deposit (AJ888131.1, "Xanthoria
      flammea partial MAT1-1-1 gene ... specimen voucher 2", 397 bp), i.e. different
      individuals carry different idiomorphs. That is inference from two deposits,
      not a segregation experiment in this species; Scherrer et al. ran their single-ascus
      segregation assay on X. polycarpa, X. parietina and X. elegans, not on D. flammea.

      '
