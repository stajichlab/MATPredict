    reference_orientation: SLA2->MAT1-2-1->APN2(-)
    definition_note: 'MAT1-2 idiomorph of Polycauliona polycarpa (published as Xanthoria
      polycarpa), the opposite-idiomorph partner of record 1301501_voucher-215_MAT_MAT1-1.
      Sequence is EMBL/GenBank AJ884598.1 (specimen voucher 267) from Scherrer et
      al. 2005. This is the accession that supplies CAI59767.1, the SLA2 query protein
      used by Pizarro et al. 2019 for their genome-wide tBLASTn screen of Lecanoromycetes.
      Segment span is the whole deposited fragment (1..5698) and is curator_derived;
      the deposit itself annotates the idiomorph interval explicitly as misc_feature
      1786..4941 ("MAT1-2 idiomorph"). All gene coordinates, strands and protein accessions
      were re-read from the GenBank flatfile via NCBI efetch on 2026-09-17.

      The GenBank gene name for the APN2 anchor is "DNA lyase"; recorded here as APN2,
      the order.yml flanking_conserved name (APN2 is the DNA lyase anchoring the Pezizomycotina
      MAT locus; Pizarro et al. 2019 use the X. parietina orthologue CAI59775.1 as
      their APN2 query). SLA2 and APN2 are partial CDSs at the fragment ends; "complete"
      means both anchoring genes are present and flank the idiomorph, not that each
      anchor CDS is full length.

      '
