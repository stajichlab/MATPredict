  idiomorph_assignment:
    tier: 1
    experimental_method: 'HMG-box identity of MAT1-2-1 plus an experimental single-ascus
      segregation assay: eight single-spore isolates from one ascus of X. polycarpa
      each carried either an HMG or an alpha-box fragment, never both'
    citations:
