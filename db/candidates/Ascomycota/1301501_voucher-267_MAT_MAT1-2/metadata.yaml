    tier: 1
    experimental_method: PCR amplification, cloning and sequencing of the MAT1-2 idiomorph
      of X. polycarpa using the SLA2 and DNA lyase (APN2) flanking genes as anchors,
      after the locus was first cloned from a genomic lambda phage library of X. parietina
      (Scherrer et al. 2005)
