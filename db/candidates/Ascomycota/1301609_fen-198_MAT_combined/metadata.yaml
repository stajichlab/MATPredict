evidence:
  locus_existence:
    tier: 2
    experimental_method: BLASTx of the assembly against a curated sla2/apn2/MAT1-1/MAT1-2
      query database (bit score >75), Augustus v3.3 gene prediction with A. nidulans
      parameters on the hit contigs, and PSI-BLAST confirmation of the predicted proteins
      (White et al. 2024). This is genome-annotation/homology evidence only -- no
      mating assay, crossing experiment, transcript evidence, or targeted locus cloning
      was performed for this species. Tier 2 per this project's strict evidence bar.
      For THIS record the underlying assembly is not public, so even the genome-annotation
      evidence cannot be independently re-derived.
