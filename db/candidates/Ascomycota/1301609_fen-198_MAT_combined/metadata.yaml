    completeness: fragmented
    reference_orientation: '[NODE_352] MAT1-1-1<-APN2 | [NODE_39] hypothetical-protein->MAT1-2-1->SLA2(fused)'
    definition_note: 'BOTH idiomorph genes present in one genome (alpha-box MAT1-1-1
      and HMG-box MAT1-2-1), so the architecture recorded here is homothallic, on
      two separate assembly contigs.


      *** COORDINATES ARE NOT INDEPENDENTLY NCBI-VERIFIABLE FOR THIS RECORD. *** Supplementary
      Table S1 gives this sample''s accession as SAMN19302549, which is a BioSample,
      not an assembly or nucleotide accession. The curator confirmed SAMN19302549
      is real (Xanthocarpia feracissima, sample FEN_198, University of Colorado Boulder)
      but it has SRA reads only (SRR14722176) and NO linked assembly at NCBI. The
      reported contigs ''NODE_352_length_19404_cov_4.31037'' and ''NODE_39_length_44817_cov_4.00986''
      are raw SPAdes contig names from the authors'' own unsubmitted assembly and
      are not retrievable from NCBI. The only Xanthocarpia feracissima assembly at
      NCBI, GCA_964255735.1 (WGS CAXUYH01, BioSample SAMEA115958149), is a metabat2
      bin of the SAME reads (SRR14722176) submitted independently by the Spribille
      Lab in 2024 -- it is a DIFFERENT assembly, so the NODE_39/NODE_352 coordinates
      cannot be transferred onto it without re-running an alignment. Consequently
      sequence_source.type is ''none'', no segment coordinates are recorded, gene
      coordinates are carried as published-only, and excluded_from_coordinate_benchmark
      is TRUE. Gene coordinates below are transcribed from the paper''s table and
      were NOT re-derived from any NCBI sequence -- do not treat them as equivalent
      to the NCBI-verified Xanthoria records.


      PAPER-INTERNAL CONTRADICTION: S1''s ''MAT_Scaffolds'' sheet calls this sample
      heterothallic, but S1''s ''Homothallic'' sheet lists it with both MAT1-1 and
      MAT1-2 genes, and the paper''s own read-depth test for it (BUSCO 45.6x, alpha-box
      47.7x, HMG 51.9x; p = 0.56 and 0.67) is non-significant, i.e. consistent with
      both idiomorphs at single-genome depth. This record follows the observed gene
      content and the depth test (homothallic) and flags the conflict for the reviewer.
      S1 also names the sample ''FEN_98'' on the Depth sheet while the BioSample record
      names it FEN_198.


      The contig arrangement is APN2 + MAT1-1-1 on NODE_352 (both minus strand) and
      MAT1-2-1 + SLA2 on NODE_39, i.e. the two idiomorph genes are NOT adjacent here,
      unlike the Xanthoria records. S1 additionally reports an unnamed hypothetical
      protein (41649-42513, minus) between them on NODE_39, and states that the SLA2
      CDS is fused with an upstream polymerase-zeta prediction and gives NO coordinates
      for SLA2 -- SLA2 is therefore recorded as present with null coordinates.'
