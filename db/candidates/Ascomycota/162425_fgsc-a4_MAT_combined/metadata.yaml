    reference_orientation: 'segment 0 (chr VI): SLA2->MAT1-1-1 | segment 1 (chr III):
      COX13->APN2->(APC5)->MAT1-2-1'
    definition_note: 'Homothallic. A. nidulans does NOT have a single contiguous MAT
      locus: the alpha-box gene (MAT1-1-1; RefSeq gene name MAT1 / ANIA_02755; = matB-1-1
      of Miller & Miller, GenBank AY339600.1) and the HMG-domain gene (MAT1-2-1; RefSeq
      gene name MAT2 / ANIA_04734; = matA-2, GenBank AY328028.1) are UNLINKED and
      sit on different chromosomes (VI and III respectively). Curator verified this
      directly: XP_660359.1 is 100% identical to AAQ01665.1 (matB-1-1, annotated chromosome
      VI) and XP_050467652.1 is 100% identical to AAP92161.1 (matA-2, annotated chromosome
      III). Each gene retains one half of the canonical Pezizomycotina MAT flank:
      SLA2 (slaB, ANIA_02756) is adjacent to the alpha-box gene on chromosome VI,
      while COX13, APN2 and APC5 are adjacent to the HMG gene on chromosome III --
      the arrangement reported by Galagan et al. 2005. APC5 (ANIA_04735, XP_662339.1,
      1142412-1145047, minus strand) lies between APN2 and the HMG gene but is omitted
      from the gene list because it is not in this phylum''s order.yml gene vocabulary.
      Because the two segments are on different chromosomes this record is excluded
      from the coordinate benchmark; completeness is recorded as ''fragmented'' to
      describe the biological split, NOT an assembly gap. Uses the existing Pezizomycotina
      ''MAT'' locus_name; both idiomorph values are listed because a single haploid
      genome carries both genes.'
