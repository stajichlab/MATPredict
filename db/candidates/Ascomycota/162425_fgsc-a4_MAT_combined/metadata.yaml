evidence:
  locus_existence:
    tier: 1
    experimental_method: 'Functional characterisation of both MAT genes in A. nidulans:
      expression of the alpha-box and HMG-domain MAT genes is required for normal
      sexual development and ascospore production, and balanced MAT overexpression
      stimulates sexual differentiation (Paoletti et al. 2007); a sterile A. nidulans
      deltamatA (HMG) deletion strain was restored to full fertility by homologous
      gene replacement at the matA locus (Pyrzak et al. 2008).'
    citations:
    - pmid: '17669651'
      doi: 10.1016/j.cub.2007.07.012
    - pmid: '18245277'
      doi: 10.1128/EC.00380-07
  boundaries:
    tier: 2
    experimental_method: No published base-level locus coordinates. Coordinates are
      curator-derived from the FGSC A4 RefSeq annotation (NC_066262.1, NC_066259.1)
      fetched directly via NCBI efetch on 2026-09-17; the unlinked two-chromosome
      architecture is reported by Galagan et al. 2005 and was independently reconfirmed
      by the curator against GenBank AY339600.1 and AY328028.1.
    citations:
    - pmid: '16372000'
      doi: 10.1038/nature04341
  idiomorph_assignment:
    tier: 1
    experimental_method: 'Homothallic: a single haploid genome carries both an alpha-box
      and an HMG-domain MAT gene, and both are functionally required for self-fertility
      (gene deletion / expression analysis, Paoletti et al. 2007; Pyrzak et al. 2008).'
    citations:
    - pmid: '17669651'
      doi: 10.1016/j.cub.2007.07.012
    - pmid: '16372000'
      doi: 10.1038/nature04341
