    reference_orientation: COX13->APN2->MAT1-1-4->MAT1-1-1
    definition_note: 'MAT1-1 idiomorph of Coccidioides posadasii strain RMSCC1040,
      from the targeted GenBank deposit EF512013.1 of Mandel et al. 2007 (8,746 bp;
      curator confirmed the flatfile REFERENCE block cites PMID 17513566). The deposit
      carries an explicit misc_feature ''MAT1-1 idiomorph'' at 478..8527 (8,050 bp),
      matching the 8.1 kb figure in the paper''s abstract; that feature is used as
      the segment. Four genes, as the paper states: cox13, APN2, an unknown-function
      gene deposited as MAT1-1-4, and the alpha-box gene MAT1-1-1 (ABS19622.1). Curator
      note on a secondary-source error encountered during this curation: ABS19621.1
      (this record''s MAT1-1-4) and ABS19617.1 (the C. immitis equivalent on AH015916.2)
      are the UNKNOWN-FUNCTION proteins, not the alpha-box MAT1-1-1 proteins; the
      alpha-box proteins are ABS19622.1 (C. posadasii) and ABS19618.1 (C. immitis).
      Verified directly by efetch. Gene-name convention: in the source GenBank deposits
      of Mandel et al. 2007 the captured flanking genes are given MAT-style names
      (cox13 = ''MAT1-1-2'', APN2 = ''MAT1-1-3''). Those names COLLIDE with the unrelated
      Sordariomycete core genes MAT1-1-2/MAT1-1-3 already used in this phylum''s order.yml,
      so this record uses the gene-identity names COX13 and APN2 with role flanking_conserved,
      exactly as done for the Cytospora mali record where the same genes are found
      inside the idiomorph. Note the biology: in Coccidioides APN2 and COX13 are CAPTURED
      INSIDE the MAT idiomorph rather than merely flanking it, and the MAT1-1 and
      MAT1-2 copies have diverged strongly from each other (Fraser et al. 2007; Mandel
      et al. 2007). The role vocabulary describes gene identity, not physical position;
      order_in_locus reflects the true order. No sexual cycle has ever been observed
      in Coccidioides, and no functional characterisation of these MAT genes exists,
      so ALL evidence keys in this record are tier 2.'
