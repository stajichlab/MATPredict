evidence:
  locus_existence:
    tier: 2
    experimental_method: Targeted sequencing of the idiomorph plus cDNA structure
      determination showing all idiomorph genes are transcribed (Mandel et al. 2007);
      independently identified by Fraser et al. 2007. No mating has ever been observed
      in Coccidioides and no functional validation of these genes exists.
    citations:
    - pmid: '17513566'
      doi: 10.1128/EC.00117-07
    - pmid: '17337636'
      doi: 10.1128/EC.00018-07
  boundaries:
    tier: 2
    experimental_method: Idiomorph boundary explicitly published (8.1 kb) and explicitly
      annotated as misc_feature 478..8527 on EF512013.1; re-fetched and checked by
      the curator via NCBI efetch. Tiered 2 rather than 1 because the boundary rests
      on sequence comparison, with no functional validation.
    citations:
    - pmid: '17513566'
      doi: 10.1128/EC.00117-07
  idiomorph_assignment:
    tier: 2
    experimental_method: Alpha-box domain identity plus diagnostic PCR mating-type
      typing of 436 Coccidioides isolates showing a 1:1 MAT1-1:MAT1-2 ratio (Mandel
      et al. 2007). Sequence-detection assay, not a functional mating assay.
    citations:
    - pmid: '17513566'
      doi: 10.1128/EC.00117-07
