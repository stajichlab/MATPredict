    definition_note: 'Paired MAT1-2 idiomorph to 230073_uamh-1363_MAT_MAT1-1 (different
      isolate, same species -- expected for a heterothallic species, each isolate
      carries only one idiomorph). Central finding of Tsui et al. 2013: this MAT1-2
      idiomorph contains a TRUNCATED MAT1-1-1 remnant (alpha-box domain deleted, gene_index
      1 below) immediately upstream of the functional MAT1-2-1 gene, attributed to
      an ancient unequal recombination event. The truncated gene is included here
      as present:true with role core_MAT (it has a real annotated CDS in GenBank,
      AGH03258.1) but is almost certainly non-functional as a transcription factor
      per the paper''s analysis -- this is a genuine biological finding to preserve
      in the record, not a data-quality issue with this curation.

      '
