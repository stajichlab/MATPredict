    reference_orientation: SLA2->MAT1-1-1->MAT1-1-2->MAT1-1-3
    definition_note: 'Uses the existing Pezizomycotina "MAT" locus_name (idiomorphs
      MAT1-1/MAT1-2). Added MAT1-1-2 and MAT1-1-3 to order.yml''s gene list for this
      locus (previously only MAT1-1-1/MAT1-2-1 were listed) since this species (like
      Neurospora, Podospora, Schizothecium, and others in Sordariales) carries all
      three MAT1-1 genes. This is one of eight Ophiostomatales species with identical
      MAT gene organization reported by Tsui et al. 2013; O. montium was chosen over
      the CSV''s headline species (Grosmannia clavigera) because this specific accession
      (JX402993.1) has a complete, directly fetchable GenBank CDS annotation for all
      four genes on one contiguous 6814 bp segment, whereas no single clean per-locus
      accession for G. clavigera itself was found among the accessions given in the
      source data.

      '
