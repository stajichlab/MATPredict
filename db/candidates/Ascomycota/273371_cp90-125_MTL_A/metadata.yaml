    reference_orientation: PAP1->OBP1->PIK1->MTLA2->MTLA1
    definition_note: 'Lodderomyces (Candida) orthopsilosis Cp90-125 (type 2 isolate) MTL a idiomorph,
      GenBank HQ696681.1 (Sai et al. 2011): MTLa1 (ADY62691.1, 183 aa, three exons) and MTLa2 (ADY62690.1,
      two exons), plus the idiomorph-specific PAP1 (PAPa), OBP1 (OBPa) and PIK1 (PIKa) alleles (optional
      flanking_variable roster genes). The deposit also carries a 5''-partial GAP1, orf19.3202, RCY1 and
      a 3''-partial orf19.3204, which are not MTL roster genes and are not curated. Sai et al. report
      the regulatory genes intact, but splicing of the introns in MTLa1 and MTLa2 is defective in C. orthopsilosis
      in the isolate tested, so the deposited gene structures are the annotated ones, not shown to be
      spliced in vivo.'
