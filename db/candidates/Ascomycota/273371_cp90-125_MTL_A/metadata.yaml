evidence:
  locus_existence:
    tier: 2
    experimental_method: Cloning and sequencing of the MTL a idiomorph of C. orthopsilosis 90-125 from
      a fosmid library, deposited as HQ696681.1 (Sai et al. 2011, Eukaryot Cell 10:578-587). 'We sequenced
      both idiomorphs ... the regulatory genes are intact.'
    citations: &id001
    - pmid: '21335529'
      doi: 10.1128/EC.00276-10
  boundaries:
    tier: 2
    experimental_method: The record segment spans the curated MTL roster genes on the deposit HQ696681.1
      (PAP1 through MTLA1); the idiomorph's own boundaries (the left junction of MTL alpha lies between
      the stop codons of MTLalpha2 and GAP1) are described in the paper.
    citations: *id001
  idiomorph_assignment:
    tier: 2
    experimental_method: Idiomorph A by gene content (MTLa1, MTLa2) of the sequenced idiomorph, which
      Sai et al. identify as the MTL a idiomorph of C. orthopsilosis (isolate 90-125, listed in the paper's
      accession table as HQ696681, MTL a).
    citations: *id001
