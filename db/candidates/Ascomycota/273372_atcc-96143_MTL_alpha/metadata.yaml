    definition_note: Lodderomyces (Candida) metapsilosis ATCC 96143 MTL ALPHA idiomorph, GenBank HQ696678.1
      (Sai et al. 2011). The deposit names its genes MTLa1, MTLa2, PAPa, OBPa and PIKa, but Sai et al.
      state that this is the MTL alpha idiomorph (all 18 C. metapsilosis isolates carry only MTL alpha).
      The two regulators are therefore Mtlalpha1 (ADY62670.1, 208 aa, one exon; the paper's alignment
      of Mtlalpha1 sequences shows a repeated motif specific to C. metapsilosis) and Mtlalpha2 (ADY62667.1,
      194 aa, two exons); the deposit's 'a' gene names are not evidence of an a idiomorph. PAP1 (ADY62671.1),
      OBP1 (ADY62668.1) and PIK1 (ADY62669.1) are the idiomorph-specific alleles (optional flanking_variable
      roster genes). GAP1, orf19.3202 and the other deposited genes are not MTL roster genes and are not
      curated.
