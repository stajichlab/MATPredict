  notes: 'Proposed 2026-10-25 (Claude Code) from the cited deposit HQ696678.1. The GenBank gene names
    (MTLa1, MTLa2, PAPa, OBPa, PIKa) contradict the paper, which calls this the MTL alpha idiomorph; the
    record follows the paper. The earlier repository note listing HQ696678.1 as an MTLa locus is wrong.
    The deposit has no transl_table and its proteins translate CTG as Leu; the record uses table 12 (CTG
    = Ser) like the other Serinales records, so the independent re-translation differs from the deposited
    proteins at exactly the CTG codons (MTLalpha2 3, PIK1 8, MTLalpha1 4, PAP1 2 residues). mating_type.system
    is unknown: all 18 isolates carry only MTL alpha and mating has not been observed.'
