    definition_note: 'Complete SLA2-MAT1-2-1-APN2 anchored MAT locus of Cladonia grayi,
      GenBank MH795990.1 (5994 bp), submitted by Miao, Armaleo and McDonald and published
      with Armaleo et al. 2019 (BMC Genomics 20:605), the Cladonia grayi / C. metacorallifera
      genome paper. All coordinates, strands and protein accessions were re-read from
      the GenBank flatfile via NCBI efetch on 2026-09-17. Segment span is the full
      deposited fragment (1..5994), chosen by the curator; the deposit annotates no
      idiomorph interval.

      EVIDENCE TIER: 2 for every field. This locus is derived from genome sequence
      and homology-based annotation, with no experimental mating or segregation assay
      reported for this species. That is the correct tier under this project''s rule
      even though the source is a peer-reviewed genome paper.

      RELATION TO PIZARRO ET AL. 2019: that paper''s supplementary table S1 lists
      Cladonia grayi as MAT1-1, scored from the JGI genome (table S2: "JGI/Cgr/DA2myc/ss
      v2.0"). This record is MAT1-2 and comes from a DIFFERENT sample -- MH795990.1
      reports source /tissue_type="natural thallus", /geo_loc_name="USA", /collected_by="D.
      Armaleo", with no strain or isolate given, so it is not the sequenced JGI culture.
      Both can be true for a heterothallic species whose individuals carry one idiomorph
      each. strain.known is false and differs_from_sequenced is true for this reason.
      Pizarro et al. 2019 is NOT cited as the evidence source for this record, because
      their Table S1 entry describes a different sample and a different idiomorph;
      the citation used is the deposit''s own publication.

      The deposit also annotates misc_feature complement(880..1405) /note="mat1-1-1
      like region" inside the MAT1-2 idiomorph. That feature is not recorded as a
      gene here: it is a similarity-based note with no CDS, no protein accession and
      no stated function, and recording it as a MAT1-1-1 gene would be an over-call.
      It is flagged here because a MAT1-1-1-like remnant inside a MAT1-2 idiomorph
      is biologically interesting and a reviewer may want to follow it up.

      sla2 and apn2 are partial CDS features at the fragment ends (<1..295 and 5835..>5994);
      "complete" means both anchoring genes are present and flank the idiomorph, the
      same sense used by Pizarro et al. 2019, not that each anchor CDS is full length.

      '
