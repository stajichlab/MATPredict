    definition_note: 'DRAFT candidate, not a curated record (proposed 2026-11-15,
      MAT discovery session; evidence in docs/notes/2026-11-14_mat-discovery-strategy-taphrinomycotina.md).
      An HMG-box gene that is the reciprocal best hit of the curated Taphrina deformans
      matMc, and a homeodomain-encoding region that matches the curated T. deformans
      matPi, lie 7,146 bp apart on NW_024468021.1 of Protomyces lactucae-debilis 12-1054
      (both on the minus strand). Two annotated genes (F003EF48_006293 on +, F003EF48_006294
      on -) lie between them, so the two are not adjacent genes. The HMG gene is the
      BFD funannotate model F003EF48_006292 (2 exons, 30356-31000). The homeodomain
      gene has no BFD model; the entry here is the tblastn region (38146-38599), not
      a gene model. Gene models: none for the homeodomain gene; its exons, start and
      protein are unresolved. The same arrangement (HMG ortholog and homeodomain-like
      region 7 to 14 kb apart, same contig) is present in P. inouyei NRRL YB-4354
      (QXDQ01000433.1, contig 36.8 kb and cut 0.5 kb past the HMG gene), the second
      P. lactucae-debilis assembly NRRL YB-4353 (not independent) and Taphrina confusa
      CBS 375.39. A mating role has not been shown in any of them. This genome was
      chosen because it has a reverse-stranded RNA-seq library (SRR5576147).'
