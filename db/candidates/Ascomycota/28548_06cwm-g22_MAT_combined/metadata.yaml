evidence:
  locus_existence:
    tier: 1
    experimental_method: 'The complete MAT locus of this strain was amplified with
      13 overlapping PCR primer pairs from genomic DNA and every product Sanger-sequenced;
      the assembled 16.3-kb PCR-derived sequence showed 100 percent identity to the
      independently generated PacBio draft genome assembly of the same isolate, giving
      two independent sequence determinations of the same locus. This is a dedicated,
      experimentally supported characterisation of this specific locus, not a genome-annotation
      homology screen. (Xu, Jardini and Chen 2016)

      '
    citations:
    - pmid: '27255676'
      doi: 10.1038/srep27083
  boundaries:
    tier: 1
    experimental_method: 'Locus sequenced flank-to-flank (APN2 through SLA2) by overlapping
      PCR plus Sanger sequencing and deposited as KU726096.1; every CDS coordinate,
      strand and protein accession recorded below was independently re-read by the
      curator from that primary GenBank record via NCBI efetch on 2026-09-17, and
      all five protein accessions (ANN44260.1, ANN44261.1, ANN44262.1, ANN44263.1,
      ANN44264.1) were confirmed to exist with the expected product names and lengths
      (505, 377, 366, 293, 840 aa) via NCBI esummary.

      '
    citations:
    - pmid: '27255676'
      doi: 10.1038/srep27083
  idiomorph_assignment:
    tier: 1
    experimental_method: 'Both idiomorphs'' genes are physically present at one locus
      in this haploid strain (MAT1-1-derived MAT1-1-5 plus HMG-box MAT1-2-1 and MAT1-2-10),
      and the correspondence between locus content and mating phenotype was established
      experimentally by tetrad analysis: every large-ascospore-derived progeny strain
      retained the DNA between the two 146-bp direct repeats and was self-fertile,
      while every small-ascospore-derived progeny strain had lost it and was self-sterile.
      A diagnostic PCR (primers 4F/6R) distinguishes the two alleles by product size
      (~3,800 bp L vs ~800 bp S). The idiomorph content of this record is therefore
      tied to a scored, heritable phenotype, not to sequence similarity alone.

      '
    citations:
    - pmid: '27255676'
      doi: 10.1038/srep27083
