    reference_orientation: APN2->MAT1-1-5->MAT1-2-1(reverse)->MAT1-2-10->SLA2(reverse)
    definition_note: 'The self-fertile "L" (large-ascospore) MAT allele of Sclerotinia
      trifoliorum, sequenced flank-to-flank by Xu, Jardini and Chen 2016 and deposited
      as GenBank KU726096.1 (16,944 bp). All gene identities, CDS coordinates, strands
      and protein accessions below were read directly off that primary GenBank record
      by the curator via NCBI efetch, not from any review or synthesis.

      Architecture: this is a fused homothallic locus carrying genes of both idiomorphs
      between the canonical Pezizomycotina flanking anchors APN2 and SLA2, which are
      both annotated on this record, so the locus is captured complete from flank
      to flank. Gene order and orientation closely resemble the inversion-positive
      (Inv+) MAT alleles of S. sclerotiorum and S. minor.

      MAT1-1-1 is recorded below as present: false. This is a deliberate, sourced
      call rather than an absence claim: Xu et al. 2016 state explicitly that in this
      allele "an ORF with high similarity to MAT1-1-1 was divided into two parts by
      MAT1-2-1 and MAT1-2-4", i.e. the MAT1-1-1 gene exists only as separated 5''
      and 3'' fragments and no intact MAT1-1-1 ORF is present. Consistent with that,
      GenBank KU726096.1 annotates no MAT1-1-1 CDS at all, and no MAT1-1-1 protein
      accession exists for this strain. No coordinates, strand or protein accession
      are asserted for it here. The 5'' MAT1-1-1 fragment is functionally important
      nonetheless: it contains the first copy of the 146-bp direct repeat whose recombination
      with a second copy in the downstream non-coding region deletes MAT1-2-1 and
      MAT1-2-10 and produces the self-sterile "S" allele (curated separately as 28548_6cwm-g27_MAT_MAT1-1,
      GenBank KU726097.1).

      Nomenclature: the gene listed here as MAT1-2-10 is deposited on KU726096.1 under
      its older name MAT1-2-4 (protein ANN44263.1, product "MAT1-2-4"), renamed MAT1-2-10
      by Wilken et al. 2017 (Fungal Biol Rev 31:199-211) and used as MAT1-2-10 by
      the Leotiomycete-wide survey of Wilson et al. 2023 (PLOS ONE 18:e0292619). The
      current name is used here and the deposited synonym recorded so the GenBank
      feature can still be matched.

      System: S. trifoliorum reproduces by unidirectional mating-type switching, a
      form of secondary homothallism -- self-fertile L-type strains give rise in a
      4:4 ratio to self-fertile (L) and self-sterile (S) offspring. The schema''s
      `system` vocabulary has no "switching" value; "homothallic" is the closest honest
      fit for this self-fertile parental allele and the mechanism is documented here.

      '
