    notes: 'MAT1-1-5 (gene_index 1) fails independent re-translation. KU726096.1''s
      own feature table (re-fetched via NCBI efetch on 2026-09-18) shows the real
      MAT1-1-5 CDS is join(4679..4961,5011..5558,5623..5649,5709..5984) -- a
      4-exon, 3-intron gene. This schema stores only a single start/end/strand
      span per gene with no intron model, so translating the raw 4679..5984 span
      cannot reproduce ANN44261.1 exactly. The recorded coordinates already match
      the CDS''s real outer bounds exactly; this is a known schema limitation, not
      a coordinate error. MAT1-2-1, MAT1-2-10 and SLA2 are also multi-exon
      (respectively complement(join(9526..9974,10030..10400,10451..10731)),
      join(11231..11664,11708..12155), and
      complement(join(14226..14312,14366..16779,16830..16851))) but their recorded
      spans already pass because the matched region before each gene''s first
      intron is 100% identical.'
