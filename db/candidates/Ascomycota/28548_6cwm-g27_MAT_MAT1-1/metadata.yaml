    notes: 'Both MAT1-1-5 (gene_index 1) and MAT1-1-1 (gene_index 2) fail
      independent re-translation. KU726097.1''s own feature table (re-fetched via
      NCBI efetch on 2026-09-18) shows: MAT1-1-5 CDS is
      join(4679..4961,5011..5558,5623..5649,5709..5984) (4 exons, identical
      coordinates to the sister L-allele record 28548_06cwm-g22_MAT_combined, as
      expected since the two alleles share this gene); MAT1-1-1 CDS is
      join(8827..9100,9150..9932,9983..10038) (3 exons). This schema stores only
      a single start/end/strand span per gene with no intron model, so translating
      the raw recorded spans cannot reproduce either protein exactly. The recorded
      coordinates already match each CDS''s real outer bounds exactly; this is a
      known schema limitation, not a coordinate error. SLA2 is also multi-exon
      (complement(join(11248..11334,11388..13801,13852..13873))) but its recorded
      span already passes because the matched region before its first intron is
      100% identical.'
