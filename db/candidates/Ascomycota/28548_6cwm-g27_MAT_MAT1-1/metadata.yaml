evidence:
  locus_existence:
    tier: 1
    experimental_method: 'The MAT locus of this strain was amplified with overlapping
      PCR primer pairs from genomic DNA and Sanger-sequenced (10 of 13 primer pairs
      amplified; the three that failed define the deletion, and a cross-primer PCR
      spanning the junction was amplified and sequenced), yielding the 13.9-kb assembled
      locus deposited as KU726097.1. A dedicated, experimentally supported characterisation
      of this specific locus rather than a genome-annotation homology screen. (Xu,
      Jardini and Chen 2016)

      '
    citations:
    - pmid: '27255676'
      doi: 10.1038/srep27083
  boundaries:
    tier: 1
    experimental_method: 'Locus sequenced flank-to-flank (APN2 through SLA2) and deposited
      as KU726097.1; every CDS coordinate, strand and protein accession recorded below
      was independently re-read by the curator from that primary GenBank record via
      NCBI efetch on 2026-09-17, and all four protein accessions (ANN44265.1, ANN44266.1,
      ANN44267.1, ANN44268.1) were confirmed to exist with the expected product names
      and lengths (505, 377, 370, 840 aa) via NCBI esummary.

      '
    citations:
    - pmid: '27255676'
      doi: 10.1038/srep27083
  idiomorph_assignment:
    tier: 1
    experimental_method: 'Only MAT1-1 idiomorph genes are present (alpha-box MAT1-1-1
      plus MAT1-1-5); the absence of MAT1-2-1 and MAT1-2-10 was demonstrated experimentally
      by failed and junction-spanning PCRs and by sequencing across the recombination
      junction, and the MAT1-1-only content was shown by tetrad analysis to co-segregate
      with the self-sterile small-ascospore phenotype in every scored progeny strain.

      '
    citations:
    - pmid: '27255676'
      doi: 10.1038/srep27083
