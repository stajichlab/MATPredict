    reference_orientation: APN2->MAT1-1-5->MAT1-1-1->SLA2(reverse)
    definition_note: 'The self-sterile "S" (small-ascospore) MAT allele of Sclerotinia
      trifoliorum, sequenced flank-to-flank by Xu, Jardini and Chen 2016 and deposited
      as GenBank KU726097.1 (13,965 bp). All gene identities, CDS coordinates, strands
      and protein accessions below were read directly off that primary GenBank record
      by the curator via NCBI efetch, not from any review or synthesis.

      This allele is the meiotic derivative of the self-fertile L allele curated as
      28548_06cwm-g22_MAT_combined (GenBank KU726096.1). A 2,966-bp region containing
      the entire MAT1-2-1 and MAT1-2-10 genes is deleted from this allele by intramolecular
      homologous recombination between two copies of a 146-bp direct repeat, one of
      which lies inside the MAT1-1-1 gene; a single copy of the repeat remains here.
      What is left is a clean MAT1-1 idiomorph -- intact MAT1-1-1 and MAT1-1-5 --
      between the canonical flanking anchors APN2 and SLA2, so the locus is captured
      complete from flank to flank. The strain''s own coordinates are identical to
      the L allele''s up to the end of MAT1-1-5 (APN2 244..1761 and MAT1-1-5 4679..5984
      on both records), which is consistent with the two records being alternative
      alleles of the same locus rather than independent assemblies.

      MAT1-2-1 and MAT1-2-10 are recorded below as present: false. That is a positive,
      experimentally demonstrated absence -- Xu et al. showed the deletion directly
      by PCR (three primer pairs spanning the region fail on this strain, and a cross-primer
      PCR gives ~800 bp here versus ~3,800 bp in the L allele) and by sequencing across
      the recombination junction -- not merely a failure to find them.

      System: "homothallic" is recorded because it describes the species'' mating
      system, which is secondary homothallism by unidirectional mating-type switching;
      this specific strain is the self-sterile product of that switch and is itself
      self-incompatible. The schema''s `system` vocabulary has no value for either
      "switching" or "self-sterile derivative of a homothallic parent", so the species-level
      term is used and the strain-level phenotype is stated explicitly here. A reviewer
      who prefers strain-level semantics should change this field to heterothallic;
      the underlying facts are unchanged either way.

      '
