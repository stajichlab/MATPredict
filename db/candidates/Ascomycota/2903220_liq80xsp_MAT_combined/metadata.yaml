  core:
    completeness: fragmented
    reference_orientation: APN2->MAT1-2-1->MAT1-1-1 | [scaffold break] | SLA2
    definition_note: 'Same homothallic both-idiomorphs-present architecture as 2903222_liq146xsp_MAT_combined:
      alpha-box MAT1-1-1 and HMG-box MAT1-2-1 together in one genome, flanked by APN2
      and SLA2.


      ACCESSION CORRECTION (verified by the curator): Supplementary Table S1 gives
      this assembly''s MAT scaffolds as ''JALAI010000088.1'' and ''JALAI010000140.1''.
      Those accessions DO NOT EXIST at NCBI (efetch: ''Failed to understand id'').
      GCA_023646395.1''s real WGS prefix is JALAIM01, and the correct accessions are
      JALAIM010000088.1 (53912 bp) and JALAIM010000140.1 (41267 bp); both were fetched
      and both contain the published spans. S1 dropped a letter from the 6-letter
      WGS prefix. The corrected accessions are used here.


      The locus is FRAGMENTED across two scaffolds: APN2 + MAT1-2-1 + MAT1-1-1 on
      JALAIM010000088.1, and SLA2 alone on JALAIM010000140.1. MAT1-1-1 ends 815 bp
      from the end of scaffold 88, so the assembly break falls immediately downstream
      of the idiomorph pair; the two-scaffold split is an assembly artefact, not evidence
      of a split locus.


      COORDINATE CONVENTION: Supplementary Table S1 reports a ''Length'' column equal
      to (end - start), i.e. one less than the fully-closed length. The curator resolved
      the ambiguity empirically by extracting each span from the real NCBI scaffold
      sequence: under a 1-based fully-closed reading every gene begins with ATG and
      ends with a stop codon (TAA/TAG/TGA) on the stated strand, while under a 0-based
      half-open reading they do not. The coordinates below are therefore used as published,
      1-based fully-closed (this project''s convention); S1''s ''Length'' column is
      simply off by one.


      NOTE ON THE MAT1-1-1 SPAN: the Augustus-predicted MAT1-1-1 genomic span is ~3.9-4.0
      kb, which is unusually long for an alpha-box mating-type gene (typically ~1.2-1.5
      kb of genomic sequence). The curator confirmed the span begins with ATG and
      ends with an in-frame-terminal stop codon on the stated strand, but cannot rule
      out that Augustus fused MAT1-1-1 with a neighbouring ORF or over-called intron
      structure. The MAT1-2-1 span (1155 bp) is unremarkable. Treat the MAT1-1-1 boundaries
      as the paper''s gene prediction, not as a validated CDS.


      Homothally is additionally supported by the paper''s own read-depth test (Supplementary
      Table S1, ''Depth'' sheet): mean read depth over the alpha-box and HMG genes
      was compared to mean BUSCO-gene depth, and neither differed significantly, which
      is what is expected if both idiomorphs sit in a single haploid genome rather
      than in a mixed/contaminated assembly.


      CAVEAT: this assembly is registered at NCBI as a MAG (metagenome-assembled genome)
      from a lichen thallus metagenome, not an axenic culture. Both-idiomorph gene
      content in a MAG is in principle also compatible with two co-occurring conspecific
      genomes; the read-depth test above is the paper''s control against that, and
      it passed, but this record is not equivalent to a homothally call made from
      a cultured single-spore isolate.'
