    definition_note: 'DRAFT, GENE MODELS ARE OURS (tier 3). B. californica strain
      PB4207 (Dalian Medical University, GCA_023627795.1, ctg_5 = JAMAIE010000005.1,
      694,392 bp; the locus is 63 kb from one contig end). The one published description
      is Hession, Byrne, Wolfe & Butler, PLoS Genet 2025 (PMID 41359681, doi 10.1371/journal.pgen.1011814):
      a centromere formed at the MAT locus of B. californica, whose 460 bp centromere
      sequence lies in a 2.8 kb intergenic region between MATa1 and MATa2 on one side
      and MATalpha1 and MATalpha2 on the other; all three Barnettozyma species appear
      homothallic. The paper gives no gene models, coordinates or accessions for the
      locus (its UCD09 ONT assembly is not in the NCBI assembly database as of 2026-10-30;
      the supplement S1 Table was not available). NO RNA-seq exists for the genus
      (ENA, 2026-10-30: only WGS and Hi-C), so every model is a prediction from sequence:
      stop-to-stop six-frame ORFs, Pfam (Homeodomain, MATalpha_HMGbox, ANTH/I_LWEQ),
      phmmer against the curated Saccharomycotina MAT proteins, an exhaustive one-intron
      GT..AG search scored with the curated Saccharomycotina MATa2 profile. WHAT AGREES
      WITH THE PAPER: MATa1 ends at 615,568 and MATalpha1 starts at 618,402, a 2,833
      bp intergenic region (paper: 2.8 kb); MATa2 and MATa1 are the divergent pair
      on one side. SLA2 and DIC1 flank the locus (DIC1 7.4 kb from MATa2; SLA2 8.6
      kb from MATalpha1). MODELS: SLA2 (1,046 aa, ANTH + I_LWEQ, single exon), DIC1
      (316 aa, single exon), MATa1 (162 aa, homeodomain, single exon), MATalpha1 (233
      aa, alpha-box, zero-intron ORF whose C-terminus is uncertain: one-intron alternatives
      score the same), MATa2 (269 aa, one 56 bp GTATGT..CTTAG intron at 614,112-614,167,
      82 bits to the MATa2 profile against a background maximum of 32 over all 124
      six-frame segments of the window; no Pfam HMG_box hit, as for Komagataella).
      MATalpha2 IS NOT RECORDED: a homeodomain region (genome 620,370-620,700) follows
      MATalpha1 but no complete gene model could be built; it is not recorded as present
      or absent. NAMING: Pfam cannot tell the MATa1 homeodomain from the MATalpha2
      homeodomain; the names follow position (the homeodomain gene next to the HMG-like
      gene on the MATa side is MATa1). The other three californica assemblies (UCD09
      GCA_003123585.1, UCD89 GCA_003123885.1, NRRL Y-17395 GCA_003706655.3) carry
      the same proteins at 99.6-100% identity, which is one strain family, not independent
      evidence. B. discipulorum (GCA_049863505.1) has SLA2, MATa1, MATalpha1 and DIC1
      at 45-86% identity but arranged differently and no MATa2 hit. GENETIC CODE:
      standard (table 1), not tested. Details: results/2026-10-30_barnettozyma/README.md.'
