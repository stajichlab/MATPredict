evidence:
  locus_existence:
    tier: 1
    experimental_method: Genomic clone isolation and complete sequencing of the MAT1-1-1-containing
      region from a field strain (Mel206) shown by PCR screening to lack MAT1-2-1,
      complementing the reference genome (Mel28) which carries MAT1-2-1 but lacks
      MAT1-1-1; the T. melanosporum species is further shown heterothallic by mating-type-specific
      genotyping of individual dissected ascospores within asci (Rubini et al. 2011).
    citations:
    - &id001
      pmid: '20961294'
      doi: 10.1111/j.1469-8137.2010.03492.x
  boundaries:
    tier: 2
    experimental_method: All three CDS on this accession carry partial exon/UTR location
      markers at the sequenced insert's edges; no idiomorph endpoint beyond the sequenced
      clone is published. Coordinates are the depositors' own GenBank annotation,
      independently re-fetched and transcribed by the curator via NCBI efetch.
    citations:
    - *id001
  idiomorph_assignment:
    tier: 1
    experimental_method: MAT1-1-1 identity confirmed by alpha-box domain content (depositor
      /note) and by the mutually exclusive presence/absence pattern against MAT1-2-1
      (present in the Mel28 reference genome, absent by PCR in Mel206); single-ascospore
      genotyping in the same paper independently confirms mating-type segregation
      in this species.
    citations:
    - *id001
