  notes: 'Proposed 2026-10-24 (Claude Code) for the CTG-clade MTLA1 gap: the 55 CTG-clade loci that lost
    a polished MTLA1 model after the full-length B11243 MTLA1 record (#133) lowered hit coverage. Evidence:
    results/2026-10-24_ctg_mtla1_verify/. Gene models: BFD predictions; each independently re-derived from the
    NCBI contig by exon coordinates (genetic code 12) and identical to the BFD protein: MTLA1 187 aa, PIK1 952 aa,
    OBP1 427 aa, PAP1 557 aa, all starting with M. mating_type.system is unknown (single-gene core, no MTLA2
    found), the first use of that value in db/; needs the curator''s agreement.'
