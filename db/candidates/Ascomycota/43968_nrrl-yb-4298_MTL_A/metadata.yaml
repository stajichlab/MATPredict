evidence:
  locus_existence:
    tier: 3
    experimental_method: 'TIER 3 (genome-derived, no paper). Gene models are unpublished genome-annotation predictions (BFD
      funannotate, assembly GCA_030579395.1). MTLA1 was found by diamond blastp of curated Serinales MTLA1
      proteins and the L. orthopsilosis MTLA1 protein CCG24159.1 (the query set also held ADY62670.1, which is a L. metapsilosis Mtlalpha1, not an MTLA1 protein; it is not evidence here) against the proteome and
      verified by gene order: neighbours within 4 genes hit the curated C. lusitaniae / C. auris proteins
      (PIK1 51%; OBP1 68%; PAP1 71%); see results/2026-10-24_ctg_mtla1_verify/verify.tsv. Identity of the
      MTLA1 candidate to the best curated MTLA1 is 33-39%, so the assignment rests on position and domain
      content, not sequence alone. Pfam-A (hmmscan, E <= 1e-3): the candidate hits Homeodomain (PF00046; E
      1.6e-12) and Homeobox_KN (1.9e-5), as do all five curated MTLA1 reference proteins; the curated
      MTLA2 proteins have no Pfam hit (results/2026-10-24_ctg_mtla1_verify/pfam_candidates.txt).'
    citations: &id001 []
  boundaries:
    tier: 3
    experimental_method: 'TIER 3 (genome-derived, no paper). Gene models are unpublished genome-annotation predictions (BFD
      funannotate, assembly GCA_030579395.1). Segment 295030-303860 on JAKTQU010000010.1 spans the BFD-
      predicted CDS of MTLA1 (two exons, 44 bp intron, minus strand), PIK1, OBP1 and PAP1; boundaries are
      gene-model CDS spans (no UTR, no sequence-defined idiomorph edge), so they are not suitable for
      coordinate benchmarking.'
    citations: *id001
  idiomorph_assignment:
    tier: 3
    experimental_method: 'TIER 3 (genome-derived, no paper). Gene models are unpublished genome-annotation predictions (BFD
      funannotate, assembly GCA_030579395.1). The A label rests on MTLA1 alone: a homeodomain protein in
      PAP1/OBP1/PIK1 synteny, like the curated C. albicans and C. auris MTLA1 records. No MTLA2 and no
      alpha-box (MTLalpha1/2) gene is annotated at the locus; BFD locus tags F6D375A1_002373 and _002374
      are consecutive, so the annotation has nothing in the 1,892 bp between MTLA1 and PIK1, and a six-
      frame scan of that gap finds no unspliced ORF longer than 105 aa. The core is therefore recorded as
      partial.'
    citations: *id001
