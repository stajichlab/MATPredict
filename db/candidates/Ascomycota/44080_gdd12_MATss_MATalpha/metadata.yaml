    reference_orientation: MATalpha1->MATalpha2->sla2
    definition_note: 'Left (alpha-dominant) sub-cluster of the active MAT locus on
      chromosome IV of S. schoenii GDD12 (CM143129.1; the paper''s span 470,610-475,000,
      Kriti et al. G3 2026, PMID 41849659). HOMOTHALLIC (Dost et al. 2024, PMID 38492364);
      one of several SLA2-MAT cassettes (one per chromosome plus a palindromic one
      on chromosome IV). GENE MODELS ARE OURS (tier 3): the BRAKER2 GTF the paper
      cites is not on its GitHub or Zenodo, so the models were rebuilt from the three
      public paired RNA-seq runs (PRJNA1364152; hisat2, StringTie, TransDecoder, phmmer
      against the curated MAT proteins, Pfam-A); see results/2026-10-29_ss_records/README.md.
      The library is not stranded; strand is the ORF''s. MATalpha1 is single-exon,
      minus strand, 191 aa. The homeodomain ORF (named MATalpha2 after the paper)
      is partial (103 aa, two exons with a 217 bp intron of 198 reads that joins it
      toward SLA2, the paper''s MAT-SLA2 splice junction); phmmer ranks it closest
      to MATa1-type references (50 bits to C. albicans MTLA1), so the name is a hypothesis.
      SLA2 here is a diverged copy: 256 aa (472,708-473,478, minus), 5-prime partial
      (the ORF has no start codon); a second SLA2 piece (473,680-474,606, 309 aa)
      is not recorded. An HMG-like ORF at 470,349-470,951 (200 aa, 44 bits to S. cerevisiae
      MATA2, no Pfam hit) is not assigned to a gene. GENETIC CODE: NCBI table 12 (CUG
      = Ser) for the species; proteins are translated with it.'
