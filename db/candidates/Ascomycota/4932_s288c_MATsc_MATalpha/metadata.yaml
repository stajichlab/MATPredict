    reference_orientation: MATALPHA2->MATALPHA1
    definition_note: 'Uses a distinct locus_name ("MATsc") from the existing Pezizomycotina
      "MAT" (MAT1-1/MAT1-2), Taphrinomycotina "PM" (M/P), and Schizosaccharomyces
      "mat1"/"mat2"/"mat3" entries, since S. cerevisiae''s MATa1/MATalpha1/MATalpha2
      gene set is not homologous to any of those systems -- only functionally analogous
      (see user architectural guidance this session: Saccharomycotina/Taphrinomycotina/
      Pezizomycotina MAT genes are non-homologous across subphyla). S. cerevisiae
      determines cell type via a single active MAT locus on chromosome III, with two
      permanently silenced donor cassettes (HMLalpha, HMRa) elsewhere on the same
      chromosome that supply template sequence during HO-endonuclease-triggered switching
      (Astell et al. 1981; Kostriken et al. 1983; Haber 2012). "system" is set to
      "heterothallic" for this specific genome snapshot (S288C is fixed MATalpha,
      the standard non-switching lab reference build); this does not capture the species''
      switching capacity in wild isolates, matching how the parallel S. pombe records
      (4896_972h_mat1_M) handle the same conceptual issue. The S288C reference genome,
      being MATalpha, has no MATa gene models -- see the paired-locus gap note in
      the report submitted alongside this batch; a MATa record was not drafted in
      this pass because no independently-reconfirmed modern coordinate source was
      found for a MATa-carrying strain''s genome build (the original 1981 MATa sequence
      exists in the literature/historical GenBank records, e.g. V01312.1, but was
      not independently re-verified to modern coordinate/protein-accession standards
      in this session -- flagged as a gap for a follow-up pass rather than filled
      with unverified data). The HML/HMR silent donor cassettes are likewise deliberately
      not represented here, following this session''s established pattern of capturing
      the active locus first and deferring silent/donor loci.

      '
