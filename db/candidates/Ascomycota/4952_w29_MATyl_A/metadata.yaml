    reference_orientation: sla2->mata1->mata2->apn2
    definition_note: 'Y. lipolytica is architecturally distinct from the rest of Saccharomycotina:
      its MAT genes are NOT homeodomain-based like S. cerevisiae''s MATa1/alpha1/alpha2
      system. mata2 contains an HMG-box DNA-binding domain instead -- the same domain
      family used throughout Basidiomycota and in the MAT1-2 idiomorph of Pezizomycotina,
      making this species a rare Saccharomycotina bridge to that broader HMG-domain
      MAT pattern (Kurischko et al. 1999; Butler et al. 2004, PMID 14745027, DOI 10.1073/pnas.0304170101,
      note this species has no HML/HMR-type silent cassettes at all). mata1 (119 aa,
      no recognizable protein domain, described by its discoverers as "a new class
      of mating-type gene") and mata2 (291 aa, HMG-box) were functionally dissected
      by subcloning in the original characterization paper. Given this architectural
      distinctness, a new locus_name ("MATyl") was added rather than reusing "MATsc".
      Only the MATA idiomorph is represented here (this GenBank record, AJ617306.1,
      strain W29); the opposite MATB idiomorph exists (shown functionally complete
      by cassette-replacement experiments in Butler et al. 2004 and more recently
      given a full reference sequence by a 2025 haplotype-resolved genome project
      referenced in the source literature synthesis for this database) but was not
      independently verified against a fetchable GenBank/DDBJ accession in this pass
      -- a candidate MATB record is left as a follow-up. The apn2 CDS on this record
      is annotated as extending beyond the deposited fragment (">8174"), so it is
      truncated at the sequence boundary; completeness is "partial" for this reason.

      '
