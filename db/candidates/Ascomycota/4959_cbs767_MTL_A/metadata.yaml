    reference_orientation: MTLA1->MTLA2
    definition_note: 'D. hansenii''s reference genome (strain CBS767) carries only
      the "A" gene configuration (MTLA1, MTLA2) at this locus; no MTLalpha1 gene is
      present in this strain''s assembly. No dedicated primary MTL-locus cloning/characterization
      paper for D. hansenii was independently located in this curation pass -- gene
      identity and coordinates are instead sourced from this species'' inclusion in
      the 4-species comparative hemiascomycete genome paper (Dujon et al. 2004), cross-checked
      directly against this assembly''s own NCBI Gene/RefSeq annotation via efetch.
      Per the literature synthesis this candidate was drafted from, whether D. hansenii
      is truly homothallic (both A- and alpha-type genes present somewhere in the
      genome, with expression epigenetically restricted to one type per cell -- the
      "primary homothallic, contiguous" model proposed for this genus) or effectively
      heterothallic-by-genome- content (this strain''s genome simply lacks the alpha
      genes outright) is an OPEN, UNRESOLVED question in the field -- this record''s
      "system: heterothallic" reflects only what is directly observable in this specific
      strain''s sequenced genome (A genes present, no alpha genes found), not a settled
      classification of the species. completeness is "partial" for the same reason:
      whether this is the complete gene complement for this species'' mating-type
      biology, or only half of a larger homothallic locus not captured in this genome
      build, is unresolved.

      '
