    definition_note: 'SPECIES/RECORD ROLE. Fusarium fujikuroi (teleomorph Gibberella
      fujikuroi) is the HETEROTHALLIC counterpart to the homothallic Fusarium graminearum
      / Gibberella zeae record proposed in the same pass (5518_3639_MAT_combined).
      Together they capture the contrast drawn by Yun et al. 2000 (PMID 11118131):
      three genes at MAT1-1 and one at MAT1-2, carried in two different nuclei of
      two different strains here, versus all four genes at one chromosomal location
      in a single G. zeae nucleus. NCBI''s current species name for this organism
      is Fusarium fujikuroi (taxid 5127); the source paper and the deposits'' notes
      use ''Gibberella fujikuroi'' and give the anamorph as Fusarium moniliforme.


      NOMENCLATURE. The gene names recorded here are the standard Turgeon and Yoder
      forms (MAT1-1-1, MAT1-1-2, MAT1-1-3, MAT1-2-1), which is what Yun et al. 2000
      uses in the paper itself and what db/Ascomycota/order.yml''s ''MAT'' locus declares.
      IMPORTANT AND VERIFIED DIRECTLY: the GenBank deposits predate that standard
      and carry the LEGACY /gene qualifiers MAT-1-3, MAT-1-2, MAT-1-1 (on AF100925.1)
      and MAT-2 (on AF100926.1) -- i.e. a single hyphenated level, not the three-level
      form. The curator confirmed these legacy symbols on the feature tables via NCBI
      efetch and mapped them as MAT-1-1 = MAT1-1-1, MAT-1-2 = MAT1-1-2, MAT-1-3 =
      MAT1-1-3, MAT-2 = MAT1-2-1. The standard convention is defined by Turgeon and
      Yoder 2000, ''Proposed nomenclature for mating type genes of filamentous ascomycetes'',
      Fungal Genet Biol 31:1-5, PMID 11118130, doi 10.1006/fgbi.2000.1227 (verified
      via PubMed efetch); it appeared in the same issue immediately before Yun et
      al. 2000. The deposits'' own /note qualifiers independently support the orthology
      used here by stating similarity to the Neurospora crassa mat A-3 / mat A-2 /
      mat A-1 / mat a-1 genes respectively -- the same orthology asserted in the paired
      Neurospora records.


      BOUNDARIES ARE NOT PUBLISHED AS COORDINATES. Neither deposit annotates APN2/SLA2/COX13
      or any other flanking gene, and no idiomorph endpoints are published on these
      accessions. The core segment recorded below is a curator-defined mechanical
      span from the first base of the leftmost MAT CDS to the last base of the rightmost
      MAT CDS. The gene/mRNA features carry partial markers (''<''/''>'') because
      the UTRs run past the sequenced ends, although the CDS coordinates themselves
      are exact. completeness is therefore ''partial'', boundaries evidence is tier
      2, and excluded_from_coordinate_benchmark is true.


      THIS RECORD. GenBank AF100925.1, 4784 bp, /strain="MO44 (A00149)", db_xref taxon:5127,
      reference Yun et al. 2000 (PMID 11118131). Three MAT1-1 genes verified on the
      feature table via NCBI efetch: MAT-1-3 complement(join(246..397,446..638,698..841))
      protein_id AAC71053.1; MAT-1-2 1404..2630 protein_id AAC71054.1; MAT-1-1 join(3212..3482,3529..4406)
      protein_id AAC71055.1. Strain MO44 is not the F. fujikuroi reference-genome
      strain (IMI 58289), hence differs_from_sequenced: true.

      '
