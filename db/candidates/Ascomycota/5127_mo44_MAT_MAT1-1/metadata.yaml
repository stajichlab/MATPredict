evidence:
  locus_existence:
    tier: 1
    experimental_method: 'Cloning and complete sequencing of both MAT idiomorphs from
      genetically defined opposite-mating-type strains of heterothallic Gibberella
      fujikuroi, with RT-PCR confirmation that the MAT genes are expressed and that
      every predicted intron is removed (Yun et al. 2000).

      '
    citations:
    - pmid: '11118131'
      doi: 10.1006/fgbi.2000.1226
  boundaries:
    tier: 2
    experimental_method: 'No idiomorph endpoints are published on this accession and
      no flanking genes are annotated on it. The CDS coordinates are the authors''
      own GenBank annotation, independently re-fetched and transcribed by the curator;
      the recorded core segment is a curator-defined first-to-last MAT CDS span. Tier
      2 for the boundary claim specifically.

      '
    citations:
    - pmid: '11118131'
      doi: 10.1006/fgbi.2000.1226
  idiomorph_assignment:
    tier: 1
    experimental_method: 'The two idiomorphs were cloned from two separate strains
      of known, genetically defined opposite mating type (MO44 vs MO45), and their
      gene content matches the canonical heterothallic Pezizomycotina pattern -- alpha-box
      MAT1-1-1 plus MAT1-1-2 and HMG-domain MAT1-1-3 in one strain, HMG-domain MAT1-2-1
      in the other (Yun et al. 2000). Cross-genus orthology is further supported by
      the deposits'' own similarity notes to the Neurospora crassa mat A-1/mat A-2/mat
      A-3/mat a-1 genes.

      '
    citations:
    - pmid: '11118131'
      doi: 10.1006/fgbi.2000.1226
