  remnant_note: 'MTLa1 is defective in C. parapsilosis: four stop codons and an unspliced putative intron
    in the region corresponding to C. albicans MTLa1; the stop codons are present in all eight isolates
    sequenced (Logue et al. 2005). The deposit annotates it as a pseudogene with no CDS (12866-13534,
    670 bp).'
