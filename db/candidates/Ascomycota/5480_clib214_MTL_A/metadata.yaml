    definition_note: 'Lodderomyces (Candida) parapsilosis CLIB214 (type strain, ATCC 22019) MTL a idiomorph,
      GenBank AY961981.1 (Logue et al. 2005): intact MTLa2 (AAY33181.1, two exons), PAP1 (PAPa, AAY33178.1),
      OBP1 (OBPa, AAY33179.1) and PIK1 (PIKa, AAY33180.1), and an MTLa1 PSEUDOGENE (no protein): the gene
      order and orientations match C. albicans MTLa, but MTLa1 has stop codons and an unspliced intron.
      Documentation record: the MTLa1 entry records a defective gene on purpose, so detection should not
      expect a modelled MTLA1 in C. parapsilosis. Logue et al. found only the MTL a idiomorph at this
      locus in every isolate tested (Sai et al. 2011: 189 of 189); MTL alpha sequences exist elsewhere
      in the genome.'
