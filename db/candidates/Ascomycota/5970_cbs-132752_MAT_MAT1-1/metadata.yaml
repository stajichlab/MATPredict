    reference_orientation: MAT1-1-4->MAT1-1-1
    definition_note: 'Exophiala dermatitidis (Chaetothyriales) MAT1-1 idiomorph, GenBank
      MH341450.1 (12,011 bp long-range PCR product from strain CBS 132752, Sanger;
      Metin et al. 2019, Fungal Genet Biol 124:29-38). The deposit annotates MAT1-1-4
      (AXZ62320.1, complement, 6 exons, 1761-2935) and MAT1-1-1 (alpha-box, AXZ62321.1,
      3 exons, 3595-4885) back to back, then a hypothetical protein similar to HMPREF1120_08861
      (AXZ62322.1), a 5S rRNA gene and a partial gene similar to HMPREF1120_08860.
      SLA2 and APN2 are not annotated on the deposit. The paper gives the MAT1-1 idiomorph
      as 3544 bp (MAT1-1-1 + MAT1-1-4); the exact idiomorph boundaries are not given
      and are not asserted: the segment here spans the two annotated MAT genes (1761-4885,
      3125 bp, shorter than the stated idiomorph). Coordinates are those of the deposit,
      fetched through NCBI efetch on 2026-11-08. The MAT1-2 partner is the separate
      candidate 858893_nih-ut8656_MAT_MAT1-2.'
