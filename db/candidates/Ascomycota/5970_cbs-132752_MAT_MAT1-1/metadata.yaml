evidence:
  locus_existence:
    tier: 1
    experimental_method: 'Metin et al. 2019: long-range PCR and Sanger sequencing
      of a ~12 kb product from CBS 132752, PCR screening of 74 isolates (35 MAT1-1,
      39 MAT1-2) and RT-PCR showing transcription (MAT1-1-1 455 bp, MAT1-1-4 429 bp
      products). No sexual cycle has been observed.'
    citations: &id001
    - pmid: '30611834'
      doi: 10.1016/j.fgb.2018.12.011
  boundaries:
    tier: 2
    experimental_method: Idiomorph length stated (MAT1-1 3544 bp) but boundaries not
      given; segment = span of the two annotated MAT genes on MH341450.1.
    citations: *id001
  idiomorph_assignment:
    tier: 1
    experimental_method: MAT1-1 by presence of the alpha-box gene MAT1-1-1 (with MAT1-1-4)
      in the sequenced isolate, per Metin et al. 2019.
    citations: *id001
