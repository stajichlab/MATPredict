    definition_note: 'Heterothallic MAT1-1 idiomorph, taken from the A. fumigatus
      A1163 (CEA10-derived) genome, supercontig DS499596.1. The region is in the opposite
      orientation to Af293: COX13 -- APN2 -- [MAT idiomorph] -- SLA2. The idiomorph
      carries the alpha-box gene MAT1-1-1 (AFUB_042900, EDP53120.1, 368 aa, annotated
      ''mating-type protein MAT alpha 1'' and noted by the submitters as similar to
      A. nidulans matB-1-1). Immediately adjacent, AFUB_042890 (EDP53119.1) is annotated
      ''mating-type factor MAT1-2-1-like protein, putative''; the curator aligned
      it directly and found it is a DEGENERATE 3'' REMNANT of MAT1-2-1: its C-terminal
      ~100 residues are nearly identical to the Af293 MAT1-2-1 protein XP_754989.2,
      while the HMG-box-encoding 5'' part is absent/frameshifted. It is recorded here
      as present core_MAT under the name MAT1-2-1 so the remnant is not lost, following
      the precedent of the MAT1-1-2 remnant retained in the Cytospora mali MAT1-2
      record in this database. This remnant is consistent with the HMG-gene fragment
      reported in the A. fumigatus MAT1-1 locus in the secondary literature, but the
      curator did not verify the ''360 bp'' figure against a primary source and makes
      no claim about its exact length here. The alpha-box and HMG positions are offset
      relative to Af293, as described by Galagan et al. 2005.'
