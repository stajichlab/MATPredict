evidence:
  locus_existence:
    tier: 1
    experimental_method: A. fumigatus has a demonstrated heterothallic sexual cycle;
      isolates of complementary mating types (i.e. a MAT1-1 partner and a MAT1-2 partner)
      are required for cleistothecium and ascospore formation and give recombinant
      progeny (O'Gorman et al. 2009; Szewczyk & Krappmann 2010).
    citations:
    - pmid: '19043401'
      doi: 10.1038/nature07528
    - pmid: '20348388'
      doi: 10.1128/EC.00375-09
  boundaries:
    tier: 2
    experimental_method: No published base-level idiomorph coordinates were verified
      for strain A1163. Gene coordinates are curator-derived from the A1163 WGS annotation
      on DS499596.1, fetched directly via NCBI efetch on 2026-09-17.
    citations:
    - pmid: '18404212'
      doi: null
  idiomorph_assignment:
    tier: 2
    experimental_method: 'No published mating-type assay on strain A1163 itself was
      located. The MAT1-1 assignment is curator-derived from the primary sequence
      record: the region carries an intact alpha-box gene and only a degenerate 3''
      remnant of MAT1-2-1 (verified by direct protein alignment against Af293 XP_754989.2).
      The MAT1-1/MAT1-2 idiomorph system itself is experimentally established for
      the species (Paoletti et al. 2005; O''Gorman et al. 2009), but that does not
      by itself type this strain, so this key is deliberately tier 2.'
    citations:
    - pmid: '16005299'
      doi: 10.1016/j.cub.2005.05.045
    - pmid: '18404212'
      doi: null
