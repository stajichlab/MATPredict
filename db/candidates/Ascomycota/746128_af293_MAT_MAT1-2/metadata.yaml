    definition_note: Heterothallic MAT1-2 idiomorph of the Af293 reference genome
      (NC_007196.1, chromosome 3). Canonical Pezizomycotina arrangement SLA2 -- [MAT
      idiomorph] -- APN2 -- COX13, with the HMG-domain gene (RefSeq gene name MAT1-2,
      locus tag AFUA_3G06170) plus an idiomorph-specific gene annotated MAT1-2-4 (AFUA_3G06160,
      unknown function) inside the idiomorph. Unlike the Sordariomycetes records already
      in this database, the A. fumigatus idiomorph carries only ONE recognisable core
      transcription-factor gene (the HMG gene); there is no MAT1-2-2/-3. MAT1-2-4
      is not in this phylum's order.yml gene vocabulary; it is recorded here under
      the gene name used in the RefSeq annotation. Coordinates are curator-derived
      from RefSeq and were fetched directly via NCBI efetch on 2026-09-17.
