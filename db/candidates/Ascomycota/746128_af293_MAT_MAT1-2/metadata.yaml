evidence:
  locus_existence:
    tier: 1
    experimental_method: 'A. fumigatus has a demonstrated, fully functional heterothallic
      sexual cycle: crosses between isolates of complementary mating types produce
      cleistothecia and recombinant ascospores (O''Gorman et al. 2009); successful
      mating and expression of mating genes requires the presence of both MAT1-1 and
      MAT1-2 idiomorphs (Szewczyk & Krappmann 2010); the A. fumigatus mat1-2 ORF is
      functional in vivo, conferring full fertility when replacing matA in A. nidulans
      (Pyrzak et al. 2008).'
    citations:
    - pmid: '19043401'
      doi: 10.1038/nature07528
    - pmid: '20348388'
      doi: 10.1128/EC.00375-09
    - pmid: '18245277'
      doi: 10.1128/EC.00380-07
  boundaries:
    tier: 2
    experimental_method: No published base-level idiomorph coordinates were verified.
      Gene coordinates are curator-derived from the Af293 RefSeq annotation on NC_007196.1,
      fetched directly via NCBI efetch on 2026-09-17.
    citations:
    - pmid: '16005299'
      doi: 10.1016/j.cub.2005.05.045
  idiomorph_assignment:
    tier: 1
    experimental_method: MAT1-1/MAT1-2 idiomorph structure established by sequencing
      and a multiplex-PCR mating-type assay applied to 290 worldwide clinical and
      environmental isolates (Paoletti et al. 2005); mating-type complementarity subsequently
      confirmed by fertile crosses (O'Gorman et al. 2009). Af293 carries the HMG-domain
      gene (MAT1-2), independently reconfirmed by the curator on NC_007196.1.
    citations:
    - pmid: '16005299'
      doi: 10.1016/j.cub.2005.05.045
    - pmid: '19043401'
      doi: 10.1038/nature07528
