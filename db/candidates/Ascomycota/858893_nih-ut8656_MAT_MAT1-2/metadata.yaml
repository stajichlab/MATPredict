evidence:
  locus_existence:
    tier: 1
    experimental_method: Metin et al. 2019 screened 74 E. dermatitidis isolates (11
      clinical, 63 environmental) by PCR (35 MAT1-1, 39 MAT1-2), amplified and sequenced
      the surrounding region by long-range PCR, and showed MAT gene transcription
      by RT-PCR (MAT1-2-1 product 408 bp). No sexual cycle has been observed.
    citations: &id001
    - pmid: '30611834'
      doi: 10.1016/j.fgb.2018.12.011
  boundaries:
    tier: 2
    experimental_method: The paper reports idiomorph lengths (MAT1-2 3771 bp) but
      no coordinates; the segment here spans SLA2 start to APN2 end from the RefSeq
      annotation of NIH/UT8656 and is not an experimentally mapped idiomorph boundary.
    citations: *id001
  idiomorph_assignment:
    tier: 1
    experimental_method: MAT1-2 = HMG-domain MAT1-2-1 idiomorph by PCR typing of 74
      isolates and sequencing (Metin et al. 2019); the reference genome strain CBS
      525.76 is the MAT1-2 isolate in that study. The specific gene model HMPREF1120_08862
      is identified by the curator from the RefSeq annotation.
    citations: *id001
