    reference_orientation: SLA2->MAT1-2-1->APN2
    definition_note: 'Exophiala dermatitidis (Chaetothyriales) MAT1-2 idiomorph in
      the reference genome of NIH/UT8656 (= CBS 525.76 = ATCC 34100; Broad assembly
      Exop_derm_V1, RefSeq GCF_000230625.1, scaffold NW_008751653.1 = supercont1.8).
      Metin et al. 2019 (Fungal Genet Biol 124:29-38) state that this genome harbors
      an HMG-domain gene (MAT1-2-1) near SLA2 and APN2; the MAT1-2 idiomorph is 3771
      bp and carries only MAT1-2-1 (the paper gives lengths, not coordinates; the
      idiomorph start and end are NOT located here). The HMG gene was identified here
      as HMPREF1120_08862 (XP_009161380.1, 379 aa, HMG-box_ROX1-like domain, single
      exon 1140 bp, NCBI Gene 20313501): this identification is by the curator-side
      reading of the RefSeq annotation (HMG-box domain, position between SLA2 and
      APN2), not stated by locus tag in the paper. Flank genes: SLA2 = HMPREF1120_08859
      (annotated huntingtin interacting protein 1, XP_009161377.1) and APN2 = HMPREF1120_08863
      (AP endonuclease 2, XP_009161381.1). Between SLA2 and MAT1-2-1 lie HMPREF1120_08860
      (+5S rRNA region) and HMPREF1120_08861, both non-MAT (the paper places the MAT
      locus between APN2 and HMPREF1120_08861). Gene coordinates were fetched through
      NCBI efetch (NCBI Gene genomic intervals, 0-based start converted to 1-based)
      on 2026-11-08. Metin et al. also report a 116-bp MAT1-1-1 remnant in the MAT1-2
      locus; not modelled. Only one idiomorph per record; the MAT1-1 partner is the
      separate candidate 5970_cbs-132752_MAT_MAT1-1.'
