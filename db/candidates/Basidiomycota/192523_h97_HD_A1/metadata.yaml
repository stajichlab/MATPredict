  core:
    completeness: partial
    reference_orientation: HD2->HD1(a1-1)
    definition_note: 'A. bisporus is bipolar with a single HD locus; the PR (pheromone/
      receptor) locus has lost its mating-type role in this species (Foulongne-Oriol
      et al. 2021) -- no paired PR-locus record exists or is expected for this species.
      The reference genome (var. bisporus strain H97) carries an extra HD2 gene copy
      per the primary literature; only the single HD1/HD2 pair captured at this specific
      genomic position (matching the gene identities directly confirmed via NCBI efetch)
      is represented here -- completeness is "partial" because the reported extra
      HD2 copy elsewhere in the genome is not included in this record. HD1 is officially
      annotated "a1-1" in GenBank; idiomorph "A1" here reflects the locus_name "HD"
      pattern convention (^A[0-9]+$) already established for Coprinopsis cinerea in
      this database, applied to the "a1-1" allele designation. Flanking genes reported
      in the literature (mip1, beta-fg) are not included in this record; a follow-up
      could add them once specifically located and verified.

      '
