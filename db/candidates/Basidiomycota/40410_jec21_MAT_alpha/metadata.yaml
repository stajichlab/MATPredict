    reference_orientation: SXI1->MFalpha1/2/3->STE3
    definition_note: 'This is the bipolar, fused-MAT-type locus described by Lengeler
      et al. 2002 (PMID 12455690, DOI 10.1128/EC.1.5.704-718.2002, the primary Cryptococcus
      MAT locus paper) and deposited as GenBank AF542531.2 (133,474 bp, complete MAT
      alpha locus, strain JEC21). The report used to seed this candidate (a literature
      synthesis by a separate research agent) describes the full locus as containing
      >20 genes; only the core identity-determining genes (SXI1, the three MFalpha
      pheromone precursors, and STE3 receptor) are represented here with verified
      coordinates from the GenBank feature table -- the additional MAT-linked but
      non-identity genes (MAPK cascade components, MYO2, RPL22alpha) are NOT included
      in this record. completeness is "partial" to reflect this reduced gene set,
      not any doubt about the locus boundary itself (which is the full deposited 133,474
      bp fragment). This "MAT" locus_name entry required extending db/Basidiomycota/order.yml,
      which previously only modeled the tetrapolar HD/PR case.

      '
