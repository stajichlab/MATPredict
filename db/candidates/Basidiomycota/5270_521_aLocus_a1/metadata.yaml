    reference_orientation: pra->mfa/rba
    definition_note: 'Mycosarcoma maydis (= Ustilago maydis, older name still used
      throughout the primary literature) has two unlinked tetrapolar loci: this record
      covers only the a locus (pheromone/receptor); the b locus (bE/bW homeodomain
      pair) is a separate record (5270_521_b_locus_b1). Reference strain 521 has genotype
      a1 b1 (Bolker, Urban, Kahmann 1992; Gillissen et al. 1992). RefSeq''s own annotation
      of this genome names the two genes at this locus "Pra1" (product: "a2-pheromone
      receptor Pra1") and "Rba1" (product: "a1-mating type protein Rba1") -- a naming
      inconsistency worth flagging: despite the "Pra1" product description literally
      saying "a2", this gene resides in the a1 genotype reference strain''s genome,
      and "Rba1" is not the classical "mfa" pheromone-precursor name used in the review
      literature (Bolker et al. 1992; Spellig et al. 1994) for the a locus''s other
      core gene. This may reflect legacy/inconsistent gene symbol assignment in RefSeq''s
      annotation pipeline rather than a real second a2 gene present in an a1 genome;
      a human reviewer familiar with the current U. maydis gene nomenclature (e.g.
      MycoCosm/PomBase-style curation) should confirm whether "Rba1" is functionally
      the mfa1 pheromone precursor before this record is relied upon for anything
      beyond general locus/coordinate reference. Coordinates and protein accessions
      were independently verified directly against GenBank via NCBI efetch, not inferred
      from gene symbols alone.

      '
