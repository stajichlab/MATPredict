    definition_note: "Bbeta1 locus (specificity 2, \"bbr2\"/\"bbp2-x\" gene naming)\
      \ per Vaillancourt et al. 1997 (original Bbeta1 discovery paper). Genes here\
      \ (6 pheromone precursors + 1 receptor, per bbp2-2/bbp2-1/bbp2 x2/bbp2-5/bbp2-8/bbp2-6/bbr2)\
      \ form a ~17kb cluster on contig NW_026089548.1 of assembly GCF_000143185.2,\
      \ spatially adjacent to the Balpha cluster (5334_h4-8_Balpha_3, same contig,\
      \ ~241-248kb, vs this locus's ~216-234kb). Two genes both carried the raw gene_id\
      \ \"bbp2\" in the source literature table but resolved to two distinct GenBank\
      \ protein accessions (XP_003028246.1 at 224353-224604, and a different transcript\
      \ at 227442-227732 annotated \"peptide mating pheromone precursor Bbp2-7\" in\
      \ GenBank's own record despite the source table's generic \"bbp2\" label) --\
      \ named \"bbp2_a\"/\"bbp2_b\" here to keep them distinct, following GenBank's\
      \ own annotation over the literature table's label collision. Two additional\
      \ receptor-like genes flanking the whole Balpha+Bbeta region (brl1, brl3) were\
      \ excluded from both this record and the Balpha record for the reasons given\
      \ in 5334_h4-8_Balpha_3's definition_note. Report describes Bbeta1 as containing\
      \ \"\u22653 pheromones + 1 receptor\"; 6 pheromones were found here, exceeding\
      \ that description -- completeness is \"partial\" only because this gene roster\
      \ is not claimed to be exhaustive, not because the count is doubted.\n"
    segments:
    - segment_index: 0
