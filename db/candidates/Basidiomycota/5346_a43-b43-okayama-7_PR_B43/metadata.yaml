  core:
    completeness: partial
    reference_orientation: not established from coordinate data alone
    definition_note: 'The B (PR) locus in C. cinerea is a large multi-group pheromone/receptor
      complex (O''Shea et al. 1998; Halsall et al. 2000; Riquelme et al. 2005): three
      gene groups per locus, each with two pheromones and one receptor. A literature-derived
      gene list (from a separate research agent''s synthesis) reported pheromone/receptor
      annotations for this species scattered across FOUR different contigs of the
      fragmented assembly GCA_016772295.1 (JAAGWA010000001/4/8/10/13). Given C. cinerea
      has many paralogous pheromone/receptor gene clusters genome-wide (the source
      literature reports ~14 receptors and ~29 pheromones total across the species),
      only ONE contig cluster (JAAGWA010000010.1, ~1806154-1826859) was used for this
      record: it is the only one containing a gene explicitly annotated "Pheromone
      Phb2.2 B43", directly matching this strain''s known B43 allele. Genes on the
      other three contigs were deliberately excluded as likely unrelated paralogous
      loci elsewhere in the genome, not confirmed as part of this specific B43 specificity
      module. This cluster also contains a gene annotated "Pheromone Phb2.2 B44" immediately
      adjacent to the B43 gene; whether that reflects two linked specificity sub-modules
      or a naming artifact from the gene family''s evolutionary history was not resolved
      here and would need the primary literature''s own locus maps to confirm. completeness
      is "partial" to reflect this real uncertainty about the locus''s internal substructure,
      not a doubt about the individual gene coordinates (which were verified directly
      against GenBank).

      '
