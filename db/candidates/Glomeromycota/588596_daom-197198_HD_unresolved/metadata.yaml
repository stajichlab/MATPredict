    definition_note: 'DRAFT candidate, not a curated record. Putative AMF HD locus of Ropars et al. 2016,
      Nat Microbiol 1:16033 (PMID 27572831): HD1-like and HD2 in opposite orientation, flanked by a P-glycerate
      mutase gene and a choline transporter gene. The authors state a role in mating has not been shown
      functionally. Gene models are the BFD funannotate models on RefSeq NC_089440.1 (locus tags FDB574B3_*);
      they are not NCBI annotations and have no protein accession here. HD1-like has no Pfam homeodomain
      hit; HD2 has one (Pfam 38.2 GA cutoff). Idiomorph (allele/mating type) is unresolved: DAOM-197198
      is homokaryotic with one genotype in the paper, and its allele has not been matched to the paper''s
      six putative mating types. Evidence tiers below are provisional; the curator assigns them. Same
      arrangement in 27 of 29 BFD Rhizophagus genomes and in 8 other Glomeromycota genomes (docs/notes/2026-11-13_amf-hd-locus.md).'
