<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="MATPredict: two compatible hyphae fuse">
  <title>MATPredict</title>
  <defs><radialGradient id="g" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#dce9f7"/></radialGradient></defs>
  <circle cx="128" cy="128" r="120" fill="url(#g)"/>
  <circle cx="128" cy="128" r="120" fill="none" stroke="#0a5da8" stroke-width="6"/>
  <!-- plus hypha -->
  <path d="M46 206C52 150 84 126 118 110" fill="none" stroke="#0a5da8" stroke-width="22" stroke-linecap="round"/>
  <!-- minus hypha -->
