[workspace]
name = "MATPredict"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
pip = "*"
taxonkit = "*"
# Search binaries `matpredict detect` shells out to (see detect/search.py):
# diamond for the proteome fast path, exonerate for protein-to-genome fallback.
diamond = "*"
exonerate = "*"

[pypi-dependencies]
MATPredict = { path = ".", editable = true }

[feature.test.dependencies]
pytest = "*"

[environments]
default = { features = [], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tasks]
test = "pytest -v"
matpredict = "matpredict"
