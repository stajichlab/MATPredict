  dedupe: 10.1007/s11557-012-0840-z|90004|HD|A1
  citations:
  - {pmid: null, doi: 10.1007/s11557-012-0840-z}
  methods:
  - targeted cloning and sequencing of the A (HD) mating-type locus; allele polymorphism among strains used for strain identification (Wan et al. 2013)
  - targeted sequencing; the deposit spans MIP (5' partial) through the two HD genes
  - allele RrA1, as named by the depositors (gene names RrA1-hox1, RrA1-hox2)
  genes:
  - [BAL45601.2, MIP1, flanking_conserved]
  - [BAL45602.2, HD1, core_MAT]
  - [BAL45603.2, HD2, core_MAT]
  note: 'Rhizopogon roseolus HD (A) mating-type locus, allele RrA1, from the locus
    deposit AB646132.2 (5,786 bp; Wan J, Li Y, Shimomura N, Yamaguchi T, Aimi T 2013,
    Mycol Prog 12:353-365, doi:10.1007/s11557-012-0840-z; no PMID). Gene order: mip
    (5'' partial, codon_start 3, BAL45601.2) - RrA1-hox1 HD1 (BAL45602.2, minus strand) -
    RrA1-hox2 HD2 (BAL45603.2, plus strand). The strain is not stated on the deposit.
    The idiomorph label A1 is the depositors'' own allele name (RrA1). This is the first
    Boletales MAT reference in the database. The paper has no PMID; recorded by DOI
    only, as for the Morchella records.'
- record_id: 2822231_sb25_HD_A1
  accession: HQ188438.1
  taxid: 2822231
  strain: SB25
  idiomorph: A1
  completeness: complete
  orientation: MIP1->[HD2(A2)<-|->HD1(A1)]
  dedupe: 21131435|2822231|HD|SB25
  citations:
  - {pmid: '21131435', doi: 10.1128/EC.00212-10}
  methods:
  - inheritance and segregation of the HD genes in crosses, heterozygosity in wild strains; the HD genes form the single MAT locus (James et al. 2011)
  - targeted sequencing; the deposit spans MIP (5' partial) through the two HD genes and a partial hypothetical protein
  - HD1/HD2 gene identity at the MAT locus; allele not numbered in the deposit (see definition_note)
  genes:
  - [ADN97170.1, MIP1, flanking_conserved]
  - [ADN97171.1, HD2, core_MAT]
  - [ADN97172.1, HD1, core_MAT]
  note: 'Phanerochaete chrysosporium strain SB25 HD mating-type locus, from the locus
    deposit HQ188438.1 (10,066 bp; James TY, Lee M, van Diepen LTA 2011, Eukaryot Cell
    10:249-261). P. chrysosporium is bipolar with the HD genes as the single MAT locus;
    the pheromone receptor genes are unlinked and not mating-type determinants in this
    species. Gene order: MIP (5'' partial, codon_start 3, ADN97170.1) - "A2 mating-type
    protein" HD2 (ADN97171.1, minus) - "A1 mating-type protein" HD1 (ADN97172.1, plus) -
    hypothetical protein HP2 (partial, ADN97173.1, not curated: not a roster gene).
    The gene names A1/A2 in the deposit denote the HD1/HD2 genes, NOT alleles. The
    idiomorph label "A1" is a PLACEHOLDER (the allele of SB25 is not numbered); curator
    decision pending on a label convention. NCBI taxid 2822231 is the current name for
    this species (lineage resolved 2026-09-26). No Phanerochaete genome is in the BFD
    library, so this record cannot be scored against its own assembly.'
