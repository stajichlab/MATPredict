# Sporidiobolales redPR (tier 1, locus-specific GenBank deposits)
- record_id: 5005_cbs-483_redPR_A1
  accession: GU474642.1
  strain: CBS 483
  locus: redPR
  idiomorph: A1
  tier: 1
  completeness: partial
  orientation: STE3a1
  genes: [[ADM24772.1, STE3a1, core_MAT]]
  note: 'Sporobolomyces (= Sporidiobolus) salmonicolor CBS 483, STE3-A1 allele of the
    mating pheromone receptor, complete CDS (372 aa) on a 1,290 bp deposit that spans
    only the CDS. completeness partial: the deposit carries no flank. The deposit''s own
    /gene is STE3; curated as STE3a1, this family''s name for the A1-specific receptor
    (the depositors label it "STE3-A1 allele"). Coelho MA, Sampaio JP, Goncalves P
    (2010) A deviation from the bipolar-tetrapolar mating paradigm in an early diverged
    basidiomycete. PLoS Genet 6(8):e1001052.'
  methods:
  - targeted PCR/genome-walking sequencing of the mating-type receptor allele by the
    describing authors, deposited as a GenBank record
  - record segment spans the deposited CDS
  - A1 by the depositors' own allele designation (STE3-A1), supported by the paper's
    mating-type assignments of the strains
  citations: [{doi: 10.1371/journal.pgen.1001052, pmid: '20700437'}]
  dedupe: 10.1371/journal.pgen.1001052|5005|redPR|A1
