# Pucciniales rustHD (tier 2, depositors' genome models identified by the paper)
- record_id: 418459_crl-75-36-700-3_rustHD_b1
  accession: DS178274.1
  strain: CRL 75-36-700-3
  locus: rustHD
  idiomorph: b1
  tier: 2
  provenance: curator_derived
  completeness: complete
  orientation: bE<-|->bW
  genes: [[EFP79918.2, bE, core_MAT], [EFP79919.2, bW, core_MAT]]
  note: 'Puccinia graminis f. sp. tritici CRL 75-36-700-3, b mating-type HD gene pair on
    supercontig DS178274.1, divergently transcribed, 545 bp apart: bE1-HD2 = PGTG_05143
    (EFP79918.2, 373 aa, minus strand) and bW1-HD1 = PGTG_05144 (EFP79919.2, 579 aa,
    plus strand), per Cuomo et al. 2017 Table S11. The paper gives bW1 as 618 aa from an
    RNA-seq-corrected model; the GenBank model is 579 aa (logged in
    ANNOTATION_ERRORS_FIXED_REPORT.md). The second Pgt allele (bE2/bW2) was assembled
    only from RNA-seq and has no genome model, so it is not curated. IDIOMORPH LABEL:
    ''b1'' is the paper''s allele number and a pattern placeholder; allele identity is not
    called. TIER 2: genome-derived, no locus-specific deposit exists.'
  methods:
  - 'TIER 2 (genome-derived). The proteins are the depositors'' own gene models in the
    Pgt CRL 75-36-700-3 genome; Cuomo et al. 2017 identified them as the b mating-type
    HD1/HD2 genes (Table S11), showed rust HD proteins active in a heterologous Ustilago
    mating assay and HD silencing reducing infection (for P. triticina alleles).'
  - record segment spans the two curated gene models on DS178274.1, from the assembly's
    own CDS features
  - allele number from Cuomo et al. 2017 Table S11 (bE1/bW1); pattern placeholder
  citations: [{doi: 10.1534/g3.116.032797, pmid: '27913634'}]
  dedupe: 10.1534/g3.116.032797|418459|rustHD|b1
