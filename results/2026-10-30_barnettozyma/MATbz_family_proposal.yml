# PROPOSED order.yml family block for Barnettozyma (NOT applied; db/ is untouched). Modelled on MATpk / MATog.
# Scope-only (never searched on a phylum fallback), genus Barnettozyma 599802 (verified with NCBI Taxonomy efetch, 2026-10-30:
# Saccharomycotina; Phaffomycetales 3243778; Phaffomycetaceae 115784). Disjoint from MATsc (4893), MTL (2916678), MATkp, MATog, MATpk.
  - locus_name: "MATbz"
    vocabulary_type: "enum"
    idiomorph_values: ["MATa", "MATalpha"]
    idiomorph_class: {MATalpha: unassigned, MATa: unassigned}
    taxonomic_scope: [599802]
    fallback_subphylum: 147537
    fallback_searchable: false
    flank_carried_window_bp: 20000
    genes:
      - {name: MATa1, role: core_MAT, present_in_idiomorphs: ["MATa"]}
      - {name: MATa2, role: core_MAT, optional: true, present_in_idiomorphs: ["MATa"]}      # divergent HMG-like; no Pfam HMG_box hit
      - {name: MATalpha1, role: core_MAT, gene_class: alpha_box, present_in_idiomorphs: ["MATalpha"]}
      - {name: MATalpha2, role: core_MAT, optional: true, present_in_idiomorphs: ["MATalpha"]}   # not modelled in PB4207
      - {name: sla2, role: flanking_conserved, gene_class: sla2_homolog, optional: true}
      - {name: dic1, role: flanking_conserved, optional: true}
