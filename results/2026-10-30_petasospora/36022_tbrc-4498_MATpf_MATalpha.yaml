    definition_note: 'MATalpha idiomorph of P. fabianii TBRC 4498 (xylitol-producing strain; PMID 40558965), chromosome-level
      GCA_050575385.1, CM115473.1. The draft genome of strain 65 from fermented masau fruit (GCA_001983305.1, MPUK01000005.1:611,410-630,920;
      PMID 28385833) carries the same locus with an identical MATalpha1 protein and holds the depositor''s ONH67106 (''Mating-type-like
      protein ALPHA1'', 254 aa, MPUK01000005.1:616,190-616,396 + 617,660-618,217), which our model replaces. GENE MODELS ARE
      OURS (tier 3, manual annotation; curator decision 2026-10-30). No RNA-seq exists for the species in ENA/SRA (checked
      2026-10-30), so the models are AUGUSTUS ab initio predictions (species models S. cerevisiae S288C, C. guilliermondii,
      P. stipitis, K. lactis) chosen where several agree and where homology supports them; MATa2 is also supported by the
      Saccharomycotina MATa2 profile (76.8 bits, above the 52.4 bits of P. kudriavzevii). Coordinates include the stop codon.
      Intron signals: MATa2 72 bp GTAGGT..TACTAAC..TAG (strong); MATa1 97 bp GTACCA..AAAG (weak donor; an upstream exon is
      required because the homeodomain open frame has no start codon, but the splice sites are unconfirmed). The MATalpha1
      model is a single exon of 305 aa; the depositor''s ONH67106 (254 aa, strain 65) is the same C-terminal 185 aa plus a
      69 aa exon joined across a 1,263 bp intron (GTCCTT..CCCCAG) that has no support here: the N-terminus is unresolved.
      GENE NAMES by homology and position: MATa1 is the homeodomain protein (Pfam Homeodomain 64 bits, 66 bits to Komagataella
      MATa1), MATa2 the HMG-box protein (divergent; no Pfam HMG_box hit above GA), MATalpha1 the alpha-box protein (PF04769
      36 bits, 407 bits to ONH67106). No MATalpha2 homeodomain gene was found in either alpha allele (only a 57 aa Homeobox_KN
      fragment at 12-18 bits about 1.2 kb upstream of MATalpha1). LAYOUT: DIC1 (minus) - 0.5 kb (MATa) or 5.0 kb (MATalpha)
      - MAT genes - six conserved non-MAT ORFs (409, 173, 589, 219, 465, 622 aa; identical in both alleles, not recorded)
      - SLA2 (plus); SLA2 is therefore about 9.5 kb from the MAT genes. The alpha allele also carries an 800 aa MutS_III-domain
      ORF between DIC1 and MATalpha1 that has no counterpart in the MATa allele (not recorded). No second MAT cassette: miniprot
      of the MAT proteins finds no other MAT gene in any of the four assemblies, so the species looks heterothallic with one
      idiomorph per genome. GENETIC CODE: standard (table 1). Details: results/2026-10-30_petasospora/README.md.'
