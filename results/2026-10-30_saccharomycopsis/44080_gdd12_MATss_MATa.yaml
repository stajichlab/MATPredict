    reference_orientation: sla2->MATa1
    definition_note: 'Right (palindromic) cassette of the active MAT locus on chromosome
      IV of S. schoenii GDD12 (CM143129.1; the paper''s span 528,044-537,777; an SLA2
      anchor between mirrored MAT arrays, Kriti et al. G3 2026, PMID 41849659). HOMOTHALLIC
      (Dost et al. 2024, PMID 38492364). The record covers the arm that RNA-seq resolves:
      SLA2 533,981-535,828 (plus, 615 aa) and the homeodomain gene named MATa1 after
      the paper at 536,046-536,944 (minus, 211 aa; introns of 205 bp, 221 reads, and
      58 bp, 218 reads, the conserved 58 bp junction the paper reports at 536,635).
      The mirrored arm (SLA2 529,992-532,490; homeodomain ORF 529,258-529,749, 163
      aa) is not recorded: short reads cannot separate the two inverted copies, and
      the paper''s mirrored junction at 529,128 is not seen. No HMG-box (MATa2) ORF
      passed the filters. GENE MODELS ARE OURS (tier 3), see results/2026-10-29_ss_records/README.md.
      The library is not stranded. GENETIC CODE: NCBI table 12 (CUG = Ser).'
