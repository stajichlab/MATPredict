    reference_orientation: dic1->MATa2->MATa1->sla2->MATalpha2->MATalpha1
    definition_note: 'CANDIDATE MATam record of Ambrosiozyma philentoma NRRL Y-7523 (GCA_003707675.3, contig-level
      assembly). TWO CASSETTE ENDS AT TWO UNRELATED POSITIONS: a MATa side on PPKZ03000004.1 (DIC1 - MATa2 - MATa1
      - SLA2, with SUI1 beside SLA2; the Komagataella-type MATa arrangement) and a MATalpha side on PPKZ03000012.1,
      211 kb from a contig edge (MATalpha2 and MATalpha1 on one strand 5 kb apart, and a 35 aa SLA2 3-prime fragment
      2 kb beyond MATalpha1 that is not recorded). The two regions share no nucleotide sequence (blastn, 2026-11-04),
      so this is not an allele pair: a complementary pair of cassettes in one genome, as in the Ogataea two-cassette
      genomes; which one is expressed is not determined. In the same genus A. platypodis and A. monospora show the
      same two-locus pattern in the v0.8.0 run (fragments, not recorded). OUR OWN PROJECTION (tier 3): miniprot
      alignments of curated Saccharomycotina and Ogataea MAT proteins, kept only without frameshift or internal
      stop; no RNA-seq or annotation. GENE NAMES: MTLA1 of the Candida references is MATa1 and MTLA2 the HMG MATa2;
      the gene identities rest on homology at 28-70% identity. Every MAT model is partial (MATa1 58 aa homeodomain
      fragment, MATalpha2 107 aa). Independent review (Opus, 2026-11-04): the strongest second-cassette case of
      the 80 genomes of #189. GENETIC CODE: standard (NCBI code 1).'
