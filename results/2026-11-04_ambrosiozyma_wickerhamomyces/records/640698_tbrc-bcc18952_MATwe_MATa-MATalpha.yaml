    definition_note: 'CANDIDATE MATwe record of Wickerhamomyces edaphicus TBRC-BCC18952 (GCA_054949465.1; NCBI Taxonomy
      lists the species as ''[Wickerhamomyces] edaphicus (nom. inval.)'' under Hansenula). ONE HETEROZYGOUS MAT
      LOCUS WITH BOTH ALLELES ASSEMBLED AS SEPARATE CONTIGS: the MATalpha allele on JBSXOT010000020.1 (SUI1 - SLA2
      - MATalpha1 - MATalpha2 - DIC1) and the MATa allele on the 3.5 kb contig JBSXOT010000274.1 (SLA2 3-prime end
      - MATa1 - MATa2 - DIC1 5-prime end). Both ends of contig 274 match contig 20 at 97.2% (533 bp, contig 20 41,292-41,824)
      and 97.3% (147 bp, 45,203-45,347) on either side of the idiomorph, so the two are the a and alpha alleles
      at the same position, NOT two cassettes (blastn, 2026-11-04; independent review, Opus). Only 680 bp of flank
      is shared; read mapping would confirm half coverage for each allele. OUR OWN PROJECTION (tier 3): miniprot
      alignments of curated Saccharomycotina and Ogataea MAT proteins, kept only without frameshift or internal
      stop; no RNA-seq or annotation. GENE NAMES: the MATa2 HMG gene (170 aa at 28% identity to the Pichia/Komagataella
      MATa2) and MATa1 (55 aa homeodomain fragment) rest on homology. GENETIC CODE: standard (NCBI code 1).'
