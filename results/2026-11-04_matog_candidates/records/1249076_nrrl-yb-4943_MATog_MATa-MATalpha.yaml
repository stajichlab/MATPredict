    reference_orientation: sla2->MATa1->MATalpha1->MATalpha2->dic1
    definition_note: 'CANDIDATE MATog record of Ogataea wickerhamii NRRL YB-4943 (GCA_030559035.1), a
      divergent member of the genus (MATog score 67-142 in the v0.8.0 run against the two polymorpha-clade
      references). OUR OWN PROJECTION (tier 3): each gene is the miniprot alignment of the O. parapolymorpha
      DL-1 or O. polymorpha CBS 4732 MATog proteins to the contig, kept only when it has no frameshift
      and no internal stop; no RNA-seq or annotation was used (results/2026-11-04_matog_candidates/README.md).
      The record holds two cassette ends on two contigs of the assembly (SLA2-MATa1 end on one, MATalpha1-MATalpha2-DIC1
      end on the other). Genes: sla2 seg0 1-2010(+) 670 aa, 373-1019 of 1019 aa of the DL-1 protein at
      49% identity; MATa1 seg0 2130-2378(-) 83 aa, 95-181 of 181 aa of the CBS 4732 protein at 51% identity;
      MATalpha1 seg1 47-496(-) 150 aa, 39-185 of 190 aa of the DL-1 protein at 40% identity; MATalpha2
      seg1 760-921(-) 54 aa, 158-211 of 222 aa of the DL-1 protein at 56% identity; dic1 seg1 2296-3117(+)
      273 aa, 15-287 of 287 aa of the CBS 4732 protein at 72% identity. PARTIAL BY CONSTRUCTION: every
      model starts or stops at the alignment end or at a contig end, so none has a verified start or stop
      codon, and no MAT gene is recorded as absent. GENETIC CODE: standard (NCBI Taxonomy code 1 for the
      species).'
