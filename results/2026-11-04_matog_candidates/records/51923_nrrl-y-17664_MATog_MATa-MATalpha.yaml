    definition_note: 'CANDIDATE MATog record of Ogataea pignaliae NRRL Y-17664 (GCA_030570775.1), a divergent
      member of the genus (MATog score 67-142 in the v0.8.0 run against the two polymorpha-clade references).
      OUR OWN PROJECTION (tier 3): each gene is the miniprot alignment of the O. parapolymorpha DL-1 or
      O. polymorpha CBS 4732 MATog proteins to the contig, kept only when it has no frameshift and no
      internal stop; no RNA-seq or annotation was used (results/2026-11-04_matog_candidates/README.md).
      The record holds two cassette ends on two contigs of the assembly (SLA2-MATa1 end on one, MATalpha1-MATalpha2-DIC1
      end on the other). Genes: sla2 seg0 3-761(+) 253 aa, 767-1019 of 1019 aa of the DL-1 protein at
      55% identity; MATa1 seg0 7406-7579(-) 58 aa, 130-187 of 187 aa of the DL-1 protein at 59% identity;
      MATalpha2 seg1 2579-2737(+) 53 aa, 158-210 of 222 aa of the DL-1 protein at 66% identity. PARTIAL
      BY CONSTRUCTION: every model starts or stops at the alignment end or at a contig end, so none has
      a verified start or stop codon, and no MAT gene is recorded as absent. MATalpha2 on JAJLWO010000212.1:
      projection rejected (frameshift or internal stop); MATalpha1 on JAJLWO010000212.1: projection rejected
      (frameshift or internal stop). GENETIC CODE: standard (NCBI Taxonomy code 1 for the species).'
