    reference_orientation: sla2->MATa1->dic1->MATalpha2->MATalpha1
    definition_note: 'CANDIDATE MATog record of Ogataea dorogensis NRRL Y-27599 (GCA_030568015.1), a divergent
      member of the genus (MATog score 67-142 in the v0.8.0 run against the two polymorpha-clade references).
      OUR OWN PROJECTION (tier 3): each gene is the miniprot alignment of the O. parapolymorpha DL-1 or
      O. polymorpha CBS 4732 MATog proteins to the contig, kept only when it has no frameshift and no
      internal stop; no RNA-seq or annotation was used (results/2026-11-04_matog_candidates/README.md).
      The record holds two cassette ends on two contigs of the assembly (SLA2-MATa1 end on one, MATalpha1-MATalpha2-DIC1
      end on the other). Genes: sla2 seg0 1-1458(+) 486 aa, 524-1018 of 1019 aa of the DL-1 protein at
      56% identity; MATa1 seg0 1486-2040(-) 185 aa, 7-187 of 187 aa of the DL-1 protein at 33% identity;
      dic1 seg1 14828-15649(-) 274 aa, 14-287 of 287 aa of the CBS 4732 protein at 78% identity; MATalpha2
      seg1 16583-17097(+) 161 aa, 58-213 of 222 aa of the DL-1 protein at 44% identity; MATalpha1 seg1
      17279-17761(+) 161 aa, 32-186 of 190 aa of the DL-1 protein at 45% identity. PARTIAL BY CONSTRUCTION:
      every model starts or stops at the alignment end or at a contig end, so none has a verified start
      or stop codon, and no MAT gene is recorded as absent. GENETIC CODE: standard (NCBI Taxonomy code
      1 for the species).'
