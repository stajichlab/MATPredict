    reference_orientation: sla2->MATa1->MATalpha1->MATalpha2->dic1
    definition_note: 'CANDIDATE MATog record of Ogataea siamensis NRRL Y-27963 (GCA_030574315.1), a divergent
      member of the genus (MATog score 67-142 in the v0.8.0 run against the two polymorpha-clade references).
      OUR OWN PROJECTION (tier 3): each gene is the miniprot alignment of the O. parapolymorpha DL-1 or
      O. polymorpha CBS 4732 MATog proteins to the contig, kept only when it has no frameshift and no
      internal stop; no RNA-seq or annotation was used (results/2026-11-04_matog_candidates/README.md).
      The record holds two cassette ends on two contigs of the assembly (SLA2-MATa1 end on one, MATalpha1-MATalpha2-DIC1
      end on the other). Genes: sla2 seg0 6-1487(+) 493 aa, 522-1019 of 1019 aa of the DL-1 protein at
      64% identity; MATa1 seg0 1499-2014(-) 171 aa, 16-181 of 181 aa of the CBS 4732 protein at 42% identity;
      MATalpha1 seg1 8-514(-) 169 aa, 25-190 of 190 aa of the DL-1 protein at 45% identity; MATalpha2
      seg1 645-1135(-) 148 aa, 5-151 of 163 aa of the CBS 4732 protein at 42% identity; dic1 seg1 2133-2969(+)
      278 aa, 10-287 of 287 aa of the CBS 4732 protein at 78% identity. PARTIAL BY CONSTRUCTION: every
      model starts or stops at the alignment end or at a contig end, so none has a verified start or stop
      codon, and no MAT gene is recorded as absent. MATalpha2 on JAJMET010000024.1: projection rejected
      (frameshift or internal stop); MATalpha2 on JAJMET010000024.1: projection rejected (frameshift or
      internal stop); MATalpha1 on JAJMET010000024.1: projection rejected (frameshift or internal stop);
      MATalpha2 on JAJMET010000024.1: projection rejected (frameshift or internal stop); MATalpha1 on
      JAJMET010000024.1: projection rejected (frameshift or internal stop). GENETIC CODE: standard (NCBI
      Taxonomy code 1 for the species).'
