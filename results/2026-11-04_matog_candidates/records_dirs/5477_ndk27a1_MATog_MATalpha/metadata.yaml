    definition_note: 'CANDIDATE MATog record of Candida boidinii NDK27A1 (GCA_002008015.1), a divergent
      member of the genus (MATog score 67-142 in the v0.8.0 run against the two polymorpha-clade references).
      OUR OWN PROJECTION (tier 3): each gene is the miniprot alignment of the O. parapolymorpha DL-1 or
      O. polymorpha CBS 4732 MATog proteins to the contig, kept only when it has no frameshift and no
      internal stop; no RNA-seq or annotation was used (results/2026-11-04_matog_candidates/README.md).
      The record holds one cassette end (MATalpha idiomorph; the strain carries one idiomorph). Genes:
      sla2 seg0 111232-114369(+) 1046 aa, 6-1019 of 1019 aa of the DL-1 protein at 50% identity; MATalpha1
      seg0 114645-115097(-) 151 aa, 33-185 of 190 aa of the DL-1 protein at 33% identity; MATalpha2 seg0
      116821-116943(+) 41 aa, 95-135 of 163 aa of the CBS 4732 protein at 59% identity; dic1 seg0 118787-119722(+)
      311 aa, 1-294 of 294 aa of the DL-1 protein at 64% identity. PARTIAL BY CONSTRUCTION: every model
      starts or stops at the alignment end or at a contig end, so none has a verified start or stop codon,
      and no MAT gene is recorded as absent. MATalpha2 on MSSE01000022.1: projection rejected (frameshift
      or internal stop). GENETIC CODE: standard (NCBI Taxonomy code 1 for the species).'
