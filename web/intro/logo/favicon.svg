<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="MATPredict: a lens finds the mating-type locus in a genome">
  <title>MATPredict</title>
  <!-- Lens -->
  <circle cx="112" cy="112" r="80" fill="none" stroke="#0a5da8" stroke-width="20"/>
  <path d="M170 170L232 232" stroke="#0a5da8" stroke-width="32" stroke-linecap="round"/>
  <!-- The called locus span -->
  <rect x="74" y="74" width="80" height="76" rx="10" fill="#e8d44d"/>
  <!-- Locus map: flank genes green, core MAT gene blue -->
  <path d="M46 90H60L72 112L60 134H46Z" fill="#0f8a5f"/>
  <path d="M82 90H130L146 112L130 134H82Z" fill="#0a5da8"/>
  <path d="M156 90H168L180 112L168 134H156Z" fill="#0f8a5f"/>
</svg>
